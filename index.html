<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Wave Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f0f0f; margin: 0; padding: 0; }
    .card { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 20px; transition: 0.2s; }
    .card:hover { transform: translateY(-2px); border-color: #3b82f6; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e1e1e; border: 1px solid #333; color: white; padding: 8px 18px; border-radius: 40px; z-index: 9999; font-size: 14px; }
    .media-preview { position: relative; display: inline-block; margin: 4px; border-radius: 14px; overflow: hidden; border: 1px solid #3a3a3a; width: 80px; height: 80px; cursor: pointer; }
    .media-preview img, .media-preview video { width: 100%; height: 100%; object-fit: cover; }
    .remove-media { position: absolute; top: -6px; right: -6px; background: #ef4444; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; color: white; z-index: 10; border: 2px solid #1a1a1a; }
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 16px; min-width: 160px; z-index: 50; overflow: hidden; }
    .dropdown-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: #e0e0e0; cursor: pointer; }
    .dropdown-item:hover { background: #2a2a2a; }
    .reply-quote { background: #1a1a1a; padding: 6px 10px; border-radius: 12px; border-left: 3px solid #3b82f6; font-size: 11px; color: #aaa; margin-bottom: 6px; }
    .mention { color: #3b82f6; font-weight: 600; cursor: pointer; background: rgba(59,130,246,0.15); padding: 2px 4px; border-radius: 8px; display: inline-block; }
    .hashtag { color: #eab308; font-weight: 600; cursor: pointer; background: rgba(234,179,8,0.15); padding: 2px 4px; border-radius: 8px; display: inline-block; }
    .white-glow-btn { background: linear-gradient(135deg, #ffffff, #f0f0f0); color: #111; box-shadow: 0 0 8px rgba(255,255,255,0.3); transition: 0.2s; font-weight: 500; cursor: pointer; border: none; border-radius: 40px; padding: 8px 20px; }
    .white-glow-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255,255,255,0.5); background: linear-gradient(135deg, #f5f5f5, #e8e8e8); }
    .white-icon-btn { background: linear-gradient(135deg, #ffffff, #f0f0f0); color: #111; border-radius: 40px; padding: 8px 16px; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; border: none; transition: 0.2s; }
    .white-icon-btn:hover { transform: scale(1.02); background: linear-gradient(135deg, #f5f5f5, #e8e8e8); box-shadow: 0 2px 10px rgba(255,255,255,0.2); }
    .fullscreen-media { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .fullscreen-media img, .fullscreen-media video { max-width: 95vw; max-height: 95vh; border-radius: 28px; }
    .fullscreen-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .fullscreen-modal-content { background: #1a1a1a; border-radius: 28px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 20px; }
    .chat-user-list { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
    .chat-user-item { background: #1a1a1a; border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.2s; border: 1px solid #2c2c2c; display: flex; align-items: center; gap: 12px; }
    .chat-user-item:hover { background: #252525; border-color: #3b82f6; }
    .chat-messages { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; padding: 12px; }
    .message-bubble { max-width: 85%; padding: 10px 14px; border-radius: 20px; word-break: break-word; }
    .message-mine { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message-theirs { background: #2a2a2a; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message-media { max-width: 200px; max-height: 200px; border-radius: 12px; margin-top: 6px; cursor: pointer; }
    .post-media-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
    .post-media-grid .full-width { grid-column: span 2; }
    .post-media-grid img, .post-media-grid video { width: 100%; border-radius: 14px; cursor: pointer; max-height: 300px; object-fit: cover; }
    .read-more-container { position: relative; }
    .read-more-content.collapsed { max-height: 120px; overflow: hidden; }
    .read-more-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(to bottom, transparent, #1a1a1a); pointer-events: none; }
    .read-more-btn { background: #3b82f6; color: white; border: none; padding: 6px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 8px; }
    .fade-comment { opacity: 0.6; transition: 0.2s; }
    .fade-comment:hover { opacity: 1; }
    .active-tab { background: #3b82f6 !important; color: white !important; border-radius: 40px; }
    .poll-option { background: #2a2a2a; border-radius: 12px; margin: 8px 0; overflow: hidden; cursor: pointer; }
    .poll-option:hover { background: #333; }
    .poll-bar { background: #3b82f6; height: 100%; transition: width 0.3s ease; }
    .input-field { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 40px; padding: 12px 16px; }
    .input-field:focus { border-color: #3b82f6; outline: none; }
    .mention-suggestions { position: absolute; bottom: 100%; left: 0; background: #1a1a1a; border: 1px solid #3a3a3a; border-radius: 16px; max-height: 200px; overflow-y: auto; z-index: 50; width: 220px; margin-bottom: 5px; }
    .mention-suggestion-item { padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.1s; }
    .mention-suggestion-item:hover { background: #2a2a2a; }
    .action-btn { font-size: 15px; gap: 8px; padding: 8px 16px; border-radius: 40px; transition: 0.2s; background: #2a2a2a; }
    .action-btn:hover { background: #3b82f6; color: white; }
    .shared-post-card { background: #252525; border-radius: 16px; padding: 12px; margin-top: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #3a3a3a; }
    .shared-post-card:hover { background: #2a2a2a; border-color: #3b82f6; }
    .avatar-with-status { position: relative; display: inline-block; }
    .online-status { position: absolute; bottom: 4px; right: 4px; width: 14px; height: 14px; background-color: #22c55e; border-radius: 50%; border: 2px solid #1a1a1a; }
    .online-status.offline { background-color: #6b7280; }
    .tab-btn { padding: 8px 16px; border-radius: 40px; transition: 0.2s; cursor: pointer; background: #2a2a2a; color: #9ca3af; }
    .tab-btn:hover { background: #3a3a3a; color: white; }
    @media (max-width: 640px) {
      .message-bubble { max-width: 90%; }
      .chat-user-item { padding: 10px; }
      .card { border-radius: 16px; }
      .white-icon-btn { padding: 6px 12px; font-size: 12px; }
      .white-glow-btn { padding: 6px 14px; font-size: 12px; }
      .post-media-grid { gap: 4px; }
      .action-btn { font-size: 13px; padding: 6px 12px; }
      .online-status { width: 10px; height: 10px; }
      .tab-btn { padding: 6px 12px; font-size: 14px; }
    }
  </style>
</head>
<body>
<div id="root"><div class="flex items-center justify-center min-h-screen text-white"><i class="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const STORAGE_BUCKET = "wave-media";
  const DEFAULT_AVATAR = "https://ui-avatars.com/api/?background=3b82f6&color=fff&rounded=true&size=96&bold=true&length=2&name=?";
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    realtime: { enabled: false }
  });

  let onlineUsers = new Set();

  function showToast(msg) { 
    const t = document.createElement('div'); 
    t.className = 'toast'; 
    t.innerHTML = msg; 
    document.body.appendChild(t); 
    setTimeout(() => t.remove(), 2500); 
  }
  
  function formatDate(iso) { 
    if(!iso) return 'только что';
    const d = new Date(iso);
    const now = new Date();
    const diff = Math.floor((now - d) / 1000);
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterdayStart = new Date(todayStart - 86400000);
    
    if (diff < 60) return 'только что';
    if (diff < 3600) return `${Math.floor(diff/60)} мин назад`;
    if (d >= todayStart) return `сегодня в ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    if (d >= yesterdayStart) return `вчера в ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  }
  
  function formatLikes(n) { 
    if (n >= 1000) return (n/1000).toFixed(1) + 'к'; 
    return n; 
  }

  function isUserOnline(userId) {
    return onlineUsers.has(userId);
  }

  function getRecommendationOrder(posts) {
    const popular = posts.filter(p => (p.likes || 0) + (p.comments?.length || 0) > 3);
    const normal = posts.filter(p => (p.likes || 0) + (p.comments?.length || 0) <= 3);
    const mixed = [];
    const maxLen = Math.max(popular.length, normal.length);
    for (let i = 0; i < maxLen; i++) {
      if (i < popular.length) mixed.push(popular[i]);
      if (i < normal.length) mixed.push(normal[i]);
    }
    return mixed;
  }

  function MediaCollage({ media, onFullscreen }) {
    if (!media || media.length === 0) return null;
    if (media.length === 1) {
      const m = media[0];
      return (
        <div className="mt-3">
          {m.type === 'video' ? 
            <video src={m.url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => onFullscreen(m)} /> :
            <img src={m.url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => onFullscreen(m)} />
          }
        </div>
      );
    }
    if (media.length === 2) {
      return (
        <div className="post-media-grid mt-3">
          {media.map((m, i) => (
            <div key={i}>
              {m.type === 'video' ? 
                <video src={m.url} className="w-full rounded-xl h-48 object-cover cursor-pointer" onClick={() => onFullscreen(m)} /> :
                <img src={m.url} className="w-full rounded-xl h-48 object-cover cursor-pointer" onClick={() => onFullscreen(m)} />
              }
            </div>
          ))}
        </div>
      );
    }
    return (
      <div className="grid grid-cols-3 gap-1 mt-3">
        {media.slice(0, 3).map((m, i) => (
          <div key={i}>
            {m.type === 'video' ? 
              <video src={m.url} className="w-full rounded-xl aspect-square object-cover cursor-pointer" onClick={() => onFullscreen(m)} /> :
              <img src={m.url} className="w-full rounded-xl aspect-square object-cover cursor-pointer" onClick={() => onFullscreen(m)} />
            }
          </div>
        ))}
        {media.length > 3 && (
          <div className="relative cursor-pointer" onClick={() => onFullscreen(media[0])}>
            <img src={media[3]?.url} className="w-full rounded-xl aspect-square object-cover opacity-70" />
            <div className="absolute inset-0 flex items-center justify-center bg-black/50 rounded-xl">
              <span className="text-white font-bold text-xl">+{media.length - 3}</span>
            </div>
          </div>
        )}
      </div>
    );
  }

  function SharedPostCard({ post, onGoToPost }) {
    return (
      <div className="shared-post-card" onClick={(e) => { e.stopPropagation(); onGoToPost(post.id); }}>
        <div className="flex items-center gap-2 mb-2">
          <img src={post.user_avatar || DEFAULT_AVATAR} className="w-5 h-5 rounded-full" />
          <span className="text-white text-xs font-medium">@{post.username}</span>
        </div>
        <p className="text-gray-300 text-sm line-clamp-2">{post.content?.substring(0, 100)}{post.content?.length > 100 ? '...' : ''}</p>
        <div className="flex gap-3 mt-2 text-gray-500 text-xs">
          <span><i className="fas fa-heart text-red-500"></i> {formatLikes(post.likes || 0)}</span>
          <span><i className="far fa-comment"></i> {(post.comments || []).length}</span>
        </div>
      </div>
    );
  }

  function ReadMore({ text, maxLength = 180 }) {
    const [expanded, setExpanded] = React.useState(false);
    if(!text) return null;
    const needTruncate = text.length > maxLength;
    const displayText = expanded ? text : (needTruncate ? text.slice(0, maxLength) + '...' : text);
    if (!needTruncate) return <p className="text-white text-sm whitespace-pre-wrap leading-relaxed">{text}</p>;
    return (
      <div className="read-more-container relative">
        <div className={`read-more-content ${!expanded ? 'collapsed' : ''}`}>
          <p className="text-white text-sm whitespace-pre-wrap leading-relaxed">{displayText}</p>
        </div>
        {!expanded && <div className="read-more-overlay"></div>}
        <button onClick={() => setExpanded(!expanded)} className="read-more-btn">{expanded ? 'Свернуть ↑' : 'Читать далее ↓'}</button>
      </div>
    );
  }

  function PollComponent({ poll, postId, userId, onVote }) {
    const [voted, setVoted] = React.useState(poll?.voted_by?.includes(userId) || false);
    const totalVotes = poll?.options?.reduce((sum, opt) => sum + (opt.votes || 0), 0) || 0;
    const handleVote = async (optionIndex) => {
      if (voted) return;
      const newPoll = { ...poll };
      newPoll.options[optionIndex].votes = (newPoll.options[optionIndex].votes || 0) + 1;
      newPoll.voted_by = [...(poll.voted_by || []), userId];
      onVote(postId, newPoll);
      setVoted(true);
    };
    return (
      <div className="mt-3 p-3 bg-[#252525] rounded-xl">
        <p className="text-white text-sm font-medium mb-2">{poll?.question || 'Опрос'}</p>
        {poll?.options?.map((opt, idx) => {
          const percent = totalVotes > 0 ? ((opt.votes || 0) / totalVotes) * 100 : 0;
          return (
            <div key={idx} className="poll-option" onClick={() => handleVote(idx)}>
              <div className="relative p-2">
                <div className="poll-bar absolute left-0 top-0 h-full rounded-xl" style={{ width: `${percent}%`, opacity: 0.3 }}></div>
                <div className="relative flex justify-between items-center z-10">
                  <span className="text-white text-sm">{opt.text}</span>
                  {voted && <span className="text-gray-300 text-xs">{percent.toFixed(1)}% ({opt.votes || 0})</span>}
                </div>
              </div>
            </div>
          );
        })}
        <p className="text-gray-500 text-xs mt-2 text-center">{voted ? `✅ Всего голосов: ${totalVotes}` : '📊 Нажмите на вариант, чтобы проголосовать'}</p>
      </div>
    );
  }

  function PollCreatorModal({ onClose, onSave }) {
    const [question, setQuestion] = React.useState('');
    const [options, setOptions] = React.useState(['', '']);
    const addOption = () => { if (options.length < 10) setOptions([...options, '']); };
    const removeOption = (idx) => { if (options.length > 2) setOptions(options.filter((_, i) => i !== idx)); };
    const savePoll = () => {
      if (!question.trim()) { showToast('Введите вопрос опроса'); return; }
      const valid = options.filter(o => o.trim());
      if (valid.length < 2) { showToast('Минимум 2 варианта'); return; }
      onSave({ question: question.trim(), options: valid.map(t => ({ text: t, votes: 0 })), voted_by: [] });
      onClose();
    };
    return (
      <div className="fullscreen-modal" onClick={onClose}>
        <div className="fullscreen-modal-content" onClick={e=>e.stopPropagation()}>
          <div className="flex justify-between items-center mb-4"><h2 className="text-white text-xl font-bold">Создать опрос</h2><button onClick={onClose} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
          <input type="text" placeholder="Вопрос опроса" value={question} onChange={e=>setQuestion(e.target.value)} className="w-full input-field text-white text-sm mb-3" autoFocus />
          <div className="mb-4"><p className="text-gray-400 text-sm mb-2">Варианты ответа (2-10):</p>
            {options.map((opt, i) => (<div key={i} className="flex gap-2 mb-2"><input type="text" placeholder={`Вариант ${i+1}`} value={opt} onChange={e=>setOptions(options.map((o, j)=>j===i?e.target.value:o))} className="flex-1 p-2 input-field text-white text-sm" />{options.length>2 && <button onClick={()=>removeOption(i)} className="bg-red-600 text-white px-3 rounded-xl text-sm">✖</button>}</div>))}
          </div>
          <button onClick={addOption} className="text-blue-400 text-sm mb-4">+ Добавить вариант ({options.length}/10)</button>
          <div className="flex gap-3"><button onClick={savePoll} className="flex-1 bg-blue-600 py-3 rounded-xl text-white font-semibold">Добавить</button><button onClick={onClose} className="flex-1 bg-gray-700 py-3 rounded-xl text-white">Отмена</button></div>
        </div>
      </div>
    );
  }

  function HideSettingsModal({ users, currentUserId, selectedUsers, onToggleUser, onApply, onClose }) {
    return (
      <div className="fullscreen-modal" onClick={onClose}>
        <div className="fullscreen-modal-content" onClick={e=>e.stopPropagation()}>
          <div className="flex justify-between items-center mb-4"><h2 className="text-white text-xl font-bold">Скрыть пост</h2><button onClick={onClose} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
          <p className="text-gray-400 text-sm mb-4">Выберите пользователей:</p>
          <div className="max-h-96 overflow-y-auto mb-4 space-y-2">
            {users.filter(u=>u.id!==currentUserId).map(u=>(
              <div key={u.id} className={`flex items-center gap-3 p-3 rounded-xl cursor-pointer transition ${selectedUsers.includes(u.id)?'bg-[#2a2a2a] border border-blue-500':'bg-[#1a1a1a] hover:bg-[#252525]'}`} onClick={()=>onToggleUser(u.id)}>
                <input type="checkbox" checked={selectedUsers.includes(u.id)} onChange={()=>{}} className="w-4 h-4" />
                <img src={u.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                <div className="flex-1"><div className="text-white text-sm">{u.full_name||u.username}</div><div className="text-gray-500 text-xs">@{u.username}</div></div>
              </div>
            ))}
          </div>
          <div className="flex gap-3"><button onClick={onApply} className="flex-1 bg-blue-600 py-3 rounded-xl text-white font-semibold">Применить ({selectedUsers.length})</button><button onClick={onClose} className="flex-1 bg-gray-700 py-3 rounded-xl text-white">Отмена</button></div>
        </div>
      </div>
    );
  }

  function CommentsPage({ post, currentUser, onClose, onAddComment, onDeleteComment }) {
    const [text, setText] = React.useState('');
    const [replyTo, setReplyTo] = React.useState(null);
    const comments = post.comments || [];
    const renderComment = (c, depth=0) => {
      const replies = comments.filter(rc => rc.reply_to_id === c.id);
      return (
        <div key={c.id} className="mb-3" style={{marginLeft: depth*16}}>
          <div className="flex gap-2 p-2 hover:bg-[#2a2a2a] rounded-xl group">
            <img src={c.user_avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full mt-0.5" />
            <div className="flex-1"><div className="flex gap-2 flex-wrap"><span className="font-bold text-white text-sm">@{c.username}</span><span className="text-gray-500 text-xs">{formatDate(c.created_at)}</span></div>{c.reply_to_username && <div className="reply-quote mt-1 text-xs">→ @{c.reply_to_username}</div>}<p className="text-gray-300 text-sm mt-1">{c.text}</p><button onClick={()=>{setReplyTo(c); setText(`@${c.username} `);}} className="text-blue-400 text-xs mt-1 opacity-0 group-hover:opacity-100 transition">Ответить</button></div>
            {c.user_id === currentUser.id && <button onClick={() => onDeleteComment(post.id, c.id)} className="text-red-400 text-xs opacity-0 group-hover:opacity-100 transition"><i className="fas fa-trash-alt"></i></button>}
          </div>
          {replies.map(r => renderComment(r, depth+1))}
        </div>
      );
    };
    return (
      <div className="fixed inset-0 bg-black/95 z-50 flex flex-col">
        <div className="sticky top-0 bg-[#1a1a1a] p-3 flex items-center gap-3 border-b border-gray-800"><button onClick={onClose} className="text-white text-xl">←</button><span className="text-white font-bold">Комментарии ({comments.length})</span></div>
        <div className="flex-1 overflow-y-auto p-3">{comments.filter(c=>!c.reply_to_id).map(c=>renderComment(c))}{comments.length===0 && <div className="text-center text-gray-500 py-8">Нет комментариев</div>}</div>
        <div className="p-3 border-t border-gray-800 bg-[#1a1a1a]">
          {replyTo && <div className="reply-quote mb-2 text-xs">Ответ @{replyTo.username} <button onClick={()=>setReplyTo(null)} className="text-red-400">✖</button></div>}
          <div className="flex gap-2"><input type="text" placeholder="Написать комментарий..." value={text} onChange={e=>setText(e.target.value)} className="flex-1 p-2 input-field text-white text-sm" /><button onClick={()=>{if(text.trim()){onAddComment(post.id, text, replyTo); setText(''); setReplyTo(null);}}} className="bg-blue-600 text-white px-4 rounded-xl">→</button></div>
        </div>
      </div>
    );
  }

  function PasswordGate({ onSuccess }) { 
    const [p, setP] = React.useState(''); 
    const [e, setE] = React.useState(''); 
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full text-center">
          <i className="fas fa-lock text-4xl text-white mb-3"></i>
          <h1 className="text-xl font-bold text-white">Wave Social</h1>
          <p className="text-gray-400 mt-1 text-sm">Введите пароль для доступа</p>
          <form onSubmit={(e) => { e.preventDefault(); if (p === '8554social') { localStorage.setItem('wave_access','ok'); onSuccess(); } else setE('Неверный пароль'); }} className="mt-4">
            <input type="password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-3 input-field text-white text-center" autoFocus placeholder="Пароль" />
            {e && <div className="text-red-400 text-sm mt-1">{e}</div>}
            <button type="submit" className="w-full mt-3 bg-blue-600 text-white py-3 rounded-xl font-semibold">Войти</button>
          </form>
        </div>
      </div>
    );
  }

  function Auth({ onLogin }) { 
    const [login, setLogin] = React.useState(true); 
    const [user, setUser] = React.useState(''); 
    const [pass, setPass] = React.useState(''); 
    const [name, setName] = React.useState(''); 
    const [err, setErr] = React.useState(''); 
    const [load, setLoad] = React.useState(false); 
    
    const submit = async (e) => { 
      e.preventDefault(); setErr(''); setLoad(true); 
      if (login) { 
        const { data: u } = await supabase.from('users').select('*').eq('username', user).single(); 
        if (!u) { setErr('Неверный логин или пароль'); setLoad(false); return; } 
        if (pass === u.password_hash) onLogin(u); else setErr('Неверный логин или пароль'); 
      } else { 
        if (pass.length < 4) { setErr('Пароль минимум 4 символа'); setLoad(false); return; } 
        const { data: exist } = await supabase.from('users').select('username').eq('username', user).single(); 
        if (exist) { setErr('Имя пользователя занято'); setLoad(false); return; } 
        const { data: nu } = await supabase.from('users').insert({ username: user, full_name: name || user, password_hash: pass, avatar: DEFAULT_AVATAR, following: [], followers: [] }).select().single(); 
        if (nu) onLogin(nu); else setErr('Ошибка регистрации'); 
      } 
      setLoad(false); 
    }; 
    
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full">
          <div className="text-center"><i className="fas fa-water text-3xl text-white"></i><h1 className="text-2xl font-bold mt-1 text-white">Wave Social</h1></div>
          <form onSubmit={submit} className="space-y-3 mt-4">
            <input type="text" placeholder="Логин" value={user} onChange={e=>setUser(e.target.value.toLowerCase())} className="w-full p-3 input-field text-white" required />
            <input type="password" placeholder="Пароль" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-3 input-field text-white" required />
            {!login && <input type="text" placeholder="Имя" value={name} onChange={e=>setName(e.target.value)} className="w-full p-3 input-field text-white" />}
            {err && <div className="text-red-400 text-sm text-center">{err}</div>}
            <button type="submit" disabled={load} className="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold">{load ? 'Загрузка...' : (login ? 'Войти' : 'Регистрация')}</button>
          </form>
          <button onClick={()=>{setLogin(!login); setErr('');}} className="w-full mt-3 text-gray-400 text-sm hover:text-white">{login ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}</button>
        </div>
      </div>
    );
  }

  function MainApp({ user, onLogout }) {
    const [tab, setTab] = React.useState('feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(null);
    const [messages, setMessages] = React.useState([]);
    const [chatList, setChatList] = React.useState([]);
    const [unread, setUnread] = React.useState({});
    const [notifs, setNotifs] = React.useState([]);
    const [viewProfile, setViewProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [newPost, setNewPost] = React.useState('');
    const [media, setMedia] = React.useState([]);
    const [uploading, setUploading] = React.useState(false);
    const [commentTexts, setCommentTexts] = React.useState({});
    const [msgText, setMsgText] = React.useState('');
    const [search, setSearch] = React.useState('');
    const [searchUsers, setSearchUsers] = React.useState([]);
    const [searchPosts, setSearchPosts] = React.useState([]);
    const [sType, setSType] = React.useState('users');
    const [avatarUp, setAvatarUp] = React.useState(false);
    const [editProfile, setEditProfile] = React.useState(false);
    const [editName, setEditName] = React.useState(user.full_name||'');
    const [editBio, setEditBio] = React.useState(user.bio||'');
    const [editPost, setEditPost] = React.useState(null);
    const [editPostContent, setEditPostContent] = React.useState('');
    const [sharePost, setSharePost] = React.useState(null);
    const [shareSel, setShareSel] = React.useState([]);
    const [delPostId, setDelPostId] = React.useState(null);
    const [fullscreen, setFullscreen] = React.useState(null);
    const [tempPoll, setTempPoll] = React.useState(null);
    const [showPollModal, setShowPollModal] = React.useState(false);
    const [showHideModal, setShowHideModal] = React.useState(false);
    const [hideSel, setHideSel] = React.useState([]);
    const [commentsPagePost, setCommentsPagePost] = React.useState(null);
    const [replyComm, setReplyComm] = React.useState(null);
    const [switchDialog, setSwitchDialog] = React.useState(false);
    const [switchUser, setSwitchUser] = React.useState('');
    const [switchPass, setSwitchPass] = React.useState('');
    const [switchErr, setSwitchErr] = React.useState('');
    const [showMentions, setShowMentions] = React.useState(false);
    const [mentionQuery, setMentionQuery] = React.useState('');
    const [mentionPos, setMentionPos] = React.useState(0);
    const [scrollingToPost, setScrollingToPost] = React.useState(null);
    const msgEndRef = React.useRef(null);
    const textareaRef = React.useRef(null);
    const messageIdsSet = React.useRef(new Set());
    const chatContainerRef = React.useRef(null);
    const postRefs = React.useRef({});

    // Простой онлайн-статус через last_seen
    React.useEffect(() => {
      const updateLastSeen = async () => {
        await supabase.from('users').update({ last_seen: new Date().toISOString() }).eq('id', user.id);
      };
      updateLastSeen();
      const interval = setInterval(updateLastSeen, 60000);
      
      const loadOnlineUsers = async () => {
        const { data } = await supabase.from('users').select('id, last_seen');
        if (data) {
          const online = new Set();
          data.forEach(u => {
            if (u.last_seen && (new Date() - new Date(u.last_seen)) < 120000) {
              online.add(u.id);
            }
          });
          onlineUsers = online;
          setUsers(prev => [...prev]);
        }
      };
      loadOnlineUsers();
      const onlineInterval = setInterval(loadOnlineUsers, 30000);
      
      return () => {
        clearInterval(interval);
        clearInterval(onlineInterval);
      };
    }, [user.id]);

    React.useEffect(() => {
      if (chatContainerRef.current) {
        chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
      }
    }, [messages]);

    React.useEffect(() => {
      if (scrollingToPost && postRefs.current[scrollingToPost]) {
        postRefs.current[scrollingToPost].scrollIntoView({ behavior: 'smooth', block: 'center' });
        setScrollingToPost(null);
      }
    }, [scrollingToPost, posts]);

    const loadAll = async () => {
      try {
        const [pRes, uRes, mRes, nRes] = await Promise.all([
          supabase.from('posts').select('*').order('created_at', { ascending: false }),
          supabase.from('users').select('*'),
          supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`).order('created_at', { ascending: true }),
          supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false })
        ]);
        const all = pRes.data || [];
        const visible = all.filter(p => !p.hidden_from?.includes(user.id));
        setPosts(visible);
        setUsers(uRes.data || []);
        setNotifs(nRes.data || []);
        const msgs = mRes.data || [];
        const chatSet = new Set();
        msgs.forEach(m=>{ if(m.from_user!==user.id) chatSet.add(m.from_user); if(m.to_user!==user.id) chatSet.add(m.to_user); });
        setChatList(uRes.data?.filter(u=>chatSet.has(u.id))||[]);
        const cnt = {};
        msgs.forEach(m=>{ if(m.to_user===user.id && !m.read) cnt[m.from_user]=(cnt[m.from_user]||0)+1; });
        setUnread(cnt);
        if(chatUser){
          const chatMsgs = msgs.filter(m=>(m.from_user===user.id&&m.to_user===chatUser.id)||(m.from_user===chatUser.id&&m.to_user===user.id));
          setMessages(chatMsgs);
          await supabase.from('messages').update({read:true}).eq('to_user',user.id).eq('from_user',chatUser.id);
        }
      } catch(e) { console.error(e); showToast('Ошибка загрузки'); }
      setLoading(false);
    };

    React.useEffect(() => { loadAll(); }, []);
    React.useEffect(() => { if(chatUser) loadAll(); }, [chatUser]);

    React.useEffect(() => {
      const pSub = supabase.channel('posts').on('postgres_changes', {event:'*',schema:'public',table:'posts'}, () => loadAll()).subscribe();
      const mSub = supabase.channel('messages').on('postgres_changes', {event:'INSERT',schema:'public',table:'messages'}, (payload) => {
        const newMsg = payload.new;
        if (messageIdsSet.current.has(newMsg.id)) return;
        messageIdsSet.current.add(newMsg.id);
        if ((newMsg.to_user === user.id || newMsg.from_user === user.id)) {
          if (chatUser && (newMsg.from_user === chatUser.id || newMsg.to_user === chatUser.id)) {
            setMessages(prev => {
              if (prev.some(m => m.id === newMsg.id)) return prev;
              return [...prev, newMsg];
            });
            if (newMsg.to_user === user.id) {
              supabase.from('messages').update({read:true}).eq('id', newMsg.id);
              setUnread(prev => ({...prev, [newMsg.from_user]: 0}));
            }
          } else {
            loadAll();
          }
        }
      }).subscribe();
      return () => { pSub.unsubscribe(); mSub.unsubscribe(); };
    }, [chatUser, user.id]);

    React.useEffect(() => {
      if(!search.trim()){ setSearchUsers([]); setSearchPosts([]); return; }
      if(sType === 'users') setSearchUsers(users.filter(u=>u.id!==user.id && u.username.toLowerCase().includes(search.toLowerCase())));
      else setSearchPosts(posts.filter(p=>p.content?.toLowerCase().includes(search.toLowerCase())));
    }, [search, sType, users, posts]);

    const handlePostChange = (e) => {
      const val = e.target.value;
      setNewPost(val);
      const cursorPos = e.target.selectionStart;
      const textBeforeCursor = val.slice(0, cursorPos);
      const lastAtIndex = textBeforeCursor.lastIndexOf('@');
      if (lastAtIndex !== -1 && (lastAtIndex === textBeforeCursor.length - 1 || textBeforeCursor[lastAtIndex + 1]?.match(/\s/))) {
        const afterAt = textBeforeCursor.slice(lastAtIndex + 1);
        if (!afterAt.includes(' ') && afterAt.length < 30) {
          setShowMentions(true);
          setMentionQuery(afterAt);
          setMentionPos(lastAtIndex);
          return;
        }
      }
      setShowMentions(false);
    };

    const insertMention = (username) => {
      const before = newPost.slice(0, mentionPos);
      const after = newPost.slice(mentionPos + 1 + mentionQuery.length);
      setNewPost(`${before}@${username} ${after}`);
      setShowMentions(false);
      textareaRef.current?.focus();
    };

    const uploadMedia = async (files) => {
      const uploaded = [];
      for(let f of files){
        const name = `${Date.now()}_${Math.random().toString(36).substring(7)}.${f.name.split('.').pop()}`;
        const {error} = await supabase.storage.from(STORAGE_BUCKET).upload(name, f);
        if(error) continue;
        const {data:url} = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name);
        uploaded.push({url:url.publicUrl, type:f.type.startsWith('image/')?'image':'video'});
      }
      return uploaded;
    };

    const createPost = async () => {
      if(!newPost.trim() && media.length===0 && !tempPoll){ showToast('Напишите текст или добавьте медиа/опрос'); return; }
      
      const mentions = [...newPost.matchAll(/@(\w+)/g)].map(m=>m[1]);
      for(let m of mentions){
        const {data} = await supabase.from('users').select('username').eq('username',m).single();
        if(!data){ showToast(`Пользователь @${m} не существует`); return; }
      }
      
      const hashtags = [...newPost.matchAll(/#[\wа-яё]+/gi)].map(m=>m[0]);
      const hidden = hideSel.length ? hideSel : null;
      
      const newPostObj = { 
        user_id: user.id, 
        username: user.username, 
        user_avatar: user.avatar, 
        content: newPost, 
        media: media, 
        poll: tempPoll, 
        likes: 0, 
        comments: [], 
        mentions: mentions, 
        hashtags: hashtags,
        hidden_from: hidden,
        created_at: new Date().toISOString() 
      };
      
      const {data: ins, error} = await supabase.from('posts').insert(newPostObj).select().single();
      
      if(error) { 
        showToast('Ошибка: ' + error.message); 
        return; 
      }
      
      if(ins) setPosts([ins, ...posts]);
      setNewPost(''); setMedia([]); setTempPoll(null); setHideSel([]);
      
      for(let m of mentions){
        const u = users.find(x=>x.username === m);
        if(u && u.id !== user.id){
          await supabase.from('notifications').insert({ 
            user_id: u.id, type: 'mention', from_user_id: user.id, 
            from_username: user.username, text: `${user.username} упомянул вас в посте`, 
            read: false, created_at: new Date() 
          });
        }
      }
      showToast('Пост опубликован!');
    };

    const likePost = async (pid, curr) => { 
      const newL = curr + 1; 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,likes:newL}:p)); 
      await supabase.from('posts').update({likes:newL}).eq('id',pid); 
    };
    
    const addComment = async (pid, text, replyTo=null) => {
      const post = posts.find(p=>p.id===pid);
      const newC = {id:Date.now(), user_id:user.id, username:user.username, user_avatar:user.avatar, text, reply_to_id:replyTo?.id||null, reply_to_username:replyTo?.username||null, created_at:new Date().toISOString()};
      const newCmnts = [...(post.comments||[]), newC];
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newCmnts}:p));
      await supabase.from('posts').update({comments:newCmnts}).eq('id',pid);
      if(post.user_id!==user.id) await supabase.from('notifications').insert({user_id:post.user_id,type:'comment',from_user_id:user.id,from_username:user.username,post_id:pid,text:`${user.username} прокомментировал ваш пост`, read:false,created_at:new Date()});
    };
    
    const deleteComment = async (pid, cid) => { 
      const post=posts.find(p=>p.id===pid); 
      const newC=(post.comments||[]).filter(c=>c.id!==cid); 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newC}:p)); 
      await supabase.from('posts').update({comments:newC}).eq('id',pid); 
      showToast('Комментарий удалён'); 
    };
    
    const delPost = async (pid) => { 
      setPosts(prev=>prev.filter(p=>p.id!==pid)); 
      await supabase.from('posts').delete().eq('id',pid).eq('user_id',user.id); 
      setDelPostId(null); 
      showToast('Пост удалён'); 
    };
    
    const follow = async (id) => { 
      if(id===user.id){showToast('Нельзя подписаться на себя');return;} 
      let f=user.following||[]; 
      let is=f.includes(id); 
      let nf=is?f.filter(i=>i!==id):[...f,id]; 
      await supabase.from('users').update({following:nf}).eq('id',user.id); 
      user.following=nf; 
      let t=users.find(u=>u.id===id); 
      if(t){
        let fl=t.followers||[]; 
        let nfl=is?fl.filter(i=>i!==user.id):[...fl,user.id]; 
        await supabase.from('users').update({followers:nfl}).eq('id',id);
        setUsers(prev => prev.map(u => u.id === id ? {...u, followers: nfl} : u));
      }
      showToast(is?'Отписались':'Подписались'); 
      setViewProfile(null);
      loadAll();
    };
    
    const sendMsg = async () => {
      if(!msgText.trim() || !chatUser) return;
      const {data:ins} = await supabase.from('messages').insert({ from_user:user.id, to_user:chatUser.id, content:msgText, read:false, created_at:new Date() }).select().single();
      if(ins) setMessages(prev => [...prev, ins]);
      setMsgText('');
      await supabase.from('notifications').insert({ user_id:chatUser.id, type:'message', from_user_id:user.id, from_username:user.username, text:`${user.username} написал вам`, read:false, created_at:new Date() });
    };
    
    const sharePostToChat = async (post, chatUserId) => {
      const sharedContent = `📌 Поделился(ась) постом:\n\n"${post.content?.substring(0, 200)}"${post.content?.length > 200 ? '...' : ''}\n\n❤️ ${formatLikes(post.likes || 0)} лайков | 💬 ${(post.comments || []).length} комментариев`;
      const {data:ins} = await supabase.from('messages').insert({ from_user:user.id, to_user:chatUserId, content:sharedContent, shared_post_id:post.id, read:false, created_at:new Date() }).select().single();
      if(ins) showToast('Пост отправлен в чат');
    };
    
    const upAvatar = async (file) => { 
      if(!file) return; 
      setAvatarUp(true); 
      const name=`avatar_${user.id}_${Date.now()}.jpg`; 
      const {error}=await supabase.storage.from(STORAGE_BUCKET).upload(name,file); 
      if(error){showToast('Ошибка'); setAvatarUp(false); return;} 
      const {data:url}=supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name); 
      await supabase.from('users').update({avatar:url.publicUrl}).eq('id',user.id); 
      user.avatar=url.publicUrl; 
      await loadAll(); 
      setAvatarUp(false); 
      showToast('Аватар обновлён'); 
    };
    
    const saveProfile = async () => { 
      await supabase.from('users').update({full_name:editName, bio:editBio}).eq('id',user.id); 
      user.full_name=editName; 
      user.bio=editBio; 
      setEditProfile(false); 
      await loadAll(); 
      showToast('Профиль обновлён'); 
    };
    
    const handlePollVote = async (pid, newPoll) => { 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,poll:newPoll}:p)); 
      await supabase.from('posts').update({poll:newPoll}).eq('id',pid); 
    };

    const renderText = (text) => {
      if(!text) return null;
      const parts = text.split(/(@\w+|#[\wа-яё]+)/gi);
      return parts.map((p,i) => {
        if(p.startsWith('@')){ const un=p.slice(1); return <span key={i} className="mention" onClick={()=>{const u=users.find(x=>x.username===un); if(u) setViewProfile(u);}}>{p}</span>; }
        if(p.startsWith('#')) return <span key={i} className="hashtag" onClick={()=>{setSearch(p.slice(1)); setSType('posts'); setTab('search');}}>{p}</span>;
        return <span key={i}>{p}</span>;
      });
    };

    const PostMenu = ({onEdit,onDel,onShare}) => {
      const [open,setOpen]=React.useState(false);
      const ref=React.useRef(null);
      React.useEffect(()=>{const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener('click',fn); return()=>document.removeEventListener('click',fn);},[]);
      return (<div className="relative" ref={ref}><button onClick={()=>setOpen(!open)} className="text-gray-400 hover:text-white p-2"><i className="fas fa-ellipsis-h"></i></button>{open&&(<div className="dropdown-menu">{onEdit&&<div onClick={()=>{onEdit();setOpen(false);}} className="dropdown-item"><i className="fas fa-pen"></i> Редактировать</div>}{onShare&&<div onClick={()=>{onShare();setOpen(false);}} className="dropdown-item"><i className="fas fa-share-alt"></i> Поделиться</div>}{onDel&&<div onClick={()=>{onDel();setOpen(false);}} className="dropdown-item"><i className="fas fa-trash-alt"></i> Удалить</div>}</div>)}</div>);
    };

    // Исправленная функция показа профиля
    const renderProfilePage = (profileUser) => {
      const [showSubs, setShowSubs] = React.useState(false);
      const [showFollows, setShowFollows] = React.useState(false);
      const profilePosts = posts.filter(p => p.user_id === profileUser.id);
      const isFollowing = (user.following || []).includes(profileUser.id);
      const isOnline = isUserOnline(profileUser.id);
      
      if (!profileUser) return <div className="flex items-center justify-center min-h-screen text-white">Пользователь не найден</div>;
      
      return (
        <div className="min-h-screen" style={{background: '#0a0a0a'}}>
          <button onClick={() => setViewProfile(null)} className="fixed top-4 left-4 z-10 text-white bg-black/50 p-2 rounded-full hover:bg-black/70">
            <i className="fas fa-arrow-left"></i>
          </button>
          <div className="pt-12 px-4 pb-4">
            <div className="flex flex-col items-center">
              <div className="avatar-with-status">
                <img src={profileUser.avatar || DEFAULT_AVATAR} className="w-24 h-24 rounded-full border-4 border-blue-500" />
                <div className={`online-status ${isOnline ? '' : 'offline'}`} title={isOnline ? 'В сети' : 'Не в сети'}></div>
              </div>
              <h2 className="text-xl font-bold text-white mt-3">{profileUser.full_name || profileUser.username}</h2>
              <p className="text-gray-400 text-sm">@{profileUser.username}</p>
              <p className="text-gray-500 text-sm mt-2 text-center">{profileUser.bio || ''}</p>
              {profileUser.id !== user.id && (
                <button onClick={() => follow(profileUser.id)} className={`mt-3 px-6 py-1.5 rounded-full text-sm transition ${isFollowing ? 'bg-gray-600' : 'bg-blue-600'}`}>
                  {isFollowing ? 'Отписаться' : 'Подписаться'}
                </button>
              )}
              <div className="flex gap-6 mt-4 text-sm">
                <button onClick={() => { setShowSubs(!showSubs); setShowFollows(false); }} className="hover:text-blue-400 transition">
                  <span className="font-bold text-white text-lg">{profileUser.followers?.length || 0}</span> подписчиков
                </button>
                <button onClick={() => { setShowFollows(!showFollows); setShowSubs(false); }} className="hover:text-blue-400 transition">
                  <span className="font-bold text-white text-lg">{profileUser.following?.length || 0}</span> подписок
                </button>
              </div>
              {showSubs && (
                <div className="mt-3 w-full max-h-48 overflow-y-auto bg-[#1a1a1a] rounded-xl p-2 border border-gray-800">
                  <h4 className="text-white text-sm font-medium mb-2">Подписчики</h4>
                  {users.filter(u => profileUser.followers?.includes(u.id)).map(u => (
                    <div key={u.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded transition" onClick={() => setViewProfile(u)}>
                      <img src={u.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                      <div><div className="text-white font-medium text-sm">@{u.username}</div><div className="text-gray-500 text-xs">{u.full_name || u.username}</div></div>
                    </div>
                  ))}
                  {(!profileUser.followers || profileUser.followers.length === 0) && <div className="text-gray-500 text-sm text-center py-2">Нет подписчиков</div>}
                </div>
              )}
              {showFollows && (
                <div className="mt-3 w-full max-h-48 overflow-y-auto bg-[#1a1a1a] rounded-xl p-2 border border-gray-800">
                  <h4 className="text-white text-sm font-medium mb-2">Подписки</h4>
                  {users.filter(u => profileUser.following?.includes(u.id)).map(u => (
                    <div key={u.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded transition" onClick={() => setViewProfile(u)}>
                      <img src={u.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                      <div><div className="text-white font-medium text-sm">@{u.username}</div><div className="text-gray-500 text-xs">{u.full_name || u.username}</div></div>
                    </div>
                  ))}
                  {(!profileUser.following || profileUser.following.length === 0) && <div className="text-gray-500 text-sm text-center py-2">Нет подписок</div>}
                </div>
              )}
              <div className="w-full mt-6 space-y-3">
                <h3 className="text-white font-bold text-lg">Посты</h3>
                {profilePosts.length > 0 ? profilePosts.map(p => (
                  <div key={p.id} className="card p-3">
                    <ReadMore text={p.content} maxLength={180} />
                    <div className="flex gap-4 mt-2 text-gray-400 text-sm">
                      <span><i className="fas fa-heart text-red-500"></i> {formatLikes(p.likes || 0)}</span>
                      <span><i className="far fa-comment"></i> {(p.comments || []).length}</span>
                    </div>
                  </div>
                )) : <div className="text-center text-gray-500 py-4">Нет постов</div>}
              </div>
            </div>
          </div>
        </div>
      );
    };

    if(loading) return <div className="min-h-screen flex items-center justify-center text-white"><i className="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div>;
    if(commentsPagePost) return <CommentsPage post={commentsPagePost} currentUser={user} onClose={()=>setCommentsPagePost(null)} onAddComment={addComment} onDeleteComment={deleteComment} />;
    if(viewProfile) return renderProfilePage(viewProfile);

    const mentionUsers = users.filter(u => u.id !== user.id && u.username.toLowerCase().includes(mentionQuery.toLowerCase())).slice(0,5);
    const orderedPosts = getRecommendationOrder(posts);

    return (
      <div className="min-h-screen pb-16" style={{background:'#0a0a0a'}}>
        {fullscreen && <div className="fullscreen-media" onClick={()=>setFullscreen(null)}>{fullscreen.type==='video'?<video src={fullscreen.url} controls autoPlay />:<img src={fullscreen.url} />}</div>}
        {delPostId && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>setDelPostId(null)}><div className="card p-5 max-w-sm w-full text-center"><p className="text-white mb-4">Удалить этот пост?</p><div className="flex gap-2"><button onClick={()=>delPost(delPostId)} className="flex-1 bg-red-600 py-2 rounded-xl">Да</button><button onClick={()=>setDelPostId(null)} className="flex-1 bg-gray-700 py-2 rounded-xl">Нет</button></div></div></div>}
        {editPost && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>setEditPost(null)}><div className="card p-5 max-w-sm w-full"><textarea value={editPostContent} onChange={e=>setEditPostContent(e.target.value)} rows="3" className="w-full p-2 input-field text-white mb-3" /><div className="flex gap-2"><button onClick={async()=>{setPosts(prev=>prev.map(p=>p.id===editPost.id?{...p,content:editPostContent,edited:true}:p)); await supabase.from('posts').update({content:editPostContent,edited:true}).eq('id',editPost.id); setEditPost(null); showToast('Пост обновлён');}} className="flex-1 bg-blue-600 py-2 rounded-xl text-white">Сохранить</button><button onClick={()=>setEditPost(null)} className="flex-1 bg-gray-700 py-2 rounded-xl">Отмена</button></div></div></div>}
        {sharePost && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>{setSharePost(null); setShareSel([]);}}><div className="card p-5 max-w-sm w-full"><p className="text-white mb-2">Поделиться в чате</p><div className="max-h-48 overflow-auto">{chatList.map(cu=><div key={cu.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded" onClick={()=>{sharePostToChat(sharePost, cu.id); setSharePost(null);}}><img src={cu.avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white">@{cu.username}</span></div>)}</div><button onClick={()=>setSharePost(null)} className="w-full mt-2 bg-gray-700 py-2 rounded-xl">Отмена</button></div></div>}
        {switchDialog && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>{setSwitchDialog(false); setSwitchErr(''); setSwitchUser(''); setSwitchPass('');}}><div className="card p-5 max-w-sm w-full"><p className="text-white mb-3 text-center">Сменить аккаунт</p><input type="text" placeholder="Логин" value={switchUser} onChange={e=>setSwitchUser(e.target.value)} className="w-full p-2 input-field text-white mb-2" /><input type="password" placeholder="Пароль" value={switchPass} onChange={e=>setSwitchPass(e.target.value)} className="w-full p-2 input-field text-white mb-2" />{switchErr&&<div className="text-red-400 text-sm mb-2">{switchErr}</div>}<div className="flex gap-2"><button onClick={async()=>{const{data:acc}=await supabase.from('users').select('*').eq('username',switchUser).single(); if(!acc||acc.password_hash!==switchPass){setSwitchErr('Неверный логин или пароль');return;} localStorage.setItem('wave_user',JSON.stringify(acc)); window.location.reload();}} className="flex-1 bg-blue-600 py-2 rounded-xl text-white">Войти</button><button onClick={()=>{setSwitchDialog(false); setSwitchErr(''); setSwitchUser(''); setSwitchPass('');}} className="flex-1 bg-gray-700 py-2 rounded-xl">Отмена</button></div></div></div>}
        {showPollModal && <PollCreatorModal onClose={()=>setShowPollModal(false)} onSave={(poll)=>{setTempPoll(poll); showToast('Опрос добавлен');}} />}
        {showHideModal && <HideSettingsModal users={users} currentUserId={user.id} selectedUsers={hideSel} onToggleUser={(id)=>setHideSel(prev=>prev.includes(id)?prev.filter(i=>i!==id):[...prev,id])} onApply={()=>{setShowHideModal(false); showToast(`Скрыто от ${hideSel.length} пользователей`);}} onClose={()=>setShowHideModal(false)} />}

        <header className="sticky top-0 z-20 border-b border-gray-800 bg-[#0a0a0a]/90 backdrop-blur-md p-3"><div className="max-w-2xl mx-auto flex justify-between items-center"><div className="flex items-center gap-2"><i className="fas fa-water text-white text-xl"></i><span className="text-white font-bold text-lg">Wave</span></div><div className="flex gap-2 sm:gap-3"><button onClick={()=>{setTab('feed'); setViewProfile(null);}} className={`tab-btn ${tab==='feed'?'active-tab':''}`}><i className="fas fa-home mr-1"></i> Лента</button><button onClick={()=>{setTab('search'); setViewProfile(null);}} className={`tab-btn ${tab==='search'?'active-tab':''}`}><i className="fas fa-search mr-1"></i> Поиск</button><button onClick={()=>{setTab('chat'); setViewProfile(null);}} className={`tab-btn relative ${tab==='chat'?'active-tab':''}`}><i className="fas fa-comments mr-1"></i> Чаты{Object.values(unread).reduce((a,b)=>a+b,0)>0&&<span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{Object.values(unread).reduce((a,b)=>a+b,0)}</span>}</button><button onClick={()=>{setTab('notify'); setViewProfile(null);}} className={`tab-btn ${tab==='notify'?'active-tab':''}`}><i className="fas fa-bell mr-1"></i> Уведомления{notifs.filter(n=>!n.read).length>0&&<span className="ml-1 bg-red-500 text-white text-[10px] rounded-full px-1">{notifs.filter(n=>!n.read).length}</span>}</button><button onClick={()=>{setTab('profile'); setViewProfile(null);}} className={`tab-btn ${tab==='profile'?'active-tab':''}`}><i className="fas fa-user mr-1"></i> Профиль</button><button onClick={onLogout} className="tab-btn bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white"><i className="fas fa-sign-out-alt mr-1"></i> Выйти</button></div></div></header>

        <main className="max-w-2xl mx-auto p-3">
          {tab==='feed' && (
            <div>
              <div className="card p-3 mb-4"><div className="flex gap-2"><img src={user.avatar||DEFAULT_AVATAR} className="w-8 h-8 sm:w-10 sm:h-10 rounded-full" /><div className="flex-1 relative"><textarea ref={textareaRef} rows="2" placeholder="Что нового? @ или #" className="w-full p-2 sm:p-3 input-field text-white text-sm resize-none" value={newPost} onChange={handlePostChange} />{showMentions && mentionUsers.length>0 && (<div className="mention-suggestions">{mentionUsers.map(u=><div key={u.id} className="mention-suggestion-item" onClick={()=>insertMention(u.username)}><img src={u.avatar||DEFAULT_AVATAR} className="w-5 h-5 rounded-full" /><span className="text-white text-sm">@{u.username}</span></div>)}</div>)}<div className="flex flex-wrap gap-1 mt-2">{media.map((m,i)=><div key={i} className="media-preview" onClick={()=>setFullscreen({url:m.url,type:m.type})}>{m.type==='video'?<video src={m.url} />:<img src={m.url} />}<button className="remove-media" onClick={(e)=>{e.stopPropagation(); setMedia(media.filter((_,idx)=>idx!==i));}}>×</button></div>)}</div>{tempPoll && <div className="mt-2 p-2 bg-[#252525] rounded-xl flex justify-between"><span className="text-white text-xs">Опрос: {tempPoll.question}</span><button onClick={()=>setTempPoll(null)} className="text-red-400 text-xs">✖</button></div>}<div className="flex gap-2 mt-2 flex-wrap"><label className={`white-icon-btn text-sm ${uploading?'opacity-50':''}`}><i className="fas fa-paperclip"></i> Файлы<input type="file" accept="image/*,video/*" multiple onChange={async(e)=>{const files=Array.from(e.target.files); if(media.length+files.length>5){showToast('Максимум 5');return;} setUploading(true); const up=await uploadMedia(files); setMedia([...media,...up]); setUploading(false); e.target.value='';}} className="hidden" disabled={uploading} /></label><button onClick={()=>setShowPollModal(true)} className="white-icon-btn text-sm"><i className="fas fa-chart-simple"></i> Опрос</button><button onClick={()=>setShowHideModal(true)} className="white-icon-btn text-sm"><i className="fas fa-eye-slash"></i> Скрыть</button><button onClick={createPost} className="white-glow-btn text-sm"><i className="fas fa-paper-plane mr-1"></i> Опубликовать</button></div></div></div></div>
              {orderedPosts.map(p=>{
                const comments=p.comments||[];
                const firstThree=comments.filter(c=>!c.reply_to_id).slice(0,3);
                const hasMore=comments.length>3;
                const isPostAuthorOnline = isUserOnline(p.user_id);
                return (
                  <div key={p.id} ref={el => postRefs.current[p.id] = el} className="card p-3 mb-3">
                    <div className="flex justify-between items-start"><div className="flex gap-2 cursor-pointer" onClick={()=>p.user_id!==user.id&&setViewProfile(users.find(u=>u.id===p.user_id))}><div className="avatar-with-status"><img src={p.user_avatar||DEFAULT_AVATAR} className="w-7 h-7 sm:w-8 sm:h-8 rounded-full" /><div className={`online-status ${isPostAuthorOnline ? '' : 'offline'}`} style={{width: '10px', height: '10px'}}></div></div><div><div className="font-bold text-white text-xs sm:text-sm">@{p.username}</div><div className="text-xs text-gray-500">{formatDate(p.created_at)}{p.edited&&<span className="ml-1 text-gray-600">(ред)</span>}</div></div></div><PostMenu onEdit={p.user_id===user.id?()=>{setEditPost(p); setEditPostContent(p.content);}:null} onDel={p.user_id===user.id?()=>setDelPostId(p.id):null} onShare={()=>{setSharePost(p); setShareSel([]);}} /></div>
                    <ReadMore text={p.content} maxLength={180} />
                    <MediaCollage media={p.media} onFullscreen={(m)=>setFullscreen(m)} />
                    {p.poll && <PollComponent poll={p.poll} postId={p.id} userId={user.id} onVote={handlePollVote} />}
                    <div className="flex gap-3 mt-3"><button onClick={()=>likePost(p.id,p.likes||0)} className="action-btn"><i className="fas fa-heart mr-1"></i> {formatLikes(p.likes||0)}</button><button onClick={()=>{const d=document.getElementById(`c-${p.id}`); if(d)d.classList.toggle('hidden');}} className="action-btn"><i className="far fa-comment mr-1"></i> {(p.comments||[]).length}</button></div>
                    <div id={`c-${p.id}`} className="hidden mt-2 pt-2 border-t border-gray-800">
                      {firstThree.map(c=>(
                        <div key={c.id} className="mb-2 fade-comment"><div className="flex items-start gap-2 p-2 hover:bg-[#2a2a2a] rounded-xl cursor-pointer" onClick={()=>setCommentsPagePost(p)}><img src={c.user_avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full mt-0.5" /><div className="flex-1"><div className="flex items-center gap-2 flex-wrap"><span className="font-bold text-sm text-white">@{c.username}</span><span className="text-xs text-gray-500">{formatDate(c.created_at)}</span></div>{c.reply_to_username&&<div className="reply-quote mt-1 text-xs">@{c.reply_to_username}</div>}<p className="text-gray-300 text-sm mt-1">{c.text.length>80?c.text.substring(0,80)+'...':c.text}</p></div></div></div>
                      ))}
                      {hasMore&&<button onClick={()=>setCommentsPagePost(p)} className="text-blue-400 text-xs mt-1">Показать еще ({comments.length-3})</button>}
                      <div className="flex gap-2 mt-2"><input type="text" placeholder="Комментарий..." className="flex-1 p-1.5 input-field rounded-xl text-sm text-white" value={commentTexts[p.id]||''} onChange={e=>setCommentTexts({...commentTexts,[p.id]:e.target.value})} /><button onClick={()=>addComment(p.id, commentTexts[p.id])} className="bg-blue-600 text-white px-3 rounded-xl text-xs">→</button></div>
                    </div>
                  </div>
                );
              })}
              {orderedPosts.length===0 && <div className="card p-8 text-center text-gray-500"><i className="fas fa-newspaper text-4xl mb-2 opacity-50"></i><p>Нет постов. Напишите что-нибудь!</p></div>}
            </div>
          )}

          {tab==='search' && (<div><div className="card p-3 mb-4"><div className="flex gap-2 mb-2"><button onClick={()=>setSType('users')} className={`text-xs px-3 py-1 rounded-full ${sType==='users'?'bg-blue-600':'bg-gray-800'}`}><i className="fas fa-users mr-1"></i> Пользователи</button><button onClick={()=>setSType('posts')} className={`text-xs px-3 py-1 rounded-full ${sType==='posts'?'bg-blue-600':'bg-gray-800'}`}><i className="fas fa-hashtag mr-1"></i> Хештеги</button></div><input type="text" placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full p-2 input-field rounded-xl text-white text-sm" /></div>{sType==='users'&&searchUsers.map(u=><div key={u.id} className="card p-3 mb-2 flex justify-between items-center"><div className="flex gap-2 cursor-pointer" onClick={()=>setViewProfile(u)}><div className="avatar-with-status"><img src={u.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><div className={`online-status ${isUserOnline(u.id) ? '' : 'offline'}`} style={{width: '10px', height: '10px'}}></div></div><div><div className="font-bold text-white text-sm">{u.full_name||u.username}</div><div className="text-gray-400 text-xs">@{u.username}</div></div></div><button onClick={()=>{setChatUser(u); setTab('chat');}} className="bg-green-600 text-white px-2 py-1 rounded-full text-xs"><i className="fas fa-comment mr-1"></i> Чат</button></div>)}</div>)}

          {tab==='chat' && (<div className="flex flex-col h-[80vh]">
            {!chatUser ? (
              <div className="chat-user-list">
                <h3 className="text-white font-bold text-base mb-3 px-1"><i className="fas fa-users mr-2"></i> Контакты</h3>
                {chatList.map(cu=>{
                  const isOnline = isUserOnline(cu.id);
                  return (
                    <div key={cu.id} className="chat-user-item" onClick={()=>setChatUser(cu)}>
                      <div className="avatar-with-status">
                        <img src={cu.avatar||DEFAULT_AVATAR} className="w-10 h-10 sm:w-12 sm:h-12 rounded-full" />
                        <div className={`online-status ${isOnline ? '' : 'offline'}`}></div>
                      </div>
                      <div className="flex-1"><div className="font-bold text-white text-sm sm:text-base">@{cu.username}</div><div className="text-gray-400 text-xs">{cu.full_name||cu.username}</div></div>
                      {unread[cu.id]>0 && <div className="bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">{unread[cu.id]}</div>}
                    </div>
                  );
                })}
                {chatList.length===0 && <div className="text-center text-gray-500 py-12"><i className="fas fa-comment-slash text-3xl mb-3 opacity-50"></i><p>Нет чатов. Начните общение!</p></div>}
              </div>
            ) : (
              <div className="fixed inset-x-0 bottom-0 top-0 z-50 bg-[#0a0a0a] flex flex-col" style={{marginTop:'55px'}}>
                <div className="sticky top-0 bg-[#1a1a1a] p-3 flex items-center gap-3 border-b border-gray-800">
                  <button onClick={()=>setChatUser(null)} className="text-white text-xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-800">←</button>
                  <div className="avatar-with-status">
                    <img src={chatUser.avatar||DEFAULT_AVATAR} className="w-8 h-8 sm:w-10 sm:h-10 rounded-full" />
                    <div className={`online-status ${isUserOnline(chatUser.id) ? '' : 'offline'}`}></div>
                  </div>
                  <div><div className="font-bold text-white text-sm sm:text-base">@{chatUser.username}</div><div className="text-gray-400 text-xs">{chatUser.full_name||chatUser.username} {isUserOnline(chatUser.id) ? '• в сети' : '• не в сети'}</div></div>
                </div>
                <div className="flex-1 overflow-y-auto px-2 py-3 space-y-2" ref={chatContainerRef}>
                  {messages.map(msg=>(
                    <div key={msg.id} className={`flex ${msg.from_user===user.id?'justify-end':'justify-start'}`}>
                      <div className={`message-bubble text-sm ${msg.from_user===user.id?'message-mine':'message-theirs'}`}>
                        {msg.shared_post_id && (()=>{
                          const sharedPost = posts.find(p => p.id === msg.shared_post_id);
                          return sharedPost && <SharedPostCard post={sharedPost} onGoToPost={(pid)=>{setTab('feed'); setScrollingToPost(pid); setChatUser(null);}} />;
                        })()}
                        {msg.content && <p className="break-words whitespace-pre-wrap">{msg.content}</p>}
                        <div className="text-[10px] opacity-70 mt-1 text-right">{new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="p-3 border-t border-gray-800 flex gap-2 bg-[#1a1a1a]">
                  <input type="text" placeholder="Сообщение..." value={msgText} onChange={e=>setMsgText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&sendMsg()} className="flex-1 p-2 input-field rounded-xl text-white text-sm" />
                  <button onClick={sendMsg} className="bg-blue-600 text-white px-4 py-2 rounded-xl hover:bg-blue-700 transition"><i className="fas fa-paper-plane"></i></button>
                </div>
              </div>
            )}
          </div>)}

          {tab==='notify' && (<div><div className="flex justify-between items-center mb-2"><h2 className="text-lg font-bold text-white"><i className="fas fa-bell mr-2"></i> Уведомления</h2><button onClick={async()=>{const unreadIds=notifs.filter(n=>!n.read).map(n=>n.id); if(unreadIds.length===0)return; await supabase.from('notifications').update({read:true}).in('id',unreadIds); setNotifs(prev=>prev.map(n=>({...n,read:true}))); showToast('Все прочитаны');}} className="text-xs bg-gray-700 px-2 py-1 rounded-full"><i className="fas fa-check-double mr-1"></i> Прочитать все</button></div>{notifs.length===0&&<div className="card p-6 text-center text-gray-500">Нет уведомлений</div>}{notifs.map(n=><div key={n.id} className={`card p-2 mb-2 cursor-pointer ${!n.read?'border-l-4 border-green-500':''}`} onClick={async()=>{await supabase.from('notifications').update({read:true}).eq('id',n.id); setNotifs(prev=>prev.map(not=>not.id===n.id?{...not,read:true}:not)); if(n.type==='message'){const from=users.find(u=>u.id===n.from_user_id); if(from){setChatUser(from); setTab('chat');}} else setTab('feed');}}><p className="text-white text-sm"><i className={`fas ${n.type==='message'?'fa-envelope':n.type==='mention'?'fa-at':'fa-comment'} mr-2`}></i> {n.text}</p><p className="text-gray-500 text-xs">{formatDate(n.created_at)}</p></div>)}</div>)}

          {tab==='profile' && (<div className="card p-4 text-center"><div className="flex justify-end"><button onClick={()=>setSwitchDialog(true)} className="text-gray-400 hover:text-white p-1"><i className="fas fa-exchange-alt"></i></button></div><div className="avatar-with-status w-20 h-20 mx-auto"><img src={user.avatar||DEFAULT_AVATAR} className="w-20 h-20 rounded-full object-cover" /><div className={`online-status ${isUserOnline(user.id) ? '' : 'offline'}`} style={{bottom: '4px', right: '4px', width: '14px', height: '14px'}}></div><input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer rounded-full" onChange={(e)=>upAvatar(e.target.files[0])} disabled={avatarUp} style={{position: 'absolute', inset: 0, opacity: 0, borderRadius: '9999px'}} /></div>{editProfile?(<div className="mt-3"><input type="text" value={editName} onChange={e=>setEditName(e.target.value)} className="w-full p-2 input-field rounded-xl text-white text-sm mb-2" placeholder="Имя" /><textarea value={editBio} onChange={e=>setEditBio(e.target.value)} className="w-full p-2 input-field rounded-xl text-white text-sm" rows="3" placeholder="О себе"></textarea><div className="flex gap-2 mt-3"><button onClick={saveProfile} className="flex-1 bg-green-600 text-white py-2 rounded-xl text-sm">Сохранить</button><button onClick={()=>setEditProfile(false)} className="flex-1 bg-gray-700 text-white py-2 rounded-xl text-sm">Отмена</button></div></div>):(<><h2 className="text-lg font-bold text-white mt-2">{user.full_name||user.username}</h2><p className="text-gray-400 text-sm">@{user.username}</p><p className="text-gray-500 text-xs mt-1">{user.bio||''}</p><div className="flex gap-4 justify-center mt-3 text-sm"><div><span className="font-bold text-white">{posts.filter(p=>p.user_id===user.id).length}</span><span className="text-gray-500 ml-1">постов</span></div><div><span className="font-bold text-white">{user.followers?.length||0}</span><span className="text-gray-500 ml-1">подписчиков</span></div><div><span className="font-bold text-white">{user.following?.length||0}</span><span className="text-gray-500 ml-1">подписок</span></div></div></>)}</div>)}
        </main>
      </div>
    );
  }

  function App() { 
    const [a,setA]=React.useState(false); 
    const [u,setU]=React.useState(null); 
    const [l,setL]=React.useState(true); 
    React.useEffect(()=>{ 
      if(localStorage.getItem('wave_access')==='ok') setA(true); 
      const s=localStorage.getItem('wave_user'); 
      if(s) setU(JSON.parse(s)); 
      setL(false); 
    },[]); 
    const log=(u)=>{ localStorage.setItem('wave_user',JSON.stringify(u)); setU(u); }; 
    const out=()=>{ localStorage.removeItem('wave_user'); setU(null); localStorage.removeItem('wave_access'); window.location.reload(); }; 
    if(l) return <div className="flex items-center justify-center min-h-screen text-white"><i className="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div>; 
    if(!a) return <PasswordGate onSuccess={()=>setA(true)} />; 
    if(u) return <MainApp user={u} onLogout={out} />; 
    return <Auth onLogin={log} />; 
  }
  
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
