<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Wave Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f0f0f; margin: 0; padding: 0; }
    #root { min-height: 100vh; background: #0f0f0f; }
    .card { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 24px; transition: 0.2s; box-shadow: 0 0 5px rgba(255,255,255,0.05); }
    .card:hover { transform: translateY(-3px); border-color: #4a4a4a; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e1e1e; border: 1px solid #333; color: white; padding: 8px 18px; border-radius: 40px; z-index: 1000; font-size: 14px; animation: fadeInUp 0.3s ease; z-index: 3000; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .media-preview { position: relative; display: inline-block; margin: 4px; border-radius: 14px; overflow: hidden; border: 1px solid #3a3a3a; width: 80px; height: 80px; cursor: pointer; }
    .media-preview img, .media-preview video { width: 100%; height: 100%; object-fit: cover; }
    .remove-media { position: absolute; top: -8px; right: -8px; background: #ef4444; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; color: white; z-index: 10; }
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 16px; min-width: 160px; z-index: 50; overflow: hidden; }
    .dropdown-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: #e0e0e0; transition: 0.15s; cursor: pointer; }
    .dropdown-item:hover { background: #2a2a2a; }
    .reply-quote { background: #1a1a1a; padding: 6px 10px; border-radius: 12px; border-left: 3px solid #3b82f6; font-size: 11px; color: #aaa; margin-bottom: 6px; display: flex; flex-direction: column; gap: 2px; }
    .mention { color: #3b82f6; font-weight: 600; cursor: pointer; background: rgba(59,130,246,0.15); padding: 2px 6px; border-radius: 12px; display: inline-block; }
    .hashtag { color: #eab308; font-weight: 600; cursor: pointer; background: rgba(234,179,8,0.15); padding: 2px 6px; border-radius: 12px; display: inline-block; }
    .white-glow-btn { background: white; color: #111; box-shadow: 0 0 8px rgba(255,255,255,0.3); transition: 0.2s; font-weight: 500; cursor: pointer; border: none; border-radius: 40px; padding: 8px 20px; white-space: nowrap; }
    .white-glow-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255,255,255,0.5); background: #f0f0f0; }
    .icon-btn { background: white; color: #111; border-radius: 40px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; border: none; transition: 0.2s; white-space: nowrap; }
    .icon-btn:hover { transform: scale(1.02); background: #f5f5f5; }
    .modal-media { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .modal-media-content { max-width: 90vw; max-height: 85vh; border-radius: 20px; object-fit: contain; }
    .fullscreen-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fullscreen-modal-content { background: #1a1a1a; border-radius: 32px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 24px; border: 1px solid #3a3a3a; animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .poll-option { background: #2a2a2a; border-radius: 12px; margin: 8px 0; overflow: hidden; transition: 0.2s; }
    .poll-option:hover { background: #333; }
    .poll-bar { background: #3b82f6; height: 100%; transition: width 0.3s ease; }
    .poll-option.disabled { opacity: 0.7; cursor: not-allowed; }
    .poll-option.disabled:hover { background: #2a2a2a; }
    .chat-user-list { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
    .chat-user-item { background: #1a1a1a; border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.2s; border: 1px solid #2c2c2c; display: flex; align-items: center; gap: 12px; }
    .chat-user-item:hover { background: #252525; border-color: #3b82f6; }
    .chat-messages { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; padding: 12px; }
    .message-bubble { max-width: 80%; padding: 10px 14px; border-radius: 20px; word-break: break-word; }
    .message-mine { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message-theirs { background: #2a2a2a; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
    .read-more-container { position: relative; }
    .read-more-content { overflow: hidden; transition: max-height 0.3s ease; }
    .read-more-content.collapsed { max-height: 150px; }
    .read-more-content.expanded { max-height: 2000px; }
    .read-more-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(to bottom, transparent, #1a1a1a); pointer-events: none; }
    .read-more-btn { background: #3b82f6; color: white; border: none; padding: 6px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 8px; transition: 0.2s; display: inline-block; width: auto; }
    .read-more-btn:hover { background: #2563eb; }
    .media-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; scrollbar-width: thin; border-radius: 16px; }
    .media-carousel > * { scroll-snap-align: start; flex: 0 0 100%; }
    .close-fullscreen { position: fixed; top: 20px; right: 20px; background: rgba(50,50,60,0.8); backdrop-filter: blur(8px); border-radius: 40px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2001; color: white; font-size: 20px; transition: 0.2s; border: 1px solid rgba(255,255,255,0.2); }
    .close-fullscreen:hover { background: rgba(80,80,100,0.9); transform: scale(1.05); }
    .shared-post-quote { background: #252525; border-radius: 16px; padding: 10px; margin-top: 6px; border-left: 3px solid #3b82f6; cursor: pointer; transition: 0.2s; }
    .shared-post-quote:hover { background: #2a2a2a; transform: translateX(2px); }
    .avatar-crop-container { display: flex; flex-direction: column; align-items: center; }
    .crop-canvas { border-radius: 50%; overflow: hidden; width: 220px; height: 220px; margin: 20px auto; border: 3px solid #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.3); background: #1a1a1a; cursor: grab; }
    .crop-canvas:active { cursor: grabbing; }
    .crop-slider { width: 100%; margin: 15px 0; accent-color: #3b82f6; }
    .confirm-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 3000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
    .confirm-modal-content { background: #1a1a1a; border-radius: 32px; width: 90%; max-width: 400px; padding: 28px; border: 1px solid #3a3a3a; text-align: center; }
    .upload-progress { position: fixed; bottom: 20px; right: 20px; background: #1a1a1a; border: 1px solid #3b82f6; border-radius: 12px; padding: 12px; z-index: 2000; min-width: 200px; }
    @media (max-width: 640px) {
      .message-bubble { max-width: 90%; }
      .chat-user-item { padding: 10px; }
      .card { border-radius: 16px; }
      .icon-btn { padding: 6px 10px; font-size: 11px; }
      .white-glow-btn { padding: 6px 12px; font-size: 11px; }
      .modal-media-content { max-width: 95vw; max-height: 80vh; }
      .close-fullscreen { top: 10px; right: 10px; width: 36px; height: 36px; font-size: 16px; }
      .post-actions { flex-wrap: wrap !important; gap: 6px !important; }
      .post-actions .icon-btn, .post-actions .white-glow-btn { flex: 0 0 auto; }
      .crop-canvas { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>
<div id="root"><div class="flex items-center justify-center min-h-screen text-white"><i class="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const STORAGE_BUCKET = "wave-media";
  const DEFAULT_AVATAR = "https://ui-avatars.com/api/?background=3b82f6&color=fff&rounded=true&size=96&bold=true&length=2&name=?";
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showToast(msg) { 
    const t = document.createElement('div'); 
    t.className = 'toast'; 
    t.innerHTML = msg; 
    document.body.appendChild(t); 
    setTimeout(() => t.remove(), 2800); 
  }
  
  function formatDate(iso) { 
    if(!iso) return 'только что';
    const d = new Date(iso);
    const now = new Date();
    const mskOffset = 3 * 60;
    const localOffset = now.getTimezoneOffset();
    const mskTime = new Date(d.getTime() + (localOffset + mskOffset) * 60000);
    const nowMsk = new Date(now.getTime() + (localOffset + mskOffset) * 60000);
    const diff = Math.floor((nowMsk - mskTime) / 1000);
    if (diff < 60) return 'только что';
    if (diff < 3600) return `${Math.floor(diff/60)} мин назад`;
    if (diff < 86400) {
      const h = mskTime.getHours().toString().padStart(2,'0');
      const m = mskTime.getMinutes().toString().padStart(2,'0');
      const dNum = mskTime.getDate();
      const nowDate = nowMsk.getDate();
      if (dNum === nowDate) return `сегодня в ${h}:${m}`;
      if (dNum === nowDate - 1) return `вчера в ${h}:${m}`;
      return `${mskTime.toLocaleDateString('ru-RU', {day:'numeric', month:'short'})} в ${h}:${m}`;
    }
    if (diff < 172800) return 'вчера';
    if (diff < 604800) return `${Math.floor(diff/86400)} дн назад`;
    if (diff < 2592000) return `${Math.floor(diff/604800)} нед назад`;
    if (diff < 31536000) return `${Math.floor(diff/2592000)} мес назад`;
    return `${Math.floor(diff/31536000)} г назад`;
  }
  
  function formatLikes(n) { 
    if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'м'; 
    if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'к'; 
    return n; 
  }

  // ИСПРАВЛЕННАЯ ФУНКЦИЯ ЗАГРУЗКИ - использует Supabase Storage
  async function uploadToSupabase(file, onProgress) {
    try {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
      const filePath = `${fileName}`;
      
      const { data, error } = await supabase.storage
        .from(STORAGE_BUCKET)
        .upload(filePath, file, {
          cacheControl: '3600',
          upsert: false
        });
      
      if (error) {
        console.error('Upload error:', error);
        return null;
      }
      
      const { data: { publicUrl } } = supabase.storage
        .from(STORAGE_BUCKET)
        .getPublicUrl(filePath);
      
      return { 
        url: publicUrl, 
        type: file.type.startsWith('image/') ? 'image' : 'video' 
      };
    } catch(e) { 
      console.error('Upload error:', e); 
      return null;
    }
  }

  // Альтернативная загрузка через base64 для маленьких файлов
  async function uploadAsBase64(file) {
    if (file.size > 500000) return null;
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        resolve({ 
          url: reader.result, 
          type: file.type.startsWith('image/') ? 'image' : 'video' 
        });
      };
      reader.readAsDataURL(file);
    });
  }

  async function uploadMediaFile(file) {
    let result = await uploadToSupabase(file);
    if (!result) {
      result = await uploadAsBase64(file);
    }
    return result;
  }

  // Компонент для обрезки аватара
  function AvatarCropper({ imageUrl, onCrop, onClose }) {
    const [zoom, setZoom] = React.useState(1);
    const [position, setPosition] = React.useState({ x: 0, y: 0 });
    const [isDragging, setIsDragging] = React.useState(false);
    const [dragStart, setDragStart] = React.useState({ x: 0, y: 0 });
    const canvasRef = React.useRef(null);
    const imgRef = React.useRef(null);

    React.useEffect(() => {
      const img = new Image();
      img.src = imageUrl;
      img.onload = () => {
        imgRef.current = img;
        drawCanvas();
      };
    }, [imageUrl]);

    const drawCanvas = () => {
      if (!canvasRef.current || !imgRef.current) return;
      const canvas = canvasRef.current;
      const ctx = canvas.getContext('2d');
      const size = 400;
      canvas.width = size;
      canvas.height = size;

      const img = imgRef.current;
      const scale = Math.max(size / img.width, size / img.height) * zoom;
      const scaledWidth = img.width * scale;
      const scaledHeight = img.height * scale;
      
      const dx = (size - scaledWidth) / 2 + position.x;
      const dy = (size - scaledHeight) / 2 + position.y;
      
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, dx, dy, scaledWidth, scaledHeight);
      ctx.restore();
    };

    React.useEffect(() => {
      drawCanvas();
    }, [zoom, position]);

    const handleMouseDown = (e) => {
      setIsDragging(true);
      setDragStart({ x: e.clientX - position.x, y: e.clientY - position.y });
    };

    const handleMouseMove = (e) => {
      if (!isDragging) return;
      const newX = e.clientX - dragStart.x;
      const newY = e.clientY - dragStart.y;
      setPosition({ x: newX, y: newY });
    };

    const handleMouseUp = () => {
      setIsDragging(false);
    };

    React.useEffect(() => {
      if (isDragging) {
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }
    }, [isDragging, dragStart]);

    const handleCrop = () => {
      const canvas = canvasRef.current;
      const croppedDataUrl = canvas.toDataURL('image/jpeg');
      onCrop(croppedDataUrl);
    };

    return (
      <div className="fullscreen-modal" onClick={onClose}>
        <div className="fullscreen-modal-content" onClick={e => e.stopPropagation()}>
          <h2 className="text-white text-xl font-bold mb-4">Обрезка аватара</h2>
          <div className="avatar-crop-container">
            <canvas 
              ref={canvasRef} 
              className="rounded-full w-48 h-48 object-cover" 
              onMouseDown={handleMouseDown}
              width="400" height="400" 
              style={{ width: '220px', height: '220px', cursor: 'grab' }} 
            />
            <input type="range" min="0.5" max="3" step="0.01" value={zoom} onChange={e => setZoom(parseFloat(e.target.value))} className="crop-slider mt-3" />
            <div className="flex gap-2 mt-4 w-full">
              <button onClick={handleCrop} className="flex-1 bg-blue-600 py-2 rounded-xl text-white font-semibold">Применить</button>
              <button onClick={onClose} className="flex-1 bg-gray-700 py-2 rounded-xl text-white">Отмена</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  function MediaCarousel({ media, onFullscreen }) {
    const [currentIndex, setCurrentIndex] = React.useState(0);
    if (!media || media.length === 0) return null;
    
    const handleScroll = (e) => {
      const scrollLeft = e.target.scrollLeft;
      const itemWidth = e.target.clientWidth;
      const newIndex = Math.round(scrollLeft / itemWidth);
      if (newIndex !== currentIndex) setCurrentIndex(newIndex);
    };
    
    return (
      <div className="mt-3 relative">
        <div className="media-carousel" onScroll={handleScroll}>
          {media.map((m, idx) => (
            <div key={idx} className="cursor-pointer" onClick={() => onFullscreen(m)}>
              {m.type === 'video' ? 
                <video src={m.url} className="w-full rounded-xl h-64 object-cover" /> :
                <img src={m.url} className="w-full rounded-xl h-64 object-cover" />
              }
            </div>
          ))}
        </div>
        {media.length > 1 && (
          <div className="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white text-xs px-2 py-1 rounded-full z-10">
            {currentIndex+1}/{media.length}
          </div>
        )}
      </div>
    );
  }

  function MediaCollage({ media, onFullscreen }) {
    if (!media || media.length === 0) return null;
    if (media.length === 1) {
      const m = media[0];
      return (
        <div className="mt-3">
          {m.type === 'video' ? 
            <video src={m.url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => onFullscreen(m)} /> :
            <img src={m.url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => onFullscreen(m)} />
          }
        </div>
      );
    }
    return <MediaCarousel media={media} onFullscreen={onFullscreen} />;
  }

  function SharedPostQuote({ post, onGoToPost }) {
    return (
      <div className="shared-post-quote" onClick={() => onGoToPost(post.id)}>
        <div className="flex items-center gap-2 mb-2">
          <img src={post.user_avatar || DEFAULT_AVATAR} className="w-5 h-5 rounded-full" />
          <span className="text-xs font-medium text-white">@{post.username}</span>
          <span className="text-[10px] text-gray-500">{formatDate(post.created_at)}</span>
        </div>
        <p className="text-sm text-gray-300 line-clamp-2">{post.content?.substring(0, 100)}</p>
        {post.media && post.media.length > 0 && (
          <div className="mt-2">
            {post.media[0].type === 'video' ? 
              <video src={post.media[0].url} className="w-full max-h-32 rounded-lg object-cover" /> :
              <img src={post.media[0].url} className="w-full max-h-32 rounded-lg object-cover" />
            }
          </div>
        )}
        <div className="flex gap-3 mt-2 text-gray-500 text-xs">
          <span><i className="fas fa-heart text-red-500"></i> {formatLikes(post.likes || 0)}</span>
          <span><i className="far fa-comment"></i> {(post.comments || []).length}</span>
        </div>
      </div>
    );
  }

  function ReadMore({ text, maxLength = 200 }) {
    const [expanded, setExpanded] = React.useState(false);
    if(!text) return null;
    const needTruncate = text.length > maxLength;
    const displayText = expanded ? text : (needTruncate ? text.slice(0, maxLength) + '...' : text);
    if (!needTruncate) return <p className="text-white text-sm whitespace-pre-wrap">{text}</p>;
    return (
      <div className="read-more-container">
        <div className={`read-more-content ${expanded ? 'expanded' : 'collapsed'}`}>
          <p className="text-white text-sm whitespace-pre-wrap">{displayText}</p>
        </div>
        {!expanded && <div className="read-more-overlay"></div>}
        <button onClick={() => setExpanded(!expanded)} className="read-more-btn">{expanded ? 'Свернуть ↑' : 'Читать далее ↓'}</button>
      </div>
    );
  }

  // ИСПРАВЛЕННЫЙ КОМПОНЕНТ ОПРОСА - можно голосовать только один раз
  function PollComponent({ poll, postId, userId, onVote }) {
    const hasVoted = poll?.voted_by?.includes(userId) || false;
    const totalVotes = poll?.options?.reduce((sum, opt) => sum + (opt.votes || 0), 0) || 0;
    
    const handleVote = async (optionIndex) => {
      if (hasVoted) {
        showToast('❌ Вы уже проголосовали в этом опросе');
        return;
      }
      
      let newPoll = JSON.parse(JSON.stringify(poll));
      newPoll.options[optionIndex].votes = (newPoll.options[optionIndex].votes || 0) + 1;
      newPoll.voted_by = [...(newPoll.voted_by || []), userId];
      newPoll.user_vote_index = optionIndex;
      
      onVote(postId, newPoll);
      showToast('✅ Голос учтён!');
    };
    
    return (
      <div className="mt-3 p-3 bg-[#252525] rounded-xl">
        <p className="text-white text-sm font-medium mb-2">{poll?.question || 'Опрос'}</p>
        {poll?.options?.map((opt, idx) => {
          const percent = totalVotes > 0 ? ((opt.votes || 0) / totalVotes) * 100 : 0;
          const isUserVote = poll.user_vote_index === idx && hasVoted;
          return (
            <div 
              key={idx} 
              className={`poll-option ${hasVoted ? 'disabled' : ''}`}
            >
              <div 
                className={`relative p-2 ${!hasVoted ? 'cursor-pointer' : ''}`}
                onClick={() => !hasVoted && handleVote(idx)}
              >
                <div className="poll-bar absolute left-0 top-0 h-full rounded-xl" style={{ width: `${percent}%`, opacity: 0.3 }}></div>
                <div className="relative flex justify-between items-center z-10">
                  <span className="text-white text-sm">
                    {opt.text} 
                    {isUserVote && <span className="text-blue-400 text-xs ml-1">✓ ваш голос</span>}
                  </span>
                  <span className="text-gray-300 text-xs">{percent.toFixed(1)}% ({opt.votes || 0})</span>
                </div>

  function Auth({ onLogin }) { 
    const [login, setLogin] = React.useState(true); 
    const [user, setUser] = React.useState(''); 
    const [pass, setPass] = React.useState(''); 
    const [name, setName] = React.useState(''); 
    const [err, setErr] = React.useState(''); 
    const [load, setLoad] = React.useState(false); 
    
    const submit = async (e) => { 
      e.preventDefault(); setErr(''); setLoad(true); 
      if (login) { 
        const { data: u } = await supabase.from('users').select('*').eq('username', user).single(); 
        if (!u) { setErr('Неверный логин или пароль'); setLoad(false); return; } 
        if (pass === u.password_hash) onLogin(u); else setErr('Неверный логин или пароль'); 
      } else { 
        if (pass.length < 4) { setErr('Пароль минимум 4 символа'); setLoad(false); return; } 
        const { data: exist } = await supabase.from('users').select('username').eq('username', user).single(); 
        if (exist) { setErr('Имя пользователя занято'); setLoad(false); return; } 
        const { data: nu } = await supabase.from('users').insert({ username: user, full_name: name || user, password_hash: pass, avatar: DEFAULT_AVATAR, following: [], followers: [] }).select().single(); 
        if (nu) onLogin(nu); else setErr('Ошибка регистрации'); 
      } 
      setLoad(false); 
    }; 
    
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full">
          <div className="text-center"><i className="fas fa-water text-3xl text-white"></i><h1 className="text-2xl font-bold mt-1 text-white">Wave Social</h1><p className="text-gray-500 text-sm mt-2">Общайся. Делись. Вдохновляй.</p></div>
          <form onSubmit={submit} className="space-y-3 mt-4">
            <input type="text" placeholder="Логин" value={user} onChange={e=>setUser(e.target.value.toLowerCase())} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            <input type="password" placeholder="Пароль" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            {!login && <input type="text" placeholder="Имя" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" />}
            {err && <div className="text-red-400 text-sm text-center">{err}</div>}
            <button type="submit" disabled={load} className="w-full bg-blue-600 text-white py-2 rounded-xl font-semibold">{load ? 'Загрузка...' : (login ? 'Войти' : 'Регистрация')}</button>
          </form>
          <button onClick={()=>{setLogin(!login); setErr('');}} className="w-full mt-3 text-gray-400 text-sm hover:text-white">{login ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}</button>
        </div>
      </div>
    );
  }

  function MainApp({ user, onLogout }) {
    const [tab, setTab] = React.useState('feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(null);
    const [messages, setMessages] = React.useState([]);

    const [unread, setUnread] = React.useState({});
    const [notifs, setNotifs] = React.useState([]);
    const [viewProfile, setViewProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [newPost, setNewPost] = React.useState('');
    const [media, setMedia] = React.useState([]);
    const [uploading, setUploading] = React.useState(false);
    const [commentTexts, setCommentTexts] = React.useState({});
    const [msgText, setMsgText] = React.useState('');
    const [msgMedia, setMsgMedia] = React.useState([]);

    const [sType, setSType] = React.useState('users');
    const [avatarUp, setAvatarUp] = React.useState(false);
    const [showAvatarCropper, setShowAvatarCropper] = React.useState(false);
    const [tempAvatarFile, setTempAvatarFile] = React.useState(null);
    const [editProfile, setEditProfile] = React.useState(false);
    const [editName, setEditName] = React.useState(user.full_name||'');
    const [editBio, setEditBio] = React.useState(user.bio||'');
    const [editPost, setEditPost] = React.useState(null);
    const [editPostContent, setEditPostContent] = React.useState('');
    const [sharePost, setSharePost] = React.useState(null);
    const [delPostId, setDelPostId] = React.useState(null);
    const [fullscreenMedia, setFullscreenMedia] = React.useState(null);
    const [tempPoll, setTempPoll] = React.useState(null);
    const [showPollModal, setShowPollModal] = React.useState(false);
    const [showHideModal, setShowHideModal] = React.useState(false);
    const [hideSel, setHideSel] = React.useState([]);
    const [commentsPagePost, setCommentsPagePost] = React.useState(null);
    const [commentsReturnToPost, setCommentsReturnToPost] = React.useState(null);
    const [switchDialog, setSwitchDialog] = React.useState(false);
    const [switchUser, setSwitchUser] = React.useState('');
    const [switchPass, setSwitchPass] = React.useState('');
    const [switchErr, setSwitchErr] = React.useState('');
    const [showMentions, setShowMentions] = React.useState(false);
    const [mentionQuery, setMentionQuery] = React.useState('');
    const [mentionPos, setMentionPos] = React.useState(0);
    const [scrollingToPost, setScrollingToPost] = React.useState(null);
    const [showSubs, setShowSubs] = React.useState(false);
    const [showFollows, setShowFollows] = React.useState(false);
    const [showDeleteAccount, setShowDeleteAccount] = React.useState(false);
    const [showConfirmDeletePost, setShowConfirmDeletePost] = React.useState(false);
    const [showConfirmDeleteAccount, setShowConfirmDeleteAccount] = React.useState(false);
    const msgEndRef = React.useRef(null);
    const textareaRef = React.useRef(null);
    const messageIdsSet = React.useRef(new Set());
    const chatContainerRef = React.useRef(null);
    const postRefs = React.useRef({});

    React.useEffect(() => {
      if (chatContainerRef.current) {
        chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
      }
    }, [messages]);

    React.useEffect(() => {
      if (scrollingToPost && postRefs.current[scrollingToPost]) {
        postRefs.current[scrollingToPost].scrollIntoView({ behavior: 'smooth', block: 'center' });
        setScrollingToPost(null);
      }
    }, [scrollingToPost, posts]);

    const loadAll = async () => {
      try {
        const [pRes, uRes, mRes, nRes] = await Promise.all([
          supabase.from('posts').select('*').order('created_at', { ascending: false }),
          supabase.from('users').select('*'),
          supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`).order('created_at', { ascending: true }),
          supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false })
        ]);
        const all = pRes.data || [];
        const visible = all.filter(p => !p.hidden_from?.includes(user.id));
        setPosts(visible);
        setUsers(uRes.data || []);
        setNotifs(nRes.data || []);
        
        const { data: updatedUser } = await supabase.from('users').select('*').eq('id', user.id).single();
        if (updatedUser) {
          user.following = updatedUser.following || [];
          user.followers = updatedUser.followers || [];
          user.avatar = updatedUser.avatar;
          user.full_name = updatedUser.full_name;
          user.bio = updatedUser.bio;
        }
        
        const msgs = mRes.data || [];
        const chatSet = new Set();
        msgs.forEach(m=>{ if(m.from_user!==user.id) chatSet.add(m.from_user); if(m.to_user!==user.id) chatSet.add(m.from_user); if(m.from_user===user.id) chatSet.add(m.to_user); });
        setChatList(uRes.data?.filter(u=>chatSet.has(u.id) && u.id !== user.id)||[]);
        const cnt = {};
        msgs.forEach(m=>{ if(m.to_user===user.id && !m.read) cnt[m.from_user]=(cnt[m.from_user]||0)+1; });
        setUnread(cnt);
        if(chatUser){
          const chatMsgs = msgs.filter(m=>(m.from_user===user.id&&m.to_user===chatUser.id)||(m.from_user===chatUser.id&&m.to_user===user.id));
          setMessages(chatMsgs);
          await supabase.from('messages').update({read:true}).eq('to_user',user.id).eq('from_user',chatUser.id);
        }
      } catch(e) { console.error(e); showToast('Ошибка загрузки'); }
      setLoading(false);
    };

    React.useEffect(() => { loadAll(); }, []);
    React.useEffect(() => { if(chatUser) loadAll(); }, [chatUser]);

    React.useEffect(() => {
      const pSub = supabase.channel('posts').on('postgres_changes', {event:'*',schema:'public',table:'posts'}, () => loadAll()).subscribe();
      const mSub = supabase.channel('messages').on('postgres_changes', {event:'INSERT',schema:'public',table:'messages'}, (payload) => {
        const newMsg = payload.new;
        if (messageIdsSet.current.has(newMsg.id)) return;
        messageIdsSet.current.add(newMsg.id);
        if ((newMsg.to_user === user.id || newMsg.from_user === user.id)) {
          if (chatUser && (newMsg.from_user === chatUser.id || newMsg.to_user === chatUser.id)) {
            setMessages(prev => [...prev, newMsg]);
            if (newMsg.to_user === user.id) {
              supabase.from('messages').update({read:true}).eq('id', newMsg.id);
              setUnread(prev => ({...prev, [newMsg.from_user]: 0}));
            }
          } else {
            loadAll();
          }
        }
      }).subscribe();
      return () => { pSub.unsubscribe(); mSub.unsubscribe(); };
    }, [chatUser, user.id]);

    React.useEffect(() => {
      if(!search.trim()){ setSearchUsers([]); setSearchPosts([]); return; }
      if(sType === 'users') setSearchUsers(users.filter(u=>u.id!==user.id && u.username.toLowerCase().includes(search.toLowerCase())));
      else {
        const hashtagPattern = new RegExp(`#${search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`, 'i');
        const filtered = posts.filter(p => p.content && hashtagPattern.test(p.content));
        setSearchPosts(filtered);
      }
    }, [search, sType, users, posts]);

    const handlePostChange = (e) => {
      const val = e.target.value;
      setNewPost(val);
      const cursorPos = e.target.selectionStart;
      const textBeforeCursor = val.slice(0, cursorPos);
      const lastAtIndex = textBeforeCursor.lastIndexOf('@');
      if (lastAtIndex !== -1 && (lastAtIndex === textBeforeCursor.length - 1 || textBeforeCursor[lastAtIndex + 1]?.match(/\s/))) {
        const afterAt = textBeforeCursor.slice(lastAtIndex + 1);
        if (!afterAt.includes(' ') && afterAt.length < 30) {
          setShowMentions(true);
          setMentionQuery(afterAt);
          setMentionPos(lastAtIndex);
          return;
        }
      }
      setShowMentions(false);
    };

    const insertMention = (username) => {
      const before = newPost.slice(0, mentionPos);
      const after = newPost.slice(mentionPos + 1 + mentionQuery.length);
      setNewPost(`${before}@${username} ${after}`);
      setShowMentions(false);
      textareaRef.current?.focus();
    };

    const uploadMediaFiles = async (files) => {
      setUploading(true);
      const uploaded = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        if (media.length + uploaded.length >= 5) { showToast('Максимум 5 файлов'); break; }
        const result = await uploadMediaFile(f);
        if (result) uploaded.push(result);
        else showToast(`Ошибка загрузки: ${f.name}`);
      }
      setMedia([...media, ...uploaded]);
      setUploading(false);
      return uploaded;
    };

    const uploadMsgMediaFiles = async (files) => {
      setUploadingMsg(true);
      const uploaded = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const result = await uploadMediaFile(f);
        if (result) uploaded.push(result);
      }
      setMsgMedia([...msgMedia, ...uploaded]);
      setUploadingMsg(false);
      return uploaded;
    };

    const handleAvatarFileSelect = (file) => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        setTempAvatarFile(e.target.result);
        setShowAvatarCropper(true);
      };
      reader.readAsDataURL(file);
    };

    const saveCroppedAvatar = async (croppedDataUrl) => {
      setAvatarUp(true);
      setShowAvatarCropper(false);
      try {
        const blob = await (await fetch(croppedDataUrl)).blob();
        const file = new File([blob], `avatar_${user.id}_${Date.now()}.jpg`, { type: 'image/jpeg' });
        const name = `avatar_${user.id}_${Date.now()}.jpg`;
        const {error} = await supabase.storage.from(STORAGE_BUCKET).upload(name, file);
        if(error) throw error;
        const {data:url} = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name);
        await supabase.from('users').update({avatar:url.publicUrl}).eq('id',user.id);
        user.avatar = url.publicUrl;
        setUsers(prev => prev.map(u => u.id === user.id ? {...u, avatar: url.publicUrl} : u));
        showToast('Аватар обновлён');
      } catch(e) { console.error(e); showToast('Ошибка загрузки аватара'); }
      setAvatarUp(false);
      setTempAvatarFile(null);
    };

    const createPost = async () => {
      if(!newPost.trim() && media.length===0 && !tempPoll){ showToast('Напишите текст или добавьте медиа/опрос'); return; }
      
      const mentions = [...newPost.matchAll(/@(\w+)/g)].map(m=>m[1]);
      for(let m of mentions){
        const {data} = await supabase.from('users').select('username').eq('username',m).single();
        if(!data){ showToast(`Пользователь @${m} не существует`); return; }
      }
      
      const hashtags = [...newPost.matchAll(/#([\wа-яё]+)/gi)].map(m=>m[0]);
      const hidden = hideSel.length ? hideSel : null;
      
      const newPostObj = { 
        user_id: user.id, 
        username: user.username, 
        user_avatar: user.avatar, 
        content: newPost, 
        media: media, 
        poll: tempPoll, 
        likes: 0, 
        comments: [], 
        mentions: mentions, 
        hashtags: hashtags,
        hidden_from: hidden,
        created_at: new Date().toISOString() 
      };
      
      const {data: ins, error} = await supabase.from('posts').insert(newPostObj).select().single();
      
      if(error) { 
        showToast('Ошибка: ' + error.message); 
        return; 
      }
      
      if(ins) setPosts([ins, ...posts]);
      setNewPost(''); setMedia([]); setTempPoll(null); setHideSel([]);
      
      for(let m of mentions){
        const u = users.find(x=>x.username === m);
        if(u && u.id !== user.id){
          await supabase.from('notifications').insert({ 
            user_id: u.id, type: 'mention', from_user_id: user.id, 
            from_username: user.username, text: `${user.username} упомянул вас в посте`, 
            read: false, created_at: new Date() 
          });
        }
      }
      showToast('Пост опубликован!');
    };

    const likePost = async (pid, curr) => { 
      const newL = curr + 1; 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,likes:newL}:p)); 
      await supabase.from('posts').update({likes:newL}).eq('id',pid); 
    };
    
    const addComment = async (pid, text, replyTo=null) => {
      const post = posts.find(p=>p.id===pid);
      const newC = {id:Date.now(), user_id:user.id, username:user.username, user_avatar:user.avatar, text, reply_to_id:replyTo?.id||null, reply_to_username:replyTo?.username||null, created_at:new Date().toISOString()};
      const newCmnts = [...(post.comments||[]), newC];
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newCmnts}:p));
      await supabase.from('posts').update({comments:newCmnts}).eq('id',pid);
      if(post.user_id!==user.id) await supabase.from('notifications').insert({user_id:post.user_id,type:'comment',from_user_id:user.id,from_username:user.username,post_id:pid,text:`${user.username} прокомментировал ваш пост`, read:false,created_at:new Date()});
    };
    
    const deleteComment = async (pid, cid) => { 
      const post=posts.find(p=>p.id===pid); 
      const newC=(post.comments||[]).filter(c=>c.id!==cid); 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newC}:p)); 
      await supabase.from('posts').update({comments:newC}).eq('id',pid); 
      showToast('Комментарий удалён'); 
    };
    
    const delPost = async () => { 
      if (!delPostId) return;
      setPosts(prev=>prev.filter(p=>p.id!==delPostId)); 
      await supabase.from('posts').delete().eq('id',delPostId).eq('user_id',user.id); 
      setDelPostId(null);
      setShowConfirmDeletePost(false);
      showToast('Пост удалён'); 
    };
    
    const follow = async (id) => { 
      if(id===user.id){showToast('Нельзя подписаться на себя');return;} 
      
      let currentFollowing = user.following || [];
      if(currentFollowing.includes(id)) { 
        showToast('Вы уже подписаны'); 
        return; 
      }
      
      const newFollowing = [...currentFollowing, id];
      const { error: err1 } = await supabase.from('users').update({ following: newFollowing }).eq('id', user.id);
      if(err1) { showToast('Ошибка'); return; }
      user.following = newFollowing;
      
      const targetUser = users.find(u => u.id === id);
      if(targetUser) {
        const newFollowers = [...(targetUser.followers || []), user.id];
        const { error: err2 } = await supabase.from('users').update({ followers: newFollowers }).eq('id', id);
        if(!err2) {
          setUsers(prev => prev.map(u => u.id === id ? {...u, followers: newFollowers} : u));
        }
      }
      
      showToast('Подписались');
      await loadAll();
    };
    
    const sendMsg = async (content, msgMediaList = []) => {
      if((!content || !content.trim()) && msgMediaList.length === 0) return;
      const msgObj = { 
        from_user: user.id, 
        to_user: chatUser.id, 
        content: content || '', 
        media: msgMediaList,
        read: false, 
        created_at: new Date() 
      };
      const {data:ins} = await supabase.from('messages').insert(msgObj).select().single();
      if(ins) {
        setMessages(prev => [...prev, ins]);
        setMsgText('');
        setMsgMedia([]);
      }
    };

    const sharePostToChat = async (post, chatUserId) => {
      const msgObj = { 
        from_user: user.id, 
        to_user: chatUserId, 
        content: '',
        shared_post: post,
        read: false, 
        created_at: new Date() 
      };
      const { error } = await supabase.from('messages').insert(msgObj).select().single();
      if (!error) {
        setChatUser(users.find(u => u.id === chatUserId));
        setTab('chat');
        setSharePost(null);
        showToast('Пост отправлен в чат');
      } else {
        showToast('Ошибка при отправке: ' + error.message);
      }
    };
    
    const saveProfile = async () => { 
      await supabase.from('users').update({full_name:editName, bio:editBio}).eq('id',user.id); 
      user.full_name=editName; 
      user.bio=editBio; 
      setEditProfile(false); 
      await loadAll(); 
      showToast('Профиль обновлён'); 
    };
    
    const deleteAccount = async () => {
      await supabase.from('users').delete().eq('id', user.id);
      showToast('Аккаунт удалён');
      localStorage.removeItem('wave_user');
      localStorage.removeItem('wave_access');
      window.location.reload();
    };
    
    const handlePollVote = async (pid, newPoll) => { 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,poll:newPoll}:p)); 
      await supabase.from('posts').update({poll:newPoll}).eq('id',pid); 
    };

    const renderText = (text) => {
      if(!text) return null;
      const parts = text.split(/(@\w+|#[\wа-яё]+)/gi);
      return parts.map((p,i) => {
        if(p && p.startsWith('@')){ const un=p.slice(1); return <span key={i} className="mention" onClick={()=>{const u=users.find(x=>x.username===un); if(u) setViewProfile(u);}}>{p}</span>; }
        if(p && p.startsWith('#')) return <span key={i} className="hashtag" onClick={()=>{setSearch(p.slice(1)); setSType('posts'); setTab('search');}}>{p}</span>;
        return <span key={i}>{p}</span>;
      });
    };
    
    const openProfileFollowList = (profileUser, type) => {
      setViewProfile(profileUser);
      if(type === 'subs') { setShowSubs(true); setShowFollows(false); }
      else { setShowFollows(true); setShowSubs(false); }
    };

    const goToMyProfile = () => {
      setViewProfile(user);
      setShowSubs(false);
      setShowFollows(false);
    };

    const PostMenu = ({onEdit,onDel,onShare}) => {
      const [open,setOpen]=React.useState(false);
      const ref=React.useRef(null);
      React.useEffect(()=>{const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener('click',fn); return()=>document.removeEventListener('click',fn);},[]);
      return (<div className="relative" ref={ref}><button onClick={()=>setOpen(!open)} className="text-gray-400 hover:text-white p-2"><i className="fas fa-ellipsis-h"></i></button>{open&&(<div className="dropdown-menu">{onEdit&&<div onClick={()=>{onEdit();setOpen(false);}} className="dropdown-item"><i className="fas fa-pen"></i> Редактировать</div>}{onShare&&<div onClick={()=>{onShare();setOpen(false);}} className="dropdown-item"><i className="fas fa-share-alt"></i> Поделиться</div>}{onDel&&<div onClick={()=>{onDel();setOpen(false);}} className="dropdown-item"><i className="fas fa-trash-alt"></i> Удалить</div>}</div>)}</div>);
    };

    const ProfileMenu = () => {
      const [open,setOpen]=React.useState(false);
      const ref=React.useRef(null);
      React.useEffect(()=>{const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener('click',fn); return()=>document.removeEventListener('click',fn);},[]);
      return (
        <div className="absolute top-4 right-4 z-20" ref={ref}>
          <button onClick={()=>setOpen(!open)} className="text-gray-400 hover:text-white p-2 rounded-full bg-black/30"><i className="fas fa-ellipsis-v"></i></button>
          {open&&(
            <div className="dropdown-menu">
              <div onClick={()=>setEditProfile(true)} className="dropdown-item"><i className="fas fa-user-edit"></i> Редактировать профиль</div>
              <div onClick={()=>setSwitchDialog(true)} className="dropdown-item"><i className="fas fa-exchange-alt"></i> Сменить аккаунт</div>
              <div onClick={()=>setShowConfirmDeleteAccount(true)} className="dropdown-item"><i className="fas fa-trash-alt"></i> Удалить аккаунт</div>
            </div>
          )}
        </div>
      );
    };

    const mentionUsers = users.filter(u => u.id !== user.id && u.username.toLowerCase().includes(mentionQuery.toLowerCase())).slice(0,5);
    
    const getRecommendationOrder = (postsList) => {
      const popular = postsList.filter(p => (p.likes || 0) + (p.comments?.length || 0) > 5);
      const normal = postsList.filter(p => (p.likes || 0) + (p.comments?.length || 0) <= 5);
      const mixed = [];
      const maxLen = Math.max(popular.length, normal.length);
      for (let i = 0; i < maxLen; i++) {
        if (i < popular.length) mixed.push(popular[i]);
        if (i < normal.length) mixed.push(normal[i]);
      }
      return mixed;
    };
    
    const orderedPosts = getRecommendationOrder(posts);
    const myPosts = posts.filter(p => p.user_id === user.id);

    if(loading) return <div className="min-h-screen flex items-center justify-center text-white"><i className="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div>;
    
    if(showConfirmDeletePost && delPostId) {
      return <ConfirmModal title="Удалить пост?" message="Это действие нельзя отменить. Пост будет удалён навсегда." onConfirm={delPost} onCancel={() => { setShowConfirmDeletePost(false); setDelPostId(null); }} />;
    }
    
    if(showConfirmDeleteAccount) {
      return <ConfirmModal title="Удалить аккаунт?" message="Это действие нельзя отменить. Все ваши посты, подписки и данные будут удалены навсегда." onConfirm={deleteAccount} onCancel={() => setShowConfirmDeleteAccount(false)} />;
    }
    
    if(commentsPagePost) {
      return <CommentsPage 
        post={commentsPagePost} 
        currentUser={user} 
        onClose={() => setCommentsPagePost(null)} 
        onAddComment={addComment} 
        onDeleteComment={deleteComment}
        returnToPostId={commentsReturnToPost}
        onReturn={(postId) => { setScrollingToPost(postId); }}
      />;
    }
    
    if(fullscreenMedia) {
      return (
        <div className="modal-media" onClick={() => setFullscreenMedia(null)}>
          <div className="close-fullscreen" onClick={() => setFullscreenMedia(null)}>
            <i className="fas fa-times"></i>
          </div>
          {fullscreenMedia.type === 'video' ? 
            <video src={fullscreenMedia.url} controls autoPlay className="modal-media-content" onClick={(e) => e.stopPropagation()} /> :
            <img src={fullscreenMedia.url} className="modal-media-content" onClick={(e) => e.stopPropagation()} />
          }
        </div>
      );
    }
    
    if(showAvatarCropper && tempAvatarFile) {
      return <AvatarCropper imageUrl={tempAvatarFile} onCrop={saveCroppedAvatar} onClose={() => { setShowAvatarCropper(false); setTempAvatarFile(null); }} />;
    }
    
    if(viewProfile) {
      const profileUser = viewProfile;
      const isFollowing = (user.following || []).includes(profileUser.id);
      let profilePostsToShow = posts.filter(p => p.user_id === profileUser.id);
      const isOwnProfile = profileUser.id === user.id;
      
      return (
        <div className="min-h-screen p-4" style={{background: '#0a0a0a'}}>
          <button onClick={() => { setViewProfile(null); setShowSubs(false); setShowFollows(false); }} className="text-gray-400 mb-4 hover:text-white transition"><i className="fas fa-arrow-left"></i> Назад</button>
          <div className="card p-6 text-center mb-6 relative">
            {isOwnProfile && <ProfileMenu />}
            <div className="relative w-24 h-24 mx-auto cursor-pointer group" onClick={() => isOwnProfile && document.getElementById('avatarInput')?.click()}>
              <img src={profileUser.avatar || DEFAULT_AVATAR} className="w-24 h-24 rounded-full object-cover border-2 border-blue-500" />
              {isOwnProfile && (
                <div className="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                  <i className="fas fa-camera text-white text-xl"></i>
                </div>
              )}
              {isOwnProfile && <input id="avatarInput" type="file" accept="image/*" className="hidden" onChange={(e) => e.target.files && handleAvatarFileSelect(e.target.files[0])} />}
            </div>
            <h2 className="text-xl font-bold text-white mt-3">{profileUser.full_name || profileUser.username}</h2>
            <p className="text-gray-400 text-sm">@{profileUser.username}</p>
            <p className="text-gray-400 text-sm mt-2">{profileUser.bio || ''}</p>
            <div className="flex gap-2 justify-center mt-4">
              {!isOwnProfile && <button onClick={() => { setChatUser(profileUser); setViewProfile(null); setTab('chat'); }} className="bg-green-600 text-white px-4 py-1.5 rounded-full text-sm hover:bg-green-700">Чат</button>}
              {!isOwnProfile && !isFollowing && <button onClick={() => follow(profileUser.id)} className="bg-blue-600 text-white px-4 py-1.5 rounded-full text-sm">Подписаться</button>}
              {!isOwnProfile && isFollowing && <button className="bg-gray-600 text-white px-4 py-1.5 rounded-full text-sm cursor-default">Подписан</button>}
            </div>
            <div className="flex gap-5 justify-center mt-4 text-sm">
              <button onClick={() => { setShowSubs(!showSubs); setShowFollows(false); }} className="hover:text-blue-400 transition">
                <span className="font-bold text-white text-lg">{profileUser.followers?.length || 0}</span> <span className="text-gray-400">подписчиков</span>
              </button>
              <button onClick={() => { setShowFollows(!showFollows); setShowSubs(false); }} className="hover:text-blue-400 transition">
                <span className="font-bold text-white text-lg">{profileUser.following?.length || 0}</span> <span className="text-gray-400">подписок</span>
              </button>
            </div>
            {showSubs && (
              <div className="mt-4 p-2 bg-[#2a2a2a] rounded-xl max-h-48 overflow-y-auto">
                {users.filter(u => profileUser.followers?.includes(u.id)).map(u => (
                  <div key={u.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#3a3a3a] rounded" onClick={() => setViewProfile(u)}>
                    <img src={u.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                    <div className="text-left"><div className="text-white font-medium">@{u.username}</div><div className="text-gray-500 text-xs">{u.full_name || u.username}</div></div>
                  </div>
                ))}
                {(!profileUser.followers || profileUser.followers.length === 0) && <div className="text-gray-500 text-sm text-center py-4">Нет подписчиков</div>}
              </div>
            )}
            {showFollows && (
              <div className="mt-4 p-2 bg-[#2a2a2a] rounded-xl max-h-48 overflow-y-auto">
                {users.filter(u => profileUser.following?.includes(u.id)).map(u => (
                  <div key={u.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#3a3a3a] rounded" onClick={() => setViewProfile(u)}>
                    <img src={u.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                    <div className="text-left"><div className="text-white font-medium">@{u.username}</div><div className="text-gray-500 text-xs">{u.full_name || u.username}</div></div>
                  </div>
                ))}
                {(!profileUser.following || profileUser.following.length === 0) && <div className="text-gray-500 text-sm text-center py-4">Нет подписок</div>}
              </div>
            )}
          </div>
          <div className="space-y-3">
            <h3 className="text-white font-bold text-lg px-1">Посты</h3>
            {profilePostsToShow.map(p => (
              <div key={p.id} className="card p-4 cursor-pointer hover:bg-[#1a1a1a] transition" onClick={() => { setTab('feed'); setScrollingToPost(p.id); setViewProfile(null); }}>
                <div className="flex items-center gap-2 mb-2">
                  <img src={p.user_avatar || DEFAULT_AVATAR} className="w-6 h-6 rounded-full" />
                  <span className="text-white text-sm font-medium">@{p.username}</span>
                  <span className="text-xs text-gray-500">{formatDate(p.created_at)}</span>
                </div>
                <div className="text-white text-sm whitespace-pre-wrap line-clamp-3">{renderText(p.content)}</div>
                {p.media && p.media.length > 0 && p.media[0] && (
                  <div className="mt-2">
                    {p.media[0].type === 'video' ? 
                      <video src={p.media[0].url} className="w-full max-h-32 rounded-lg object-cover" /> :
                      <img src={p.media[0].url} className="w-full max-h-32 rounded-lg object-cover" />
                    }
                  </div>
                )}
                <div className="flex gap-4 mt-2 text-gray-400 text-xs">
                  <span><i className="fas fa-heart text-red-500"></i> {formatLikes(p.likes || 0)}</span>
                  <span><i className="far fa-comment"></i> {(p.comments || []).length}</span>
                </div>
              </div>
            ))}
            {profilePostsToShow.length === 0 && <div className="text-center text-gray-500 py-8">Нет постов</div>}
          </div>
        </div>
      );
    }

    if(switchDialog) {
      return (
        <div className="fullscreen-modal" onClick={()=>{setSwitchDialog(false); setSwitchErr(''); setSwitchUser(''); setSwitchPass('');}}>
          <div className="fullscreen-modal-content" onClick={e=>e.stopPropagation()}>
            <h2 className="text-white text-xl font-bold mb-4 text-center">Сменить аккаунт</h2>
            <input type="text" placeholder="Логин" value={switchUser} onChange={e=>setSwitchUser(e.target.value)} className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white mb-3" />
            <input type="password" placeholder="Пароль" value={switchPass} onChange={e=>setSwitchPass(e.target.value)} className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white mb-3" />
            {switchErr && <div className="text-red-400 text-sm mb-3 text-center">{switchErr}</div>}
            <div className="flex gap-3">
              <button onClick={async()=>{const{data:acc}=await supabase.from('users').select('*').eq('username',switchUser).single(); if(!acc||acc.password_hash!==switchPass){setSwitchErr('Неверный логин или пароль');return;} localStorage.setItem('wave_user',JSON.stringify(acc)); window.location.reload();}} className="flex-1 bg-blue-600 py-2 rounded-xl text-white font-semibold">Войти</button>
              <button onClick={()=>{setSwitchDialog(false); setSwitchErr(''); setSwitchUser(''); setSwitchPass('');}} className="flex-1 bg-gray-700 py-2 rounded-xl text-white font-semibold">Отмена</button>
            </div>
          </div>
        </div>
      );
    }

    if(editProfile) {
      return (
        <div className="fullscreen-modal" onClick={()=>setEditProfile(false)}>
          <div className="fullscreen-modal-content" onClick={e=>e.stopPropagation()}>
            <h2 className="text-white text-xl font-bold mb-4 text-center">Редактировать профиль</h2>
            <input type="text" placeholder="Имя" value={editName} onChange={e=>setEditName(e.target.value)} className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white mb-3" />
            <textarea placeholder="О себе" value={editBio} onChange={e=>setEditBio(e.target.value)} rows="3" className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white mb-3" />
            <div className="flex gap-3">
              <button onClick={saveProfile} className="flex-1 bg-green-600 py-2 rounded-xl text-white font-semibold">Сохранить</button>
              <button onClick={()=>setEditProfile(false)} className="flex-1 bg-gray-700 py-2 rounded-xl text-white font-semibold">Отмена</button>
            </div>
          </div>
        </div>
      );
    }

    return (
      <div className="min-h-screen pb-20" style={{background:'#0a0a0a'}}>
        {editPost && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>setEditPost(null)}><div className="card p-5 max-w-sm w-full"><textarea value={editPostContent} onChange={e=>setEditPostContent(e.target.value)} rows="3" className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white mb-3" /><div className="flex gap-2"><button onClick={async()=>{setPosts(prev=>prev.map(p=>p.id===editPost.id?{...p,content:editPostContent,edited:true}:p)); await supabase.from('posts').update({content:editPostContent,edited:true}).eq('id',editPost.id); setEditPost(null); showToast('Пост обновлён');}} className="flex-1 bg-blue-600 py-2 rounded-xl text-white">Сохранить</button><button onClick={()=>setEditPost(null)} className="flex-1 bg-gray-700 py-2 rounded-xl">Отмена</button></div></div></div>}
        {sharePost && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>{setSharePost(null);}}><div className="card p-5 max-w-sm w-full"><p className="text-white mb-2">Поделиться в чате</p><div className="max-h-48 overflow-auto">{chatList.filter(cu => cu.id !== user.id).map(cu=><div key={cu.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded" onClick={()=>{sharePostToChat(sharePost, cu.id);}}><img src={cu.avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white text-sm">@{cu.username}</span></div>)}</div><button onClick={()=>setSharePost(null)} className="w-full mt-2 bg-gray-700 py-2 rounded-xl">Отмена</button></div></div>}
        {showPollModal && <PollCreatorModal onClose={()=>setShowPollModal(false)} onSave={(poll)=>{setTempPoll(poll); showToast('Опрос добавлен');}} />}
        {showHideModal && <HideSettingsModal users={users} currentUserId={user.id} selectedUsers={hideSel} onToggleUser={(id)=>setHideSel(prev=>prev.includes(id)?prev.filter(i=>i!==id):[...prev,id])} onApply={()=>{setShowHideModal(false); showToast(`Скрыто от ${hideSel.length} пользователей`);}} onClose={()=>setShowHideModal(false)} />}

        <header className="sticky top-0 z-20 border-b border-gray-800 bg-[#0f0f0f]/90 backdrop-blur-md p-3"><div className="max-w-2xl mx-auto flex justify-between items-center"><div className="flex items-center gap-2"><i className="fas fa-water text-white text-xl"></i><span className="text-white font-bold text-lg">Wave</span></div><div className="flex gap-3 text-gray-400"><button onClick={()=>{setTab('feed'); setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className={`text-lg ${tab==='feed'?'text-white':''}`}><i className="fas fa-home"></i></button><button onClick={()=>{setTab('search'); setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className={`text-lg ${tab==='search'?'text-white':''}`}><i className="fas fa-search"></i></button><button onClick={()=>{setTab('chat'); setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className={`text-lg relative ${tab==='chat'?'text-white':''}`}><i className="fas fa-comments"></i>{Object.values(unread).reduce((a,b)=>a+b,0)>0&&<span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{Object.values(unread).reduce((a,b)=>a+b,0)}</span>}</button><button onClick={()=>{setTab('notify'); setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className={`text-lg relative ${tab==='notify'?'text-white':''}`}><i className="fas fa-bell"></i>{notifs.filter(n=>!n.read).length>0&&<span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{notifs.filter(n=>!n.read).length}</span>}</button><button onClick={()=>{goToMyProfile();}} className={`text-lg ${tab==='profile'?'text-white':''}`}><i className="fas fa-user"></i></button><button onClick={onLogout} className="text-sm bg-gray-800 px-2 py-0.5 rounded-full">Выйти</button></div></div></header>

        <main className="max-w-2xl mx-auto p-3">
          {tab==='feed' && (<>
            <div className="card p-3 mb-4">
              <div className="flex gap-2">
                <img src={user.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full flex-shrink-0" />
                <div className="flex-1">
                  <textarea ref={textareaRef} rows="2" placeholder="Что нового? @ или #" className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm resize-none" value={newPost} onChange={handlePostChange} />
                  {showMentions && mentionUsers.length>0 && (<div className="absolute bottom-full left-0 bg-[#1a1a1a] border border-gray-700 rounded-xl max-h-36 overflow-auto z-10 mb-1 w-44">{mentionUsers.map(u=><div key={u.id} className="p-1.5 hover:bg-[#2a2a2a] cursor-pointer flex gap-2" onClick={()=>insertMention(u.username)}><img src={u.avatar||DEFAULT_AVATAR} className="w-5 h-5 rounded-full" /><span className="text-white text-xs">@{u.username}</span></div>)}</div>)}
                  <div className="flex flex-wrap gap-1 mt-2">{media.map((m,i)=><div key={i} className="media-preview" onClick={()=>setFullscreenMedia({url:m.url,type:m.type})}>{m.type==='video'?<video src={m.url} />:<img src={m.url} />}<button className="remove-media" onClick={(e)=>{e.stopPropagation(); setMedia(media.filter((_,idx)=>idx!==i));}}>×</button></div>)}</div>
                  {tempPoll && <div className="mt-2 p-2 bg-[#252525] rounded-xl flex justify-between"><span className="text-white text-xs">Опрос: {tempPoll.question}</span><button onClick={()=>setTempPoll(null)} className="text-red-400 text-xs">✖</button></div>}
                  <div className="flex flex-wrap gap-2 mt-2 post-actions">
                    <label className={`icon-btn text-sm ${uploading ? 'opacity-50 cursor-wait' : ''} flex items-center gap-1`}>{uploading ? <><i className="fas fa-spinner fa-spin"></i> Загрузка...</> : <><i className="fas fa-paperclip"></i> Медиа</>}<input type="file" accept="image/*,video/*" multiple onChange={async(e)=>{const files=Array.from(e.target.files); if(media.length+files.length>5){showToast('Максимум 5');e.target.value='';return;} await uploadMediaFiles(files); e.target.value='';}} className="hidden" disabled={uploading} /></label>
                    <button onClick={()=>setShowPollModal(true)} className="icon-btn text-sm"><i className="fas fa-chart-bar"></i></button>
                    <button onClick={()=>setShowHideModal(true)} className="icon-btn text-sm"><i className="fas fa-eye-slash"></i></button>
                    <button onClick={createPost} className="white-glow-btn text-sm ml-auto">Опубликовать</button>
                  </div>
                </div>
              </div>
            </div>
            {orderedPosts.map(p=>(
              <div key={p.id} ref={el => postRefs.current[p.id] = el} className="card p-3 mb-3">
                <div className="flex justify-between"><div className="flex gap-2 cursor-pointer" onClick={()=>p.user_id!==user.id&&setViewProfile(users.find(u=>u.id===p.user_id))}><img src={p.user_avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full" /><div><div className="font-bold text-white text-sm">@{p.username}</div><div className="text-xs text-gray-500">{formatDate(p.created_at)}{p.edited&&<span className="ml-1 text-gray-600">(ред)</span>}</div></div></div><PostMenu onEdit={p.user_id===user.id?()=>{setEditPost(p); setEditPostContent(p.content);}:null} onDel={p.user_id===user.id?()=>{setDelPostId(p.id); setShowConfirmDeletePost(true);}:null} onShare={()=>{setSharePost(p);}} /></div>
                <div className="text-white text-sm whitespace-pre-wrap">{renderText(p.content)}</div>
                <MediaCollage media={p.media} onFullscreen={(m)=>setFullscreenMedia(m)} />
                {p.poll && <PollComponent poll={p.poll} postId={p.id} userId={user.id} onVote={handlePollVote} />}
                <div className="flex gap-3 mt-2 text-gray-400 text-sm"><button onClick={()=>likePost(p.id,p.likes||0)} className="flex gap-1 hover:text-red-400"><i className="fas fa-heart"></i> {formatLikes(p.likes||0)}</button><button onClick={()=>{setCommentsPagePost(p); setCommentsReturnToPost(p.id);}} className="flex gap-1 hover:text-blue-400"><i className="far fa-comment"></i> {(p.comments||[]).length}</button></div>
              </div>
            ))}
          </>)}

          {tab==='search' && (<div><div className="card p-3 mb-4"><div className="flex gap-2 mb-2"><button onClick={()=>setSType('users')} className={`text-xs px-2 py-1 rounded-full ${sType==='users'?'bg-blue-600':'bg-gray-800'}`}><i className="fas fa-users mr-1"></i> Пользователи</button><button onClick={()=>setSType('posts')} className={`text-xs px-2 py-1 rounded-full ${sType==='posts'?'bg-blue-600':'bg-gray-800'}`}><i className="fas fa-hashtag mr-1"></i> Хештеги</button></div><input type="text" placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" /></div>{sType==='users'&&searchUsers.map(u=><div key={u.id} className="card p-3 mb-2 flex justify-between items-center"><div className="flex gap-2 cursor-pointer" onClick={()=>setViewProfile(u)}><img src={u.avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full" /><div><div className="font-bold text-white text-sm">{u.full_name||u.username}</div><div className="text-gray-400 text-xs">@{u.username}</div></div></div><button onClick={()=>{setChatUser(u); setTab('chat');}} className="bg-green-600 text-white px-2 py-0.5 rounded-full text-xs">Чат</button></div>)}
            {sType==='posts'&&searchPosts.map(p=><div key={p.id} className="card p-3 mb-2 cursor-pointer" onClick={()=>{setTab('feed'); setScrollingToPost(p.id);}}><div className="text-white text-sm">{p.content?.substring(0,100)}</div><div className="text-gray-500 text-xs mt-1">@{p.username} • {formatDate(p.created_at)}</div></div>)}
            {sType==='posts' && searchPosts.length===0 && search && <div className="text-gray-500 text-center py-8">Ничего не найдено по хештегу</div>}
          </div>)}

          {tab==='chat' && (<div className="flex flex-col h-[80vh]">
            <div className="chat-user-list">
              <h3 className="text-white font-bold mb-3"><i className="fas fa-users mr-2"></i> Контакты</h3>
              {chatList.filter(cu => cu.id !== user.id).map(cu=>(
                <div key={cu.id} className="chat-user-item" onClick={()=>setChatUser(cu)}>
                  <img src={cu.avatar||DEFAULT_AVATAR} className="w-10 h-10 rounded-full" />
                  <div className="flex-1"><div className="font-bold text-white">@{cu.username}</div><div className="text-gray-400 text-xs">{cu.full_name||cu.username}</div></div>
                  {unread[cu.id]>0 && <div className="bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">{unread[cu.id]}</div>}
                </div>
              ))}
              {chatList.filter(cu => cu.id !== user.id).length === 0 && <div className="text-center text-gray-500 py-8">Нет чатов. Начните общение!</div>}
            </div>
            {chatUser && chatUser.id !== user.id && (
              <div className="fixed inset-x-0 bottom-0 top-0 z-50 bg-[#0a0a0a] flex flex-col" style={{marginTop:'55px'}}>
                <div className="sticky top-0 bg-[#1a1a1a] p-3 flex items-center gap-3 border-b border-gray-800">
                  <button onClick={()=>setChatUser(null)} className="text-white text-xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-800">←</button>
                  <img src={chatUser.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                  <div><div className="font-bold text-white">@{chatUser.username}</div><div className="text-gray-400 text-xs">{chatUser.full_name||chatUser.username}</div></div>
                </div>
                <div className="flex-1 overflow-y-auto p-3 space-y-2 chat-messages" ref={chatContainerRef}>
                  {messages.map(msg=>{
                    const isMine = msg.from_user === user.id;
                    const isRead = msg.read === true;
                    return (
                      <div key={msg.id} className={`flex ${isMine ? 'justify-end' : 'justify-start'}`}>
                        <div className={`message-bubble ${isMine ? 'message-mine' : 'message-theirs'}`}>
                          {msg.shared_post && (
                            <SharedPostQuote 
                              post={msg.shared_post} 
                              onGoToPost={(pid) => { setTab('feed'); setScrollingToPost(pid); setChatUser(null); }}
                            />
                          )}
                          {msg.media && msg.media.length > 0 && (
                            <div className="flex flex-wrap gap-1 mt-1">
                              {msg.media.map((m, idx) => (
                                <div key={idx} className="cursor-pointer" onClick={() => setFullscreenMedia(m)}>
                                  {m.type === 'video' ? 
                                    <video src={m.url} className="w-20 h-20 rounded-lg object-cover" /> :
                                    <img src={m.url} className="w-20 h-20 rounded-lg object-cover" />
                                  }
                                </div>
                              ))}
                            </div>
                          )}
                          {msg.content && <p className="break-words">{msg.content}</p>}
                          <div className="flex justify-end items-center gap-1 mt-1">
                            <span className="text-[10px] opacity-70">{new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
                            {isMine && <span className="text-[10px] text-gray-400">{isRead ? <i className="fas fa-check-double"></i> : <i className="fas fa-check"></i>}</span>}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="p-3 border-t border-gray-800 flex gap-2 bg-[#1a1a1a]">
                  <input type="text" placeholder="Сообщение..." value={msgText} onChange={e=>setMsgText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&sendMsg(msgText, msgMedia)} className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" />
                  <label className={`bg-gray-700 text-white px-3 rounded-xl flex items-center cursor-pointer ${uploadingMsg ? 'opacity-50' : ''}`}>
                    {uploadingMsg ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-paperclip"></i>}
                    <input type="file" accept="image/*,video/*" multiple className="hidden" onChange={async(e)=>{const files=Array.from(e.target.files); await uploadMsgMediaFiles(files); e.target.value='';}} disabled={uploadingMsg} />
                  </label>
                  <button onClick={() => sendMsg(msgText, msgMedia)} className="bg-blue-600 text-white px-4 rounded-xl">→</button>
                </div>
              </div>
            )}
            {chatUser && chatUser.id === user.id && (
              <div className="text-center text-gray-500 py-8">Нельзя отправить сообщение самому себе</div>
            )}
          </div>)}

          {tab==='notify' && (<div><div className="flex justify-between items-center mb-2"><h2 className="text-lg font-bold text-white">Уведомления</h2><button onClick={async()=>{const unreadIds=notifs.filter(n=>!n.read).map(n=>n.id); if(unreadIds.length===0)return; await supabase.from('notifications').update({read:true}).in('id',unreadIds); setNotifs(prev=>prev.map(n=>({...n,read:true}))); showToast('Все прочитаны');}} className="text-xs bg-gray-700 px-2 py-0.5 rounded-full">Прочитать все</button></div>{notifs.length===0&&<div className="card p-6 text-center text-gray-500">Нет уведомлений</div>}{notifs.map(n=><div key={n.id} className={`card p-2 mb-2 cursor-pointer ${!n.read?'border-l-4 border-green-500':''}`} onClick={async()=>{await supabase.from('notifications').update({read:true}).eq('id',n.id); setNotifs(prev=>prev.map(not=>not.id===n.id?{...not,read:true}:not)); if(n.type==='message'){const from=users.find(u=>u.id===n.from_user_id); if(from){setChatUser(from); setTab('chat');}} else setTab('feed');}}><p className="text-white text-sm">{n.text}</p><p className="text-gray-500 text-xs">{formatDate(n.created_at)}</p></div>)}</div>)}

        </main>
      </div>
    );
  }

  function App() { 
    const [a,setA]=React.useState(false); 
    const [u,setU]=React.useState(null); 
    const [l,setL]=React.useState(true); 
    React.useEffect(()=>{ 
      if(localStorage.getItem('wave_access')==='ok') setA(true); 
      const s=localStorage.getItem('wave_user'); 
      if(s) setU(JSON.parse(s)); 
      setL(false); 
    },[]); 
    const log=(u)=>{ localStorage.setItem('wave_user',JSON.stringify(u)); setU(u); }; 
    const out=()=>{ localStorage.removeItem('wave_user'); setU(null); localStorage.removeItem('wave_access'); window.location.reload(); }; 
    if(l) return <div className="p-4 text-white">Загрузка...</div>; 
    if(!a) return <PasswordGate onSuccess={()=>setA(true)} />; 
    if(u) return <MainApp user={u} onLogout={out} />; 
    return <Auth onLogin={log} />; 
  }
  
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
