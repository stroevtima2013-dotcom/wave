 p-2 bg-[#2a2a2a] rounded-xl text-white" />}{error&&<div className="text-red-400 text-sm">{error}</div>}<button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-2 rounded-xl font-semibold btn">{loading?'Загрузка...':(login?'Войти':'Зарегистрироваться')}</button></form><button onClick={()=>{setLogin(!login); setError('');}} className="w-full mt-3 text-gray-400 text-sm">{login?'Нет аккаунта?':'Уже есть аккаунт?'}</button></div></div>);}

    async function loadAll(){ let [pRes,uRes,mRes,nRes]=await Promise.all([ supabase.from('posts').select('*').order('created_at',{ascending:false}), supabase.from('users').select('*'), supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`), supabase.from('notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false}) ]); let allPosts=pRes.data||[]; let visible=allPosts.filter(p=>!p.hidden_from?.includes(user.id)); setPosts(visible); setUsers(uRes.data||[]); setNotifications(nRes.data||[]); let msgs=mRes.data||[]; let chSet=new Set(); msgs.forEach(m=>{if(m.from_user!==user.id)chSet.add(m.from_user); if(m.to_user!==user.id)chSet.add(m.to_user);}); setChatList(uRes.data?.filter(u=>chSet.has(u.id))||[]); let cnt={}; msgs.forEach(m=>{if(m.to_user===user.id&&!m.read)cnt[m.from_user]=(cnt[m.from_user]||0)+1;}); setUnread(cnt); if(chatUser){ let chatMsgs=msgs.filter(m=>(m.from_user===user.id&&m.to_user===chatUser.id)||(m.from_user===chatUser.id&&m.to_user===user.id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)); setMessages(chatMsgs); await supabase.from('messages').update({read:true}).eq('to_user',user.id).eq('from_user',chatUser.id); } setLoading(false); }

    let ProfileDrop=()=>{let [open,setOpen]=React.useState(false); let ref=React.useRef(null); React.useEffect(()=>{let fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener('click',fn); return()=>document.removeEventListener('click',fn);},[]); return (<div className="relative" ref={ref}><button onClick={()=>setOpen(!open)} className="text-gray-400 hover:text-white p-1"><i className="fas fa-ellipsis-h"></i></button>{open&&<div className="dropdown-menu"><div className="dropdown-item" onClick={()=>{setEditProfile(true); setOpen(false);}}><i className="fas fa-user-edit"></i> Редактировать профиль</div><div className="dropdown-item" onClick={()=>{setShowDel(true); setOpen(false);}}><i className="fas fa-trash-alt"></i> Удалить аккаунт</div></div>}</div>); };

    if(loading) return <div className="min-h-screen flex items-center justify-center text-white">Загрузка...</div>;
    if(viewProfile){
      let prof=viewProfile, isFollow=(user.following||[]).includes(prof.id), profPosts=posts.filter(p=>p.user_id===prof.id);
      return (<div className="min-h-screen p-4"><button onClick={()=>{setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className="text-gray-400 mb-3"><i className="fas fa-arrow-left"></i> Назад</button><div className="card p-5 text-center mb-5"><img src={prof.avatar||DEFAULT_AVATAR} className="w-20 h-20 rounded-full mx-auto object-cover" /><h2 className="text-lg font-bold text-white mt-2">{prof.full_name||prof.username}</h2><p className="text-gray-400">@{prof.username}</p><p className="text-gray-500 text-sm">{prof.bio||'Нет описания'}</p><div className="flex gap-2 justify-center mt-3"><button onClick={()=>{setChatUser(prof); setViewProfile(null); setTab('chat');}} className="bg-green-600 text-white px-3 py-1 rounded-full text-xs">Чат</button><button onClick={()=>followUser(prof.id)} className={`px-3 py-1 rounded-full text-xs ${isFollow?'bg-gray-600':'bg-blue-600'}`}>{isFollow?'Отписаться':'Подписаться'}</button></div><div className="flex gap-4 justify-center mt-3 text-sm"><button onClick={()=>setShowSubs(!showSubs)}><span className="font-bold text-white">{prof.followers?.length||0}</span> подписчиков</button><button onClick={()=>setShowFollows(!showFollows)}><span className="font-bold text-white">{prof.following?.length||0}</span> подписок</button></div>{showSubs&&<div className="mt-2 p-2 bg-[#2a2a2a] rounded-xl">{users.filter(u=>(prof.followers||[]).includes(u.id)).map(u=><div key={u.id} className="flex items-center gap-2 p-1 cursor-pointer hover:bg-[#3a3a3a] rounded" onClick={()=>setViewProfile(u)}><img src={u.avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white text-sm">@{u.username}</span></div>)}</div>}{showFollows&&<div className="mt-2 p-2 bg-[#2a2a2a] rounded-xl">{users.filter(u=>(prof.following||[]).includes(u.id)).map(u=><div key={u.id} className="flex items-center gap-2 p-1 cursor-pointer hover:bg-[#3a3a3a] rounded" onClick={()=>setViewProfile(u)}><img src={u.avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white text-sm">@{u.username}</span></div>)}</div>}</div>{profPosts.map(p=><div key={p.id} className="card p-3 mb-3"><p className="text-white text-sm whitespace-pre-wrap">{renderMentions(p.content)}</p><div className="flex gap-3 mt-2 text-gray-500 text-xs"><span><i className="fas fa-heart text-red-500"></i> {formatLikes(p.likes||0)}</span><span><i className="far fa-comment"></i> {(p.comments||[]).length}</span></div></div>)}</div>);
    }

    return (<div className="min-h-screen pb-16">
      {delPostId&&<div className="modal" onClick={()=>setDelPostId(null)}><div className="modal-card" onClick={e=>e.stopPropagation()}><p className="text-white mb-4">Удалить пост?</p><div className="flex gap-2"><button onClick={()=>deletePost(delPostId)} className="flex-1 bg-red-900 py-1.5 rounded-xl">Да</button><button onClick={()=>setDelPostId(null)} className="flex-1 bg-gray-700 py-1.5 rounded-xl">Нет</button></div></div></div>}
      {selComment&&<div className="modal" onClick={()=>setSelComment(null)}><div className="modal-card" onClick={e=>e.stopPropagation()}><p className="text-white text-sm mb-3">{selComment.comment.text}</p><div className="flex flex-col gap-2"><button onClick={()=>{setReplyComment(selComment.comment); setSelComment(null);}} className="bg-blue-600 py-1.5 rounded-xl">Ответить</button><button onClick={()=>deleteComment(selComment.postId,selComment.comment.id)} className="bg-red-900 py-1.5 rounded-xl">Удалить</button><button onClick={()=>setSelComment(null)} className="bg-gray-700 py-1.5 rounded-xl">Отмена</button></div></div></div>}
      {selMsg&&<div className="modal" onClick={()=>setSelMsg(null)}><div className="modal-card" onClick={e=>e.stopPropagation()}><p className="text-white text-sm mb-3">{selMsg.msg.content}</p><div className="flex flex-col gap-2"><button onClick={()=>{setReplyMsg(selMsg.msg); setSelMsg(null);}} className="bg-blue-600 py-1.5 rounded-xl">Ответить</button><button onClick={()=>delMsg(selMsg.msg.id)} className="bg-red-900 py-1.5 rounded-xl">Удалить</button><button onClick={()=>setSelMsg(null)} className="bg-gray-700 py-1.5 rounded-xl">Отмена</button></div></div></div>}
      {editPost&&<div className="modal" onClick={()=>setEditPost(null)}><div className="modal-card" onClick={e=>e.stopPropagation()}><p className="text-white mb-2">Редактировать</p><textarea value={editPostContent} onChange={e=>setEditPostContent(e.target.value)} rows="3" className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm"></textarea><div className="flex gap-2 mt-3"><button onClick={updatePost} className="flex-1 bg-blue-600 py-1.5 rounded-xl">Сохранить</button><button onClick={()=>setEditPost(null)} className="flex-1 bg-gray-700 py-1.5 rounded-xl">Отмена</button></div></div></div>}
      {sharePost&&<div className="modal" onClick={()=>{setSharePost(null); setShareSel([]);}}><div className="modal-card" onClick={e=>e.stopPropagation()}><p className="text-white mb-2">Поделиться</p><div className="max-h-48 overflow-auto">{users.filter(u=>u.id!==user.id).map(u=><div key={u.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded" onClick={()=>setShareSel(prev=>prev.includes(u.id)?prev.filter(id=>id!==u.id):[...prev,u.id])}><input type="checkbox" checked={shareSel.includes(u.id)} onChange={()=>{}} className="w-4 h-4" /><img src={u.avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white text-sm">@{u.username}</span></div>)}</div><div className="flex gap-2 mt-3"><button onClick={sharePostFunc} className="flex-1 bg-green-600 py-1.5 rounded-xl">Отправить ({shareSel.length})</button><button onClick={()=>{setSharePost(null); setShareSel([]);}} className="flex-1 bg-gray-700 py-1.5 rounded-xl">Отмена</button></div></div></div>}
      {hidePost&&<div className="modal" onClick={()=>{setHidePost(null); setHideSel([]);}}><div className="modal-card" onClick={e=>e.stopPropagation()}><p className="text-white mb-2">Скрыть от пользователей</p><div className="max-h-48 overflow-auto">{users.filter(u=>u.id!==user.id).map(u=><div key={u.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded" onClick={()=>setHideSel(prev=>prev.includes(u.id)?prev.filter(id=>id!==u.id):[...prev,u.id])}><input type="checkbox" checked={hideSel.includes(u.id)} onChange={()=>{}} className="w-4 h-4" /><img src={u.avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white text-sm">@{u.username}</span></div>)}</div><div className="flex gap-2 mt-3"><button onClick={()=>setHidePost(false)} className="flex-1 bg-blue-600 py-1.5 rounded-xl">Применить</button><button onClick={()=>{setHidePost(null); setHideSel([]);}} className="flex-1 bg-gray-700 py-1.5 rounded-xl">Отмена</button></div></div></div>}

      <header className="sticky top-0 z-20 border-b border-gray-800 bg-[#0f0f0f]/90 backdrop-blur-md p-3">
        <div className="max-w-2xl mx-auto flex justify-between items-center">
          <div className="flex items-center gap-2"><i className="fas fa-water text-white text-xl"></i><span className="text-white font-bold text-lg">Wave</span></div>
          <div className="flex gap-4 text-gray-400">
            <button onClick={()=>{setTab('feed'); setViewProfile(null);}} className={`text-lg ${tab==='feed'?'text-white':''}`}><i className="fas fa-home"></i></button>
            <button onClick={()=>{setTab('search'); setViewProfile(null);}} className={`text-lg ${tab==='search'?'text-white':''}`}><i className="fas fa-search"></i></button>
            <button onClick={()=>{setTab('chat'); setViewProfile(null);}} className={`text-lg relative ${tab==='chat'?'text-white':''}`}><i className="fas fa-comments"></i>{Object.values(unread).reduce((a,b)=>a+b,0)>0&&<span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{Object.values(unread).reduce((a,b)=>a+b,0)}</span>}</button>
            <button onClick={()=>{setTab('notify'); setViewProfile(null);}} className={`text-lg relative ${tab==='notify'?'text-white':''}`}><i className="fas fa-bell"></i>{notifications.filter(n=>!n.read).length>0&&<span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{notifications.filter(n=>!n.read).length}</span>}</button>
            <button onClick={()=>{setTab('profile'); setViewProfile(null);}} className={`text-lg ${tab==='profile'?'text-white':''}`}><i className="fas fa-user"></i></button>
            <button onClick={onLogout} className="text-sm bg-gray-800 px-2 py-0.5 rounded-full">Выйти</button>
          </div>
        </div>
      </header>

      <main className="max-w-2xl mx-auto p-3">
        {tab==='feed'&&(<>
          <div className="card p-3 mb-4">
            <div className="flex gap-2"><img src={user.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><div className="flex-1 relative"><textarea ref={textRef} rows="2" placeholder="Что нового? @ или #" className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm resize-none" value={newPost} onChange={handlePostChange} />{showMentions&&mentionUsers.length>0&&<div className="absolute bottom-full left-0 bg-[#1a1a1a] border border-gray-700 rounded-xl max-h-36 overflow-auto z-10 mb-1 w-44">{mentionUsers.map(u=><div key={u.id} className="p-1.5 hover:bg-[#2a2a2a] cursor-pointer flex gap-2" onClick={()=>insertMention(u.username)}><img src={u.avatar||DEFAULT_AVATAR} className="w-5 h-5 rounded-full" /><span className="text-white text-xs">@{u.username}</span></div>)}</div>}<div className="flex flex-wrap gap-1 mt-2">{media.map((m,i)=><div key={i} className="media-preview">{m.type==='video'?<video src={m.url} />:<img src={m.url} />}<button className="remove-media" onClick={()=>removeMedia(i)}>×</button></div>)}</div><div className="flex gap-2 mt-2"><label className={`cursor-pointer bg-gray-800 p-1.5 rounded-xl ${uploadingMedia?'opacity-50':''}`}><i className="fas fa-paperclip"></i><input type="file" accept="image/*,video/*" multiple onChange={handleMedia} className="hidden" disabled={uploadingMedia} /></label><button onClick={()=>setHidePost(true)} className="bg-gray-800 px-2 py-1.5 rounded-xl"><i className="fas fa-cog"></i></button><button onClick={createPost} className="bg-blue-600 text-white px-4 py-1.5 rounded-full text-sm btn">Опубликовать</button></div></div></div>
          </div>
          {posts.map(p=><div key={p.id} className="card p-3 mb-3"><div className="flex justify-between"><div className="flex gap-2 cursor-pointer" onClick={()=>p.user_id!==user.id&&setViewProfile(users.find(u=>u.id===p.user_id))}><img src={p.user_avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full" /><div><div className="font-bold text-white text-sm">@{p.username}</div><div className="text-xs text-gray-500">{formatDate(p.created_at)}{p.edited&&<span className="ml-1 text-gray-600">(ред)</span>}</div></div></div><Dropdown onEdit={p.user_id===user.id?()=>{setEditPost(p); setEditPostContent(p.content);}:null} onDel={p.user_id===user.id?()=>setDelPostId(p.id):null} onShare={()=>{setSharePost(p); setShareSel([]);}} onHide={p.user_id===user.id?()=>{setHidePost(true); setHideSel(p.hidden_from||[]);}:null} /></div><p className="text-white text-sm mt-1 whitespace-pre-wrap">{renderMentions(p.content)}</p>{p.media?.length>0&&<div className="grid grid-cols-3 gap-1 mt-2">{p.media.map((m,i)=>m.type==='video'?<video key={i} src={m.url} className="h-20 object-cover rounded-lg" />:<img key={i} src={m.url} className="h-20 object-cover rounded-lg" />)}</div>}<div className="flex gap-3 mt-2 text-gray-400 text-xs"><button onClick={()=>likePost(p.id,p.likes||0)} className="flex gap-1 hover:text-red-400"><i className="fas fa-heart"></i> {formatLikes(p.likes||0)}</button><button onClick={()=>{let d=document.getElementById(`c-${p.id}`); if(d)d.classList.toggle('hidden');}} className="flex gap-1 hover:text-blue-400"><i className="far fa-comment"></i> {(p.comments||[]).length}</button></div><div id={`c-${p.id}`} className="hidden mt-2 pt-2 border-t border-gray-800">{replyComment&&<div className="reply-quote">Ответ @{replyComment.username}: "{replyComment.text.substring(0,60)}"</div>}{(p.comments||[]).map(c=><div key={c.id} className="flex gap-2 mb-1 text-sm p-1 hover:bg-[#2a2a2a] rounded-lg cursor-pointer" onClick={()=>setSelComment({postId:p.id,comment:c})}><span className="font-bold text-gray-300" onClick={(e)=>{e.stopPropagation(); if(c.user_id!==user.id)setViewProfile(users.find(u=>u.id===c.user_id));}}>@{c.username}</span><span className="text-gray-400">{c.text}</span></div>)}<div className="flex gap-2 mt-2"><input id={`ci-${p.id}`} type="text" placeholder="Комментарий..." className="flex-1 p-1.5 bg-[#2a2a2a] rounded-xl text-sm text-white" value={commentTexts[p.id]||''} onChange={e=>setCommentTexts({...commentTexts,[p.id]:e.target.value})} /><button onClick={()=>addComment(p.id)} className="bg-gray-700 text-white px-3 rounded-xl text-xs">→</button></div></div></div>)}</>)}
        {tab==='search'&&(<div><div className="card p-3 mb-4"><div className="flex gap-2 mb-2"><button onClick={()=>setSType('users')} className={`text-sm px-2 py-1 rounded-full ${stype==='users'?'bg-blue-600':'bg-gray-800'}`}>👥 Пользователи</button><button onClick={()=>setSType('posts')} className={`text-sm px-2 py-1 rounded-full ${stype==='posts'?'bg-blue-600':'bg-gray-800'}`}>📄 Посты</button></div><input type="text" placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" /></div>{stype==='users'&&searchUsers.map(u=><div key={u.id} className="card p-3 mb-2 flex justify-between items-center"><div className="flex gap-2 cursor-pointer" onClick={()=>setViewProfile(u)}><img src={u.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><div><div className="font-bold text-white text-sm">{u.full_name||u.username}</div><div className="text-gray-400 text-xs">@{u.username}</div></div></div><button onClick={()=>{setChatUser(u); setTab('chat');}} className="bg-green-600 text-white px-2 py-0.5 rounded-full text-xs">Чат</button></div>)}</div>)}
        {tab==='chat'&&(<div className="flex flex-col h-[70vh]"><div className="flex gap-1 mb-2 overflow-x-auto pb-1">{chatList.map(cu=><button key={cu.id} onClick={()=>setChatUser(cu)} className={`px-2 py-0.5 rounded-full text-xs ${chatUser?.id===cu.id?'bg-blue-600':'bg-gray-800'}`}>@{cu.username}</button>)}</div>{chatUser?(<div className="card flex flex-col h-full"><div className="p-2 border-b border-gray-800 font-bold text-white text-sm">Чат с @{chatUser.username}</div><div className="flex-1 overflow-y-auto p-2 space-y-1">{replyMsg&&<div className="reply-quote text-xs">Ответ @{replyMsg.from_user===user.id?chatUser.username:users.find(u=>u.id===replyMsg.from_user)?.username}: "{replyMsg.content.substring(0,60)}"</div>}{messages.map((msg,i)=><div key={i} className={`flex ${msg.from_user===user.id?'justify-end':'justify-start'}`}><div className={`max-w-[75%] p-1.5 rounded-xl ${msg.from_user===user.id?'bg-blue-600 text-white':'bg-[#2a2a2a] text-white'} text-xs cursor-pointer`} onClick={()=>setSelMsg({msg})}><p className="break-words whitespace-pre-wrap">{msg.content}</p><div className="text-[10px] opacity-70 mt-0.5">{new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div></div>)}<div ref={msgEndRef} /></div><div className="p-2 border-t border-gray-800 flex gap-2"><input id="msgInp" type="text" placeholder="Сообщение..." value={msgText} onChange={e=>setMsgText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&sendMsg()} className="flex-1 p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm" /><button onClick={sendMsg} className="bg-blue-600 text-white px-3 rounded-xl">→</button></div></div>):(<div className="card p-6 text-center text-gray-500 text-sm">Выберите чат</div>)}</div>)}
        {tab==='notify'&&(<div><div className="flex justify-between items-center mb-2"><h2 className="text-lg font-bold text-white">Уведомления</h2><button onClick={markAllRead} className="text-xs bg-gray-700 px-2 py-0.5 rounded-full">Прочитать все</button></div>{notifications.length===0&&<div className="card p-6 text-center text-gray-500 text-sm">Нет уведомлений</div>}{notifications.map(n=><div key={n.id} className={`card p-2 mb-2 cursor-pointer ${!n.read?'border-l-4 border-green-500':''}`} onClick={async()=>{await supabase.from('notifications').update({read:true}).eq('id',n.id); setNotifications(prev=>prev.map(not=>not.id===n.id?{...not,read:true}:not)); if(n.type==='message'){let from=users.find(u=>u.id===n.from_user_id); if(from){setChatUser(from); setTab('chat');}} else setTab('feed');}}><p className="text-white text-sm">{n.text}</p><p className="text-gray-500 text-xs">{formatDate(n.created_at)}</p></div>)}</div>)}
        {tab==='profile'&&(<div className="card p-4 text-center"><div className="flex justify-end"><ProfileDrop/></div><div className="avatar-upload w-20 h-20 mx-auto relative cursor-pointer"><img src={user.avatar||DEFAULT_AVATAR} className="w-20 h-20 rounded-full object-cover" /><input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer rounded-full" onChange={(e)=>upAvatar(e.target.files[0])} disabled={avatarUp} /></div>{editProfile?(<div className="mt-3"><input type="text" value={editName} onChange={e=>setEditName(e.target.value)} className="edit-input w-full p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm" placeholder="Имя" /><textarea value={editBio} onChange={e=>setEditBio(e.target.value)} className="edit-input w-full p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm mt-1" rows="2" placeholder="О себе"></textarea><div className="flex gap-2 mt-2"><button onClick={saveProfile} className="flex-1 bg-green-600 text-white py-1 rounded-xl text-sm">Сохранить</button><button onClick={()=>setEditProfile(false)} className="flex-1 bg-gray-700 text-white py-1 rounded-xl text-sm">Отмена</button></div></div>):(<><h2 className="text-lg font-bold text-white mt-1">{user.full_name||user.username}</h2><p className="text-gray-400 text-sm">@{user.username}</p><p className="text-gray-500 text-xs mt-1">{user.bio||'Нет описания'}</p><div className="flex gap-4 justify-center mt-3 text-sm"><div><span className="font-bold text-white">{posts.filter(p=>p.user_id===user.id).length}</span><span className="text-gray-500 ml-1">постов</span></div><div><span className="font-bold text-white">{user.followers?.length||0}</span><span className="text-gray-500 ml-1">подписчиков</span></div><div><span className="font-bold text-white">{user.following?.length||0}</span><span className="text-gray-500 ml-1">подписок</span></div></div></>)}</div>)}
      </main>
    </div>);
  }

  function App(){ let [a,setA]=React.useState(false); let [u,setU]=React.useState(null); let [l,setL]=React.useState(true); React.useEffect(()=>{if(localStorage.getItem('wave_access')==='ok') setA(true); let s=localStorage.getItem('wave_user'); if(s) setU(JSON.parse(s)); setL(false); },[]); const log=(u)=>{localStorage.setItem('wave_user',JSON.stringify(u)); setU(u);}; const out=()=>{localStorage.removeItem('wave_user'); setU(null);}; if(l) return <div className="p-4 text-white">Загрузка...</div>; if(!a) return <PasswordGate onSuccess={()=>setA(true)} />; if(u) return <MainApp user={u} onLogout={out} />; return <Auth onLogin={log} />; }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
