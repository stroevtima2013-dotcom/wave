<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Wave Social — Полная версия</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #1a1a1a; }
    .card-bg { background: #2d2d2d; border: 1px solid #4a4a4a; border-radius: 20px; }
    .chat-btn { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.3); transition: all 0.2s ease; }
    .chat-btn:hover { background: #16a34a; box-shadow: 0 0 20px rgba(34,197,94,0.6); transform: scale(1.02); }
    .toast-notify { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2d2d2d; border: 1px solid #4a4a4a; color: white; padding: 8px 16px; border-radius: 40px; z-index: 1000; font-size: 14px; }
    input, textarea { background: #2d2d2d; border: 1px solid #4a4a4a; color: white; outline: none; border-radius: 16px; }
    input:focus, textarea:focus { border-color: #6b6b6b; }
    .post-media { border-radius: 20px; cursor: pointer; max-height: 300px; object-fit: cover; width: 100%; }
    .photo-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .photo-modal img, .photo-modal video { max-width: 95vw; max-height: 95vh; border-radius: 24px; box-shadow: 0 0 50px rgba(255,255,255,0.2); }
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: #2d2d2d; border: 1px solid #4a4a4a; border-radius: 12px; z-index: 50; min-width: 140px; }
    .media-preview { position: relative; display: inline-block; margin: 5px; border-radius: 12px; overflow: hidden; border: 2px solid #4a4a4a; cursor: pointer; }
    .media-preview img { width: 80px; height: 80px; object-fit: cover; }
    .media-preview video { width: 80px; height: 80px; object-fit: cover; }
    .media-preview .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: white; text-shadow: 0 0 5px black; }
    .media-preview .remove-media { position: absolute; top: -8px; right: -8px; background: red; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; }
    .notification-badge { position: absolute; top: -5px; right: -10px; background: #ef4444; color: white; font-size: 10px; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .grid-media { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
    .grid-media img, .grid-media video { width: 100%; height: 150px; object-fit: cover; border-radius: 16px; cursor: pointer; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  // ========== НАСТРОЙКИ ==========
  const SITE_PASSWORD = "8554social";
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ========== УТИЛИТЫ ==========
  function compressImage(file, maxSize = 800) {
    return new Promise((resolve) => {
      if (!file.type.startsWith('image/')) { resolve(file); return; }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          let width = img.width, height = img.height;
          if (width > height) {
            if (width > maxSize) { height = (height * maxSize) / width; width = maxSize; }
          } else {
            if (height > maxSize) { width = (width * maxSize) / height; height = maxSize; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob((blob) => {
            const r = new FileReader();
            r.readAsDataURL(blob);
            r.onload = () => resolve({ data: r.result, type: file.type, name: file.name });
          }, file.type, 0.7);
        };
      };
    });
  }

  async function uploadMedia(file, showToast) {
    if (!file) return null;
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${file.name.split('.').pop()}`;
    const filePath = `media/${fileName}`;
    if (file.type.startsWith('image/')) {
      const compressed = await compressImage(file);
      const blob = await fetch(compressed.data).then(r => r.blob());
      const { error } = await supabase.storage.from('wave-media').upload(filePath, blob);
      if (error) { showToast('Ошибка загрузки фото'); return null; }
      const { data: { publicUrl } } = supabase.storage.from('wave-media').getPublicUrl(filePath);
      return { url: publicUrl, type: 'image', name: file.name, isVideo: false };
    } else if (file.type.startsWith('video/')) {
      if (file.size > 50 * 1024 * 1024) { showToast('Видео > 50 МБ'); return null; }
      const { error } = await supabase.storage.from('wave-media').upload(filePath, file);
      if (error) { showToast('Ошибка загрузки видео'); return null; }
      const { data: { publicUrl } } = supabase.storage.from('wave-media').getPublicUrl(filePath);
      return { url: publicUrl, type: 'video', name: file.name, isVideo: true };
    }
    return null;
  }

  // ========== ПОЛНОЭКРАННЫЙ ПРОСМОТР ==========
  const FullscreenMedia = ({ src, onClose }) => (
    <div className="photo-modal" onClick={onClose}>
      {src?.includes('mp4') || src?.includes('webm') ? 
        <video src={src} controls autoPlay className="max-w-[95vw] max-h-[95vh] rounded-3xl shadow-[0_0_50px_rgba(255,255,255,0.3)]" onClick={(e) => e.stopPropagation()} /> :
        <img src={src} className="max-w-[95vw] max-h-[95vh] rounded-3xl shadow-[0_0_50px_rgba(255,255,255,0.3)]" onClick={(e) => e.stopPropagation()} />
      }
    </div>
  );

  // ========== ПРЕВЬЮ МЕДИА ==========
  const MediaPreview = ({ media, onRemove, onOpen }) => {
    return (
      <div className="media-preview" onClick={() => onOpen(media.url)}>
        {media.isVideo ? (
          <>
            <video src={media.url} className="w-20 h-20 object-cover" />
            <div className="play-icon"><i className="fas fa-play-circle"></i></div>
          </>
        ) : (
          <img src={media.url} className="w-20 h-20 object-cover" />
        )}
        <button className="remove-media" onClick={(e) => { e.stopPropagation(); onRemove(); }}>×</button>
      </div>
    );
  };

  // ========== POST INPUT (до 5 медиа) ==========
  const PostInput = React.memo(({ user, onPostSuccess, showToast }) => {
    const [content, setContent] = React.useState('');
    const [mediaList, setMediaList] = React.useState([]);
    const [uploading, setUploading] = React.useState(false);
    const [loading, setLoading] = React.useState(false);
    
    const handleMediaUpload = async (e) => {
      const files = Array.from(e.target.files);
      if (mediaList.length + files.length > 5) { showToast('Максимум 5 файлов'); return; }
      setUploading(true);
      const newMedia = [];
      for (const file of files) {
        const mediaData = await uploadMedia(file, showToast);
        if (mediaData) newMedia.push(mediaData);
      }
      setMediaList([...mediaList, ...newMedia]);
      setUploading(false);
      e.target.value = '';
    };
    
    const removeMedia = (index) => setMediaList(mediaList.filter((_, i) => i !== index));
    
    const handlePost = async () => {
      if (!content.trim() && mediaList.length === 0) { showToast('Напишите текст или добавьте медиа'); return; }
      setLoading(true);
      const { error } = await supabase.from('posts').insert({
        user_id: user.id, username: user.username, user_avatar: user.avatar,
        content, media: mediaList, media_type: 'gallery', likes: 0, comments: [], created_at: new Date()
      });
      if (error) { showToast('Ошибка: ' + error.message); setLoading(false); return; }
      setContent(''); setMediaList([]); onPostSuccess(); setLoading(false);
      showToast('Пост опубликован!');
    };
    
    return (
      <div className="card-bg p-4 mb-6">
        <div className="flex gap-3">
          <img src={user.avatar || 'https://via.placeholder.com/40'} className="w-10 h-10 rounded-full object-cover" />
          <div className="flex-1">
            <textarea rows="2" placeholder="Что нового?" className="w-full p-3 bg-[#3a3a3a] rounded-2xl text-white resize-none" value={content} onChange={e => setContent(e.target.value)} />
            <div className="flex flex-wrap gap-2 mt-2">
              {mediaList.map((m, idx) => <MediaPreview key={idx} media={m} onRemove={() => removeMedia(idx)} onOpen={(url) => window.open(url)} />)}
            </div>
            <div className="flex gap-2 mt-2">
              <label className={`cursor-pointer bg-gray-700 px-4 py-2 rounded-xl text-sm ${uploading || mediaList.length >= 5 ? 'opacity-50' : ''}`}>
                <i className="fas fa-image"></i> {uploading ? 'Загрузка...' : 'Медиа (до 5)'}
                <input type="file" accept="image/*,video/*" multiple onChange={handleMediaUpload} className="hidden" disabled={uploading || mediaList.length >= 5} />
              </label>
              <button onClick={handlePost} disabled={loading} className="bg-gray-700 text-white px-5 py-2 rounded-full text-sm ml-auto">{loading ? 'Публикация...' : 'Опубликовать'}</button>
            </div>
          </div>
        </div>
      </div>
    );
  });

  // ========== ПОСТ (галерея, лайки, комментарии) ==========
  const PostItem = React.memo(({ post, currentUser, users, onDelete, onStartChat, onViewProfile, onCommentAdded }) => {
    const [showComments, setShowComments] = React.useState(false);
    const [commentText, setCommentText] = React.useState('');
    const [commentMedia, setCommentMedia] = React.useState(null);
    const [loadingComment, setLoadingComment] = React.useState(false);
    const [localLikes, setLocalLikes] = React.useState(post.likes || 0);
    const [localComments, setLocalComments] = React.useState(post.comments || []);
    const [fullscreenMedia, setFullscreenMedia] = React.useState(null);
    const isAuthor = post.user_id === currentUser.id;
    const mediaList = post.media || [];
    
    const handleLike = async () => { setLocalLikes(prev => prev + 1); await supabase.from('posts').update({ likes: localLikes + 1 }).eq('id', post.id); };
    const handleAddComment = async () => {
      if (!commentText.trim() && !commentMedia) return;
      setLoadingComment(true);
      const newComment = { id: 'c_' + Date.now(), user_id: currentUser.id, username: currentUser.username, user_avatar: currentUser.avatar, text: commentText, media: commentMedia?.url || null, media_type: commentMedia?.type || null, likes: 0, created_at: new Date().toISOString() };
      const newComments = [newComment, ...localComments];
      setLocalComments(newComments);
      await supabase.from('posts').update({ comments: newComments }).eq('id', post.id);
      setCommentText(''); setCommentMedia(null); setLoadingComment(false);
      if (onCommentAdded) onCommentAdded(post.user_id, currentUser.username);
    };
    const handleCommentMedia = async (e) => {
      const file = e.target.files[0];
      if (file) { const mediaData = await uploadMedia(file, () => {}); if (mediaData) setCommentMedia(mediaData); }
      e.target.value = '';
    };
    const handleDeleteComment = async (commentId) => { const newComments = localComments.filter(c => c.id !== commentId); setLocalComments(newComments); await supabase.from('posts').update({ comments: newComments }).eq('id', post.id); };
    const handleLikeComment = async (commentId) => { const newComments = localComments.map(c => c.id === commentId ? { ...c, likes: (c.likes || 0) + 1 } : c); setLocalComments(newComments); await supabase.from('posts').update({ comments: newComments }).eq('id', post.id); };
    
    return (
      <>
        {fullscreenMedia && <FullscreenMedia src={fullscreenMedia} onClose={() => setFullscreenMedia(null)} />}
        <div className="card-bg overflow-hidden mb-4">
          <div className="p-4">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => onViewProfile(post.user_id)}>
                <img src={post.user_avatar || 'https://via.placeholder.com/40'} className="w-10 h-10 rounded-full object-cover" />
                <div><div className="font-bold text-white hover:underline">@{post.username}</div><div className="text-xs text-gray-400">{new Date(post.created_at).toLocaleString()}</div></div>
              </div>
              <div className="flex gap-2">
                {!isAuthor && <button onClick={() => onStartChat(post.user_id)} className="chat-btn text-white px-3 py-1 rounded-full text-sm"><i className="fas fa-comment mr-1"></i> Чат</button>}
                {isAuthor && <button onClick={() => onDelete(post.id)} className="text-gray-500 hover:text-white"><i className="fas fa-trash-alt"></i></button>}
              </div>
            </div>
            <p className="mt-3 text-white">{post.content}</p>
            {mediaList.length > 0 && (
              <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mt-3">
                {mediaList.map((m, idx) => m.isVideo || m.type === 'video' ? (
                  <video key={idx} src={m.url} className="w-full h-48 object-cover rounded-2xl cursor-pointer" onClick={() => setFullscreenMedia(m.url)} />
                ) : (
                  <img key={idx} src={m.url} className="w-full h-48 object-cover rounded-2xl cursor-pointer" onClick={() => setFullscreenMedia(m.url)} />
                ))}
              </div>
            )}
            <div className="flex gap-6 mt-4 text-gray-400">
              <button onClick={handleLike} className="flex gap-1 hover:text-red-400 text-red-500"><i className="fas fa-heart"></i> {localLikes}</button>
              <button onClick={() => setShowComments(!showComments)} className="flex gap-1 hover:text-blue-400"><i className="far fa-comment"></i> {localComments.length}</button>
            </div>
            {showComments && (
              <div className="mt-4 pt-4 border-t border-gray-700">
                {localComments.map(c => (
                  <div key={c.id} className="flex gap-2 mb-3">
                    <img src={c.user_avatar || 'https://via.placeholder.com/32'} className="w-8 h-8 rounded-full cursor-pointer" onClick={() => onViewProfile(c.user_id)} />
                    <div className="flex-1 bg-[#3a3a3a] rounded-2xl p-3">
                      <div className="flex justify-between"><span className="font-semibold text-sm text-white cursor-pointer hover:underline" onClick={() => onViewProfile(c.user_id)}>@{c.username}</span><div className="flex gap-2"><button onClick={() => handleLikeComment(c.id)} className="text-xs text-gray-400 hover:text-red-400"><i className="fas fa-heart"></i> {c.likes || 0}</button>{c.user_id === currentUser.id && <button onClick={() => handleDeleteComment(c.id)} className="text-xs text-red-400"><i className="fas fa-trash-alt"></i></button>}</div></div>
                      <p className="text-sm text-gray-200">{c.text}</p>
                      {c.media && <img src={c.media} className="mt-2 rounded-2xl max-h-32 cursor-pointer" onClick={() => setFullscreenMedia(c.media)} />}
                      <div className="text-xs text-gray-500 mt-1">{new Date(c.created_at).toLocaleString()}</div>
                    </div>
                  </div>
                ))}
                <div className="flex gap-2 mt-3">
                  <input type="text" placeholder="Комментарий..." value={commentText} onChange={e => setCommentText(e.target.value)} className="flex-1 p-2 bg-[#3a3a3a] rounded-xl text-sm text-white" />
                  <label className="cursor-pointer bg-gray-700 p-2 rounded-xl"><i className="fas fa-paperclip"></i><input type="file" accept="image/*,video/*" onChange={handleCommentMedia} className="hidden" /></label>
                  <button onClick={handleAddComment} disabled={loadingComment} className="bg-gray-700 text-white px-4 rounded-xl">→</button>
                </div>
                {commentMedia && <div className="text-xs text-gray-400 mt-1">1 файл</div>}
              </div>
            )}
          </div>
        </div>
      </>
    );
  });

  // ========== DROPDOWN МЕНЮ (три точки) ==========
  const DropdownMenu = ({ onDelete, onEdit }) => {
    const [open, setOpen] = React.useState(false);
    const ref = React.useRef(null);
    React.useEffect(() => { const fn = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener('click', fn); return () => document.removeEventListener('click', fn); }, []);
    return (
      <div className="relative" ref={ref}>
        <button onClick={() => setOpen(!open)} className="text-gray-500 hover:text-white p-1"><i className="fas fa-ellipsis-h"></i></button>
        {open && (
          <div className="dropdown-menu">
            {onEdit && <button onClick={() => { onEdit(); setOpen(false); }} className="w-full text-left px-4 py-2 text-sm text-white hover:bg-gray-800 rounded-t-xl"><i className="fas fa-pen mr-2"></i> Редактировать</button>}
            <button onClick={() => { onDelete(); setOpen(false); }} className="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-gray-800 rounded-b-xl"><i className="fas fa-trash-alt mr-2"></i> Удалить аккаунт</button>
          </div>
        )}
      </div>
    );
  };

  // ========== ПРОФИЛЬ ТЕКУЩЕГО ПОЛЬЗОВАТЕЛЯ ==========
  const ProfileComponent = ({ user, onLogout, onUpdate }) => {
    const [editingName, setEditingName] = React.useState(false);
    const [newName, setNewName] = React.useState(user.full_name);
    const [showDelete, setShowDelete] = React.useState(false);
    const handleSaveName = async () => { if (newName.trim()) { await supabase.from('users').update({ full_name: newName }).eq('id', user.id); user.full_name = newName; setEditingName(false); onUpdate(); } };
    const handleDeleteAccount = async () => { await supabase.from('users').delete().eq('id', user.id); onLogout(); };
    return (
      <div className="max-w-2xl mx-auto px-3 py-4">
        <div className="card-bg rounded-3xl overflow-hidden">
          <div className="h-28 bg-gradient-to-r from-gray-700 to-gray-800"></div>
          <div className="px-4 pb-6 pt-0">
            <div className="flex justify-end -mt-2"><DropdownMenu onDelete={() => setShowDelete(true)} onEdit={() => setEditingName(true)} /></div>
            <div className="flex flex-col items-center md:flex-row gap-4 -mt-8">
              <img src={user.avatar || 'https://via.placeholder.com/96'} className="w-20 h-20 rounded-full border-4 border-gray-800" />
              <div className="flex-1 text-center md:text-left">
                {editingName ? (<div className="flex gap-2"><input value={newName} onChange={e => setNewName(e.target.value)} className="text-xl font-bold bg-black rounded-lg px-2 py-1" /><button onClick={handleSaveName} className="bg-green-700 px-3 rounded-lg">💾</button><button onClick={() => { setEditingName(false); setNewName(user.full_name); }} className="bg-gray-700 px-3 rounded-lg">✖</button></div>) : <h2 className="text-xl font-bold text-white">{user.full_name || user.username}</h2>}
                <p className="text-gray-400">@{user.username}</p>
                <p className="text-gray-500 text-sm mt-1">{user.bio || 'Нет описания'}</p>
              </div>
            </div>
            <div className="flex gap-6 justify-center mt-4"><div><span className="font-bold text-white">0</span><span className="text-gray-500 ml-1">постов</span></div><div><span className="font-bold text-white">{user.followers?.length || 0}</span><span className="text-gray-500 ml-1">подписчиков</span></div><div><span className="font-bold text-white">{user.following?.length || 0}</span><span className="text-gray-500 ml-1">подписок</span></div></div>
          </div>
        </div>
        {showDelete && (<div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50" onClick={() => setShowDelete(false)}><div className="bg-[#2d2d2d] rounded-3xl p-6 max-w-sm w-full"><p className="text-white mb-6">Удалить аккаунт навсегда?</p><div className="flex gap-3"><button onClick={handleDeleteAccount} className="flex-1 bg-red-900 text-white py-2 rounded-xl">Да</button><button onClick={() => setShowDelete(false)} className="flex-1 bg-gray-600 text-white py-2 rounded-xl">Нет</button></div></div></div>)}
      </div>
    );
  };

  // ========== ПРОФИЛЬ ДРУГОГО ПОЛЬЗОВАТЕЛЯ ==========
  const UserProfile = ({ user, onBack, onStartChat, onFollow, isFollowing, currentUserId }) => {
    const [posts, setPosts] = React.useState([]);
    React.useEffect(() => { supabase.from('posts').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).then(res => setPosts(res.data || [])); }, [user.id]);
    const [fullscreenMedia, setFullscreenMedia] = React.useState(null);
    return (
      <div className="max-w-2xl mx-auto px-3 py-4">
        {fullscreenMedia && <FullscreenMedia src={fullscreenMedia} onClose={() => setFullscreenMedia(null)} />}
        <button onClick={onBack} className="text-gray-400 mb-4"><i className="fas fa-arrow-left"></i> Назад</button>
        <div className="card-bg rounded-3xl overflow-hidden mb-6">
          <div className="h-28 bg-gradient-to-r from-gray-700 to-gray-800"></div>
          <div className="px-4 pb-6 pt-0">
            <div className="flex flex-col items-center md:flex-row gap-4 -mt-8">
              <img src={user.avatar || 'https://via.placeholder.com/96'} className="w-20 h-20 rounded-full border-4 border-gray-800" />
              <div className="flex-1 text-center md:text-left">
                <h2 className="text-xl font-bold text-white">{user.full_name || user.username}</h2>
                <p className="text-gray-400">@{user.username}</p>
                <p className="text-gray-500 text-sm mt-1">{user.bio || 'Нет описания'}</p>
                <div className="flex gap-2 mt-2">
                  <button onClick={() => onStartChat(user.id)} className="chat-btn text-white px-4 py-1 rounded-full text-sm"><i className="fas fa-comment"></i> Чат</button>
                  <button onClick={() => onFollow(user.id)} className={`px-4 py-1 rounded-full text-sm ${isFollowing ? 'bg-gray-600' : 'bg-blue-600'}`}>{isFollowing ? 'Отписаться' : 'Подписаться'}</button>
                </div>
              </div>
            </div>
            <div className="flex gap-6 justify-center mt-4"><div><span className="font-bold text-white">{posts.length}</span><span className="text-gray-500 ml-1">постов</span></div><div><span className="font-bold text-white">{user.followers?.length || 0}</span><span className="text-gray-500 ml-1">подписчиков</span></div><div><span className="font-bold text-white">{user.following?.length || 0}</span><span className="text-gray-500 ml-1">подписок</span></div></div>
          </div>
        </div>
        {posts.map(post => (
          <div key={post.id} className="card-bg p-4 mb-4">
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => onBack()}>
              <img src={post.user_avatar || 'https://via.placeholder.com/40'} className="w-10 h-10 rounded-full" /><div><div className="font-bold text-white">@{post.username}</div><div className="text-xs text-gray-400">{new Date(post.created_at).toLocaleString()}</div></div>
            </div>
            <p className="text-white mt-2">{post.content}</p>
            {post.media?.length > 0 && (
              <div className="grid grid-cols-2 gap-2 mt-2">
                {post.media.map((m, idx) => m.isVideo ? <video key={idx} src={m.url} className="w-full h-40 object-cover rounded-2xl cursor-pointer" onClick={() => setFullscreenMedia(m.url)} /> : <img key={idx} src={m.url} className="w-full h-40 object-cover rounded-2xl cursor-pointer" onClick={() => setFullscreenMedia(m.url)} />)}
              </div>
            )}
          </div>
        ))}
      </div>
    );
  };

  // ========== ЧАТ ==========
  const ChatComponent = ({ currentUser, chatUser, setChatUser, messages, setMessages, showToast }) => {
    const [newMessage, setNewMessage] = React.useState('');
    const [newMessageMedia, setNewMessageMedia] = React.useState(null);
    const [uploading, setUploading] = React.useState(false);
    const [fullscreenMedia, setFullscreenMedia] = React.useState(null);
    const messagesEndRef = React.useRef(null);
    React.useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);
    const sendMessage = async () => {
      if ((!newMessage.trim() && !newMessageMedia) || !chatUser) return;
      const newMsg = { id: 'msg_' + Date.now(), from_user: currentUser.id, to_user: chatUser.id, content: newMessage, media: newMessageMedia?.url || null, media_type: newMessageMedia?.type || null, isVideo: newMessageMedia?.isVideo || false, read: false, created_at: new Date() };
      setMessages(prev => [...prev, newMsg]);
      await supabase.from('messages').insert(newMsg);
      setNewMessage(''); setNewMessageMedia(null);
    };
    const handleMediaUpload = async (e) => {
      const file = e.target.files[0];
      if (file) {
        setUploading(true);
        const mediaData = await uploadMedia(file, showToast);
        if (mediaData) setNewMessageMedia(mediaData);
        setUploading(false);
      }
      e.target.value = '';
    };
    return (
      <>
        {fullscreenMedia && <FullscreenMedia src={fullscreenMedia} onClose={() => setFullscreenMedia(null)} />}
        <div className="flex-1 flex flex-col bg-black">
          <div className="p-4 border-b border-gray-800 flex items-center gap-3 bg-[#2d2d2d]">
            <button onClick={() => setChatUser(null)} className="text-gray-400 hover:text-white"><i className="fas fa-arrow-left"></i></button>
            <img src={chatUser?.avatar || 'https://via.placeholder.com/40'} className="w-10 h-10 rounded-full" />
            <div><div className="font-bold text-white">@{chatUser?.username}</div></div>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3">
            {messages.map(msg => {
              const isMy = msg.from_user === currentUser.id;
              return (
                <div key={msg.id} className={`flex ${isMy ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[80%] ${isMy ? 'bg-[#3a3a3a]' : 'bg-[#2d2d2d]'} rounded-2xl p-3`}>
                    {msg.content && <p className="text-sm text-white">{msg.content}</p>}
                    {msg.media && (msg.media_type === 'image' || !msg.isVideo) && <img src={msg.media} className="mt-2 rounded-2xl max-h-48 cursor-pointer" onClick={() => setFullscreenMedia(msg.media)} />}
                    {msg.isVideo && <video src={msg.media} className="mt-2 rounded-2xl max-h-48 cursor-pointer" onClick={() => setFullscreenMedia(msg.media)} controls />}
                    <div className="text-xs text-gray-500 mt-1">{new Date(msg.created_at).toLocaleTimeString()}</div>
                  </div>
                </div>
              );
            })}
            <div ref={messagesEndRef} />
          </div>
          <div className="p-3 border-t border-gray-800 bg-black">
            <div className="flex gap-2">
              <input type="text" placeholder="Сообщение..." value={newMessage} onChange={e => setNewMessage(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendMessage()} className="flex-1 p-3 bg-[#3a3a3a] rounded-2xl text-sm text-white" />
              <label className={`cursor-pointer bg-gray-700 p-3 rounded-2xl ${uploading ? 'opacity-50' : ''}`}><i className="fas fa-paperclip"></i><input type="file" accept="image/*,video/*" onChange={handleMediaUpload} className="hidden" disabled={uploading} /></label>
              <button onClick={sendMessage} className="bg-gray-700 text-white px-4 rounded-2xl"><i className="fas fa-paper-plane"></i></button>
            </div>
            {newMessageMedia && <div className="text-xs text-gray-400 mt-2">1 файл</div>}
          </div>
        </div>
      </>
    );
  };

  const ChatContainer = ({ chatUser, setChatUser, messages, setMessages, currentUser, showToast, chatList, unreadCounts, loadData }) => {
    if (chatUser) return <ChatComponent currentUser={currentUser} chatUser={chatUser} setChatUser={setChatUser} messages={messages} setMessages={setMessages} showToast={showToast} />;
    return (
      <div className="max-w-4xl mx-auto h-[calc(100vh-60px)] flex">
        <div className="w-80 bg-[#2d2d2d] border-r border-gray-700">
          <div className="p-4 font-bold text-white">Чаты</div>
          {chatList.map(cu => <div key={cu.id} onClick={() => setChatUser(cu)} className="p-4 hover:bg-gray-800 cursor-pointer border-b border-gray-700 flex items-center gap-3"><img src={cu.avatar || 'https://via.placeholder.com/48'} className="w-12 h-12 rounded-full" /><div><div className="font-semibold text-white">@{cu.username}</div><div className="text-xs text-gray-400">{cu.full_name}</div></div>{unreadCounts[cu.id] > 0 && <div className="bg-red-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center">{unreadCounts[cu.id]}</div>}</div>)}
        </div>
        <div className="flex-1 flex items-center justify-center text-gray-500"><i className="fas fa-comments text-4xl opacity-30"></i><p className="mt-2">Выберите чат</p></div>
      </div>
    );
  };

  // ========== ПОИСК ==========
  const SearchComponent = ({ users, currentUser, onStartChat, onFollow, onViewProfile }) => {
    const [query, setQuery] = React.useState('');
    const [results, setResults] = React.useState([]);
    const doSearch = () => { if (query.trim()) setResults(users.filter(u => u.id !== currentUser.id && u.username.toLowerCase().includes(query.toLowerCase()))); else setResults([]); };
    return (
      <div className="max-w-2xl mx-auto px-3 py-4">
        <div className="card-bg p-4 mb-6 flex gap-2"><input type="text" placeholder="Поиск..." value={query} onChange={e => setQuery(e.target.value)} onKeyPress={e => e.key === 'Enter' && doSearch()} className="flex-1 p-3 bg-[#3a3a3a] rounded-2xl text-white" /><button onClick={doSearch} className="bg-gray-700 text-white px-5 rounded-2xl"><i className="fas fa-search"></i></button></div>
        {results.map(u => <div key={u.id} className="card-bg p-4 mb-3 flex items-center justify-between"><div className="flex gap-3 cursor-pointer" onClick={() => onViewProfile(u.id)}><img src={u.avatar || 'https://via.placeholder.com/48'} className="w-12 h-12 rounded-full" /><div><div className="font-bold text-white">{u.full_name || u.username}</div><div className="text-sm text-gray-400">@{u.username}</div></div></div><div className="flex gap-2"><button onClick={() => onStartChat(u.id)} className="chat-btn text-white px-3 py-2 rounded-full text-sm"><i className="fas fa-comment"></i></button><button onClick={() => onFollow(u.id)} className={`px-3 py-2 rounded-full text-sm ${(currentUser.following || []).includes(u.id) ? 'bg-gray-600' : 'bg-blue-600'}`}>{(currentUser.following || []).includes(u.id) ? 'Отписаться' : 'Подписаться'}</button></div></div>)}
      </div>
    );
  };

  // ========== УВЕДОМЛЕНИЯ ==========
  const NotificationsPanel = ({ notifications, onNavigate }) => (
    <div className="max-w-2xl mx-auto px-3 py-4">
      <h2 className="text-xl font-bold text-white mb-4">Уведомления</h2>
      {notifications.length === 0 && <div className="text-center text-gray-500 py-8">Нет уведомлений</div>}
      {notifications.map(n => (
        <div key={n.id} onClick={() => onNavigate(n)} className={`card-bg p-4 mb-3 cursor-pointer transition hover:bg-gray-800 ${!n.read ? 'border-l-4 border-green-500' : ''}`}>
          <div className="flex items-center gap-3"><img src={n.avatar || 'https://via.placeholder.com/40'} className="w-10 h-10 rounded-full" /><div><p className="text-white">{n.text}</p><p className="text-xs text-gray-500">{new Date(n.created_at).toLocaleString()}</p></div></div>
        </div>
      ))}
    </div>
  );

  // ========== ОСНОВНОЙ APP ==========
  function MainApp({ user, onLogout }) {
    const [activeTab, setActiveTab] = React.useState('feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(null);
    const [messages, setMessages] = React.useState([]);
    const [chatList, setChatList] = React.useState([]);
    const [unreadCounts, setUnreadCounts] = React.useState({});
    const [notifications, setNotifications] = React.useState([]);
    const [viewingUser, setViewingUser] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    
    const showToast = (msg) => { const toast = document.createElement('div'); toast.className = 'toast-notify'; toast.innerText = msg; document.body.appendChild(toast); setTimeout(() => toast.remove(), 2500); };
    
    const loadData = async () => {
      const [postsRes, usersRes, messagesRes] = await Promise.all([
        supabase.from('posts').select('*').order('created_at', { ascending: false }),
        supabase.from('users').select('*'),
        supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`).order('created_at', { ascending: false })
      ]);
      setPosts(postsRes.data || []);
      setUsers(usersRes.data || []);
      const msgs = messagesRes.data || [];
      const chatUsersSet = new Set();
      msgs.forEach(m => { if (m.from_user !== user.id) chatUsersSet.add(m.from_user); if (m.to_user !== user.id) chatUsersSet.add(m.to_user); });
      setChatList(usersRes.data?.filter(u => chatUsersSet.has(u.id)) || []);
      const counts = {}; msgs.forEach(m => { if (m.to_user === user.id && !m.read) counts[m.from_user] = (counts[m.from_user] || 0) + 1; }); setUnreadCounts(counts);
      if (chatUser) {
        const chatMsgs = msgs.filter(m => (m.from_user === user.id && m.to_user === chatUser.id) || (m.from_user === chatUser.id && m.to_user === user.id)).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
        setMessages(chatMsgs);
        await supabase.from('messages').update({ read: true }).eq('to_user', user.id).eq('from_user', chatUser.id);
      }
      const savedNotifs = JSON.parse(localStorage.getItem(`notifications_${user.id}`) || '[]'); setNotifications(savedNotifs);
      setLoading(false);
    };
    
    React.useEffect(() => { loadData(); const interval = setInterval(loadData, 30000); return () => clearInterval(interval); }, [chatUser]);
    
    const addNotification = (type, fromUserId, postId = null) => {
      const fromUser = users.find(u => u.id === fromUserId);
      if (!fromUser || fromUserId === user.id) return;
      let text = '', linkType = '', linkId = null;
      if (type === 'comment') { text = `${fromUser.full_name || fromUser.username} оставил(а) комментарий`; linkType = 'post'; linkId = postId; }
      else if (type === 'message') { text = `${fromUser.full_name || fromUser.username} отправил(а) сообщение`; linkType = 'chat'; linkId = fromUserId; }
      const newNotif = { id: Date.now(), type, text, fromUserId, linkType, linkId, read: false, created_at: new Date(), avatar: fromUser.avatar };
      setNotifications(prev => [newNotif, ...prev]);
      localStorage.setItem(`notifications_${user.id}`, JSON.stringify([newNotif, ...notifications]));
    };
    
    const onCommentAdded = (postAuthorId) => { if (postAuthorId !== user.id) addNotification('comment', postAuthorId); };
    const markNotificationRead = (notif) => {
      const updated = notifications.map(n => n.id === notif.id ? { ...n, read: true } : n);
      setNotifications(updated); localStorage.setItem(`notifications_${user.id}`, JSON.stringify(updated));
      if (notif.linkType === 'post') { setActiveTab('feed'); setViewingUser(null); setChatUser(null); }
      else if (notif.linkType === 'chat') { const targetUser = users.find(u => u.id === notif.linkId); if (targetUser) { setChatUser(targetUser); setActiveTab('chat'); setViewingUser(null); } }
    };
    
    const handleDeletePost = async (postId) => { await supabase.from('posts').delete().eq('id', postId).eq('user_id', user.id); await loadData(); showToast('Пост удалён'); };
    const handleStartChat = async (targetUserId) => { const otherUser = users.find(u => u.id === targetUserId); setChatUser(otherUser); setActiveTab('chat'); setViewingUser(null); };
    const handleFollow = async (targetUserId) => {
      const currentUserData = users.find(u => u.id === user.id);
      let following = currentUserData?.following || [];
      if (following.includes(targetUserId)) following = following.filter(id => id !== targetUserId);
      else following.push(targetUserId);
      await supabase.from('users').update({ following }).eq('id', user.id); await loadData(); showToast(following.includes(targetUserId) ? 'Подписан ✅' : 'Отписался ❌');
    };
    const handleViewProfile = (userId) => { const profileUser = users.find(u => u.id === userId); if (profileUser && userId !== user.id) { setViewingUser(profileUser); setActiveTab('profile_view'); } else if (userId === user.id) setActiveTab('profile'); };
    
    if (loading) return <div className="min-h-screen bg-[#1a1a1a] text-white flex items-center justify-center">Загрузка...</div>;
    if (viewingUser) return <UserProfile user={viewingUser} onBack={() => setViewingUser(null)} onStartChat={handleStartChat} onFollow={handleFollow} isFollowing={(viewingUser.following || []).includes(user.id)} currentUserId={user.id} />;
    
    return (
      <div className="min-h-screen bg-[#1a1a1a]">
        <header className="sticky top-0 z-20 border-b border-gray-700 bg-[#2d2d2d]/90 backdrop-blur-md py-3 px-4">
          <div className="max-w-6xl mx-auto flex justify-between items-center">
            <div className="flex items-center gap-2"><i className="fas fa-water text-white text-2xl"></i><span className="text-white font-bold text-xl">Wave</span></div>
            <div className="flex gap-4 text-gray-400 items-center relative">
              <button onClick={() => { setActiveTab('feed'); setChatUser(null); setViewingUser(null); }} className={`text-xl ${activeTab === 'feed' ? 'text-white' : 'hover:text-white'}`}><i className="fas fa-home"></i></button>
              <button onClick={() => { setActiveTab('notifications'); setChatUser(null); setViewingUser(null); }} className="text-xl relative hover:text-white"><i className="fas fa-bell"></i>{notifications.filter(n => !n.read).length > 0 && <div className="notification-badge">{notifications.filter(n => !n.read).length}</div>}</button>
              <button onClick={() => { setActiveTab('search'); setChatUser(null); setViewingUser(null); }} className="text-xl hover:text-white"><i className="fas fa-search"></i></button>
              <button onClick={() => { setActiveTab('chat'); setViewingUser(null); }} className="text-xl relative hover:text-white"><i className="fas fa-comments"></i>{Object.values(unreadCounts).reduce((a,b)=>a+b,0)>0 && <div className="notification-badge">{Object.values(unreadCounts).reduce((a,b)=>a+b,0)}</div>}</button>
              <button onClick={() => { setActiveTab('profile'); setChatUser(null); setViewingUser(null); }} className="text-xl hover:text-white"><i className="fas fa-user"></i></button>
              <button onClick={onLogout} className="text-sm bg-gray-700 px-3 py-1 rounded-full hover:bg-gray-600"><i className="fas fa-sign-out-alt"></i></button>
            </div>
          </div>
        </header>
        <main>
          {activeTab === 'feed' && <div className="max-w-2xl mx-auto px-3 py-4"><PostInput user={user} onPostSuccess={loadData} showToast={showToast} />{posts.map(post => <PostItem key={post.id} post={post} users={users} currentUser={user} onDelete={handleDeletePost} onStartChat={handleStartChat} onViewProfile={handleViewProfile} onCommentAdded={onCommentAdded} />)}</div>}
          {activeTab === 'notifications' && <NotificationsPanel notifications={notifications} onNavigate={markNotificationRead} />}
          {activeTab === 'search' && <SearchComponent users={users} currentUser={user} onStartChat={handleStartChat} onFollow={handleFollow} onViewProfile={handleViewProfile} />}
          {activeTab === 'chat' && <ChatContainer chatUser={chatUser} setChatUser={setChatUser} messages={messages} setMessages={setMessages} currentUser={user} showToast={showToast} chatList={chatList} unreadCounts={unreadCounts} loadData={loadData} />}
          {activeTab === 'profile' && <ProfileComponent user={user} onLogout={onLogout} onUpdate={loadData} />}
        </main>
      </div>
    );
  }

  // ========== ВХОД / РЕГИСТРАЦИЯ ==========
  function App() {
    const [siteAccess, setSiteAccess] = React.useState(false);
    const [currentUser, setCurrentUser] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    React.useEffect(() => {
      if (localStorage.getItem('wave_site_access') === 'granted') setSiteAccess(true);
      const saved = localStorage.getItem('wave_current_user');
      if (saved) setCurrentUser(JSON.parse(saved));
      setLoading(false);
    }, []);
    const handleLogin = (user) => { localStorage.setItem('wave_current_user', JSON.stringify(user)); setCurrentUser(user); };
    const handleLogout = () => { localStorage.removeItem('wave_current_user'); setCurrentUser(null); };
    if (loading) return <div className="min-h-screen bg-[#1a1a1a] text-white flex items-center justify-center">Загрузка...</div>;
    if (!siteAccess) return <SitePasswordGate onSuccess={() => setSiteAccess(true)} />;
    if (currentUser) return <MainApp user={currentUser} onLogout={handleLogout} />;
    return <LoginRegister onLogin={handleLogin} />;
  }

  const SitePasswordGate = ({ onSuccess }) => {
    const [password, setPassword] = React.useState('');
    const [error, setError] = React.useState('');
    return (<div className="min-h-screen flex items-center justify-center bg-[#1a1a1a] p-4"><div className="card-bg p-8 max-w-md w-full text-center"><i className="fas fa-lock text-5xl text-white opacity-80"></i><h1 className="text-3xl font-bold mt-4 text-white">Wave Social</h1><p className="text-gray-500 mt-2">Введите пароль</p><form onSubmit={(e) => { e.preventDefault(); if (password === SITE_PASSWORD) { localStorage.setItem('wave_site_access', 'granted'); onSuccess(); } else setError('Неверный пароль'); }} className="space-y-4 mt-6"><input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-[#3a3a3a] rounded-2xl text-white text-center text-xl" autoFocus />{error && <div className="text-red-400 text-sm">{error}</div>}<button type="submit" className="w-full bg-gray-700 text-white py-3 rounded-2xl font-semibold">Войти</button></form></div></div>);
  };

  const LoginRegister = ({ onLogin }) => {
    const [isLogin, setIsLogin] = React.useState(true);
    const [username, setUsername] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [fullName, setFullName] = React.useState('');
    const [error, setError] = React.useState('');
    const [loading, setLoading] = React.useState(false);
    const handleSubmit = async (e) => {
      e.preventDefault(); setError(''); setLoading(true);
      if (isLogin) {
        const { data: userData } = await supabase.from('users').select('*').eq('username', username).single();
        if (!userData) { setError('Пользователь не найден'); setLoading(false); return; }
        if (password === userData.password_hash) onLogin(userData); else setError('Неверный пароль');
      } else {
        if (password.length < 4) { setError('Пароль минимум 4 символа'); setLoading(false); return; }
        const { data: existing } = await supabase.from('users').select('username').eq('username', username).single();
        if (existing) { setError('Имя уже занято'); setLoading(false); return; }
        const { data: newUser } = await supabase.from('users').insert({ username, full_name: fullName || username, password_hash: password, bio: 'Новый пользователь Wave! 🌊' }).select().single();
        if (newUser) onLogin(newUser); else setError('Ошибка');
      }
      setLoading(false);
    };
    return (<div className="min-h-screen flex items-center justify-center bg-[#1a1a1a] p-4"><div className="card-bg p-8 max-w-md w-full"><div className="text-center"><i className="fas fa-water text-5xl text-white opacity-80"></i><h1 className="text-3xl font-bold mt-2 text-white">Wave Social</h1></div><form onSubmit={handleSubmit} className="space-y-4 mt-6"><input type="text" placeholder="Логин" value={username} onChange={e => setUsername(e.target.value)} className="w-full p-3 bg-[#3a3a3a] rounded-2xl text-white" required /><input type="password" placeholder="Пароль" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-[#3a3a3a] rounded-2xl text-white" required />{!isLogin && <input type="text" placeholder="Имя" value={fullName} onChange={e => setFullName(e.target.value)} className="w-full p-3 bg-[#3a3a3a] rounded-2xl text-white" />}{error && <div className="text-red-400 text-sm">{error}</div>}<button type="submit" disabled={loading} className="w-full bg-gray-700 text-white py-3 rounded-2xl font-semibold">{loading ? 'Загрузка...' : (isLogin ? 'Войти' : 'Зарегистрироваться')}</button></form><button onClick={() => { setIsLogin(!isLogin); setError(''); }} className="w-full mt-4 text-gray-400 text-sm">{isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}</button></div></div>);
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
