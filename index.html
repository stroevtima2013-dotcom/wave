<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Wave Social – Рабочая версия</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0f0f0f; margin: 0; padding: 0; }
    #root { min-height: 100vh; }
    .card { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 24px; transition: 0.2s; box-shadow: 0 0 5px rgba(255,255,255,0.05); }
    .card:hover { transform: translateY(-3px); border-color: #4a4a4a; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e1e1e; border: 1px solid #333; color: white; padding: 8px 18px; border-radius: 40px; z-index: 1000; font-size: 14px; }
    .media-preview { position: relative; display: inline-block; margin: 4px; border-radius: 14px; overflow: hidden; border: 1px solid #3a3a3a; width: 80px; height: 80px; cursor: pointer; }
    .media-preview img, .media-preview video { width: 100%; height: 100%; object-fit: cover; }
    .remove-media { position: absolute; top: -8px; right: -8px; background: #ef4444; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; color: white; z-index: 10; }
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 16px; min-width: 160px; z-index: 50; overflow: hidden; }
    .dropdown-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: #e0e0e0; transition: 0.15s; cursor: pointer; }
    .dropdown-item:hover { background: #2a2a2a; }
    .edit-input, .edit-textarea { background: #2a2a2a; border: none; border-radius: 16px; padding: 10px 14px; color: white; width: 100%; margin-top: 8px; }
    .reply-quote { background: #1a1a1a; padding: 6px 10px; border-radius: 12px; border-left: 3px solid #3b82f6; font-size: 11px; color: #aaa; margin-bottom: 6px; display: flex; flex-direction: column; gap: 2px; }
    .reply-quote span { color: #3b82f6; font-weight: 500; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal-card { background: #1e1e1e; border-radius: 28px; padding: 24px; max-width: 360px; width: 90%; text-align: center; border: 1px solid #3a3a3a; }
    .mention { color: #3b82f6; font-weight: 500; cursor: pointer; }
    .hashtag { color: #eab308; font-weight: 500; cursor: pointer; }
    .chat-bubble { overflow-wrap: break-word; white-space: pre-wrap; word-break: break-word; }
    .white-glow-btn { background: white; color: #111; box-shadow: 0 0 8px rgba(255,255,255,0.3); transition: 0.2s; font-weight: 500; cursor: pointer; }
    .white-glow-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255,255,255,0.5); background: #f0f0f0; }
    .fullscreen-media { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .fullscreen-media img, .fullscreen-media video { max-width: 95vw; max-height: 95vh; border-radius: 28px; box-shadow: 0 0 50px rgba(255,255,255,0.2); }
    .white-icon-btn { background: white; color: #111; border-radius: 12px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; box-shadow: 0 0 6px rgba(255,255,255,0.3); transition: 0.2s; cursor: pointer; }
    .white-icon-btn:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(255,255,255,0.5); background: #f5f5f5; }
    .uploading-indicator { font-size: 12px; color: #aaa; margin-left: 8px; }
  </style>
</head>
<body>
<div id="root"><div style="display: flex; justify-content: center; align-items: center; height: 100vh; color: white; background: #0f0f0f;">Загрузка платформы...</div></div>

<!-- Загружаем React и зависимости -->
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="env,react">
  // ==================== КОНФИГУРАЦИЯ SUPABASE ====================
  // 🔧 ВСТАВЬТЕ ВАШИ ДАННЫЕ
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const STORAGE_BUCKET = "wave-media";
  const DEFAULT_AVATAR = "https://ui-avatars.com/api/?background=2a2a2a&color=fff&rounded=true&size=96&bold=true&length=1&name=?";

  // Инициализация Supabase
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
  function showToast(msg) { 
    const t = document.createElement('div'); 
    t.className = 'toast'; 
    t.innerText = msg; 
    document.body.appendChild(t); 
    setTimeout(() => t.remove(), 2500); 
  }
  
  function formatDate(iso) { 
    const d = new Date(iso), n = new Date(), diff = Math.floor((n - d) / 1000); 
    if (diff < 60) return 'только что'; 
    if (diff < 3600) return `${Math.floor(diff/60)} мин назад`; 
    if (diff < 86400) { 
      const h = d.getHours().toString().padStart(2,'0'), m = d.getMinutes().toString().padStart(2,'0'); 
      return `сегодня в ${h}:${m}`; 
    } 
    if (diff < 172800) return 'вчера'; 
    if (diff < 604800) return `${Math.floor(diff/86400)} дн назад`; 
    if (diff < 2592000) return `${Math.floor(diff/604800)} нед назад`; 
    if (diff < 31536000) return `${Math.floor(diff/2592000)} мес назад`; 
    return `${Math.floor(diff/31536000)} г назад`; 
  }
  
  function formatLikes(n) { 
    if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'м'; 
    if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'к'; 
    return n; 
  }

  // ==================== КОМПОНЕНТЫ ====================
  function PasswordGate({ onSuccess }) { 
    const [p, setP] = React.useState(''); 
    const [e, setE] = React.useState(''); 
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full text-center">
          <i className="fas fa-lock text-4xl text-white mb-3"></i>
          <h1 className="text-xl font-bold text-white">Wave Social</h1>
          <p className="text-gray-400 mt-1 text-sm">Введите пароль</p>
          <form onSubmit={(e) => { e.preventDefault(); if (p === '8554social') { localStorage.setItem('wave_access','ok'); onSuccess(); } else setE('Неверный пароль'); }} className="mt-4">
            <input type="password" value={p} onChange={e => setP(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-center" autoFocus />
            {e && <div className="text-red-400 text-sm mt-1">{e}</div>}
            <button type="submit" className="w-full mt-3 bg-gray-700 text-white py-1.5 rounded-xl">Войти</button>
          </form>
        </div>
      </div>
    );
  }

  function Auth({ onLogin }) { 
    const [login, setLogin] = React.useState(true); 
    const [user, setUser] = React.useState(''); 
    const [pass, setPass] = React.useState(''); 
    const [name, setName] = React.useState(''); 
    const [err, setErr] = React.useState(''); 
    const [load, setLoad] = React.useState(false); 
    
    const submit = async (e) => { 
      e.preventDefault(); 
      setErr(''); 
      setLoad(true); 
      if (login) { 
        const { data: u } = await supabase.from('users').select('*').eq('username', user).single(); 
        if (!u) { setErr('Неверный логин или пароль'); setLoad(false); return; } 
        if (pass === u.password_hash) onLogin(u); 
        else setErr('Неверный логин или пароль'); 
      } else { 
        if (pass.length < 4) { setErr('Пароль минимум 4 символа'); setLoad(false); return; } 
        const { data: exist } = await supabase.from('users').select('username').eq('username', user).single(); 
        if (exist) { setErr('Имя занято'); setLoad(false); return; } 
        const { data: nu } = await supabase.from('users').insert({ username: user, full_name: name || user, password_hash: pass, avatar: DEFAULT_AVATAR }).select().single(); 
        if (nu) onLogin(nu); 
        else setErr('Ошибка'); 
      } 
      setLoad(false); 
    }; 
    
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full">
          <div className="text-center">
            <i className="fas fa-water text-3xl text-white"></i>
            <h1 className="text-2xl font-bold mt-1 text-white">Wave Social</h1>
          </div>
          <form onSubmit={submit} className="space-y-3 mt-4">
            <input type="text" placeholder="Логин" value={user} onChange={e => setUser(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            <input type="password" placeholder="Пароль" value={pass} onChange={e => setPass(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            {!login && <input type="text" placeholder="Имя" value={name} onChange={e => setName(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" />}
            {err && <div className="text-red-400 text-sm">{err}</div>}
            <button type="submit" disabled={load} className="w-full bg-blue-600 text-white py-2 rounded-xl font-semibold">{load ? 'Загрузка...' : (login ? 'Войти' : 'Регистрация')}</button>
          </form>
          <button onClick={() => { setLogin(!login); setErr(''); }} className="w-full mt-3 text-gray-400 text-sm">{login ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}</button>
        </div>
      </div>
    );
  }

  function MainApp({ user, onLogout }) {
    const [tab, setTab] = React.useState('feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(null);
    const [messages, setMessages] = React.useState([]);
    const [chatList, setChatList] = React.useState([]);
    const [unread, setUnread] = React.useState({});
    const [notifs, setNotifs] = React.useState([]);
    const [viewProfile, setViewProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [newPost, setNewPost] = React.useState('');
    const [media, setMedia] = React.useState([]);
    const [uploading, setUploading] = React.useState(false);
    const [uploadMsg, setUploadMsg] = React.useState('');
    const [commentTexts, setCommentTexts] = React.useState({});
    const [msgText, setMsgText] = React.useState('');
    const [replyMsg, setReplyMsg] = React.useState(null);
    const [replyComm, setReplyComm] = React.useState(null);
    const [search, setSearch] = React.useState('');
    const [searchUsers, setSearchUsers] = React.useState([]);
    const [searchPosts, setSearchPosts] = React.useState([]);
    const [sType, setSType] = React.useState('users');
    const [showSubs, setShowSubs] = React.useState(false);
    const [showFollows, setShowFollows] = React.useState(false);
    const [avatarUp, setAvatarUp] = React.useState(false);
    const [editProfile, setEditProfile] = React.useState(false);
    const [editName, setEditName] = React.useState(user.full_name || '');
    const [editBio, setEditBio] = React.useState(user.bio || '');
    const [showDel, setShowDel] = React.useState(false);
    const [hidePost, setHidePost] = React.useState(null);
    const [hideSel, setHideSel] = React.useState([]);
    const [editPost, setEditPost] = React.useState(null);
    const [editPostContent, setEditPostContent] = React.useState('');
    const [sharePost, setSharePost] = React.useState(null);
    const [shareSel, setShareSel] = React.useState([]);
    const [delPostId, setDelPostId] = React.useState(null);
    const [selComment, setSelComment] = React.useState(null);
    const [selMsg, setSelMsg] = React.useState(null);
    const [fullscreen, setFullscreen] = React.useState(null);
    const [switchDialog, setSwitchDialog] = React.useState(false);
    const [switchUser, setSwitchUser] = React.useState('');
    const [switchPass, setSwitchPass] = React.useState('');
    const [switchErr, setSwitchErr] = React.useState('');
    const [showMentions, setShowMentions] = React.useState(false);
    const [mentionQ, setMentionQ] = React.useState('');
    const [mentionPos, setMentionPos] = React.useState(0);
    const textRef = React.useRef(null);
    const msgEndRef = React.useRef(null);

    const loadAll = async () => {
      const [pRes, uRes, mRes, nRes] = await Promise.all([
        supabase.from('posts').select('*').order('created_at', { ascending: false }),
        supabase.from('users').select('*'),
        supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`),
        supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false })
      ]);
      const all = pRes.data || [];
      const visible = all.filter(p => !p.hidden_from?.includes(user.id));
      setPosts(visible);
      setUsers(uRes.data || []);
      setNotifs(nRes.data || []);
      const msgs = mRes.data || [];
      const chatSet = new Set();
      msgs.forEach(m => { if (m.from_user !== user.id) chatSet.add(m.from_user); if (m.to_user !== user.id) chatSet.add(m.to_user); });
      setChatList(uRes.data?.filter(u => chatSet.has(u.id)) || []);
      const cnt = {};
      msgs.forEach(m => { if (m.to_user === user.id && !m.read) cnt[m.from_user] = (cnt[m.from_user] || 0) + 1; });
      setUnread(cnt);
      if (chatUser) {
        const chatMsgs = msgs.filter(m => (m.from_user === user.id && m.to_user === chatUser.id) || (m.from_user === chatUser.id && m.to_user === user.id)).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
        setMessages(chatMsgs);
        await supabase.from('messages').update({ read: true }).eq('to_user', user.id).eq('from_user', chatUser.id);
      }
      setLoading(false);
    };
    
    React.useEffect(() => { loadAll(); }, []);

    React.useEffect(() => {
      const pSub = supabase.channel('posts').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadAll()).subscribe();
      const mSub = supabase.channel('messages').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadAll()).subscribe();
      const nSub = supabase.channel('notifs').on('postgres_changes', { event: '*', schema: 'public', table: 'notifications' }, () => loadAll()).subscribe();
      return () => { pSub.unsubscribe(); mSub.unsubscribe(); nSub.unsubscribe(); };
    }, []);

    React.useEffect(() => {
      if (!chatUser) return;
      const sub = supabase.channel('chat-rt').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `to_user=eq.${user.id},from_user=eq.${chatUser.id}` }, (p) => {
        setMessages(prev => [...prev, p.new]);
        supabase.from('messages').update({ read: true }).eq('id', p.new.id);
        setUnread(prev => ({ ...prev, [chatUser.id]: 0 }));
      }).subscribe();
      return () => sub.unsubscribe();
    }, [chatUser, user.id]);

    React.useEffect(() => {
      if (!search.trim()) { setSearchUsers([]); setSearchPosts([]); return; }
      if (sType === 'users') setSearchUsers(users.filter(u => u.id !== user.id && u.username.toLowerCase().includes(search.toLowerCase())));
      else setSearchPosts(posts.filter(p => p.content.toLowerCase().includes(search.toLowerCase()) || (search.startsWith('#') && p.content.toLowerCase().includes(search.toLowerCase()))));
    }, [search, sType, users, posts]);

    const uploadMediaFiles = async (files) => {
      const up = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        setUploadMsg(`Загрузка ${i+1}/${files.length}: ${f.name}`);
        const ext = f.name.split('.').pop();
        const name = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
        const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(name, f);
        if (error) { showToast(`Ошибка: ${f.name}`); continue; }
        const { data: url } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name);
        up.push({ url: url.publicUrl, type: f.type.startsWith('image/') ? 'image' : 'video' });
      }
      setUploadMsg('');
      return up;
    };

    const sendMsg = async () => {
      if ((!msgText.trim() && !replyMsg) || !chatUser) return;
      let content = msgText;
      let replyId = null;
      if (replyMsg) { replyId = replyMsg.id; }
      const tempId = Date.now();
      setMessages(prev => [...prev, { id: tempId, from_user: user.id, to_user: chatUser.id, content, reply_to_id: replyId, created_at: new Date().toISOString() }]);
      setMsgText('');
      setReplyMsg(null);
      const { data: ins } = await supabase.from('messages').insert({ from_user: user.id, to_user: chatUser.id, content, reply_to_id: replyId, read: false, created_at: new Date() }).select().single();
      if (ins) setMessages(prev => prev.map(m => m.id === tempId ? ins : m));
      await supabase.from('notifications').insert({ user_id: chatUser.id, type: 'message', from_user_id: user.id, from_username: user.username, text: `${user.username} отправил сообщение`, read: false, created_at: new Date() });
    };

    const delMsg = async (id) => { setMessages(prev => prev.filter(m => m.id !== id)); await supabase.from('messages').delete().eq('id', id); setSelMsg(null); };
    const follow = async (id) => { if(id===user.id){showToast('Нельзя подписаться на себя');return;} let f=user.following||[]; let is=f.includes(id); let nf=is?f.filter(i=>i!==id):[...f,id]; await supabase.from('users').update({following:nf}).eq('id',user.id); user.following=nf; let t=users.find(u=>u.id===id); if(t){let fl=t.followers||[]; let nfl=is?fl.filter(i=>i!==user.id):[...fl,user.id]; await supabase.from('users').update({followers:nfl}).eq('id',id);} await loadAll(); showToast(is?'Отписались':'Подписались'); };
    const upAvatar = async (file) => { if(!file)return; setAvatarUp(true); let name=`avatar_${user.id}_${Date.now()}.jpg`; let {error}=await supabase.storage.from(STORAGE_BUCKET).upload(name,file); if(error){showToast('Ошибка'); setAvatarUp(false);return;} let {data:url}=supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name); await supabase.from('users').update({avatar:url.publicUrl}).eq('id',user.id); user.avatar=url.publicUrl; await loadAll(); setAvatarUp(false); showToast('Аватар обновлён'); };
    const delAccount = async () => { await supabase.from('users').delete().eq('id',user.id); showToast('Аккаунт удалён'); onLogout(); };
    const saveProfile = async () => { await supabase.from('users').update({full_name:editName,bio:editBio}).eq('id',user.id); user.full_name=editName; user.bio=editBio; setEditProfile(false); await loadAll(); showToast('Профиль обновлён'); };
    const handleMedia = async (e) => { let files=Array.from(e.target.files); if(media.length+files.length>5){showToast('Максимум 5 файлов');return;} setUploading(true); let up=await uploadMediaFiles(files); setMedia([...media,...up]); setUploading(false); e.target.value=''; };
    const removeMedia = (i) => setMedia(media.filter((_,idx)=>idx!==i));
    const createPost = async () => {
      if(!newPost.trim()&&media.length===0){showToast('Напишите текст или добавьте медиа');return;}
      let mentions=[...newPost.matchAll(/@(\w+)/g)].map(m=>m[1]);
      for(let m of mentions){let {data}=await supabase.from('users').select('username').eq('username',m).single(); if(!data){showToast(`Пользователь @${m} не существует`);return;}}
      let hashtags=[...newPost.matchAll(/#[\wа-яё]+/gi)].map(m=>m[0]);
      let hidden=hideSel.length?hideSel:null;
      let tempId=Date.now();
      setPosts([{id:tempId,user_id:user.id,username:user.username,user_avatar:user.avatar,content:newPost,media,likes:0,comments:[],mentions,hashtags,hidden_from:hidden,created_at:new Date().toISOString(),edited:false},...posts]);
      setNewPost(''); setMedia([]); setHidePost(null); setHideSel([]);
      let {data:ins}=await supabase.from('posts').insert({user_id:user.id,username:user.username,user_avatar:user.avatar,content:newPost,media,likes:0,comments:[],mentions,hashtags,hidden_from:hidden,created_at:new Date(),edited:false}).select().single();
      if(ins) setPosts(prev=>prev.map(p=>p.id===tempId?ins:p));
      for(let m of mentions){let u=users.find(x=>x.username===m); if(u&&u.id!==user.id) await supabase.from('notifications').insert({user_id:u.id,type:'mention',from_user_id:user.id,from_username:user.username,text:`${user.username} отметил вас в посте`,read:false,created_at:new Date()});}
      showToast('Пост опубликован!');
    };
    const likePost = async (pid,curr)=>{let newL=curr+1; setPosts(prev=>prev.map(p=>p.id===pid?{...p,likes:newL}:p)); await supabase.from('posts').update({likes:newL}).eq('id',pid);};
    const addComment = async (pid)=>{
      let txt=commentTexts[pid]||''; if(!txt.trim())return;
      let replyId=null; let replyUsername=null;
      if(replyComm){replyId=replyComm.id; replyUsername=replyComm.username;}
      let post=posts.find(p=>p.id===pid);
      let newC={id:Date.now(),user_id:user.id,username:user.username,user_avatar:user.avatar,text:txt,reply_to_id:replyId,reply_to_username:replyUsername,created_at:new Date().toISOString()};
      let newCmnts=[...(post.comments||[]),newC];

{()=>p.user_id!==user.id&&setViewProfile(users.find(u=>u.id===p.user_id))}><img src={p.user_avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full" /><div><div className="font-bold text-white text-sm">@{p.username}</div><div className="text-xs text-gray-500">{formatDate(p.created_at)}{p.edited&&<span className="ml-1 text-gray-600">(ред)</span>}</div></div></div><PostMenu onEdit={p.user_id===user.id?()=>{setEditPost(p); setEditPostContent(p.content);}:null} onDel={p.user_id===user.id?()=>setDelPostId(p.id):null} onShare={()=>{setSharePost(p); setShareSel([]);}} onHide={p.user_id===user.id?()=>{setHidePost(true); setHideSel(p.hidden_from||[]);}:null} /></div><p className="text-white text-sm mt-1 whitespace-pre-wrap">{renderText(p.content)}</p>{p.media?.length>0&&<div className="grid grid-cols-3 gap-1 mt-2">{p.media.map((m,i)=>m.type==='video'?<video key={i} src={m.url} className="h-20 object-cover rounded-lg cursor-pointer" onClick={()=>setFullscreen({url:m.url,type:'video'})} />:<img key={i} src={m.url} className="h-20 object-cover rounded-lg cursor-pointer" onClick={()=>setFullscreen({url:m.url,type:'image'})} />)}</div>}<div className="flex gap-3 mt-2 text-gray-400 text-xs"><button onClick={()=>likePost(p.id,p.likes||0)} className="flex gap-1 hover:text-red-400"><i className="fas fa-heart"></i> {formatLikes(p.likes||0)}</button><button onClick={()=>{let d=document.getElementById(`c-${p.id}`); if(d)d.classList.toggle('hidden');}} className="flex gap-1 hover:text-blue-400"><i className="far fa-comment"></i> {(p.comments||[]).length}</button></div><div id={`c-${p.id}`} className="hidden mt-2 pt-2 border-t border-gray-800">{(p.comments||[]).map(c=>{const repliedToC=getRepliedComm(c, p.comments); return (<div key={c.id} className="mb-2"><div className="flex items-start gap-2 p-2 hover:bg-[#2a2a2a] rounded-xl cursor-pointer" onClick={()=>setSelComment({postId:p.id,comment:c})}><img src={c.user_avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full mt-0.5" /><div className="flex-1"><div className="flex items-center gap-2"><span className="font-bold text-sm text-white">@{c.username}</span><span className="text-xs text-gray-500">{formatDate(c.created_at)}</span></div>{repliedToC&&(<div className="reply-quote mt-1"><span>@{repliedToC.author}</span><div className="text-gray-400 text-xs">{repliedToC.text.length>80?repliedToC.text.substring(0,80)+'...':repliedToC.text}</div></div>)}<p className="text-gray-300 text-sm mt-1">{c.text}</p></div></div></div>);})}</div><div className="flex gap-2 mt-2"><input id={`ci-${p.id}`} type="text" placeholder="Комментарий..." className="flex-1 p-1.5 bg-[#2a2a2a] rounded-xl text-sm text-white" value={commentTexts[p.id]||''} onChange={e=>setCommentTexts({...commentTexts,[p.id]:e.target.value})} /><button onClick={()=>addComment(p.id)} className="bg-gray-700 text-white px-3 rounded-xl text-xs">→</button></div></div>);})}</>)}

        {tab==='search'&&(<div><div className="card p-3 mb-4"><div className="flex gap-2 mb-2"><button onClick={()=>setSType('users')} className={`text-xs px-2 py-1 rounded-full ${sType==='users'?'bg-blue-600':'bg-gray-800'}`}>👥 Пользователи</button><button onClick={()=>setSType('posts')} className={`text-xs px-2 py-1 rounded-full ${sType==='posts'?'bg-blue-600':'bg-gray-800'}`}>📄 Посты</button></div><input type="text" placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" /></div>{sType==='users'&&searchUsers.map(u=><div key={u.id} className="card p-3 mb-2 flex justify-between items-center"><div className="flex gap-2 cursor-pointer" onClick={()=>setViewProfile(u)}><img src={u.avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full" /><div><div className="font-bold text-white text-sm">{u.full_name||u.username}</div><div className="text-gray-400 text-xs">@{u.username}</div></div></div><button onClick={()=>{setChatUser(u); setTab('chat');}} className="bg-green-600 text-white px-2 py-0.5 rounded-full text-xs">Чат</button></div>)}</div>)}

        {tab==='chat'&&(<div className="flex flex-col h-[70vh]"><div className="flex gap-1 mb-2 overflow-x-auto pb-1">{chatList.map(cu=><button key={cu.id} onClick={()=>setChatUser(cu)} className={`px-2 py-0.5 rounded-full text-xs ${chatUser?.id===cu.id?'bg-blue-600':'bg-gray-800'}`}>@{cu.username}</button>)}</div>{chatUser?(<div className="card flex flex-col h-full"><div className="p-2 border-b border-gray-800 font-bold text-white text-sm">Чат с @{chatUser.username}</div><div className="flex-1 overflow-y-auto p-2 space-y-1">{replyMsg&&(()=>{let r=getRepliedMsg(replyMsg.id); return r&&(<div className="reply-quote"><span>@{r.author}</span><div className="text-gray-400 text-xs">{r.text.length>80?r.text.substring(0,80)+'...':r.text}</div></div>);})()}{messages.map((msg,i)=>{let r=getRepliedMsg(msg.reply_to_id); return (<div key={i} className={`flex ${msg.from_user===user.id?'justify-end':'justify-start'}`}><div className={`max-w-[75%] p-1.5 rounded-xl ${msg.from_user===user.id?'bg-blue-600 text-white':'bg-[#2a2a2a] text-white'} text-xs cursor-pointer`} onClick={()=>setSelMsg({msg})}>{r&&(<div className="reply-quote mb-1 text-xs"><span>@{r.author}</span><div className="text-gray-400">{r.text.length>60?r.text.substring(0,60)+'...':r.text}</div></div>)}<p className="break-words whitespace-pre-wrap">{msg.content}</p><div className="text-[10px] opacity-70 mt-0.5 text-right">{new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div></div>);})}<div ref={msgEndRef} /></div><div className="p-2 border-t border-gray-800 flex gap-2"><input id="msgInp" type="text" placeholder="Сообщение..." value={msgText} onChange={e=>setMsgText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&sendMsg()} className="flex-1 p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm" /><button onClick={sendMsg} className="bg-blue-600 text-white px-3 rounded-xl">→</button></div></div>):(<div className="card p-6 text-center text-gray-500 text-sm">Выберите чат</div>)}</div>)}

        {tab==='notify'&&(<div><div className="flex justify-between items-center mb-2"><h2 className="text-lg font-bold text-white">Уведомления</h2><button onClick={markAllRead} className="text-xs bg-gray-700 px-2 py-0.5 rounded-full">Прочитать все</button></div>{notifs.length===0&&<div className="card p-6 text-center text-gray-500 text-sm">Нет уведомлений</div>}{notifs.map(n=><div key={n.id} className={`card p-2 mb-2 cursor-pointer ${!n.read?'border-l-4 border-green-500':''}`} onClick={async()=>{await supabase.from('notifications').update({read:true}).eq('id',n.id); setNotifs(prev=>prev.map(not=>not.id===n.id?{...not,read:true}:not)); if(n.type==='message'){let from=users.find(u=>u.id===n.from_user_id); if(from){setChatUser(from); setTab('chat');}} else setTab('feed');}}><p className="text-white text-sm">{n.text}</p><p className="text-gray-500 text-xs">{formatDate(n.created_at)}</p></div>)}</div>)}

        {tab==='profile'&&(<div className="card p-4 text-center"><div className="flex justify-end"><ProfileMenu/></div><div className="avatar-upload w-20 h-20 mx-auto relative cursor-pointer"><img src={user.avatar||DEFAULT_AVATAR} className="w-20 h-20 rounded-full object-cover" /><input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer rounded-full" onChange={(e)=>upAvatar(e.target.files[0])} disabled={avatarUp} /></div>{editProfile?(<div className="mt-3"><input type="text" value={editName} onChange={e=>setEditName(e.target.value)} className="w-full p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm" placeholder="Имя" /><textarea value={editBio} onChange={e=>setEditBio(e.target.value)} className="w-full p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm mt-1" rows="2" placeholder="О себе"></textarea><div className="flex gap-2 mt-2"><button onClick={saveProfile} className="flex-1 bg-green-600 text-white py-1 rounded-xl text-sm">Сохранить</button><button onClick={()=>setEditProfile(false)} className="flex-1 bg-gray-700 text-white py-1 rounded-xl text-sm">Отмена</button></div></div>):(<><h2 className="text-lg font-bold text-white mt-1">{user.full_name||user.username}</h2><p className="text-gray-400 text-sm">@{user.username}</p><p className="text-gray-500 text-xs mt-1">{user.bio||''}</p><div className="flex gap-4 justify-center mt-3 text-sm"><div><span className="font-bold text-white">{posts.filter(p=>p.user_id===user.id).length}</span><span className="text-gray-500 ml-1">постов</span></div><div><span className="font-bold text-white">{user.followers?.length||0}</span><span className="text-gray-500 ml-1">подписчиков</span></div><div><span className="font-bold text-white">{user.following?.length||0}</span><span className="text-gray-500 ml-1">подписок</span></div></div></>)}</div>)}
      </main>
    </div>);
  }

  function App() { 
    const [a, setA] = React.useState(false); 
    const [u, setU] = React.useState(null); 
    const [l, setL] = React.useState(true); 
    
    React.useEffect(() => { 
      if (localStorage.getItem('wave_access') === 'ok') setA(true); 
      let s = localStorage.getItem('wave_user'); 
      if (s) setU(JSON.parse(s)); 
      setL(false); 
    }, []); 
    
    const log = (u) => { 
      localStorage.setItem('wave_user', JSON.stringify(u)); 
      setU(u); 
    }; 
    
    const out = () => { 
      localStorage.removeItem('wave_user'); 
      setU(null); 
    }; 
    
    if (l) return <div className="p-4 text-white" style={{background: '#0f0f0f', minHeight: '100vh'}}>Загрузка...</div>; 
    if (!a) return <PasswordGate onSuccess={() => setA(true)} />; 
    if (u) return <MainApp user={u} onLogout={out} />; 
    return <Auth onLogin={log} />; 
  }
  
  // Запускаем приложение
  const rootElement = document.getElementById("root");
  if (rootElement) {
    ReactDOM.createRoot(rootElement).render(<App />);
  }
</script>
</body>
</html>
