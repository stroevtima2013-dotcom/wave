<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Wave Social | Современная соцсеть</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0a0a0a; margin: 0; padding: 0; }
    
    /* Красивые градиенты */
    .gradient-bg { background: linear-gradient(135deg, #0a0a0a 0%, #0f0f0f 100%); }
    .gradient-card { background: linear-gradient(135deg, #1a1a1a 0%, #141414 100%); border: 1px solid rgba(59,130,246,0.15); }
    .gradient-border { border-image: linear-gradient(135deg, #3b82f6, #8b5cf6) 1; }
    .gradient-text { background: linear-gradient(135deg, #fff, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gradient-btn { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
    .gradient-btn:hover { background: linear-gradient(135deg, #2563eb, #7c3aed); }
    
    .card { background: linear-gradient(135deg, #1a1a1a 0%, #141414 100%); border: 1px solid rgba(59,130,246,0.2); border-radius: 28px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .card:hover { transform: translateY(-3px); border-color: rgba(59,130,246,0.5); box-shadow: 0 8px 30px rgba(59,130,246,0.15); }
    
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #1e1e1e, #161616); border: 1px solid rgba(59,130,246,0.3); color: white; padding: 10px 22px; border-radius: 50px; z-index: 1000; font-size: 14px; backdrop-filter: blur(10px); }
    
    .media-preview { position: relative; display: inline-block; margin: 4px; border-radius: 16px; overflow: hidden; border: 1px solid #3a3a3a; width: 80px; height: 80px; cursor: pointer; transition: 0.2s; }
    .media-preview:hover { transform: scale(1.05); border-color: #3b82f6; }
    .media-preview img, .media-preview video { width: 100%; height: 100%; object-fit: cover; }
    .remove-media { position: absolute; top: -8px; right: -8px; background: linear-gradient(135deg, #ef4444, #dc2626); border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; color: white; z-index: 10; transition: 0.2s; }
    .remove-media:hover { transform: scale(1.1); }
    
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: linear-gradient(135deg, #1e1e1e, #161616); border: 1px solid #3a3a3a; border-radius: 20px; min-width: 170px; z-index: 50; overflow: hidden; backdrop-filter: blur(10px); }
    .dropdown-item { padding: 12px 18px; display: flex; align-items: center; gap: 12px; color: #e0e0e0; transition: 0.15s; cursor: pointer; font-size: 14px; }
    .dropdown-item:hover { background: #2a2a2a; }
    
    .reply-quote { background: rgba(26,26,26,0.9); padding: 8px 12px; border-radius: 14px; border-left: 3px solid #3b82f6; font-size: 11px; color: #aaa; margin-bottom: 8px; backdrop-filter: blur(5px); }
    .mention { color: #3b82f6; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .mention:hover { text-decoration: underline; text-shadow: 0 0 8px rgba(59,130,246,0.3); }
    .hashtag { color: #eab308; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .hashtag:hover { text-decoration: underline; }
    
    .white-glow-btn { background: linear-gradient(135deg, #ffffff, #f0f0f0); color: #111; box-shadow: 0 0 15px rgba(255,255,255,0.2); transition: all 0.2s; font-weight: 600; cursor: pointer; border: none; }
    .white-glow-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(255,255,255,0.4); background: linear-gradient(135deg, #f5f5f5, #e8e8e8); }
    
    .white-icon-btn { background: linear-gradient(135deg, #ffffff, #f0f0f0); color: #111; border-radius: 14px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .white-icon-btn:hover { transform: translateY(-2px); background: linear-gradient(135deg, #f5f5f5, #e8e8e8); box-shadow: 0 4px 15px rgba(255,255,255,0.15); }
    
    .fullscreen-media { position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(20px); }
    .fullscreen-media img, .fullscreen-media video { max-width: 95vw; max-height: 95vh; border-radius: 32px; box-shadow: 0 0 60px rgba(0,0,0,0.5); }
    
    .fullscreen-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(12px); } }
    .fullscreen-modal-content { background: linear-gradient(135deg, #1a1a1a, #141414); border-radius: 32px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 28px; border: 1px solid rgba(59,130,246,0.2); animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    /* Чат */
    .chat-list { display: flex; flex-direction: column; gap: 12px; max-height: 70vh; overflow-y: auto; padding: 4px; }
    .chat-item { background: #1a1a1a; border-radius: 20px; padding: 14px; cursor: pointer; transition: all 0.2s; border: 1px solid #2a2a2a; display: flex; align-items: center; gap: 14px; }
    .chat-item:hover { background: #222; border-color: #3b82f6; transform: translateX(4px); }
    .chat-item.active { background: linear-gradient(135deg, #1a2a3a, #1a2a3a); border-color: #3b82f6; }
    
    .chat-messages { display: flex; flex-direction: column; gap: 10px; max-height: 65vh; overflow-y: auto; padding: 16px; }
    .message { max-width: 80%; padding: 12px 18px; border-radius: 24px; word-break: break-word; font-size: 14px; line-height: 1.4; }
    .message-mine { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; align-self: flex-end; border-bottom-right-radius: 6px; }
    .message-theirs { background: #2a2a2a; color: white; align-self: flex-start; border-bottom-left-radius: 6px; }
    
    .post-media-large { width: 100%; border-radius: 20px; margin-top: 12px; cursor: pointer; transition: 0.2s; max-height: 450px; object-fit: cover; }
    .post-media-large:hover { opacity: 0.95; transform: scale(0.99); }
    
    .read-more-container { position: relative; }
    .read-more-content.collapsed { max-height: 150px; overflow: hidden; }
    .read-more-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: linear-gradient(to bottom, transparent, #1a1a1a); pointer-events: none; }
    .read-more-btn { background: #3b82f6; color: white; border: none; padding: 6px 18px; border-radius: 30px; font-size: 12px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .read-more-btn:hover { background: #2563eb; transform: scale(1.02); }
    
    .fade-comment { opacity: 0.7; transition: 0.2s; }
    .fade-comment:hover { opacity: 1; }
    
    .poll-option { background: #2a2a2a; border-radius: 14px; margin: 10px 0; overflow: hidden; cursor: pointer; transition: all 0.2s; }
    .poll-option:hover { background: #333; transform: scale(1.01); }
    .poll-bar { background: linear-gradient(90deg, #3b82f6, #8b5cf6); height: 100%; transition: width 0.4s ease; }
    
    .active-tab { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white !important; box-shadow: 0 0 15px rgba(59,130,246,0.3); }
    .tab-icon { transition: all 0.2s; padding: 8px; border-radius: 14px; }
    .tab-icon:hover { background: rgba(255,255,255,0.05); }
    
    .input-field { background: #2a2a2a; border: 1px solid #3a3a3a; transition: all 0.2s; }
    .input-field:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
  </style>
</head>
<body>
<div id="root"><div class="flex items-center justify-center min-h-screen text-white text-lg" style="background:#0a0a0a"><i class="fas fa-water fa-spin mr-3 text-blue-500"></i> Wave Social</div></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  // ========== ВАШИ ДАННЫЕ SUPABASE (ЗАМЕНИТЕ!) ==========
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const STORAGE_BUCKET = "wave-media";
  const DEFAULT_AVATAR = "https://ui-avatars.com/api/?background=3b82f6&color=fff&rounded=true&size=96&bold=true&length=2&name=?";
  
  let supabase;
  let dbReady = false;
  
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    dbReady = true;
    console.log("✅ Supabase подключён");
  } catch(e) {
    console.warn("⚠️ Supabase не настроен, используем локальное хранилище");
    dbReady = false;
  }

  function showToast(msg) { 
    const t = document.createElement('div'); 
    t.className = 'toast'; 
    t.innerHTML = msg; 
    document.body.appendChild(t); 
    setTimeout(() => t.remove(), 2500); 
  }
  
  function formatDate(iso) { 
    if(!iso) return 'только что';
    const d = new Date(iso), n = new Date(), diff = Math.floor((n - d) / 1000); 
    if (diff < 60) return 'только что'; 
    if (diff < 3600) return `${Math.floor(diff/60)} мин назад`; 
    if (diff < 86400) { 
      const h = d.getHours().toString().padStart(2,'0'), m = d.getMinutes().toString().padStart(2,'0'); 
      return `сегодня в ${h}:${m}`; 
    } 
    if (diff < 172800) return 'вчера'; 
    if (diff < 604800) return `${Math.floor(diff/86400)} дн назад`; 
    return `${Math.floor(diff/604800)} нед назад`; 
  }
  
  function formatLikes(n) { 
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'K'; 
    return n; 
  }

  // Компонент "Читать далее"
  function ReadMore({ text, maxLength = 200 }) {
    const [expanded, setExpanded] = React.useState(false);
    if(!text) return null;
    const needTruncate = text.length > maxLength;
    const displayText = expanded ? text : (needTruncate ? text.slice(0, maxLength) + '...' : text);
    if (!needTruncate) return <p className="text-white text-sm whitespace-pre-wrap leading-relaxed">{text}</p>;
    return (
      <div className="read-more-container relative">
        <div className={`read-more-content ${!expanded ? 'collapsed' : ''}`}>
          <p className="text-white text-sm whitespace-pre-wrap leading-relaxed">{displayText}</p>
        </div>
        {!expanded && <div className="read-more-overlay"></div>}
        <button onClick={() => setExpanded(!expanded)} className="read-more-btn">{expanded ? 'Свернуть ↑' : 'Читать далее ↓'}</button>
      </div>
    );
  }

  function PollComponent({ poll, postId, userId, onVote }) {
    const [voted, setVoted] = React.useState(poll?.voted_by?.includes(userId) || false);
    const totalVotes = poll?.options?.reduce((sum, opt) => sum + (opt.votes || 0), 0) || 0;
    const handleVote = async (optionIndex) => {
      if (voted) return;
      const newPoll = { ...poll };
      newPoll.options[optionIndex].votes = (newPoll.options[optionIndex].votes || 0) + 1;
      newPoll.voted_by = [...(poll.voted_by || []), userId];
      onVote(postId, newPoll);
      setVoted(true);
    };
    return (
      <div className="mt-3 p-3 bg-[#252525] rounded-xl border border-gray-800">
        <p className="text-white text-sm font-semibold mb-2">{poll?.question || 'Опрос'}</p>
        {poll?.options?.map((opt, idx) => {
          const percent = totalVotes > 0 ? ((opt.votes || 0) / totalVotes) * 100 : 0;
          return (
            <div key={idx} className="poll-option" onClick={() => handleVote(idx)}>
              <div className="relative p-2.5">
                <div className="poll-bar absolute left-0 top-0 h-full rounded-xl" style={{ width: `${percent}%`, opacity: 0.25 }}></div>
                <div className="relative flex justify-between items-center z-10">
                  <span className="text-white text-sm">{opt.text}</span>
                  {voted && <span className="text-gray-300 text-xs font-medium">{percent.toFixed(0)}% ({opt.votes || 0})</span>}
                </div>
              </div>
            </div>
          );
        })}
        <p className="text-gray-500 text-xs mt-2 text-center">{voted ? `✅ Всего голосов: ${totalVotes}` : '📊 Нажмите на вариант, чтобы проголосовать'}</p>
      </div>
    );
  }

  function PollCreatorModal({ onClose, onSave }) {
    const [question, setQuestion] = React.useState('');
    const [options, setOptions] = React.useState(['', '']);
    const addOption = () => { if (options.length < 10) setOptions([...options, '']); };
    const removeOption = (idx) => { if (options.length > 2) setOptions(options.filter((_, i) => i !== idx)); };
    const savePoll = () => {
      if (!question.trim()) { showToast('Введите вопрос опроса'); return; }
      const valid = options.filter(o => o.trim());
      if (valid.length < 2) { showToast('Минимум 2 варианта'); return; }
      onSave({ question: question.trim(), options: valid.map(t => ({ text: t, votes: 0 })), voted_by: [] });
      onClose();
    };
    return (
      <div className="fullscreen-modal" onClick={onClose}>
        <div className="fullscreen-modal-content" onClick={e => e.stopPropagation()}>
          <div className="flex justify-between items-center mb-5"><h2 className="text-white text-xl font-bold gradient-text">📊 Создать опрос</h2><button onClick={onClose} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
          <input type="text" placeholder="Вопрос опроса" value={question} onChange={e=>setQuestion(e.target.value)} className="w-full p-3 input-field rounded-xl text-white text-sm mb-4" autoFocus />
          <div className="mb-4"><p className="text-gray-400 text-sm mb-2">Варианты ответа (2-10):</p>
            {options.map((opt, i) => (<div key={i} className="flex gap-2 mb-2"><input type="text" placeholder={`Вариант ${i+1}`} value={opt} onChange={e=>setOptions(options.map((o, j)=>j===i?e.target.value:o))} className="flex-1 p-2 input-field rounded-xl text-white text-sm" />{options.length>2 && <button onClick={()=>removeOption(i)} className="bg-red-600 text-white px-3 rounded-xl text-sm hover:bg-red-700">✖</button>}</div>))}
          </div>
          <button onClick={addOption} className="text-blue-400 text-sm mb-4 hover:underline">+ Добавить вариант ({options.length}/10)</button>
          <div className="flex gap-3"><button onClick={savePoll} className="flex-1 gradient-btn py-3 rounded-xl text-white font-semibold">✅ Добавить опрос</button><button onClick={onClose} className="flex-1 bg-gray-700 py-3 rounded-xl text-white hover:bg-gray-600">Отмена</button></div>
        </div>
      </div>
    );
  }

  function HideSettingsModal({ users, currentUserId, selectedUsers, onToggleUser, onApply, onClose }) {
    return (
      <div className="fullscreen-modal" onClick={onClose}>
        <div className="fullscreen-modal-content" onClick={e=>e.stopPropagation()}>
          <div className="flex justify-between items-center mb-5"><h2 className="text-white text-xl font-bold gradient-text">👁 Скрыть пост</h2><button onClick={onClose} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
          <p className="text-gray-400 text-sm mb-4">Выберите пользователей, которые не увидят этот пост:</p>
          <div className="max-h-96 overflow-y-auto mb-4 space-y-2">
            {users.filter(u=>u.id!==currentUserId).map(u=>(
              <div key={u.id} className={`flex items-center gap-3 p-3 rounded-xl cursor-pointer transition ${selectedUsers.includes(u.id)?'bg-[#2a2a2a] border border-blue-500':'bg-[#1a1a1a] hover:bg-[#252525]'}`} onClick={()=>onToggleUser(u.id)}>
                <input type="checkbox" checked={selectedUsers.includes(u.id)} onChange={()=>{}} className="w-4 h-4 accent-blue-500" />
                <img src={u.avatar||DEFAULT_AVATAR} className="w-10 h-10 rounded-full" />
                <div className="flex-1"><div className="text-white font-medium">{u.full_name||u.username}</div><div className="text-gray-500 text-xs">@{u.username}</div></div>
              </div>
            ))}
          </div>
          <div className="flex gap-3"><button onClick={onApply} className="flex-1 gradient-btn py-3 rounded-xl text-white font-semibold">Применить ({selectedUsers.length})</button><button onClick={onClose} className="flex-1 bg-gray-700 py-3 rounded-xl text-white hover:bg-gray-600">Отмена</button></div>
        </div>
      </div>
    );
  }

  function CommentsPage({ post, currentUser, onClose, onAddComment, onDeleteComment }) {
    const [text, setText] = React.useState('');
    const [replyTo, setReplyTo] = React.useState(null);
    const comments = post.comments || [];
    const renderComment = (c, depth=0) => {
      const replies = comments.filter(rc => rc.reply_to_id === c.id);
      return (
        <div key={c.id} className="mb-3" style={{marginLeft: depth*20}}>
          <div className="flex gap-3 p-2 hover:bg-[#2a2a2a] rounded-xl transition">
            <img src={c.user_avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
            <div className="flex-1"><div className="flex items-center gap-2 flex-wrap"><span className="font-bold text-white text-sm">@{c.username}</span><span className="text-gray-500 text-xs">{formatDate(c.created_at)}</span></div>{c.reply_to_username && <div className="reply-quote mt-1 text-xs">→ @{c.reply_to_username}</div>}<p className="text-gray-300 text-sm mt-1 leading-relaxed">{c.text}</p><button onClick={()=>{setReplyTo(c); setText(`@${c.username} `);}} className="text-blue-400 text-xs mt-1 hover:underline">↩️ Ответить</button>{c.user_id===currentUser.id && <button onClick={()=>onDeleteComment(post.id, c.id)} className="text-red-400 text-xs ml-3 hover:underline">🗑 Удалить</button>}</div>
          </div>
          {replies.map(r => renderComment(r, depth+1))}
        </div>
      );
    };
    return (
      <div className="fixed inset-0 bg-black/95 z-50 flex flex-col">
        <div className="sticky top-0 bg-gradient-to-r from-[#1a1a1a] to-[#141414] p-4 flex items-center gap-3 border-b border-gray-800"><button onClick={onClose} className="text-white text-xl hover:text-blue-400">←</button><span className="text-white font-bold text-lg">💬 Комментарии ({comments.length})</span></div>
        <div className="flex-1 overflow-y-auto p-4">{comments.filter(c=>!c.reply_to_id).map(c=>renderComment(c))}{comments.length===0 && <div className="text-center text-gray-500 py-12"><i className="fas fa-comment-slash text-3xl mb-3 opacity-50"></i><p>Нет комментариев</p></div>}</div>
        <div className="p-4 border-t border-gray-800 bg-gradient-to-r from-[#1a1a1a] to-[#141414]">
          {replyTo && <div className="reply-quote mb-2">Ответ @{replyTo.username} <button onClick={()=>setReplyTo(null)} className="text-red-400 ml-2">✖ Отмена</button></div>}
          <div className="flex gap-3"><input type="text" placeholder="Написать комментарий..." value={text} onChange={e=>setText(e.target.value)} className="flex-1 p-3 input-field rounded-xl text-white text-sm" /><button onClick={()=>{if(text.trim()){onAddComment(post.id, text, replyTo); setText(''); setReplyTo(null);}}} className="gradient-btn text-white px-5 rounded-xl"><i className="fas fa-paper-plane"></i></button></div>
        </div>
      </div>
    );
  }

  function PasswordGate({ onSuccess }) { 
    const [p, setP] = React.useState(''); 
    const [e, setE] = React.useState(''); 
    return (
      <div className="min-h-screen flex items-center justify-center p-4 gradient-bg">
        <div className="card p-8 max-w-md w-full text-center">
          <i className="fas fa-water text-5xl text-blue-500 mb-4"></i>
          <h1 className="text-2xl font-bold text-white mb-2">Wave Social</h1>
          <p className="text-gray-400 text-sm mb-6">Введите пароль для доступа</p>
          <form onSubmit={(e) => { e.preventDefault(); if (p === '8554social') { localStorage.setItem('wave_access','ok'); onSuccess(); } else setE('Неверный пароль'); }}>
            <input type="password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-3 input-field rounded-xl text-white text-center mb-3" autoFocus placeholder="Пароль" />
            {e && <div className="text-red-400 text-sm mb-3">{e}</div>}
            <button type="submit" className="w-full gradient-btn text-white py-3 rounded-xl font-semibold">Войти</button>
          </form>
        </div>
      </div>
    );
  }

  function Auth({ onLogin }) { 
    const [login, setLogin] = React.useState(true); 
    const [user, setUser] = React.useState(''); 
    const [pass, setPass] = React.useState(''); 
    const [name, setName] = React.useState(''); 
    const [err, setErr] = React.useState(''); 
    const [load, setLoad] = React.useState(false); 
    
    const localLogin = () => {
      const users = JSON.parse(localStorage.getItem('wave_local_users') || '[]');
      const found = users.find(u => u.username === user && u.password_hash === pass);
      if(found) onLogin(found);
      else if(users.length === 0 && user === 'admin' && pass === 'admin') {
        const newUser = { id: 1, username: 'admin', full_name: 'Admin', avatar: DEFAULT_AVATAR, bio: '', following: [], followers: [] };
        localStorage.setItem('wave_local_users', JSON.stringify([newUser]));
        onLogin(newUser);
      } else setErr('Неверный логин или пароль');
      setLoad(false);
    };
    
    const localRegister = () => {
      if(pass.length < 4) { setErr('Пароль минимум 4 символа'); setLoad(false); return; }
      const users = JSON.parse(localStorage.getItem('wave_local_users') || '[]');
      if(users.find(u => u.username === user)) { setErr('Имя занято'); setLoad(false); return; }
      const newUser = { id: Date.now(), username: user, full_name: name || user, password_hash: pass, avatar: DEFAULT_AVATAR, bio: '', following: [], followers: [] };
      users.push(newUser);
      localStorage.setItem('wave_local_users', JSON.stringify(users));
      onLogin(newUser);
      setLoad(false);
    };
    
    const submit = async (e) => { 
      e.preventDefault(); setErr(''); setLoad(true); 
      if(!dbReady) { if(login) localLogin(); else localRegister(); return; }
      if (login) { 
        const { data: u } = await supabase.from('users').select('*').eq('username', user).single(); 
        if (!u) { setErr('Неверный логин или пароль'); setLoad(false); return; } 
        if (pass === u.password_hash) onLogin(u); else setErr('Неверный логин или пароль'); 
      } else { 
        if (pass.length < 4) { setErr('Пароль минимум 4 символа'); setLoad(false); return; } 
        const { data: exist } = await supabase.from('users').select('username').eq('username', user).single(); 
        if (exist) { setErr('Имя пользователя занято'); setLoad(false); return; } 
        const { data: nu } = await supabase.from('users').insert({ username: user, full_name: name || user, password_hash: pass, avatar: DEFAULT_AVATAR, following: [], followers: [] }).select().single(); 
        if (nu) onLogin(nu); else setErr('Ошибка регистрации'); 
      } 
      setLoad(false); 
    }; 
    
    return (
      <div className="min-h-screen flex items-center justify-center p-4 gradient-bg">
        <div className="card p-8 max-w-md w-full">
          <div className="text-center"><i className="fas fa-water text-5xl text-blue-500 mb-3"></i><h1 className="text-2xl font-bold text-white">Wave Social</h1><p className="text-gray-500 text-sm mt-2">Общайся. Делись. Вдохновляй.</p></div>
          <form onSubmit={submit} className="space-y-4 mt-6">
            <input type="text" placeholder="📝 Логин" value={user} onChange={e=>setUser(e.target.value.toLowerCase())} className="w-full p-3 input-field rounded-xl text-white" required />
            <input type="password" placeholder="🔒 Пароль" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-3 input-field rounded-xl text-white" required />
            {!login && <input type="text" placeholder="👤 Имя" value={name} onChange={e=>setName(e.target.value)} className="w-full p-3 input-field rounded-xl text-white" />}
            {err && <div className="text-red-400 text-sm text-center">{err}</div>}
            <button type="submit" disabled={load} className="w-full gradient-btn text-white py-3 rounded-xl font-semibold">{load ? 'Загрузка...' : (login ? '🚀 Войти' : '📝 Регистрация')}</button>
          </form>
          <button onClick={()=>{setLogin(!login); setErr('');}} className="w-full mt-4 text-gray-400 text-sm hover:text-white transition">{login ? '✨ Нет аккаунта? Зарегистрируйтесь' : '🏠 Уже есть аккаунт? Войдите'}</button>
        </div>
      </div>
    );
  }

  function MainApp({ user, onLogout }) {
    const [tab, setTab] = React.useState('feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(null);
    const [messages, setMessages] = React.useState([]);
    const [chatList, setChatList] = React.useState([]);
    const [unread, setUnread] = React.useState({});
    const [notifs, setNotifs] = React.useState([]);
    const [viewProfile, setViewProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [newPost, setNewPost] = React.useState('');
    const [media, setMedia] = React.useState([]);
    const [uploading, setUploading] = React.useState(false);
    const [commentTexts, setCommentTexts] = React.useState({});
    const [msgText, setMsgText] = React.useState('');
    const [search, setSearch] = React.useState('');
    const [searchUsers, setSearchUsers] = React.useState([]);
    const [searchPosts, setSearchPosts] = React.useState([]);
    const [sType, setSType] = React.useState('users');
    const [avatarUp, setAvatarUp] = React.useState(false);
    const [editProfile, setEditProfile] = React.useState(false);
    const [editName, setEditName] = React.useState(user.full_name||'');
    const [editBio, setEditBio] = React.useState(user.bio||'');
    const [editPost, setEditPost] = React.useState(null);
    const [editPostContent, setEditPostContent] = React.useState('');
    const [sharePost, setSharePost] = React.useState(null);
    const [shareSel, setShareSel] = React.useState([]);
    const [delPostId, setDelPostId] = React.useState(null);
    const [fullscreen, setFullscreen] = React.useState(null);
    const [tempPoll, setTempPoll] = React.useState(null);
    const [showPollModal, setShowPollModal] = React.useState(false);
    const [showHideModal, setShowHideModal] = React.useState(false);
    const [hideSel, setHideSel] = React.useState([]);
    const [commentsPagePost, setCommentsPagePost] = React.useState(null);
    const [replyComm, setReplyComm] = React.useState(null);
    const [switchDialog, setSwitchDialog] = React.useState(false);
    const [switchUser, setSwitchUser] = React.useState('');
    const [switchPass, setSwitchPass] = React.useState('');
    const [switchErr, setSwitchErr] = React.useState('');
    const msgEndRef = React.useRef(null);
    const textareaRef = React.useRef(null);

    const loadAll = async () => {
      if(!dbReady) {
        const localPosts = JSON.parse(localStorage.getItem('wave_local_posts') || '[]');
        const localUsers = JSON.parse(localStorage.getItem('wave_local_users') || '[]');
        const localMessages = JSON.parse(localStorage.getItem('wave_local_messages') || '[]');
        const localNotifs = JSON.parse(localStorage.getItem('wave_local_notifs') || '[]');
        setPosts(localPosts);
        setUsers(localUsers);
        setNotifs(localNotifs.filter(n=>n.user_id===user.id));
        const chatSet = new Set();
        localMessages.forEach(m=>{ if(m.from_user!==user.id) chatSet.add(m.from_user); if(m.to_user!==user.id) chatSet.add(m.to_user); });
        setChatList(localUsers.filter(u=>chatSet.has(u.id)));
        if(chatUser) setMessages(localMessages.filter(m=>(m.from_user===user.id&&m.to_user===chatUser.id)||(m.from_user===chatUser.id&&m.to_user===user.id)));
        setLoading(false);
        return;
      }
      try {
        const [pRes, uRes, mRes, nRes] = await Promise.all([
          supabase.from('posts').select('*').order('created_at', { ascending: false }),
          supabase.from('users').select('*'),
          supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`),
          supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false })
        ]);
        setPosts(pRes.data||[]);
        setUsers(uRes.data||[]);
        setNotifs(nRes.data||[]);
        const msgs = mRes.data||[];
        const chatSet = new Set();
        msgs.forEach(m=>{ if(m.from_user!==user.id) chatSet.add(m.from_user); if(m.to_user!==user.id) chatSet.add(m.to_user); });
        setChatList(uRes.data?.filter(u=>chatSet.has(u.id))||[]);
        const cnt = {};
        msgs.forEach(m=>{ if(m.to_user===user.id && !m.read) cnt[m.from_user]=(cnt[m.from_user]||0)+1; });
        setUnread(cnt);
        if(chatUser){
          setMessages(msgs.filter(m=>(m.from_user===user.id&&m.to_user===chatUser.id)||(m.from_user===chatUser.id&&m.to_user===user.id)));
          await supabase.from('messages').update({read:true}).eq('to_user',user.id).eq('from_user',chatUser.id);
        }
      } catch(e) { console.error(e); showToast('Ошибка подключения к Supabase'); }
      setLoading(false);
    };

    React.useEffect(() => { loadAll(); }, []);
    React.useEffect(() => { if(chatUser) loadAll(); }, [chatUser]);

    React.useEffect(() => {
      if(!dbReady) return;
      const pSub = supabase.channel('posts').on('postgres_changes', {event:'*',schema:'public',table:'posts'}, () => loadAll()).subscribe();
      const mSub = supabase.channel('messages').on('postgres_changes', {event:'*',schema:'public',table:'messages'}, () => loadAll()).subscribe();
      return () => { pSub.unsubscribe(); mSub.unsubscribe(); };
    }, []);

    React.useEffect(() => {
      if(!dbReady || !chatUser) return;
      const sub = supabase.channel('chat').on('postgres_changes', {event:'INSERT',schema:'public',table:'messages',filter:`to_user=eq.${user.id},from_user=eq.${chatUser.id}`}, (p) => {
        setMessages(prev=>[...prev, p.new]);
        setTimeout(() => msgEndRef.current?.scrollIntoView({behavior:'smooth'}), 100);
      }).subscribe();
      return () => sub.unsubscribe();
    }, [chatUser, user.id]);

    React.useEffect(() => {
      if(!search.trim()){ setSearchUsers([]); setSearchPosts([]); return; }
      if(sType === 'users') setSearchUsers(users.filter(u=>u.id!==user.id && u.username.toLowerCase().includes(search.toLowerCase())));
      else setSearchPosts(posts.filter(p=>p.content?.toLowerCase().includes(search.toLowerCase())));
    }, [search, sType, users, posts]);

    const uploadMedia = async (files) => {
      if(!dbReady) { showToast('Локальный режим: загрузка файлов недоступна'); return []; }
      const uploaded = [];
      for(let f of files){
        const name = `${Date.now()}_${Math.random().toString(36).substring(7)}.${f.name.split('.').pop()}`;
        const {error} = await supabase.storage.from(STORAGE_BUCKET).upload(name, f);
        if(error) continue;
        const {data:url} = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name);
        uploaded.push({url:url.publicUrl, type:f.type.startsWith('image/')?'image':'video'});
      }
      return uploaded;
    };

    const createPost = async () => {
      if(!newPost.trim() && media.length===0 && !tempPoll){ showToast('Напишите текст или добавьте медиа/опрос'); return; }
      const newPostObj = { user_id:user.id, username:user.username, user_avatar:user.avatar, content:newPost, media, poll:tempPoll, likes:0, comments:[], created_at:new Date().toISOString() };
      if(!dbReady) {
        const allPosts = JSON.parse(localStorage.getItem('wave_local_posts')||'[]');
        newPostObj.id = Date.now();
        allPosts.unshift(newPostObj);
        localStorage.setItem('wave_local_posts', JSON.stringify(allPosts));
        setPosts([newPostObj, ...posts]);
      } else {
        const {data:ins} = await supabase.from('posts').insert(newPostObj).select().single();
        if(ins) setPosts([ins, ...posts]);
      }
      setNewPost(''); setMedia([]); setTempPoll(null); setHideSel([]);
      showToast('Пост опубликован!');
    };

    const likePost = async (pid, curr) => { 
      const newL = curr + 1; 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,likes:newL}:p)); 
      if(dbReady) await supabase.from('posts').update({likes:newL}).eq('id',pid); 
      else localStorage.setItem('wave_local_posts', JSON.stringify(posts.map(p=>p.id===pid?{...p,likes:newL}:p)));
    };
    
    const addComment = async (pid, text, replyTo=null) => {
      const post = posts.find(p=>p.id===pid);
      const newC = {id:Date.now(), user_id:user.id, username:user.username, user_avatar:user.avatar, text, reply_to_id:replyTo?.id||null, reply_to_username:replyTo?.username||null, created_at:new Date().toISOString()};
      const newCmnts = [...(post.comments||[]), newC];
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newCmnts}:p));
      if(dbReady) await supabase.from('posts').update({comments:newCmnts}).eq('id',pid);
      else localStorage.setItem('wave_local_posts', JSON.stringify(posts.map(p=>p.id===pid?{...p,comments:newCmnts}:p)));
    };
    
    const deleteComment = async (pid, cid) => { 
      const post=posts.find(p=>p.id===pid); 
      const newC=(post.comments||[]).filter(c=>c.id!==cid); 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newC}:p)); 
      if(dbReady) await supabase.from('posts').update({comments:newC}).eq('id',pid); 
      showToast('Комментарий удалён'); 
    };
    
    const delPost = async (pid) => { 
      setPosts(prev=>prev.filter(p=>p.id!==pid)); 
      if(dbReady) await supabase.from('posts').delete().eq('id',pid).eq('user_id',user.id); 
      setDelPostId(null); 
      showToast('Пост удалён'); 
    };
    
    const follow = async (id) => { 
      if(id===user.id){showToast('Нельзя подписаться на себя');return;} 
      let f=user.following||[]; 
      let is=f.includes(id); 
      let nf=is?f.filter(i=>i!==id):[...f,id]; 
      if(dbReady) await supabase.from('users').update({following:nf}).eq('id',user.id); 
      user.following=nf; 
      let t=users.find(u=>u.id===id); 
      if(t){let fl=t.followers||[]; let nfl=is?fl.filter(i=>i!==user.id):[...fl,user.id]; if(dbReady) await supabase.from('users').update({followers:nfl}).eq('id',id); t.followers=nfl;}
      await loadAll(); 
      showToast(is?'Отписались':'Подписались'); 
    };
    
    const sendMsg = async () => {
      if(!msgText.trim() || !chatUser) return;
      const newMsg = { from_user:user.id, to_user:chatUser.id, content:msgText, read:false, created_at:new Date().toISOString() };
      if(!dbReady) {
        newMsg.id = Date.now();
        const allMsgs = JSON.parse(localStorage.getItem('wave_local_messages')||'[]');
        allMsgs.push(newMsg);
        localStorage.setItem('wave_local_messages', JSON.stringify(allMsgs));
        setMessages([...messages, newMsg]);
      } else {
        const {data:ins} = await supabase.from('messages').insert(newMsg).select().single();
        if(ins) setMessages([...messages, ins]);
      }
      setMsgText('');
      setTimeout(() => msgEndRef.current?.scrollIntoView({behavior:'smooth'}), 100);
    };
    
    const upAvatar = (file) => { 
      if(!file) return; 
      setAvatarUp(true); 
      const reader = new FileReader();
      reader.onloadend = () => {
        user.avatar = reader.result;
        if(dbReady) supabase.from('users').update({avatar:reader.result}).eq('id',user.id);
        setAvatarUp(false);
        showToast('Аватар обновлён');
      };
      reader.readAsDataURL(file);
    };
    
    const saveProfile = () => { 
      user.full_name = editName; 
      user.bio = editBio; 
      if(dbReady) supabase.from('users').update({full_name:editName, bio:editBio}).eq('id',user.id);
      setEditProfile(false); 
      showToast('Профиль обновлён'); 
    };
    
    const handlePollVote = async (pid, newPoll) => { 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,poll:newPoll}:p)); 
      if(dbReady) await supabase.from('posts').update({poll:newPoll}).eq('id',pid); 
    };

    const renderText = (text) => {
      if(!text) return null;
      const parts = text.split(/(@\w+|#[\wа-яё]+)/gi);
      return parts.map((p,i) => {
        if(p.startsWith('@')){ const un=p.slice(1); return <span key={i} className="mention" onClick={()=>{const u=users.find(x=>x.username===un); if(u) setViewProfile(u);}}>{p}</span>; }
        if(p.startsWith('#')) return <span key={i} className="hashtag" onClick={()=>{setSearch(p); setSType('posts'); setTab('search');}}>{p}</span>;
        return <span key={i}>{p}</span>;
      });
    };

    const PostMenu = ({onEdit,onDel,onShare}) => {
      const [open,setOpen]=React.useState(false);
      const ref=React.useRef(null);
      React.useEffect(()=>{const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener('click',fn); return()=>document.removeEventListener('click',fn);},[]);
      return (<div className="relative" ref={ref}><button onClick={()=>setOpen(!open)} className="text-gray-400 hover:text-white p-2"><i className="fas fa-ellipsis-h text-lg"></i></button>{open&&(<div className="dropdown-menu">{onEdit&&<div onClick={()=>{onEdit();setOpen(false);}} className="dropdown-item"><i className="fas fa-pen"></i> Редактировать</div>}{onShare&&<div onClick={()=>{onShare();setOpen(false);}} className="dropdown-item"><i className="fas fa-share-alt"></i> Поделиться</div>}{onDel&&<div onClick={()=>{onDel();setOpen(false);}} className="dropdown-item"><i className="fas fa-trash-alt"></i> Удалить</div>}</div>)}</div>);
    };

    if(loading) return <div className="min-h-screen flex items-center justify-center text-white text-lg gradient-bg"><i className="fas fa-spinner fa-spin mr-3 text-blue-500"></i> Загрузка...</div>;
    
    if(commentsPagePost) return <CommentsPage post={commentsPagePost} currentUser={user} onClose={()=>setCommentsPagePost(null)} onAddComment={addComment} onDeleteComment={deleteComment} />;
    
    if(viewProfile){
      const prof=viewProfile;
      const profPosts=posts.filter(p=>p.user_id===prof.id);
      return (<div className="min-h-screen p-4 gradient-bg"><button onClick={()=>setViewProfile(null)} className="text-gray-400 mb-4 hover:text-white transition"><i className="fas fa-arrow-left"></i> Назад</button><div className="card p-6 text-center mb-6"><img src={prof.avatar||DEFAULT_AVATAR} className="w-24 h-24 rounded-full mx-auto border-2 border-blue-500" /><h2 className="text-xl font-bold text-white mt-3">{prof.full_name||prof.username}</h2><p className="text-gray-400">@{prof.username}</p><p className="text-gray-500 text-sm mt-2">{prof.bio||'✨ Пользователь Wave Social'}</p><div className="flex gap-2 justify-center mt-4"><button onClick={()=>{setChatUser(prof); setViewProfile(null); setTab('chat');}} className="bg-green-600 text-white px-4 py-1.5 rounded-full text-sm hover:bg-green-700"><i className="fas fa-comment mr-1"></i> Чат</button><button onClick={()=>follow(prof.id)} className={`px-4 py-1.5 rounded-full text-sm transition ${(user.following||[]).includes(prof.id)?'bg-gray-600':'bg-blue-600'}`}>{(user.following||[]).includes(prof.id)?'Отписаться':'Подписаться'}</button></div><div className="flex gap-5 justify-center mt-4 text-sm"><div><span className="font-bold text-white text-lg">{prof.followers?.length||0}</span><span className="text-gray-500 ml-1">подписчиков</span></div><div><span className="font-bold text-white text-lg">{prof.following?.length||0}</span><span className="text-gray-500 ml-1">подписок</span></div><div><span className="font-bold text-white text-lg">{profPosts.length}</span><span className="text-gray-500 ml-1">постов</span></div></div></div>{profPosts.map(p=><div key={p.id} className="card p-4 mb-3"><p className="text-white text-sm">{renderText(p.content)}</p><div className="flex gap-4 mt-2 text-gray-500 text-xs"><span><i className="fas fa-heart text-red-500"></i> {formatLikes(p.likes||0)}</span><span><i className="far fa-comment"></i> {(p.comments||[]).length}</span></div></div>)}</div>);
    }

    return (
      <div className="min-h-screen pb-20 gradient-bg">
        {fullscreen && <div className="fullscreen-media" onClick={()=>setFullscreen(null)}>{fullscreen.type==='video'?<video src={fullscreen.url} controls autoPlay />:<img src={fullscreen.url} />}</div>}
        {delPostId && <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50" onClick={()=>setDelPostId(null)}><div className="card p-6 max-w-sm w-full text-center"><p className="text-white mb-4 text-lg">🗑 Удалить этот пост?</p><div className="flex gap-3"><button onClick={()=>delPost(delPostId)} className="flex-1 bg-red-600 py-2 rounded-xl hover:bg-red-700">Да</button><button onClick={()=>setDelPostId(null)} className="flex-1 bg-gray-700 py-2 rounded-xl hover:bg-gray-600">Нет</button></div></div></div>}
        {editPost && <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50" onClick={()=>setEditPost(null)}><div className="card p-6 max-w-sm w-full"><textarea value={editPostContent} onChange={e=>setEditPostContent(e.target.value)} rows="3" className="w-full p-3 input-field rounded-xl text-white mb-3" /><div className="flex gap-3"><button onClick={async()=>{setPosts(prev=>prev.map(p=>p.id===editPost.id?{...p,content:editPostContent,edited:true}:p)); if(dbReady) await supabase.from('posts').update({content:editPostContent,edited:true}).eq('id',editPost.id); setEditPost(null); showToast('Пост обновлён');}} className="flex-1 gradient-btn py-2 rounded-xl text-white">Сохранить</button><button onClick={()=>setEditPost(null)} className="flex-1 bg-gray-700 py-2 rounded-xl hover:bg-gray-600">Отмена</button></div></div></div>}
        {sharePost && <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50" onClick={()=>{setSharePost(null); setShareSel([]);}}><div className="card p-6 max-w-sm w-full"><p className="text-white mb-3">🔗 Поделиться</p><div className="max-h-48 overflow-auto space-y-2">{users.filter(u=>u.id!==user.id).map(u=><div key={u.id} className="flex items-center gap-3 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded-xl" onClick={()=>setShareSel(prev=>prev.includes(u.id)?prev.filter(id=>id!==u.id):[...prev,u.id])}><input type="checkbox" checked={shareSel.includes(u.id)} onChange={()=>{}} className="w-4 h-4 accent-blue-500" /><img src={u.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><span className="text-white">@{u.username}</span></div>)}</div><div className="flex gap-3 mt-4"><button onClick={async()=>{for(let tid of shareSel){const tu=users.find(u=>u.id===tid); if(tu){const msg={from_user:user.id,to_user:tid,content:`📌 Поделился постом @${sharePost.username}: "${sharePost.content?.substring(0,100)}"`,read:false,created_at:new Date()}; if(dbReady) await supabase.from('messages').insert(msg); else{msg.id=Date.now(); const all=JSON.parse(localStorage.getItem('wave_local_messages')||'[]'); all.push(msg); localStorage.setItem('wave_local_messages',JSON.stringify(all));}}}showToast(`Поделились с ${shareSel.length} пользователями`); setSharePost(null); setShareSel([]);}} className="flex-1 gradient-btn py-2 rounded-xl text-white">Отправить</button><button onClick={()=>{setSharePost(null); setShareSel([]);}} className="flex-1 bg-gray-700 py-2 rounded-xl hover:bg-gray-600">Отмена</button></div></div></div>}
        {switchDialog && <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50" onClick={()=>{setSwitchDialog(false); setSwitchErr(''); setSwitchUser(''); setSwitchPass('');}}><div className="card p-6 max-w-sm w-full"><p className="text-white mb-4 text-center text-lg">🔄 Сменить аккаунт</p><input type="text" placeholder="Логин" value={switchUser} onChange={e=>setSwitchUser(e.target.value)} className="w-full p-3 input-field rounded-xl text-white mb-3" /><input type="password" placeholder="Пароль" value={switchPass} onChange={e=>setSwitchPass(e.target.value)} className="w-full p-3 input-field rounded-xl text-white mb-3" />{switchErr&&<div className="text-red-400 text-sm mb-3 text-center">{switchErr}</div>}<div className="flex gap-3"><button onClick={async()=>{if(!dbReady){if(switchUser==='admin'&&switchPass==='admin'){localStorage.setItem('wave_user',JSON.stringify({id:1,username:'admin',full_name:'Admin',avatar:DEFAULT_AVATAR})); window.location.reload();}else setSwitchErr('Неверно');return;}const{data:acc}=await supabase.from('users').select('*').eq('username',switchUser).single(); if(!acc||acc.password_hash!==switchPass){setSwitchErr('Неверный логин или пароль');return;} localStorage.setItem('wave_user',JSON.stringify(acc)); window.location.reload();}} className="flex-1 gradient-btn py-2 rounded-xl text-white">Войти</button><button onClick={()=>{setSwitchDialog(false); setSwitchErr(''); setSwitchUser(''); setSwitchPass('');}} className="flex-1 bg-gray-700 py-2 rounded-xl hover:bg-gray-600">Отмена</button></div></div></div>}
        {showPollModal && <PollCreatorModal onClose={()=>setShowPollModal(false)} onSave={(poll)=>{setTempPoll(poll); showToast('Опрос добавлен');}} />}
        {showHideModal && <HideSettingsModal users={users} currentUserId={user.id} selectedUsers={hideSel} onToggleUser={(id)=>setHideSel(prev=>prev.includes(id)?prev.filter(i=>i!==id):[...prev,id])} onApply={()=>{setShowHideModal(false); showToast(`Скрыто от ${hideSel.length} пользователей`);}} onClose={()=>setShowHideModal(false)} />}

        <header className="sticky top-0 z-20 border-b border-gray-800 bg-[#0a0a0a]/90 backdrop-blur-xl p-3">
          <div className="max-w-2xl mx-auto flex justify-between items-center">
            <div className="flex items-center gap-2"><i className="fas fa-water text-2xl text-blue-500"></i><span className="text-white font-bold text-xl gradient-text">Wave</span></div>
            <div className="flex gap-1"><button onClick={()=>{setTab('feed'); setViewProfile(null);}} className={`tab-icon ${tab==='feed'?'active-tab':'text-gray-400 hover:text-white'}`}><i className="fas fa-home text-xl"></i></button><button onClick={()=>{setTab('search'); setViewProfile(null);}} className={`tab-icon ${tab==='search'?'active-tab':'text-gray-400 hover:text-white'}`}><i className="fas fa-search text-xl"></i></button><button onClick={()=>{setTab('chat'); setViewProfile(null);}} className={`tab-icon relative ${tab==='chat'?'active-tab':'text-gray-400 hover:text-white'}`}><i className="fas fa-comments text-xl"></i>{Object.values(unread).reduce((a,b)=>a+b,0)>0&&<span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{Object.values(unread).reduce((a,b)=>a+b,0)}</span>}</button><button onClick={()=>{setTab('notify'); setViewProfile(null);}} className={`tab-icon relative ${tab==='notify'?'active-tab':'text-gray-400 hover:text-white'}`}><i className="fas fa-bell text-xl"></i>{notifs.filter(n=>!n.read).length>0&&<span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{notifs.filter(n=>!n.read).length}</span>}</button><button onClick={()=>{setTab('profile'); setViewProfile(null);}} className={`tab-icon ${tab==='profile'?'active-tab':'text-gray-400 hover:text-white'}`}><i className="fas fa-user text-xl"></i></button><button onClick={onLogout} className="ml-2 text-sm bg-gray-800 px-3 py-1.5 rounded-full hover:bg-gray-700 transition"><i className="fas fa-sign-out-alt mr-1"></i> Выйти</button></div>
          </div>
        </header>

        <main className="max-w-2xl mx-auto p-4">
          {tab==='feed' && (<>
            <div className="card p-4 mb-4"><div className="flex gap-3"><img src={user.avatar||DEFAULT_AVATAR} className="w-10 h-10 rounded-full" /><div className="flex-1"><textarea ref={textareaRef} rows="2" placeholder="Что нового? @ или #" className="w-full p-3 input-field rounded-xl text-white text-sm resize-none" value={newPost} onChange={e=>setNewPost(e.target.value)} /><div className="flex flex-wrap gap-1 mt-2">{media.map((m,i)=><div key={i} className="media-preview" onClick={()=>setFullscreen({url:m.url,type:m.type})}>{m.type==='video'?<video src={m.url} />:<img src={m.url} />}<button className="remove-media" onClick={(e)=>{e.stopPropagation(); setMedia(media.filter((_,idx)=>idx!==i));}}>×</button></div>)}</div>{tempPoll && <div className="mt-2 p-2 bg-[#252525] rounded-xl flex justify-between"><span className="text-white text-xs"><i className="fas fa-chart-simple mr-1 text-blue-400"></i> Опрос: {tempPoll.question}</span><button onClick={()=>setTempPoll(null)} className="text-red-400 text-xs">✖ Удалить</button></div>}<div className="flex gap-2 mt-3 flex-wrap"><label className={`white-icon-btn text-sm ${uploading?'opacity-50':''}`}><i className="fas fa-paperclip"></i> Файлы<input type="file" accept="image/*,video/*" multiple onChange={async(e)=>{const files=Array.from(e.target.files); if(media.length+files.length>5){showToast('Максимум 5');return;} setUploading(true); const up=await uploadMedia(files); setMedia([...media,...up]); setUploading(false); e.target.value='';}} className="hidden" disabled={uploading} /></label><button onClick={()=>setShowPollModal(true)} className="white-icon-btn text-sm"><i className="fas fa-chart-simple"></i> Опрос</button><button onClick={()=>setShowHideModal(true)} className="white-icon-btn text-sm"><i className="fas fa-eye-slash"></i> Скрыть</button><button onClick={createPost} className="white-glow-btn px-5 py-1.5 rounded-full text-sm"><i className="fas fa-paper-plane mr-1"></i> Опубликовать</button></div></div></div></div>
            {posts.map(p=>{const comments=p.comments||[]; const firstThree=comments.filter(c=>!c.reply_to_id).slice(0,3); const hasMore=comments.length>3; return (<div key={p.id} className="card p-4 mb-3"><div className="flex justify-between items-start"><div className="flex gap-3 cursor-pointer" onClick={()=>p.user_id!==user.id&&setViewProfile(users.find(u=>u.id===p.user_id))}><img src={p.user_avatar||DEFAULT_AVATAR} className="w-9 h-9 rounded-full" /><div><div className="font-bold text-white">@{p.username}</div><div className="text-xs text-gray-500">{formatDate(p.created_at)}{p.edited&&<span className="ml-1 text-gray-600">(ред)</span>}</div></div></div><PostMenu onEdit={p.user_id===user.id?()=>{setEditPost(p); setEditPostContent(p.content);}:null} onDel={p.user_id===user.id?()=>setDelPostId(p.id):null} onShare={()=>{setSharePost(p); setShareSel([]);}} /></div><ReadMore text={p.content} maxLength={200} />{p.media?.length>0&&p.media.map((m,i)=><div key={i}>{m.type==='video'?<video src={m.url} className="post-media-large" onClick={()=>setFullscreen({url:m.url,type:'video'})} />:<img src={m.url} className="post-media-large" onClick={()=>setFullscreen({url:m.url,type:'image'})} /></div>)}<div className="flex gap-4 mt-3 text-gray-400 text-sm"><button onClick={()=>likePost(p.id,p.likes||0)} className="flex gap-2 hover:text-red-400 transition"><i className="fas fa-heart"></i> {formatLikes(p.likes||0)}</button><button onClick={()=>{const d=document.getElementById(`c-${p.id}`); if(d)d.classList.toggle('hidden');}} className="flex gap-2 hover:text-blue-400 transition"><i className="far fa-comment"></i> {(p.comments||[]).length}</button></div><div id={`c-${p.id}`} className="hidden mt-3 pt-3 border-t border-gray-800">{firstThree.map(c=><div key={c.id} className="mb-2 fade-comment"><div className="flex gap-3 p-2 hover:bg-[#2a2a2a] rounded-xl cursor-pointer transition" onClick={()=>setCommentsPagePost(p)}><img src={c.user_avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full mt-0.5" /><div className="flex-1"><div className="flex items-center gap-2 flex-wrap"><span className="font-bold text-white text-sm">@{c.username}</span><span className="text-gray-500 text-xs">{formatDate(c.created_at)}</span></div>{c.reply_to_username&&<div className="reply-quote mt-1">→ @{c.reply_to_username}</div>}<p className="text-gray-300 text-sm mt-1">{c.text.length>100?c.text.slice(0,100)+'...':c.text}</p></div></div></div>)}</div>{hasMore&&<button onClick={()=>setCommentsPagePost(p)} className="text-blue-400 text-sm mt-1 hover:underline"><i className="fas fa-comment-dots mr-1"></i> Показать еще ({comments.length-3})</button>}<div className="flex gap-2 mt-3"><input type="text" placeholder="Написать комментарий..." className="flex-1 p-2.5 input-field rounded-xl text-sm text-white" value={commentTexts[p.id]||''} onChange={e=>setCommentTexts({...commentTexts,[p.id]:e.target.value})} /><button onClick={()=>addComment(p.id, commentTexts[p.id])} className="gradient-btn text-white px-5 rounded-xl text-sm"><i className="fas fa-paper-plane"></i></button></div></div></div>);})}</>)}

          {tab==='search' && (<div><div className="card p-4 mb-4"><div className="flex gap-3 mb-3"><button onClick={()=>setSType('users')} className={`text-sm px-4 py-2 rounded-full transition ${sType==='users'?'gradient-btn text-white':'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}><i className="fas fa-users mr-1"></i> Пользователи</button><button onClick={()=>setSType('posts')} className={`text-sm px-4 py-2 rounded-full transition ${sType==='posts'?'gradient-btn text-white':'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}><i className="fas fa-newspaper mr-1"></i> Посты</button></div><input type="text" placeholder="🔍 Поиск..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full p-3 input-field rounded-xl text-white text-sm" autoFocus /></div>{sType==='users'&&searchUsers.map(u=><div key={u.id} className="card p-3 mb-2 flex justify-between items-center"><div className="flex gap-3 cursor-pointer" onClick={()=>setViewProfile(u)}><img src={u.avatar||DEFAULT_AVATAR} className="w-10 h-10 rounded-full" /><div><div className="font-bold text-white">{u.full_name||u.username}</div><div className="text-gray-400 text-xs">@{u.username}</div></div></div><button onClick={()=>{setChatUser(u); setTab('chat');}} className="bg-green-600 text-white px-3 py-1.5 rounded-full text-xs hover:bg-green-700"><i className="fas fa-comment mr-1"></i> Чат</button></div>)}</div>)}

          {tab==='chat' && (<div className="flex flex-col h-[80vh]">
            <div className="chat-list">
              <h3 className="text-white font-bold text-lg mb-3"><i className="fas fa-users mr-2 text-blue-400"></i> Контакты</h3>
              {chatList.map(cu=>(
                <div key={cu.id} className={`chat-item ${chatUser?.id===cu.id?'active':''}`} onClick={()=>setChatUser(cu)}>
                  <img src={cu.avatar||DEFAULT_AVATAR} className="w-12 h-12 rounded-full" />
                  <div className="flex-1"><div className="font-bold text-white text-base">@{cu.username}</div><div className="text-gray-400 text-xs">{cu.full_name||cu.username}</div></div>
                  {unread[cu.id]>0 && <div className="bg-red-500 text-white text-xs rounded-full w-6 h-6 flex items-center justify-center font-bold">{unread[cu.id]}</div>}
                </div>
              ))}
              {chatList.length===0 && <div className="text-center text-gray-500 py-12"><i className="fas fa-comment-slash text-3xl mb-3 opacity-50"></i><p>Нет чатов. Начните общение!</p></div>}
            </div>
            {chatUser && (<div className="fixed inset-x-0 bottom-0 top-0 z-50 bg-[#0a0a0a] flex flex-col" style={{marginTop:'60px'}}><div className="sticky top-0 bg-gradient-to-r from-[#1a1a1a] to-[#141414] p-4 flex items-center gap-3 border-b border-gray-800"><button onClick={()=>setChatUser(null)} className="text-white text-xl hover:text-blue-400"><i className="fas fa-arrow-left"></i></button><img src={chatUser.avatar||DEFAULT_AVATAR} className="w-10 h-10 rounded-full" /><div><div className="font-bold text-white">@{chatUser.username}</div><div className="text-gray-400 text-xs">{chatUser.full_name||chatUser.username}</div></div></div><div className="flex-1 overflow-y-auto p-4 chat-messages" ref={msgEndRef}>{messages.map(msg=><div key={msg.id} className={`message ${msg.from_user===user.id?'message-mine':'message-theirs'}`}><p className="break-words">{msg.content}</p><div className="text-[10px] opacity-70 mt-1 text-right">{new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div></div>)}</div><div className="p-4 border-t border-gray-800 bg-gradient-to-r from-[#1a1a1a] to-[#141414]"><div className="flex gap-3"><input type="text" placeholder="Сообщение..." value={msgText} onChange={e=>setMsgText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&sendMsg()} className="flex-1 p-3 input-field rounded-xl text-white text-sm" /><button onClick={sendMsg} className="gradient-btn text-white px-6 rounded-xl"><i className="fas fa-paper-plane"></i></button></div></div></div>)}
          </div>)}

          {tab==='notify' && (<div><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-white"><i className="fas fa-bell mr-2 text-blue-400"></i> Уведомления</h2><button onClick={async()=>{const unreadIds=notifs.filter(n=>!n.read).map(n=>n.id); if(unreadIds.length===0)return; if(dbReady) await supabase.from('notifications').update({read:true}).in('id',unreadIds); setNotifs(prev=>prev.map(n=>({...n,read:true}))); showToast('Все прочитаны');}} className="text-xs bg-gray-700 px-3 py-1.5 rounded-full hover:bg-gray-600 transition"><i className="fas fa-check-double mr-1"></i> Прочитать все</button></div>{notifs.length===0&&<div className="card p-8 text-center text-gray-500"><i className="fas fa-bell-slash text-4xl mb-3 opacity-50"></i><p>Нет уведомлений</p></div>}{notifs.map(n=><div key={n.id} className={`card p-3 mb-2 cursor-pointer transition ${!n.read?'border-l-4 border-green-500 bg-gradient-to-r from-[#1e2a1e] to-[#1a1a1a]':'hover:bg-[#1a1a1a]'}`} onClick={async()=>{if(dbReady) await supabase.from('notifications').update({read:true}).eq('id',n.id); setNotifs(prev=>prev.map(not=>not.id===n.id?{...not,read:true}:not)); if(n.type==='message'){const from=users.find(u=>u.id===n.from_user_id); if(from){setChatUser(from); setTab('chat');}} else setTab('feed');}}><p className="text-white text-sm"><i className={`fas ${n.type==='message'?'fa-envelope':n.type==='mention'?'fa-at':'fa-comment'} mr-2 ${!n.read?'text-green-400':'text-gray-500'}`}></i> {n.text}</p><p className="text-gray-500 text-xs mt-1">{formatDate(n.created_at)}</p></div>)}</div>)}

          {tab==='profile' && (<div className="card p-6 text-center"><div className="flex justify-end"><button onClick={()=>setSwitchDialog(true)} className="text-gray-400 hover:text-white p-2 transition"><i className="fas fa-exchange-alt text-lg"></i></button></div><div className="avatar-upload w-24 h-24 mx-auto relative cursor-pointer group"><img src={user.avatar||DEFAULT_AVATAR} className="w-24 h-24 rounded-full object-cover border-2 border-blue-500" /><input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer rounded-full" onChange={(e)=>upAvatar(e.target.files[0])} disabled={avatarUp} />{avatarUp && <div className="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center"><i className="fas fa-spinner fa-spin text-white text-xl"></i></div>}</div>{editProfile?(<div className="mt-4"><input type="text" value={editName} onChange={e=>setEditName(e.target.value)} className="w-full p-3 input-field rounded-xl text-white text-sm mb-2" placeholder="Имя" /><textarea value={editBio} onChange={e=>setEditBio(e.target.value)} className="w-full p-3 input-field rounded-xl text-white text-sm" rows="3" placeholder="О себе"></textarea><div className="flex gap-3 mt-3"><button onClick={saveProfile} className="flex-1 bg-green-600 text-white py-2 rounded-xl text-sm hover:bg-green-700"><i className="fas fa-save mr-1"></i> Сохранить</button><button onClick={()=>setEditProfile(false)} className="flex-1 bg-gray-700 text-white py-2 rounded-xl text-sm hover:bg-gray-600">Отмена</button></div></div>):(<><h2 className="text-xl font-bold text-white mt-3">{user.full_name||user.username}</h2><p className="text-gray-400 text-sm">@{user.username}</p><p className="text-gray-500 text-sm mt-2">{user.bio||'✨ Добро пожаловать в Wave Social!'}</p><div className="flex gap-5 justify-center mt-4 text-sm"><div><span className="font-bold text-white text-lg">{posts.filter(p=>p.user_id===user.id).length}</span><span className="text-gray-500 ml-1">постов</span></div><div><span className="font-bold text-white text-lg">{user.followers?.length||0}</span><span className="text-gray-500 ml-1">подписчиков</span></div><div><span className="font-bold text-white text-lg">{user.following?.length||0}</span><span className="text-gray-500 ml-1">подписок</span></div></div><div className="flex gap-3 justify-center mt-5"><button onClick={()=>setEditProfile(true)} className="bg-gray-700 text-white px-5 py-2 rounded-full text-sm hover:bg-gray-600 transition"><i className="fas fa-user-edit mr-1"></i> Редактировать</button><button onClick={onLogout} className="bg-red-600 text-white px-5 py-2 rounded-full text-sm hover:bg-red-700 transition"><i className="fas fa-sign-out-alt mr-1"></i> Выйти</button></div></>)}</div>)}
        </main>
      </div>
    );
  }

  function App() { 
    const [a,setA]=React.useState(false); 
    const [u,setU]=React.useState(null); 
    const [l,setL]=React.useState(true); 
    React.useEffect(()=>{ 
      if(localStorage.getItem('wave_access')==='ok') setA(true); 
      const s=localStorage.getItem('wave_user'); 
      if(s) setU(JSON.parse(s)); 
      setL(false); 
    },[]); 
    const log=(u)=>{ localStorage.setItem('wave_user',JSON.stringify(u)); setU(u); }; 
    const out=()=>{ localStorage.removeItem('wave_user'); setU(null); localStorage.removeItem('wave_access'); window.location.reload(); }; 
    if(l) return <div className="flex items-center justify-center min-h-screen text-white gradient-bg"><i className="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div>; 
    if(!a) return <PasswordGate onSuccess={()=>setA(true)} />; 
    if(u) return <MainApp user={u} onLogout={out} />; 
    return <Auth onLogin={log} />; 
  }
  
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
