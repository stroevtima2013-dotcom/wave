<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Wave Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0f0f0f; margin: 0; padding: 0; }
    .card { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 24px; transition: 0.2s; }
    .card:hover { transform: translateY(-2px); border-color: #3b82f6; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e1e1e; border: 1px solid #333; color: white; padding: 8px 18px; border-radius: 40px; z-index: 1000; font-size: 14px; z-index: 9999; }
    .media-preview { position: relative; display: inline-block; margin: 4px; border-radius: 14px; overflow: hidden; border: 1px solid #3a3a3a; width: 80px; height: 80px; cursor: pointer; }
    .media-preview img, .media-preview video { width: 100%; height: 100%; object-fit: cover; }
    .remove-media { position: absolute; top: -8px; right: -8px; background: #ef4444; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; color: white; z-index: 10; }
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 16px; min-width: 160px; z-index: 50; overflow: hidden; }
    .dropdown-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: #e0e0e0; cursor: pointer; }
    .dropdown-item:hover { background: #2a2a2a; }
    .reply-quote { background: #1a1a1a; padding: 6px 10px; border-radius: 12px; border-left: 3px solid #3b82f6; font-size: 11px; color: #aaa; margin-bottom: 6px; }
    .mention { color: #3b82f6; font-weight: 500; cursor: pointer; }
    .hashtag { color: #eab308; font-weight: 500; cursor: pointer; }
    .white-glow-btn { background: white; color: #111; box-shadow: 0 0 8px rgba(255,255,255,0.3); transition: 0.2s; font-weight: 500; cursor: pointer; border: none; }
    .white-glow-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255,255,255,0.5); }
    .white-icon-btn { background: white; color: #111; border-radius: 12px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; border: none; }
    .white-icon-btn:hover { transform: scale(1.02); background: #f5f5f5; }
    .fullscreen-media { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .fullscreen-media img, .fullscreen-media video { max-width: 95vw; max-height: 95vh; border-radius: 28px; }
    .fullscreen-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .fullscreen-modal-content { background: #1a1a1a; border-radius: 32px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 24px; }
    .chat-user-list { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
    .chat-user-item { background: #1a1a1a; border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.2s; border: 1px solid #2c2c2c; display: flex; align-items: center; gap: 12px; }
    .chat-user-item:hover { background: #252525; border-color: #3b82f6; }
    .chat-messages { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; padding: 12px; }
    .message-bubble { max-width: 80%; padding: 10px 14px; border-radius: 20px; word-break: break-word; }
    .message-mine { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message-theirs { background: #2a2a2a; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
    .post-media-large { width: 100%; border-radius: 16px; margin-top: 12px; cursor: pointer; max-height: 400px; object-fit: cover; }
    .read-more-container { position: relative; }
    .read-more-content.collapsed { max-height: 150px; overflow: hidden; }
    .read-more-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(to bottom, transparent, #1a1a1a); pointer-events: none; }
    .read-more-btn { background: #3b82f6; color: white; border: none; padding: 6px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 8px; }
    .fade-comment { opacity: 0.6; transition: 0.2s; }
    .fade-comment:hover { opacity: 1; }
    .active-tab { color: white !important; }
    .poll-option { background: #2a2a2a; border-radius: 12px; margin: 8px 0; overflow: hidden; cursor: pointer; }
    .poll-option:hover { background: #333; }
    .poll-bar { background: #3b82f6; height: 100%; transition: width 0.3s ease; }
  </style>
</head>
<body>
<div id="root"><div class="flex items-center justify-center min-h-screen text-white text-xl"><i class="fas fa-water fa-spin mr-2 text-blue-500"></i> Wave Social</div></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  // ========== НАСТРОЙКА SUPABASE ==========
  // ⚠️ ВАЖНО: Замените на ваши данные из Supabase!
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const STORAGE_BUCKET = "wave-media";
  const DEFAULT_AVATAR = "https://ui-avatars.com/api/?background=2a2a2a&color=fff&rounded=true&size=96&bold=true&length=1&name=?";
  
  let supabase;
  let dbReady = false;
  
  // Пытаемся подключиться к Supabase
  try {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    dbReady = true;
  } catch(e) {
    console.warn('Supabase не настроен, используем локальное хранилище');
    dbReady = false;
  }

  function showToast(msg) { 
    const t = document.createElement('div'); 
    t.className = 'toast'; 
    t.innerHTML = msg; 
    document.body.appendChild(t); 
    setTimeout(() => t.remove(), 2500); 
  }
  
  function formatDate(iso) { 
    if(!iso) return 'только что';
    const d = new Date(iso), n = new Date(), diff = Math.floor((n - d) / 1000); 
    if (diff < 60) return 'только что'; 
    if (diff < 3600) return `${Math.floor(diff/60)} мин назад`; 
    if (diff < 86400) return `сегодня в ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`; 
    if (diff < 172800) return 'вчера'; 
    if (diff < 604800) return `${Math.floor(diff/86400)} дн назад`; 
    return `${Math.floor(diff/604800)} нед назад`; 
  }
  
  function formatLikes(n) { 
    if (n >= 1000) return (n/1000).toFixed(1) + 'к'; 
    return n; 
  }

  // Компонент "Читать далее"
  function ReadMore({ text, maxLength = 200 }) {
    const [expanded, setExpanded] = React.useState(false);
    const needTruncate = text && text.length > maxLength;
    const displayText = expanded ? text : (needTruncate ? text.slice(0, maxLength) + '...' : text);
    
    if (!needTruncate) return <p className="text-white text-sm whitespace-pre-wrap">{text}</p>;
    
    return (
      <div className="read-more-container relative">
        <div className={`read-more-content ${!expanded ? 'collapsed' : ''}`}>
          <p className="text-white text-sm whitespace-pre-wrap">{displayText}</p>
        </div>
        {!expanded && <div className="read-more-overlay"></div>}
        <button onClick={() => setExpanded(!expanded)} className="read-more-btn">
          {expanded ? 'Свернуть ↑' : 'Читать далее ↓'}
        </button>
      </div>
    );
  }

  // ========== КОМПОНЕНТ ВХОДА ПО ПАРОЛЮ ==========
  function PasswordGate({ onSuccess }) { 
    const [p, setP] = React.useState(''); 
    const [e, setE] = React.useState(''); 
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full text-center">
          <i className="fas fa-lock text-4xl text-white mb-3"></i>
          <h1 className="text-xl font-bold text-white">Wave Social</h1>
          <p className="text-gray-400 mt-1 text-sm">Введите пароль для доступа</p>
          <form onSubmit={(e) => { e.preventDefault(); if (p === '8554social') { localStorage.setItem('wave_access','ok'); onSuccess(); } else setE('Неверный пароль'); }} className="mt-4">
            <input type="password" value={p} onChange={e => setP(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-center" autoFocus placeholder="Пароль" />
            {e && <div className="text-red-400 text-sm mt-1">{e}</div>}
            <button type="submit" className="w-full mt-3 bg-blue-600 text-white py-2 rounded-xl font-semibold">Войти</button>
          </form>
        </div>
      </div>
    );
  }

  // ========== КОМПОНЕНТ РЕГИСТРАЦИИ/ВХОДА ==========
  function Auth({ onLogin }) { 
    const [login, setLogin] = React.useState(true); 
    const [user, setUser] = React.useState(''); 
    const [pass, setPass] = React.useState(''); 
    const [name, setName] = React.useState(''); 
    const [err, setErr] = React.useState(''); 
    const [load, setLoad] = React.useState(false); 
    
    // Функция для работы без БД (локально)
    const localLogin = () => {
      const users = JSON.parse(localStorage.getItem('wave_local_users') || '[]');
      const found = users.find(u => u.username === user && u.password_hash === pass);
      if(found) {
        onLogin(found);
      } else if(users.length === 0 && user === 'admin' && pass === 'admin') {
        const newUser = { id: 1, username: 'admin', full_name: 'Admin', avatar: DEFAULT_AVATAR, bio: '', following: [], followers: [] };
        localStorage.setItem('wave_local_users', JSON.stringify([newUser]));
        onLogin(newUser);
      } else {
        setErr('Неверный логин или пароль');
      }
      setLoad(false);
    };
    
    const localRegister = () => {
      if(pass.length < 4) { setErr('Пароль минимум 4 символа'); setLoad(false); return; }
      const users = JSON.parse(localStorage.getItem('wave_local_users') || '[]');
      if(users.find(u => u.username === user)) { setErr('Имя занято'); setLoad(false); return; }
      const newUser = { id: Date.now(), username: user, full_name: name || user, password_hash: pass, avatar: DEFAULT_AVATAR, bio: '', following: [], followers: [] };
      users.push(newUser);
      localStorage.setItem('wave_local_users', JSON.stringify(users));
      onLogin(newUser);
      setLoad(false);
    };
    
    const submit = (e) => { 
      e.preventDefault(); 
      setErr(''); 
      setLoad(true); 
      
      if(!dbReady) {
        if(login) localLogin();
        else localRegister();
        return;
      }
      
      // Реальная Supabase авторизация
      if (login) { 
        supabase.from('users').select('*').eq('username', user).single().then(({ data: u }) => { 
          if (!u) { setErr('Неверный логин или пароль'); setLoad(false); return; } 
          if (pass === u.password_hash) onLogin(u); 
          else setErr('Неверный логин или пароль'); 
          setLoad(false);
        }).catch(() => { setErr('Ошибка подключения'); setLoad(false); });
      } else { 
        if (pass.length < 4) { setErr('Пароль минимум 4 символа'); setLoad(false); return; } 
        supabase.from('users').select('username').eq('username', user).single().then(({ data: exist }) => { 
          if (exist) { setErr('Имя занято'); setLoad(false); return; } 
          supabase.from('users').insert({ username: user, full_name: name || user, password_hash: pass, avatar: DEFAULT_AVATAR }).select().single().then(({ data: nu }) => { 
            if (nu) onLogin(nu); 
            else setErr('Ошибка'); 
            setLoad(false);
          });
        }).catch(() => { setErr('Ошибка'); setLoad(false); });
      } 
    }; 
    
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full">
          <div className="text-center"><i className="fas fa-water text-3xl text-white"></i><h1 className="text-2xl font-bold mt-1 text-white">Wave Social</h1></div>
          <form onSubmit={submit} className="space-y-3 mt-4">
            <input type="text" placeholder="Логин" value={user} onChange={e => setUser(e.target.value.toLowerCase())} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            <input type="password" placeholder="Пароль" value={pass} onChange={e => setPass(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            {!login && <input type="text" placeholder="Имя" value={name} onChange={e => setName(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" />}
            {err && <div className="text-red-400 text-sm">{err}</div>}
            <button type="submit" disabled={load} className="w-full bg-blue-600 text-white py-2 rounded-xl font-semibold">{load ? 'Загрузка...' : (login ? 'Войти' : 'Регистрация')}</button>
          </form>
          <button onClick={() => { setLogin(!login); setErr(''); }} className="w-full mt-3 text-gray-400 text-sm">{login ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}</button>
        </div>
      </div>
    );
  }

  // ========== ГЛАВНОЕ ПРИЛОЖЕНИЕ ==========
  function MainApp({ user, onLogout }) {
    const [tab, setTab] = React.useState(() => localStorage.getItem('wave_tab') || 'feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(() => {
      const saved = localStorage.getItem('wave_chat_user');
      return saved ? JSON.parse(saved) : null;
    });
    const [messages, setMessages] = React.useState([]);
    const [chatList, setChatList] = React.useState([]);
    const [unread, setUnread] = React.useState({});
    const [notifs, setNotifs] = React.useState([]);
    const [viewProfile, setViewProfile] = React.useState(() => {
      const saved = localStorage.getItem('wave_view_profile');
      return saved ? JSON.parse(saved) : null;
    });
    const [loading, setLoading] = React.useState(true);
    const [newPost, setNewPost] = React.useState('');
    const [media, setMedia] = React.useState([]);
    const [uploading, setUploading] = React.useState(false);
    const [commentTexts, setCommentTexts] = React.useState({});
    const [msgText, setMsgText] = React.useState('');
    const [search, setSearch] = React.useState('');
    const [searchUsers, setSearchUsers] = React.useState([]);
    const [searchPosts, setSearchPosts] = React.useState([]);
    const [sType, setSType] = React.useState('users');
    const [avatarUp, setAvatarUp] = React.useState(false);
    const [editProfile, setEditProfile] = React.useState(false);
    const [editName, setEditName] = React.useState(user.full_name||'');
    const [editBio, setEditBio] = React.useState(user.bio||'');
    const [delPostId, setDelPostId] = React.useState(null);
    const [fullscreen, setFullscreen] = React.useState(null);
    const [tempPoll, setTempPoll] = React.useState(null);
    const [showPollModal, setShowPollModal] = React.useState(false);
    const [showHideModal, setShowHideModal] = React.useState(false);
    const [hideSel, setHideSel] = React.useState([]);
    const [commentsPagePost, setCommentsPagePost] = React.useState(null);
    const [switchDialog, setSwitchDialog] = React.useState(false);
    const [switchUser, setSwitchUser] = React.useState('');
    const [switchPass, setSwitchPass] = React.useState('');
    const [switchErr, setSwitchErr] = React.useState('');
    const msgEndRef = React.useRef(null);
    const textareaRef = React.useRef(null);

    // Сохранение состояния
    React.useEffect(() => {
      localStorage.setItem('wave_tab', tab);
      localStorage.setItem('wave_chat_user', JSON.stringify(chatUser));
      localStorage.setItem('wave_view_profile', JSON.stringify(viewProfile));
    }, [tab, chatUser, viewProfile]);

    // Загрузка данных (локально или из Supabase)
    const loadAll = async () => {
      setLoading(true);
      
      if(!dbReady) {
        // Локальный режим
        const localPosts = JSON.parse(localStorage.getItem('wave_local_posts') || '[]');
        const localUsers = JSON.parse(localStorage.getItem('wave_local_users') || '[]');
        const localMessages = JSON.parse(localStorage.getItem('wave_local_messages') || '[]');
        const localNotifs = JSON.parse(localStorage.getItem('wave_local_notifs') || '[]');
        
        setPosts(localPosts.filter(p => !p.hidden_from?.includes(user.id)));
        setUsers(localUsers);
        setNotifs(localNotifs.filter(n => n.user_id === user.id));
        
        const chatSet = new Set();
        localMessages.forEach(m => { if(m.from_user !== user.id) chatSet.add(m.from_user); if(m.to_user !== user.id) chatSet.add(m.to_user); });
        setChatList(localUsers.filter(u => chatSet.has(u.id)));
        
        const cnt = {};
        localMessages.forEach(m => { if(m.to_user === user.id && !m.read) cnt[m.from_user] = (cnt[m.from_user]||0)+1; });
        setUnread(cnt);
        
        if(chatUser) {
          const chatMsgs = localMessages.filter(m => (m.from_user===user.id && m.to_user===chatUser.id) || (m.from_user===chatUser.id && m.to_user===user.id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
          setMessages(chatMsgs);
        }
        setLoading(false);
        return;
      }
      
      // Supabase режим
      try {
        const [pRes, uRes, mRes, nRes] = await Promise.all([
          supabase.from('posts').select('*').order('created_at', { ascending: false }),
          supabase.from('users').select('*'),
          supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`),
          supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false })
        ]);
        
        const all = pRes.data || [];
        setPosts(all.filter(p => !p.hidden_from?.includes(user.id)));
        setUsers(uRes.data || []);
        setNotifs(nRes.data || []);
        
        const msgs = mRes.data || [];
        const chatSet = new Set();
        msgs.forEach(m => { if(m.from_user !== user.id) chatSet.add(m.from_user); if(m.to_user !== user.id) chatSet.add(m.to_user); });
        setChatList(uRes.data?.filter(u => chatSet.has(u.id)) || []);
        
        const cnt = {};
        msgs.forEach(m => { if(m.to_user === user.id && !m.read) cnt[m.from_user] = (cnt[m.from_user]||0)+1; });
        setUnread(cnt);
        
        if(chatUser){
          const chatMsgs = msgs.filter(m => (m.from_user===user.id && m.to_user===chatUser.id) || (m.from_user===chatUser.id && m.to_user===user.id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
          setMessages(chatMsgs);
          await supabase.from('messages').update({read:true}).eq('to_user',user.id).eq('from_user',chatUser.id);
        }
      } catch(e) { console.warn('Supabase ошибка:', e); }
      setLoading(false);
    };

    React.useEffect(() => { loadAll(); }, []);
    
    // Сохранение постов локально
    React.useEffect(() => {
      if(!dbReady && posts.length > 0) {
        localStorage.setItem('wave_local_posts', JSON.stringify(posts));
      }
    }, [posts]);
    
    React.useEffect(() => {
      if(!dbReady && messages.length > 0) {
        localStorage.setItem('wave_local_messages', JSON.stringify(messages));
      }
    }, [messages]);
    
    React.useEffect(() => {
      if(!dbReady && notifs.length > 0) {
        localStorage.setItem('wave_local_notifs', JSON.stringify(notifs));
      }
    }, [notifs]);

    // Поиск
    React.useEffect(() => {
      if(!search.trim()){ setSearchUsers([]); setSearchPosts([]); return; }
      if(sType === 'users') setSearchUsers(users.filter(u => u.id !== user.id && u.username.toLowerCase().includes(search.toLowerCase())));
      else setSearchPosts(posts.filter(p => p.content?.toLowerCase().includes(search.toLowerCase())));
    }, [search, sType, users, posts]);

    const createPost = () => {
      if(!newPost.trim() && media.length===0 && !tempPoll){ showToast('Напишите текст или добавьте медиа/опрос'); return; }
      const newId = Date.now();
      const newPostObj = {
        id: newId, user_id: user.id, username: user.username, user_avatar: user.avatar,
        content: newPost, media: media, poll: tempPoll, likes: 0, comments: [],
        created_at: new Date().toISOString(), edited: false
      };
      setPosts([newPostObj, ...posts]);
      setNewPost(''); setMedia([]); setTempPoll(null);
      showToast('Пост опубликован!');
    };

    const likePost = (pid, curr) => { 
      const newL = curr + 1; 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,likes:newL}:p)); 
    };
    
    const addComment = (pid, text) => {
      const post = posts.find(p=>p.id===pid);
      const newC = {id:Date.now(), user_id:user.id, username:user.username, user_avatar:user.avatar, text, created_at:new Date().toISOString()};
      const newCmnts = [...(post.comments||[]), newC];
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newCmnts}:p));
    };
    
    const deleteComment = (pid, cid) => { 
      const post=posts.find(p=>p.id===pid); 
      const newC=(post.comments||[]).filter(c=>c.id!==cid); 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newC}:p)); 
      showToast('Комментарий удалён'); 
    };
    
    const delPost = (pid) => { 
      setPosts(prev=>prev.filter(p=>p.id!==pid)); 
      setDelPostId(null); 
      showToast('Пост удалён'); 
    };
    
    const follow = (id) => { 
      if(id===user.id) return;
      let f=user.following||[]; 
      let is=f.includes(id); 
      let nf=is?f.filter(i=>i!==id):[...f,id]; 
      user.following=nf;
      let t=users.find(u=>u.id===id); 
      if(t){let fl=t.followers||[]; let nfl=is?fl.filter(i=>i!==user.id):[...fl,user.id]; t.followers=nfl;}
      setUsers([...users]);
      showToast(is?'Отписались':'Подписались'); 
    };
    
    const sendMsg = () => {
      if(!msgText.trim() || !chatUser) return;
      const newMsg = {id:Date.now(), from_user:user.id, to_user:chatUser.id, content:msgText, created_at:new Date().toISOString()};
      setMessages(prev=>[...prev, newMsg]);
      if(!dbReady) {
        const allMsgs = JSON.parse(localStorage.getItem('wave_local_messages') || '[]');
        allMsgs.push(newMsg);
        localStorage.setItem('wave_local_messages', JSON.stringify(allMsgs));
      }
      setMsgText('');
      setTimeout(() => msgEndRef.current?.scrollIntoView({behavior:'smooth'}), 100);
    };
    
    const upAvatar = (file) => { 
      if(!file) return; 
      setAvatarUp(true); 
      const reader = new FileReader();
      reader.onloadend = () => {
        user.avatar = reader.result;
        setAvatarUp(false);
        showToast('Аватар обновлён');
      };
      reader.readAsDataURL(file);
    };
    
    const saveProfile = () => { 
      user.full_name = editName; 
      user.bio = editBio; 
      setEditProfile(false); 
      showToast('Профиль обновлён'); 
    };

    const renderText = (text) => {
      if(!text) return null;
      const parts = text.split(/(@\w+|#[\wа-яё]+)/gi);
      return parts.map((p,i) => {
        if(p.startsWith('@')){ const un=p.slice(1); return <span key={i} className="mention" onClick={()=>{const u=users.find(x=>x.username===un); if(u) setViewProfile(u);}}>{p}</span>; }
        if(p.startsWith('#')) return <span key={i} className="hashtag" onClick={()=>{setSearch(p); setSType('posts'); setTab('search');}}>{p}</span>;
        return <span key={i}>{p}</span>;
      });
    };

    const PostMenu = ({onDel}) => {
      const [open,setOpen]=React.useState(false);
      const ref=React.useRef(null);
      React.useEffect(()=>{const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener('click',fn); return()=>document.removeEventListener('click',fn);},[]);
      return (<div className="relative" ref={ref}><button onClick={()=>setOpen(!open)} className="text-gray-400 hover:text-white p-1"><i className="fas fa-ellipsis-h"></i></button>{open&&(<div className="dropdown-menu">{onDel&&<div onClick={()=>{onDel();setOpen(false);}} className="dropdown-item"><i className="fas fa-trash-alt"></i> Удалить</div>}</div>)}</div>);
    };

    if(loading) return <div className="min-h-screen flex items-center justify-center text-white"><i className="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div>;
    
    if(commentsPagePost) {
      const post = commentsPagePost;
      const allComments = post.comments || [];
      return (
        <div className="fixed inset-0 bg-black z-50 flex flex-col">
          <div className="bg-[#1a1a1a] p-3 flex items-center gap-3 border-b border-gray-800"><button onClick={()=>setCommentsPagePost(null)} className="text-white text-xl">←</button><span className="text-white font-bold">Комментарии ({allComments.length})</span></div>
          <div className="flex-1 overflow-y-auto p-3">{allComments.map(c=><div key={c.id} className="flex gap-2 p-2 border-b border-gray-800"><img src={c.user_avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><div><div className="font-bold text-white text-sm">@{c.username}</div><p className="text-gray-300 text-sm">{c.text}</p><div className="text-gray-500 text-xs">{formatDate(c.created_at)}</div></div></div>)}</div>
          <div className="p-3 border-t border-gray-800 flex gap-2"><input id="commentInput" placeholder="Комментарий..." className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white" /><button onClick={()=>{const input=document.getElementById('commentInput'); if(input.value.trim()){addComment(post.id, input.value); input.value=''; setCommentsPagePost(null);}}} className="bg-blue-600 px-4 rounded-xl">→</button></div>
        </div>
      );
    }
    
    if(viewProfile){
      const prof=viewProfile;
      const profPosts=posts.filter(p=>p.user_id===prof.id);
      return (<div className="min-h-screen p-4"><button onClick={()=>setViewProfile(null)} className="text-gray-400 mb-4"><i className="fas fa-arrow-left"></i> Назад</button><div className="card p-6 text-center mb-6"><img src={prof.avatar||DEFAULT_AVATAR} className="w-20 h-20 rounded-full mx-auto" /><h2 className="text-lg font-bold text-white mt-2">{prof.full_name||prof.username}</h2><p className="text-gray-400">@{prof.username}</p><p className="text-gray-500 text-sm">{prof.bio||''}</p><div className="flex gap-2 justify-center mt-3"><button onClick={()=>{setChatUser(prof); setViewProfile(null); setTab('chat');}} className="bg-green-600 px-3 py-1 rounded-full text-xs">Чат</button><button onClick={()=>follow(prof.id)} className={`px-3 py-1 rounded-full text-xs ${(user.following||[]).includes(prof.id)?'bg-gray-600':'bg-blue-600'}`}>{(user.following||[]).includes(prof.id)?'Отписаться':'Подписаться'}</button></div><div className="flex gap-4 justify-center mt-3 text-sm"><div><span className="font-bold text-white">{prof.followers?.length||0}</span> подписчиков</div><div><span className="font-bold text-white">{prof.following?.length||0}</span> подписок</div></div></div>{profPosts.map(p=><div key={p.id} className="card p-3 mb-3"><p className="text-white text-sm">{p.content}</p><div className="flex gap-3 mt-2 text-gray-500 text-xs"><span><i className="fas fa-heart"></i> {formatLikes(p.likes||0)}</span><span><i className="far fa-comment"></i> {(p.comments||[]).length}</span></div></div>)}</div>);
    }

    return (
      <div className="min-h-screen pb-16">
        {fullscreen && <div className="fullscreen-media" onClick={()=>setFullscreen(null)}>{fullscreen.type==='video'?<video src={fullscreen.url} controls autoPlay />:<img src={fullscreen.url} />}</div>}
        {delPostId && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>setDelPostId(null)}><div className="bg-[#1a1a1a] rounded-2xl p-5 max-w-sm w-full text-center"><p className="text-white mb-4">Удалить пост?</p><div className="flex gap-2"><button onClick={()=>delPost(delPostId)} className="flex-1 bg-red-900 py-2 rounded-xl">Да</button><button onClick={()=>setDelPostId(null)} className="flex-1 bg-gray-700 py-2 rounded-xl">Нет</button></div></div></div>}
        {showPollModal && <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50" onClick={()=>setShowPollModal(false)}><div className="bg-[#1a1a1a] rounded-2xl p-5 max-w-md w-full mx-4" onClick={e=>e.stopPropagation()}><h2 className="text-white font-bold mb-3">Создать опрос</h2><input type="text" placeholder="Вопрос" className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white mb-3" /><div className="flex gap-2 mb-2"><input type="text" placeholder="Вариант 1" className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white" /><input type="text" placeholder="Вариант 2" className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white" /></div><button onClick={()=>setShowPollModal(false)} className="w-full bg-blue-600 py-2 rounded-xl text-white">Добавить</button></div></div>}
        {showHideModal && <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50" onClick={()=>setShowHideModal(false)}><div className="bg-[#1a1a1a] rounded-2xl p-5 max-w-md w-full mx-4" onClick={e=>e.stopPropagation()}><h2 className="text-white font-bold mb-3">Скрыть от пользователей</h2><div className="max-h-96 overflow-auto">{users.filter(u=>u.id!==user.id).map(u=><div key={u.id} className="flex items-center gap-2 p-2"><input type="checkbox" /><img src={u.avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white">@{u.username}</span></div>)}</div><button onClick={()=>setShowHideModal(false)} className="w-full bg-blue-600 py-2 rounded-xl text-white mt-3">Применить</button></div></div>}
        {switchDialog && <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50" onClick={()=>{setSwitchDialog(false); setSwitchErr(''); setSwitchUser(''); setSwitchPass('');}}><div className="bg-[#1a1a1a] rounded-2xl p-5 max-w-sm w-full mx-4" onClick={e=>e.stopPropagation()}><p className="text-white mb-3 text-center">Сменить аккаунт</p><input type="text" placeholder="Логин" value={switchUser} onChange={e=>setSwitchUser(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white mb-2" /><input type="password" placeholder="Пароль" value={switchPass} onChange={e=>setSwitchPass(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white mb-2" />{switchErr&&<div className="text-red-400 text-sm mb-2">{switchErr}</div>}<div className="flex gap-2"><button onClick={()=>{if(switchUser==='admin' && switchPass==='admin'){const fakeUser={id:1,username:'admin',full_name:'Admin',avatar:DEFAULT_AVATAR}; localStorage.setItem('wave_user',JSON.stringify(fakeUser)); window.location.reload();}else setSwitchErr('Неверно');}} className="flex-1 bg-blue-600 py-2 rounded-xl">Войти</button><button onClick={()=>{setSwitchDialog(false);}} className="flex-1 bg-gray-700 py-2 rounded-xl">Отмена</button></div></div></div>}

        <header className="sticky top-0 z-20 border-b border-gray-800 bg-[#0f0f0f]/90 backdrop-blur-md p-3"><div className="max-w-2xl mx-auto flex justify-between items-center"><div className="flex items-center gap-2"><i className="fas fa-water text-white text-xl"></i><span className="text-white font-bold text-lg">Wave</span></div><div className="flex gap-3 text-gray-400"><button onClick={()=>{setTab('feed'); setViewProfile(null);}} className={`text-lg ${tab==='feed'?'text-white':''}`}><i className="fas fa-home"></i></button><button onClick={()=>{setTab('search'); setViewProfile(null);}} className={`text-lg ${tab==='search'?'text-white':''}`}><i className="fas fa-search"></i></button><button onClick={()=>{setTab('chat'); setViewProfile(null);}} className={`text-lg relative ${tab==='chat'?'text-white':''}`}><i className="fas fa-comments"></i>{Object.values(unread).reduce((a,b)=>a+b,0)>0&&<span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{Object.values(unread).reduce((a,b)=>a+b,0)}</span>}</button><button onClick={()=>{setTab('notify'); setViewProfile(null);}} className={`text-lg relative ${tab==='notify'?'text-white':''}`}><i className="fas fa-bell"></i>{notifs.filter(n=>!n.read).length>0&&<span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{notifs.filter(n=>!n.read).length}</span>}</button><button onClick={()=>{setTab('profile'); setViewProfile(null);}} className={`text-lg ${tab==='profile'?'text-white':''}`}><i className="fas fa-user"></i></button><button onClick={onLogout} className="text-sm bg-gray-800 px-2 py-0.5 rounded-full">Выйти</button></div></div></header>

        <main className="max-w-2xl mx-auto p-3">
          {tab==='feed' && (<>
            <div className="card p-3 mb-4"><div className="flex gap-2"><img src={user.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><div className="flex-1"><textarea ref={textareaRef} rows="2" placeholder="Что нового?" className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm resize-none" value={newPost} onChange={e=>setNewPost(e.target.value)} /><div className="flex flex-wrap gap-1 mt-2">{media.map((m,i)=><div key={i} className="media-preview" onClick={()=>setFullscreen({url:m.url,type:m.type})}>{m.type==='video'?<video src={m.url} />:<img src={m.url} />}<button className="remove-media" onClick={(e)=>{e.stopPropagation(); setMedia(media.filter((_,idx)=>idx!==i));}}>×</button></div>)}</div>{tempPoll && <div className="mt-2 p-2 bg-[#252525] rounded-xl"><span className="text-white text-xs">Опрос добавлен</span></div>}<div className="flex gap-2 mt-2"><label className={`white-icon-btn text-sm`}><i className="fas fa-paperclip"></i> Файлы<input type="file" accept="image/*,video/*" multiple onChange={async(e)=>{const files=Array.from(e.target.files); const newMedia=[]; for(let f of files){const url=URL.createObjectURL(f); newMedia.push({url, type:f.type.startsWith('image/')?'image':'video'});} setMedia([...media,...newMedia]); e.target.value='';}} className="hidden" /></label><button onClick={()=>setShowPollModal(true)} className="white-icon-btn text-sm"><i className="fas fa-chart-simple"></i> Опрос</button><button onClick={()=>setShowHideModal(true)} className="white-icon-btn text-sm"><i className="fas fa-eye-slash"></i> Скрыть</button><button onClick={createPost} className="white-glow-btn px-4 py-1.5 rounded-full text-sm">Опубликовать</button></div></div></div></div>
            {posts.map(p=>{const comments=p.comments||[]; const firstThree=comments.slice(0,3); const hasMore=comments.length>3; return (<div key={p.id} className="card p-3 mb-3"><div className="flex justify-between"><div className="flex gap-2 cursor-pointer" onClick={()=>p.user_id!==user.id&&setViewProfile(users.find(u=>u.id===p.user_id))}><img src={p.user_avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full" /><div><div className="font-bold text-white text-sm">@{p.username}</div><div className="text-xs text-gray-500">{formatDate(p.created_at)}</div></div></div><PostMenu onDel={p.user_id===user.id?()=>setDelPostId(p.id):null} /></div><ReadMore text={p.content} maxLength={200} />{p.media?.length>0&&p.media.map((m,i)=><div key={i}>{m.type==='video'?<video src={m.url} className="post-media-large" onClick={()=>setFullscreen({url:m.url,type:'video'})} />:<img src={m.url} className="post-media-large" onClick={()=>setFullscreen({url:m.url,type:'image'})} />}</div>)}<div className="flex gap-3 mt-2 text-gray-400 text-xs"><button onClick={()=>likePost(p.id,p.likes||0)} className="flex gap-1 hover:text-red-400"><i className="fas fa-heart"></i> {formatLikes(p.likes||0)}</button><button onClick={()=>{const d=document.getElementById(`c-${p.id}`); if(d)d.classList.toggle('hidden');}} className="flex gap-1 hover:text-blue-400"><i className="far fa-comment"></i> {(p.comments||[]).length}</button></div><div id={`c-${p.id}`} className="hidden mt-2 pt-2 border-t border-gray-800">{firstThree.map(c=><div key={c.id} className="mb-2 fade-comment"><div className="flex items-start gap-2 p-2 hover:bg-[#2a2a2a] rounded-xl cursor-pointer" onClick={()=>setCommentsPagePost(p)}><img src={c.user_avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full mt-0.5" /><div className="flex-1"><div className="flex items-center gap-2"><span className="font-bold text-sm text-white">@{c.username}</span><span className="text-xs text-gray-500">{formatDate(c.created_at)}</span></div><p className="text-gray-300 text-sm mt-1">{c.text}</p></div></div></div>)}</div>{hasMore&&<button onClick={()=>setCommentsPagePost(p)} className="text-blue-400 text-xs mt-1 hover:underline">Показать еще ({comments.length-3})</button>}<div className="flex gap-2 mt-2"><input type="text" placeholder="Комментарий..." className="flex-1 p-1.5 bg-[#2a2a2a] rounded-xl text-sm text-white" value={commentTexts[p.id]||''} onChange={e=>setCommentTexts({...commentTexts,[p.id]:e.target.value})} /><button onClick={()=>addComment(p.id, commentTexts[p.id])} className="bg-blue-600 text-white px-3 rounded-xl text-xs">→</button></div></div></div>);})}</>)}

          {tab==='search' && (<div><div className="card p-3 mb-4"><div className="flex gap-2 mb-2"><button onClick={()=>setSType('users')} className={`text-xs px-2 py-1 rounded-full ${sType==='users'?'bg-blue-600':'bg-gray-800'}`}>Пользователи</button><button onClick={()=>setSType('posts')} className={`text-xs px-2 py-1 rounded-full ${sType==='posts'?'bg-blue-600':'bg-gray-800'}`}>Посты</button></div><input type="text" placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" /></div>{sType==='users'&&searchUsers.map(u=><div key={u.id} className="card p-3 mb-2 flex justify-between items-center"><div className="flex gap-2 cursor-pointer" onClick={()=>setViewProfile(u)}><img src={u.avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full" /><div><div className="font-bold text-white text-sm">{u.full_name||u.username}</div><div className="text-gray-400 text-xs">@{u.username}</div></div></div><button onClick={()=>{setChatUser(u); setTab('chat');}} className="bg-green-600 px-2 py-0.5 rounded-full text-xs">Чат</button></div>)}</div>)}

          {tab==='chat' && (<div className="flex flex-col h-[80vh]">
            {!chatUser ? (
              <div className="chat-user-list">
                <h3 className="text-white font-bold mb-2">Контакты</h3>
                {chatList.map(cu=>(
                  <div key={cu.id} className="chat-user-item" onClick={()=>setChatUser(cu)}>
                    <img src={cu.avatar||DEFAULT_AVATAR} className="w-10 h-10 rounded-full" />
                    <div className="flex-1"><div className="font-bold text-white">@{cu.username}</div><div className="text-gray-400 text-xs">{cu.full_name||cu.username}</div></div>
                    {unread[cu.id]>0 && <div className="bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{unread[cu.id]}</div>}
                  </div>
                ))}
                {chatList.length===0 && <div className="text-center text-gray-500 py-8">Нет чатов. Начните общение!</div>}
              </div>
            ) : (
              <div className="flex flex-col h-full">
                <div className="flex items-center gap-3 p-3 border-b border-gray-800 bg-[#1a1a1a] rounded-t-2xl">
                  <button onClick={()=>setChatUser(null)} className="text-white text-xl">←</button>
                  <img src={chatUser.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                  <div><div className="font-bold text-white">@{chatUser.username}</div><div className="text-gray-400 text-xs">{chatUser.full_name||chatUser.username}</div></div>
                </div>
                <div className="chat-messages" ref={msgEndRef}>
                  {messages.map((msg,i)=>(
                    <div key={i} className={`message-bubble ${msg.from_user===user.id?'message-mine':'message-theirs'}`}>
                      <p className="text-sm break-words">{msg.content}</p>
                      <div className="text-[10px] opacity-70 mt-1 text-right">{new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                    </div>
                  ))}
                </div>
                <div className="p-3 border-t border-gray-800 flex gap-2 bg-[#1a1a1a] rounded-b-2xl">
                  <input type="text" placeholder="Сообщение..." value={msgText} onChange={e=>setMsgText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&sendMsg()} className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" />
                  <button onClick={sendMsg} className="bg-blue-600 text-white px-4 rounded-xl">→</button>
                </div>
              </div>
            )}
          </div>)}

          {tab==='notify' && (<div><div className="flex justify-between items-center mb-2"><h2 className="text-lg font-bold text-white">Уведомления</h2></div>{notifs.length===0&&<div className="card p-6 text-center text-gray-500">Нет уведомлений</div>}{notifs.map(n=><div key={n.id} className="card p-2 mb-2 cursor-pointer"><p className="text-white text-sm">{n.text}</p><p className="text-gray-500 text-xs">{formatDate(n.created_at)}</p></div>)}</div>)}

          {tab==='profile' && (<div className="card p-4 text-center"><div className="flex justify-end"><button onClick={()=>setSwitchDialog(true)} className="text-gray-400 hover:text-white p-1"><i className="fas fa-exchange-alt"></i></button></div><div className="avatar-upload w-20 h-20 mx-auto relative cursor-pointer"><img src={user.avatar||DEFAULT_AVATAR} className="w-20 h-20 rounded-full object-cover" /><input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer rounded-full" onChange={(e)=>upAvatar(e.target.files[0])} disabled={avatarUp} /></div>{editProfile?(<div className="mt-3"><input type="text" value={editName} onChange={e=>setEditName(e.target.value)} className="w-full p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm" placeholder="Имя" /><textarea value={editBio} onChange={e=>setEditBio(e.target.value)} className="w-full p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm mt-1" rows="2" placeholder="О себе"></textarea><div className="flex gap-2 mt-2"><button onClick={saveProfile} className="flex-1 bg-green-600 text-white py-1 rounded-xl text-sm">Сохранить</button><button onClick={()=>setEditProfile(false)} className="flex-1 bg-gray-700 text-white py-1 rounded-xl text-sm">Отмена</button></div></div>):(<><h2 className="text-lg font-bold text-white mt-1">{user.full_name||user.username}</h2><p className="text-gray-400 text-sm">@{user.username}</p><p className="text-gray-500 text-xs mt-1">{user.bio||''}</p><div className="flex gap-4 justify-center mt-3 text-sm"><div><span className="font-bold text-white">{posts.filter(p=>p.user_id===user.id).length}</span><span className="text-gray-500 ml-1">постов</span></div><div><span className="font-bold text-white">{user.followers?.length||0}</span><span className="text-gray-500 ml-1">подписчиков</span></div><div><span className="font-bold text-white">{user.following?.length||0}</span><span className="text-gray-500 ml-1">подписок</span></div></div><div className="flex gap-2 justify-center mt-4"><button onClick={()=>setEditProfile(true)} className="bg-gray-700 px-4 py-1.5 rounded-full text-sm">Редактировать</button><button onClick={onLogout} className="bg-red-600 px-4 py-1.5 rounded-full text-sm">Выйти</button></div></>)}</div>)}
        </main>
      </div>
    );
  }

  function App() { 
    const [a,setA]=React.useState(false); 
    const [u,setU]=React.useState(null); 
    const [l,setL]=React.useState(true); 
    React.useEffect(()=>{ 
      if(localStorage.getItem('wave_access')==='ok') setA(true); 
      let s=localStorage.getItem('wave_user'); 
      if(s) setU(JSON.parse(s)); 
      setL(false); 
    },[]); 
    const log=(u)=>{ localStorage.setItem('wave_user',JSON.stringify(u)); setU(u); }; 
    const out=()=>{ localStorage.removeItem('wave_user'); setU(null); localStorage.removeItem('wave_access'); window.location.reload(); }; 
    if(l) return <div className="p-4 text-white">Загрузка...</div>; 
    if(!a) return <PasswordGate onSuccess={()=>setA(true)} />; 
    if(u) return <MainApp user={u} onLogout={out} />; 
    return <Auth onLogin={log} />; 
  }
  
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
