<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Wave Social — удаление + ответы в чате</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #1a1a1a; }
    .card { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 20px; transition: all 0.2s; box-shadow: 0 0 5px rgba(100,100,100,0.1); }
    .card:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(100,100,100,0.2); }
    .btn { transition: all 0.2s; cursor: pointer; }
    .btn:hover { transform: scale(1.02); filter: brightness(1.05); }
    .mention { color: #3b82f6; font-weight: 500; cursor: pointer; }
    .mention:hover { text-decoration: underline; }
    .hashtag { color: #eab308; font-weight: 500; cursor: pointer; }
    .hashtag:hover { text-decoration: underline; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #2a2a2a; border: 1px solid #3a3a3a; color: white; padding: 8px 16px; border-radius: 40px; z-index: 1000; font-size: 14px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    .media-preview { position: relative; display: inline-block; margin: 5px; border-radius: 12px; overflow: hidden; border: 2px solid #4a4a4a; }
    .media-preview img { width: 80px; height: 80px; object-fit: cover; }
    .media-preview video { width: 80px; height: 80px; object-fit: cover; }
    .remove-media { position: absolute; top: -8px; right: -8px; background: #ef4444; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; color: white; }
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: #2a2a2a; border: 1px solid #4a4a4a; border-radius: 12px; z-index: 50; min-width: 150px; }
    .profile-avatar { position: relative; display: inline-block; cursor: pointer; }
    .profile-avatar input { position: absolute; inset: 0; opacity: 0; cursor: pointer; border-radius: 50%; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal-card { background: #2a2a2a; border-radius: 24px; padding: 24px; max-width: 320px; width: 90%; text-align: center; border: 1px solid #4a4a4a; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    .reply-quote { background: #1a1a1a; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 12px; color: #94a3b8; border-left: 3px solid #3b82f6; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }

  // ========== ЭКРАН ВХОДА ==========
  function PasswordGate({ onSuccess }) {
    const [pass, setPass] = React.useState('');
    const [err, setErr] = React.useState('');
    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="card p-8 max-w-md w-full text-center">
          <i className="fas fa-lock text-5xl text-white mb-4"></i>
          <h1 className="text-2xl font-bold text-white">Wave Social</h1>
          <p className="text-gray-400 mt-2">Введите пароль</p>
          <form onSubmit={(e) => { e.preventDefault(); if (pass === '8554social') { localStorage.setItem('wave_access', 'ok'); onSuccess(); } else setErr('Неверный пароль'); }} className="mt-6">
            <input type="password" value={pass} onChange={e => setPass(e.target.value)} className="w-full p-3 bg-[#333] rounded-xl text-white text-center" autoFocus />
            {err && <div className="text-red-400 text-sm mt-2">{err}</div>}
            <button type="submit" className="w-full mt-4 bg-gray-700 text-white py-2 rounded-xl btn">Войти</button>
          </form>
        </div>
      </div>
    );
  }

  // ========== РЕГИСТРАЦИЯ ==========
  function Auth({ onLogin }) {
    const [isLogin, setIsLogin] = React.useState(true);
    const [username, setUsername] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [name, setName] = React.useState('');
    const [error, setError] = React.useState('');
    const [loading, setLoading] = React.useState(false);

    const handleSubmit = async (e) => {
      e.preventDefault();
      setError('');
      setLoading(true);
      if (isLogin) {
        const { data: user } = await supabase.from('users').select('*').eq('username', username).single();
        if (!user) { setError('Пользователь не найден'); setLoading(false); return; }
        if (password === user.password_hash) onLogin(user);
        else setError('Неверный пароль');
      } else {
        if (password.length < 4) { setError('Пароль минимум 4 символа'); setLoading(false); return; }
        const { data: existing } = await supabase.from('users').select('username').eq('username', username).single();
        if (existing) { setError('Имя занято'); setLoading(false); return; }
        const { data: newUser } = await supabase.from('users').insert({ username, full_name: name || username, password_hash: password }).select().single();
        if (newUser) onLogin(newUser);
        else setError('Ошибка');
      }
      setLoading(false);
    };

    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="card p-8 max-w-md w-full">
          <div className="text-center"><i className="fas fa-water text-5xl text-white opacity-80"></i><h1 className="text-3xl font-bold mt-2 text-white">Wave Social</h1></div>
          <form onSubmit={handleSubmit} className="space-y-4 mt-6">
            <input type="text" placeholder="Логин" value={username} onChange={e => setUsername(e.target.value)} className="w-full p-3 bg-[#333] rounded-xl text-white" required />
            <input type="password" placeholder="Пароль" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-[#333] rounded-xl text-white" required />
            {!isLogin && <input type="text" placeholder="Имя" value={name} onChange={e => setName(e.target.value)} className="w-full p-3 bg-[#333] rounded-xl text-white" />}
            {error && <div className="text-red-400 text-sm">{error}</div>}
            <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold btn">{loading ? 'Загрузка...' : (isLogin ? 'Войти' : 'Зарегистрироваться')}</button>
          </form>
          <button onClick={() => { setIsLogin(!isLogin); setError(''); }} className="w-full mt-4 text-gray-400 text-sm">{isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}</button>
        </div>
      </div>
    );
  }

  // ========== МОДАЛЬНОЕ ПОДТВЕРЖДЕНИЕ ==========
  function ConfirmModal({ message, onConfirm, onCancel }) {
    return (
      <div className="modal-overlay" onClick={onCancel}>
        <div className="modal-card" onClick={e => e.stopPropagation()}>
          <p className="text-white mb-6">{message}</p>
          <div className="flex gap-3">
            <button onClick={onConfirm} className="flex-1 bg-red-900 text-white py-2 rounded-xl hover:bg-red-800 btn">Удалить</button>
            <button onClick={onCancel} className="flex-1 bg-gray-700 text-white py-2 rounded-xl hover:bg-gray-600 btn">Отмена</button>
          </div>
        </div>
      </div>
    );
  }

  // ========== МОДАЛКА ДЛЯ КОММЕНТАРИЯ / СООБЩЕНИЯ ==========
  function ActionModal({ item, type, onClose, onDelete, onReply }) {
    if (!item) return null;
    return (
      <div className="modal-overlay" onClick={onClose}>
        <div className="modal-card" onClick={e => e.stopPropagation()}>
          {type === 'comment' && <p className="text-white text-sm mb-3">Комментарий: {item.text}</p>}
          {type === 'message' && <p className="text-white text-sm mb-3">Сообщение: {item.content}</p>}
          <div className="flex flex-col gap-2">
            {onReply && <button onClick={onReply} className="bg-blue-600 text-white py-2 rounded-xl btn"><i className="fas fa-reply mr-2"></i> Ответить</button>}
            <button onClick={onDelete} className="bg-red-900 text-white py-2 rounded-xl btn"><i className="fas fa-trash-alt mr-2"></i> Удалить</button>
            <button onClick={onClose} className="bg-gray-700 text-white py-2 rounded-xl btn">Отмена</button>
          </div>
        </div>
      </div>
    );
  }

  // ========== ОСНОВНОЕ ПРИЛОЖЕНИЕ ==========
  function AppMain({ user, onLogout }) {
    const [tab, setTab] = React.useState('feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(null);
    const [messages, setMessages] = React.useState([]);
    const [chatList, setChatList] = React.useState([]);
    const [unread, setUnread] = React.useState({});
    const [notifications, setNotifications] = React.useState([]);
    const [viewProfile, setViewProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [newPost, setNewPost] = React.useState('');
    const [commentTexts, setCommentTexts] = React.useState({});
    const [msgText, setMsgText] = React.useState('');
    const [searchQuery, setSearchQuery] = React.useState('');
    const [searchUserResults, setSearchUserResults] = React.useState([]);
    const [searchPostResults, setSearchPostResults] = React.useState([]);
    const [searchType, setSearchType] = React.useState('users');
    const [showSubscribers, setShowSubscribers] = React.useState(false);
    const [showFollowing, setShowFollowing] = React.useState(false);
    const [avatarUploading, setAvatarUploading] = React.useState(false);
    const [editingName, setEditingName] = React.useState(false);
    const [newName, setNewName] = React.useState(user.full_name);
    const [showDeleteConfirm, setShowDeleteConfirm] = React.useState(false);
    const [mediaList, setMediaList] = React.useState([]);
    const [uploadingMedia, setUploadingMedia] = React.useState(false);
    const [showMentions, setShowMentions] = React.useState(false);
    const [mentionQuery, setMentionQuery] = React.useState('');
    const [mentionPos, setMentionPos] = React.useState(0);
    const textareaRef = React.useRef(null);
    const messagesEndRef = React.useRef(null);
    
    // Удаление поста
    const [postToDelete, setPostToDelete] = React.useState(null);
    // Модалка для комментария/сообщения
    const [selectedComment, setSelectedComment] = React.useState(null);
    const [selectedMessage, setSelectedMessage] = React.useState(null);
    const [replyToMsg, setReplyToMsg] = React.useState(null);
    const [replyToCommentPostId, setReplyToCommentPostId] = React.useState(null);

    React.useEffect(() => {
      messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
    }, [messages]);

    const loadData = async () => {
      const [postsRes, usersRes, msgsRes, notifsRes] = await Promise.all([
        supabase.from('posts').select('*').order('created_at', { ascending: false }),
        supabase.from('users').select('*'),
        supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`),
        supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false })
      ]);
      setPosts(postsRes.data || []);
      setUsers(usersRes.data || []);
      setNotifications(notifsRes.data || []);
      
      const msgs = msgsRes.data || [];
      const chatSet = new Set();
      msgs.forEach(m => { if (m.from_user !== user.id) chatSet.add(m.from_user); if (m.to_user !== user.id) chatSet.add(m.to_user); });
      setChatList(usersRes.data?.filter(u => chatSet.has(u.id)) || []);
      
      const counts = {};
      msgs.forEach(m => { if (m.to_user === user.id && !m.read) counts[m.from_user] = (counts[m.from_user] || 0) + 1; });
      setUnread(counts);
      
      if (chatUser) {
        const chatMsg = msgs.filter(m => (m.from_user === user.id && m.to_user === chatUser.id) || (m.from_user === chatUser.id && m.to_user === user.id)).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
        setMessages(chatMsg);
        await supabase.from('messages').update({ read: true }).eq('to_user', user.id).eq('from_user', chatUser.id);
      }
      setLoading(false);
    };

    React.useEffect(() => { loadData(); }, [chatUser]);

    // Realtime для сообщений
    React.useEffect(() => {
      if (!chatUser) return;
      const sub = supabase
        .channel('msgs')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `to_user=eq.${user.id},from_user=eq.${chatUser.id}` }, (payload) => {
          setMessages(prev => [...prev, payload.new]);
          supabase.from('messages').update({ read: true }).eq('id', payload.new.id);
          setUnread(prev => ({ ...prev, [chatUser.id]: 0 }));
        })
        .subscribe();
      return () => sub.unsubscribe();
    }, [chatUser, user.id]);

    // Поиск в реальном времени
    React.useEffect(() => {
      if (!searchQuery.trim()) { setSearchUserResults([]); setSearchPostResults([]); return; }
      if (searchType === 'users') {
        const filtered = users.filter(u => u.id !== user.id && u.username.toLowerCase().includes(searchQuery.toLowerCase()));
        setSearchUserResults(filtered);
        setSearchPostResults([]);
      } else {
        const filtered = posts.filter(p => 
          p.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (searchQuery.startsWith('#') && p.content.toLowerCase().includes(searchQuery.toLowerCase()))
        );
        setSearchPostResults(filtered);
        setSearchUserResults([]);
      }
    }, [searchQuery, searchType, users, posts]);

    const extractHashtags = (text) => {
      const matches = text.match(/#[\wа-яё]+/gi);
      return matches || [];
    };

    const checkUserExists = async (username) => {
      const { data } = await supabase.from('users').select('username').eq('username', username).single();
      return !!data;
    };

    const uploadMediaFiles = async (files) => {
      const newMedia = [];
      for (const file of files) {
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${file.name.split('.').pop()}`;
        const { error } = await supabase.storage.from('wave-media').upload(fileName, file);
        if (!error) {
          const { data: { publicUrl } } = supabase.storage.from('wave-media').getPublicUrl(fileName);
          newMedia.push({ url: publicUrl, type: file.type.startsWith('image/') ? 'image' : 'video', name: file.name });
        }
      }
      return newMedia;
    };

    const sendMessage = async () => {
      if (!msgText.trim() && !replyToMsg && !chatUser) return;
      let content = msgText;
      if (replyToMsg) {
        content = `[Ответ @${replyToMsg.from_user === user.id ? replyToMsg.to_user_username : replyToMsg.from_user_username}: "${replyToMsg.content.substring(0, 50)}"]\n${msgText}`;
      }
      const tempId = Date.now();
      setMessages(prev => [...prev, { id: tempId, from_user: user.id, to_user: chatUser.id, content, created_at: new Date().toISOString() }]);
      setMsgText('');
      setReplyToMsg(null);
      const { data: inserted } = await supabase.from('messages').insert({ from_user: user.id, to_user: chatUser.id, content, read: false, created_at: new Date() }).select().single();
      if (inserted) setMessages(prev => prev.map(m => m.id === tempId ? inserted : m));
      await supabase.from('notifications').insert({ user_id: chatUser.id, type: 'message', from_user_id: user.id, from_username: user.username, text: `${user.username} отправил сообщение`, read: false, created_at: new Date() });
    };

    const deleteMessageForMe = async (msgId) => {
      // Локальное удаление из UI
      setMessages(prev => prev.filter(m => m.id !== msgId));
      // В реальной БД нужно добавить поле deleted_for_me, но для простоты пока удаляем полностью
      await supabase.from('messages').delete().eq('id', msgId).eq('from_user', user.id);
      showToast('Сообщение удалено');
      setSelectedMessage(null);
    };

    const follow = async (targetId) => {
      let following = user.following || [];
      const isFollow = following.includes(targetId);
      const newFollowing = isFollow ? following.filter(id => id !== targetId) : [...following, targetId];
      await supabase.from('users').update({ following: newFollowing }).eq('id', user.id);
      user.following = newFollowing;
      const targetUser = users.find(u => u.id === targetId);
      if (targetUser) {
        let followers = targetUser.followers || [];
        const newFollowers = isFollow ? followers.filter(id => id !== user.id) : [...followers, user.id];
        await supabase.from('users').update({ followers: newFollowers }).eq('id', targetId);
      }
      loadData();
      showToast(isFollow ? 'Отписались' : 'Подписались');
    };

    const uploadAvatar = async (file) => {
      if (!file) return;
      setAvatarUploading(true);
      const fileName = `avatar_${user.id}_${Date.now()}.jpg`;
      const { error } = await supabase.storage.from('avatars').upload(fileName, file);
      if (error) { showToast('Ошибка'); setAvatarUploading(false); return; }
      const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(fileName);
      await supabase.from('users').update({ avatar: publicUrl }).eq('id', user.id);
      user.avatar = publicUrl;
      loadData();
      showToast('Аватар обновлён');
      setAvatarUploading(false);
    };

    const handleDeleteAccount = async () => {
      await supabase.from('users').delete().eq('id', user.id);
      showToast('Аккаунт удалён');
      onLogout();
    };

    const handleSaveName = async () => {
      if (!newName.trim()) return;
      await supabase.from('users').update({ full_name: newName }).eq('id', user.id);
      user.full_name = newName;
      setEditingName(false);
      loadData();
      showToast('Имя обновлено');
    };

    const handleMediaUpload = async (e) => {
      const files = Array.from(e.target.files);
      if (mediaList.length + files.length > 5) { showToast('Максимум 5 файлов'); return; }
      setUploadingMedia(true);
      const newMedia = await uploadMediaFiles(files);
      setMediaList([...mediaList, ...newMedia]);
      setUploadingMedia(false);
      e.target.value = '';
    };

    const removeMedia = (index) => setMediaList(mediaList.filter((_, i) => i !== index));

    const createPost = async () => {
      if (!newPost.trim() && mediaList.length === 0) { showToast('Напишите текст или добавьте медиа'); return; }
      
      const mentions = [...newPost.matchAll(/@(\w+)/g)].map(m => m[1]);
      for (const mention of mentions) {
        const exists = await checkUserExists(mention);
        if (!exists) {
          showToast(`Пользователь @${mention} не существует`);
          return;
        }
      }
      
      const hashtags = extractHashtags(newPost);
      const tempId = Date.now();
      const newPostObj = { id: tempId, user_id: user.id, username: user.username, content: newPost, media: mediaList, likes: 0, comments: [], mentions, hashtags, created_at: new Date().toISOString() };
      setPosts([newPostObj, ...posts]);
      setNewPost('');
      setMediaList([]);
      
      const { data: inserted } = await supabase.from('posts').insert({
        user_id: user.id, username: user.username, content: newPost, media: mediaList, likes: 0, comments: [], mentions, hashtags, created_at: new Date()
      }).select().single();
      if (inserted) setPosts(prev => prev.map(p => p.id === tempId ? inserted : p));
      
      for (const mention of mentions) {
        const mentioned = users.find(u => u.username === mention);
        if (mentioned && mentioned.id !== user.id) {
          await supabase.from('notifications').insert({ user_id: mentioned.id, type: 'mention', from_user_id: user.id, from_username: user.username, text: `${user.username} отметил вас в посте`, read: false, created_at: new Date() });
        }
      }
      showToast('Пост опубликован!');
    };

    const likePost = async (postId, likes) => {
      setPosts(prev => prev.map(p => p.id === postId ? { ...p, likes: likes + 1 } : p));
      await supabase.from('posts').update({ likes: likes + 1 }).eq('id', postId);
    };

    const addComment = async (postId, replyToComment = null) => {
      const text = commentTexts[postId] || '';
      if (!text.trim()) return;
      let content = text;
      if (replyToComment) {
        content = `[Ответ @${replyToComment.username}: "${replyToComment.text.substring(0, 50)}"]\n${text}`;
      }
      const post = posts.find(p => p.id === postId);
      const newComment = { id: Date.now(), user_id: user.id, username: user.username, text: content, created_at: new Date().toISOString() };
      const newComments = [...(post.comments || []), newComment];
      setPosts(prev => prev.map(p => p.id === postId ? { ...p, comments: newComments } : p));
      setCommentTexts({ ...commentTexts, [postId]: '' });
      setSelectedComment(null);
      await supabase.from('posts').update({ comments: newComments }).eq('id', postId);
      if (post.user_id !== user.id) {
        await supabase.from('notifications').insert({ user_id: post.user_id, type: 'comment', from_user_id: user.id, from_username: user.username, post_id: postId, text: `${user.username} прокомментировал ваш пост`, read: false, created_at: new Date() });
      }
    };

    const deleteComment = async (postId, commentId) => {
      const post = posts.find(p => p.id === postId);
      const newComments = (post.comments || []).filter(c => c.id !== commentId);
      setPosts(prev => prev.map(p => p.id === postId ? { ...p, comments: newComments } : p));
      await supabase.from('posts').update({ comments: newComments }).eq('id', postId);
      setSelectedComment(null);
      showToast('Комментарий удалён');
    };

    const deletePost = async (postId) => {
      setPosts(prev => prev.filter(p => p.id !== postId));
      await supabase.from('posts').delete().eq('id', postId).eq('user_id', user.id);
      setPostToDelete(null);
      showToast('Пост удалён');
    };

    const renderContent = (text) => {
      if (!text) return null;
      let parts = text.split(/(@\w+|#[\wа-яё]+)/gi);
      return parts.map((part, i) => {
        if (part.startsWith('@')) {
          const username = part.slice(1);
          return <span key={i} className="mention" onClick={() => { const u = users.find(x => x.username === username); if (u) setViewProfile(u); else showToast(`Пользователь @${username} не найден`); }}>{part}</span>;
        }
        if (part.startsWith('#')) {
          return <span key={i} className="hashtag" onClick={() => { setSearchQuery(part); setSearchType('posts'); setTab('search'); }}>{part}</span>;
        }
        return <span key={i}>{part}</span>;
      });
    };

    const handlePostInput = (e) => {
      const val = e.target.value;
      setNewPost(val);
      const cursor = e.target.selectionStart;
      const before = val.slice(0, cursor);
      const lastAt = before.lastIndexOf('@');
      if (lastAt !== -1 && (lastAt === before.length - 1 || before[lastAt + 1]?.match(/\s/))) {
        setShowMentions(true);
        setMentionQuery(before.slice(lastAt + 1));
        setMentionPos(lastAt);
      } else {
        setShowMentions(false);
      }
    };

    const insertMention = (username) => {
      const before = newPost.slice(0, mentionPos);
      const after = newPost.slice(mentionPos + 1 + mentionQuery.length);
      setNewPost(`${before}@${username} ${after}`);
      setShowMentions(false);
      textareaRef.current?.focus();
    };

    const filteredMentions = users.filter(u => u.id !== user.id && u.username.toLowerCase().includes(mentionQuery.toLowerCase())).slice(0, 5);

    const DropdownMenu = () => {
      const [open, setOpen] = React.useState(false);
      const ref = React.useRef(null);
      React.useEffect(() => { const fn = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }; document.addEventListener('click', fn); return () => document.removeEventListener('click', fn); }, []);
      return (
        <div className="relative" ref={ref}>
          <button onClick={() => setOpen(!open)} className="text-gray-400 hover:text-white p-1"><i className="fas fa-ellipsis-h"></i></button>
          {open && (
            <div className="dropdown-menu">
              <button onClick={() => { setEditingName(true); setOpen(false); }} className="w-full text-left px-4 py-2 text-sm text-white hover:bg-[#3a3a3a] rounded-t-xl"><i className="fas fa-pen mr-2"></i> Редактировать имя</button>
              <button onClick={() => { setShowDeleteConfirm(true); setOpen(false); }} className="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-[#3a3a3a] rounded-b-xl"><i className="fas fa-trash-alt mr-2"></i> Удалить аккаунт</button>
            </div>
          )}
        </div>
      );
    };

    if (loading) return <div className="min-h-screen flex items-center justify-center text-white">Загрузка...</div>;

    // Профиль другого пользователя (упрощённо)
    if (viewProfile) {
      const profileUser = viewProfile;
      const isFollowing = (user.following || []).includes(profileUser.id);
      const userPosts = posts.filter(p => p.user_id === profileUser.id);
      return (
        <div className="min-h-screen p-4">
          <button onClick={() => { setViewProfile(null); setShowSubscribers(false); setShowFollowing(false); }} className="text-gray-400 mb-4"><i className="fas fa-arrow-left mr-2"></i> Назад</button>
          <div className="card p-6 text-center mb-6">
            <img src={profileUser.avatar || 'https://via.placeholder.com/96'} className="w-24 h-24 rounded-full mx-auto object-cover" />
            <h2 className="text-xl font-bold text-white mt-2">{profileUser.full_name || profileUser.username}</h2>
            <p className="text-gray-400">@{profileUser.username}</p>
            <p className="text-gray-500 text-sm mt-1">{profileUser.bio || 'Нет описания'}</p>
            <div className="flex gap-3 justify-center mt-4">
              <button onClick={() => { setChatUser(profileUser); setViewProfile(null); setTab('chat'); }} className="bg-green-600 text-white px-4 py-1 rounded-full btn">Чат</button>
              <button onClick={() => follow(profileUser.id)} className={`px-4 py-1 rounded-full btn ${isFollowing ? 'bg-gray-600' : 'bg-blue-600 text-white'}`}>{isFollowing ? 'Отписаться' : 'Подписаться'}</button>
            </div>
            <div className="flex gap-6 justify-center mt-4">
              <button onClick={() => { setShowSubscribers(!showSubscribers); setShowFollowing(false); }} className="text-gray-400 hover:text-white text-sm"><span className="font-bold text-white">{profileUser.followers?.length || 0}</span> подписчиков</button>
              <button onClick={() => { setShowFollowing(!showFollowing); setShowSubscribers(false); }} className="text-gray-400 hover:text-white text-sm"><span className="font-bold text-white">{profileUser.following?.length || 0}</span> подписок</button>
            </div>
            {showSubscribers && (
              <div className="mt-4 p-3 bg-[#333] rounded-xl">
                <p className="text-gray-400 text-sm mb-2">Подписчики:</p>
                {users.filter(u => (profileUser.followers || []).includes(u.id)).map(u => (
                  <div key={u.id} className="flex items-center gap-2 p-1 cursor-pointer hover:bg-[#3a3a3a] rounded" onClick={() => setViewProfile(u)}>
                    <img src={u.avatar || 'https://via.placeholder.com/32'} className="w-6 h-6 rounded-full" />
                    <span className="text-white text-sm">@{u.username}</span>
                  </div>
                ))}
              </div>
            )}
            {showFollowing && (
              <div className="mt-4 p-3 bg-[#333] rounded-xl">
                <p className="text-gray-400 text-sm mb-2">Подписки:</p>
                {users.filter(u => (profileUser.following || []).includes(u.id)).map(u => (
                  <div key={u.id} className="flex items-center gap-2 p-1 cursor-pointer hover:bg-[#3a3a3a] rounded" onClick={() => setViewProfile(u)}>
                    <img src={u.avatar || 'https://via.placeholder.com/32'} className="w-6 h-6 rounded-full" />
                    <span className="text-white text-sm">@{u.username}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
          <h3 className="text-white font-bold mb-2">Посты</h3>
          {userPosts.map(post => (
            <div key={post.id} className="card p-4 mb-4">
              <p className="text-white whitespace-pre-wrap">{renderContent(post.content)}</p>
              <div className="flex gap-4 mt-2 text-gray-400 text-sm">
                <span><i className="fas fa-heart text-red-500"></i> {post.likes || 0}</span>
                <span><i className="far fa-comment"></i> {(post.comments || []).length}</span>
              </div>
            </div>
          ))}
        </div>
      );
    }

    return (
      <div className="min-h-screen pb-20">
        {/* Модалка удаления поста */}
        {postToDelete && <ConfirmModal message="Удалить пост навсегда?" onConfirm={() => deletePost(postToDelete)} onCancel={() => setPostToDelete(null)} />}
        {/* Модалка для комментария */}
        {selectedComment && (
          <ActionModal 
            item={selectedComment.comment} 
            type="comment" 
            onClose={() => setSelectedComment(null)} 
            onDelete={() => deleteComment(selectedComment.postId, selectedComment.comment.id)}
            onReply={() => {
              setCommentTexts({ ...commentTexts, [selectedComment.postId]: `[Ответ @${selectedComment.comment.username}: "${selectedComment.comment.text.substring(0, 50)}"]\n` });
              setSelectedComment(null);
              setTimeout(() => document.getElementById(`comment-input-${selectedComment.postId}`)?.focus(), 100);
            }}
          />
        )}
        {/* Модалка для сообщения */}
        {selectedMessage && (
          <ActionModal 
            item={selectedMessage.msg} 
            type="message" 
            onClose={() => setSelectedMessage(null)} 
            onDelete={() => deleteMessageForMe(selectedMessage.msg.id)}
            onReply={() => {
              setReplyToMsg(selectedMessage.msg);
              setSelectedMessage(null);
              document.getElementById('message-input')?.focus();
            }}
          />
        )}

        <header className="sticky top-0 z-20 border-b border-gray-700 bg-[#1a1a1a]/90 backdrop-blur-md p-4">
          <div className="max-w-2xl mx-auto flex justify-between items-center">
            <div className="flex items-center gap-2"><i className="fas fa-water text-white text-2xl"></i><span className="text-white font-bold text-xl">Wave</span></div>
            <div className="flex gap-4 text-gray-400">
              <button onClick={() => { setTab('feed'); setViewProfile(null); }} className={`text-xl ${tab === 'feed' ? 'text-white' : ''}`}><i className="fas fa-home"></i></button>
              <button onClick={() => { setTab('search'); setViewProfile(null); }} className={`text-xl ${tab === 'search' ? 'text-white' : ''}`}><i className="fas fa-search"></i></button>
              <button onClick={() => { setTab('chat'); setViewProfile(null); }} className={`text-xl relative ${tab === 'chat' ? 'text-white' : ''}`}><i className="fas fa-comments"></i>{Object.values(unread).reduce((a,b)=>a+b,0)>0 && <span className="absolute -top-1 -right-2 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">{Object.values(unread).reduce((a,b)=>a+b,0)}</span>}</button>
              <button onClick={() => { setTab('notify'); setViewProfile(null); }} className={`text-xl relative ${tab === 'notify' ? 'text-white' : ''}`}><i className="fas fa-bell"></i>{notifications.filter(n => !n.read).length > 0 && <span className="absolute -top-1 -right-2 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center">{notifications.filter(n => !n.read).length}</span>}</button>
              <button onClick={() => { setTab('profile'); setViewProfile(null); }} className={`text-xl ${tab === 'profile' ? 'text-white' : ''}`}><i className="fas fa-user"></i></button>
              <button onClick={onLogout} className="text-sm bg-gray-700 px-3 py-1 rounded-full">Выйти</button>
            </div>
          </div>
        </header>

        <main className="max-w-2xl mx-auto p-4">
          {tab === 'feed' && (
            <>
              <div className="card p-4 mb-6">
                <div className="flex gap-3">
                  <img src={user.avatar || 'https://via.placeholder.com/40'} className="w-10 h-10 rounded-full" />
                  <div className="flex-1 relative">
                    <textarea ref={textareaRef} rows="2" placeholder="Что нового? Используй @username или #хештег" className="w-full p-3 bg-[#333] rounded-xl text-white whitespace-pre-wrap" value={newPost} onChange={handlePostInput} />
                    {showMentions && filteredMentions.length > 0 && (
                      <div className="absolute bottom-full left-0 bg-[#2a2a2a] border border-gray-600 rounded-xl max-h-48 overflow-auto z-10 mb-1 w-48">
                        {filteredMentions.map(u => (
                          <div key={u.id} className="p-2 hover:bg-[#3a3a3a] cursor-pointer flex items-center gap-2" onClick={() => insertMention(u.username)}>
                            <img src={u.avatar || 'https://via.placeholder.com/32'} className="w-6 h-6 rounded-full" />
                            <span className="text-white">@{u.username}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="flex flex-wrap gap-2 mt-2">
                      {mediaList.map((m, idx) => (
                        <div key={idx} className="media-preview">
                          {m.type === 'video' ? <video src={m.url} className="w-20 h-20 object-cover" /> : <img src={m.url} className="w-20 h-20 object-cover" />}
                          <button className="remove-media" onClick={() => removeMedia(idx)}>×</button>
                        </div>
                      ))}
                    </div>
                    <div className="flex gap-2 mt-2">
                      <label className={`cursor-pointer bg-gray-700 p-2 rounded-xl ${uploadingMedia ? 'opacity-50' : ''}`}>
                        <i className="fas fa-paperclip"></i>
                        <input type="file" accept="image/*,video/*" multiple onChange={handleMediaUpload} className="hidden" disabled={uploadingMedia} />
                      </label>
                      <button onClick={createPost} className="bg-blue-600 text-white px-6 py-2 rounded-full text-sm btn">Опубликовать</button>
                    </div>
                  </div>
                </div>
              </div>
              {posts.map(post => (
                <div key={post.id} className="card p-4 mb-4">
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2 cursor-pointer" onClick={() => post.user_id !== user.id && setViewProfile(users.find(u => u.id === post.user_id))}>
                      <img src={post.user_avatar || 'https://via.placeholder.com/32'} className="w-8 h-8 rounded-full" />
                      <span className="font-bold text-white hover:underline">@{post.username}</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-gray-500 text-xs">{new Date(post.created_at).toLocaleString()}</span>
                      {post.user_id === user.id && (
                        <button onClick={() => setPostToDelete(post.id)} className="text-gray-500 hover:text-white"><i className="fas fa-ellipsis-h"></i></button>
                      )}
                    </div>
                  </div>
                  <p className="text-white whitespace-pre-wrap">{renderContent(post.content)}</p>
                  {post.media && post.media.length > 0 && (
                    <div className="grid grid-cols-3 gap-1 mt-2">
                      {post.media.map((m, idx) => m.type === 'video' ? <video key={idx} src={m.url} className="w-full h-24 object-cover rounded-lg" /> : <img key={idx} src={m.url} className="w-full h-24 object-cover rounded-lg" />)}
                    </div>
                  )}
                  <div className="flex gap-4 mt-3 text-gray-400 text-sm">
                    <button onClick={() => likePost(post.id, post.likes || 0)} className="flex gap-1 hover:text-red-400"><i className="fas fa-heart"></i> {post.likes || 0}</button>
                    <button onClick={() => { const div = document.getElementById(`comments-${post.id}`); if (div) div.classList.toggle('hidden'); }} className="flex gap-1 hover:text-blue-400"><i className="far fa-comment"></i> {(post.comments || []).length}</button>
                  </div>
                  <div id={`comments-${post.id}`} className="hidden mt-3 pt-3 border-t border-gray-700">
                    {(post.comments || []).map(c => (
                      <div key={c.id} className="flex gap-2 mb-2 text-sm p-2 hover:bg-[#333] rounded-xl cursor-pointer" onClick={() => setSelectedComment({ postId: post.id, comment: c })}>
                        <span className="font-bold text-gray-300 cursor-pointer" onClick={(e) => { e.stopPropagation(); c.user_id !== user.id && setViewProfile(users.find(u => u.id === c.user_id)); }}>@{c.username}</span>
                        <span className="text-gray-400 whitespace-pre-wrap">{c.text}</span>
                      </div>
                    ))}
                    <div className="flex gap-2 mt-2">
                      <input id={`comment-input-${post.id}`} type="text" placeholder="Комментарий..." className="flex-1 p-2 bg-[#333] rounded-xl text-sm text-white" value={commentTexts[post.id] || ''} onChange={e => setCommentTexts({ ...commentTexts, [post.id]: e.target.value })} />
                      <button onClick={() => addComment(post.id)} className="bg-gray-700 text-white px-3 rounded-xl text-sm btn">→</button>
                    </div>
                  </div>
                </div>
              ))}
            </>
          )}

          {tab === 'search' && (
            <div>
              <div className="card p-4 mb-6">
                <div className="flex gap-2 mb-3">
                  <button onClick={() => setSearchType('users')} className={`px-3 py-1 rounded-full text-sm ${searchType === 'users' ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300'}`}>👥 Пользователи</button>
                  <button onClick={() => setSearchType('posts')} className={`px-3 py-1 rounded-full text-sm ${searchType === 'posts' ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300'}`}>📄 Посты</button>
                </div>
                <input type="text" placeholder="Поиск пользователей, постов или хештегов #..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full p-3 bg-[#333] rounded-xl text-white" />
              </div>
              {searchType === 'users' && searchUserResults.map(u => (
                <div key={u.id} className="card p-4 mb-3 flex items-center justify-between">
                  <div className="flex items-center gap-3 cursor-pointer" onClick={() => setViewProfile(u)}>
                    <img src={u.avatar || 'https://via.placeholder.com/48'} className="w-10 h-10 rounded-full" />
                    <div><div className="font-bold text-white">{u.full_name || u.username}</div><div className="text-gray-400 text-sm">@{u.username}</div></div>
                  </div>
                  <button onClick={() => { setChatUser(u); setTab('chat'); }} className="bg-green-600 text-white px-3 py-1 rounded-full text-sm btn">Чат</button>
                </div>
              ))}
              {searchType === 'posts' && searchPostResults.map(post => (
                <div key={post.id} className="card p-4 mb-3 cursor-pointer" onClick={() => { setTab('feed'); setTimeout(() => document.getElementById(`post-${post.id}`)?.scrollIntoView({ behavior: 'smooth' }), 100); }}>
                  <div className="flex items-center gap-2 mb-2">
                    <img src={post.user_avatar || 'https://via.placeholder.com/32'} className="w-6 h-6 rounded-full" />
                    <span className="font-bold text-white text-sm">@{post.username}</span>
                  </div>
                  <p className="text-white text-sm whitespace-pre-wrap">{post.content.substring(0, 100)}...</p>
                  <div className="flex gap-3 mt-2 text-gray-500 text-xs">
                    <span><i className="fas fa-heart text-red-500"></i> {post.likes || 0}</span>
                    <span><i className="far fa-comment"></i> {(post.comments || []).length}</span>
                  </div>
                </div>
              ))}
              {searchQuery && searchType === 'users' && searchUserResults.length === 0 && <div className="text-center text-gray-500 py-4">Пользователи не найдены</div>}
              {searchQuery && searchType === 'posts' && searchPostResults.length === 0 && <div className="text-center text-gray-500 py-4">Посты не найдены</div>}
            </div>
          )}

          {tab === 'chat' && (
            <div className="flex flex-col h-[70vh]">
              <div className="flex gap-2 mb-4 overflow-x-auto">
                {chatList.map(cu => (
                  <button key={cu.id} onClick={() => setChatUser(cu)} className={`px-3 py-1 rounded-full text-sm ${chatUser?.id === cu.id ? 'bg-blue-600 text-white' : 'bg-gray-700 text-gray-300'}`}>@{cu.username}</button>
                ))}
              </div>
              {chatUser ? (
                <div className="card flex flex-col h-full">
                  <div className="p-3 border-b border-gray-700 font-bold text-white">Чат с @{chatUser.username}</div>
                  <div className="flex-1 overflow-y-auto p-3 space-y-2">
                    {replyToMsg && (
                      <div className="reply-quote">
                        <i className="fas fa-reply mr-1"></i> Ответ @{replyToMsg.from_user === user.id ? replyToMsg.to_user_username : replyToMsg.from_user_username}: "{replyToMsg.content.substring(0, 50)}"
                      </div>
                    )}
                    {messages.map((msg, idx) => {
                      const otherUser = msg.from_user === user.id ? chatUser : users.find(u => u.id === msg.from_user);
                      return (
                        <div key={idx} className={`flex ${msg.from_user === user.id ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[70%] p-2 rounded-xl ${msg.from_user === user.id ? 'bg-blue-600 text-white' : 'bg-[#333] text-white'} cursor-pointer`} onClick={() => setSelectedMessage({ msg })}>
                            <p className="text-sm whitespace-pre-wrap">{msg.content}</p>
                            <div className="text-xs opacity-70 mt-1">{new Date(msg.created_at).toLocaleTimeString()}</div>
                          </div>
                        </div>
                      );
                    })}
                    <div ref={messagesEndRef} />
                  </div>
                  <div className="p-3 border-t border-gray-700 flex gap-2">
                    <input id="message-input" type="text" placeholder="Сообщение..." value={msgText} onChange={e => setMsgText(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendMessage()} className="flex-1 p-2 bg-[#333] rounded-xl text-white text-sm" />
                    <button onClick={sendMessage} className="bg-blue-600 text-white px-4 rounded-xl btn">→</button>
                  </div>
                </div>
              ) : (
                <div className="card p-8 text-center text-gray-500">Выберите чат</div>
              )}
            </div>
          )}

          {tab === 'notify' && (
            <div>
              <h2 className="text-xl font-bold text-white mb-4">Уведомления</h2>
              {notifications.length === 0 && <div className="card p-8 text-center text-gray-500">Нет уведомлений</div>}
              {notifications.map(n => (
                <div key={n.id} className={`card p-4 mb-3 cursor-pointer ${!n.read ? 'border-l-4 border-green-500' : ''}`} onClick={async () => {
                  await supabase.from('notifications').update({ read: true }).eq('id', n.id);
                  setNotifications(prev => prev.map(not => not.id === n.id ? { ...not, read: true } : not));
                  if (n.type === 'message') {
                    const from = users.find(u => u.id === n.from_user_id);
                    if (from) { setChatUser(from); setTab('chat'); }
                  } else {
                    setTab('feed');
                  }
                }}>
                  <p className="text-white">{n.text}</p>
                  <p className="text-xs text-gray-500 mt-1">{new Date(n.created_at).toLocaleString()}</p>
                </div>
              ))}
            </div>
          )}

          {tab === 'profile' && (
            <div className="card p-6 text-center">
              <div className="flex justify-end">
                <DropdownMenu />
              </div>
              <div className="profile-avatar w-24 h-24 mx-auto">
                <img src={user.avatar || 'https://via.placeholder.com/96'} className="w-24 h-24 rounded-full mx-auto object-cover" />
                <input type="file" accept="image/*" onChange={(e) => uploadAvatar(e.target.files[0])} disabled={avatarUploading} />
              </div>
              {editingName ? (
                <div className="flex gap-2 justify-center mt-2">
                  <input value={newName} onChange={e => setNewName(e.target.value)} className="text-xl font-bold bg-[#333] rounded-lg px-2 py-1 text-white" />
                  <button onClick={handleSaveName} className="bg-green-700 text-white px-3 rounded-lg">💾</button>
                  <button onClick={() => { setEditingName(false); setNewName(user.full_name); }} className="bg-gray-700 text-white px-3 rounded-lg">✖</button>
                </div>
              ) : (
                <h2 className="text-xl font-bold text-white mt-2">{user.full_name || user.username}</h2>
              )}
              <p className="text-gray-400">@{user.username}</p>
              <p className="text-gray-500 text-sm mt-1">{user.bio || 'Нет описания'}</p>
              <div className="flex gap-6 justify-center mt-4">
                <div><span className="font-bold text-white">{posts.filter(p => p.user_id === user.id).length}</span><span className="text-gray-500 ml-1">постов</span></div>
                <div><span className="font-bold text-white">{user.followers?.length || 0}</span><span className="text-gray-500 ml-1">подписчиков</span></div>
                <div><span className="font-bold text-white">{user.following?.length || 0}</span><span className="text-gray-500 ml-1">подписок</span></div>
              </div>
              {showDeleteConfirm && (
                <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50" onClick={() => setShowDeleteConfirm(false)}>
                  <div className="bg-[#2a2a2a] rounded-3xl p-6 max-w-sm w-full">
                    <p className="text-white mb-6">Удалить аккаунт навсегда?</p>
                    <div className="flex gap-3">
                      <button onClick={handleDeleteAccount} className="flex-1 bg-red-900 text-white py-2 rounded-xl hover:bg-red-800">Да</button>
                      <button onClick={() => setShowDeleteConfirm(false)} className="flex-1 bg-gray-700 text-white py-2 rounded-xl hover:bg-gray-600">Нет</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </main>
      </div>
    );
  }

  function App() {
    const [access, setAccess] = React.useState(false);
    const [user, setUser] = React.useState(null);
    const [loading, setLoading] = React.useState(true);

    React.useEffect(() => {
      if (localStorage.getItem('wave_access') === 'ok') setAccess(true);
      const saved = localStorage.getItem('wave_user');
      if (saved) setUser(JSON.parse(saved));
      setLoading(false);
    }, []);

    const handleLogin = (u) => { localStorage.setItem('wave_user', JSON.stringify(u)); setUser(u); };
    const handleLogout = () => { localStorage.removeItem('wave_user'); setUser(null); };

    if (loading) return <div className="p-4 text-white">Загрузка...</div>;
    if (!access) return <PasswordGate onSuccess={() => setAccess(true)} />;
    if (user) return <AppMain user={user} onLogout={handleLogout} />;
    return <Auth onLogin={handleLogin} />;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
