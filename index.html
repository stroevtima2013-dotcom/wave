<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Wave Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f0f0f; margin: 0; padding: 0; }
    #root { min-height: 100vh; background: #0f0f0f; }
    .card { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 24px; transition: 0.2s; box-shadow: 0 0 5px rgba(255,255,255,0.05); }
    .card:hover { transform: translateY(-3px); border-color: #4a4a4a; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e1e1e; border: 1px solid #333; color: white; padding: 8px 18px; border-radius: 40px; z-index: 1000; font-size: 14px; animation: fadeInUp 0.3s ease; z-index: 3000; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .media-preview { position: relative; display: inline-block; margin: 4px; border-radius: 14px; overflow: hidden; border: 1px solid #3a3a3a; width: 80px; height: 80px; cursor: pointer; }
    .media-preview img, .media-preview video { width: 100%; height: 100%; object-fit: cover; }
    .remove-media { position: absolute; top: -8px; right: -8px; background: #ef4444; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; color: white; z-index: 10; }
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 16px; min-width: 160px; z-index: 50; overflow: hidden; }
    .dropdown-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: #e0e0e0; transition: 0.15s; cursor: pointer; }
    .dropdown-item:hover { background: #2a2a2a; }
    .reply-quote { background: #1a1a1a; padding: 6px 10px; border-radius: 12px; border-left: 3px solid #3b82f6; font-size: 11px; color: #aaa; margin-bottom: 6px; display: flex; flex-direction: column; gap: 2px; }
    .mention { color: #3b82f6; font-weight: 600; cursor: pointer; background: rgba(59,130,246,0.15); padding: 2px 6px; border-radius: 12px; display: inline-block; }
    .hashtag { color: #eab308; font-weight: 600; cursor: pointer; background: rgba(234,179,8,0.15); padding: 2px 6px; border-radius: 12px; display: inline-block; }
    .white-glow-btn { background: white; color: #111; box-shadow: 0 0 8px rgba(255,255,255,0.3); transition: 0.2s; font-weight: 500; cursor: pointer; border: none; border-radius: 40px; padding: 8px 20px; white-space: nowrap; }
    .white-glow-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255,255,255,0.5); background: #f0f0f0; }
    .icon-btn { background: white; color: #111; border-radius: 40px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; border: none; transition: 0.2s; white-space: nowrap; }
    .icon-btn:hover { transform: scale(1.02); background: #f5f5f5; }
    .modal-media { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .modal-media-content { max-width: 90vw; max-height: 85vh; border-radius: 20px; object-fit: contain; }
    .fullscreen-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fullscreen-modal-content { background: #1a1a1a; border-radius: 32px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 24px; border: 1px solid #3a3a3a; animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .poll-option { background: #2a2a2a; border-radius: 12px; margin: 8px 0; overflow: hidden; transition: 0.2s; cursor: pointer; }
    .poll-option:hover { background: #333; }
    .poll-bar { background: #3b82f6; height: 100%; transition: width 0.3s ease; }
    .chat-user-list { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
    .chat-user-item { background: #1a1a1a; border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.2s; border: 1px solid #2c2c2c; display: flex; align-items: center; gap: 12px; }
    .chat-user-item:hover { background: #252525; border-color: #3b82f6; }
    .chat-messages { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; padding: 12px; }
    .message-bubble { max-width: 80%; padding: 10px 14px; border-radius: 20px; word-break: break-word; position: relative; transition: transform 0.3s ease; }
    .message-mine { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message-theirs { background: #2a2a2a; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message-bubble.swipe-left { transform: translateX(-100px); opacity: 0.5; }
    .message-bubble.swipe-right { transform: translateX(100px); opacity: 0.5; }
    .read-more-container { position: relative; }
    .read-more-content { overflow: hidden; transition: max-height 0.3s ease; }
    .read-more-content.collapsed { max-height: 150px; }
    .read-more-content.expanded { max-height: 2000px; }
    .read-more-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: linear-gradient(to bottom, transparent, #1a1a1a); pointer-events: none; }
    .read-more-btn { background: #3b82f6; color: white; border: none; padding: 6px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; margin-top: 8px; transition: 0.2s; display: inline-block; width: auto; }
    .read-more-btn:hover { background: #2563eb; }
    .media-carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; scrollbar-width: thin; border-radius: 16px; }
    .media-carousel > * { scroll-snap-align: start; flex: 0 0 100%; }
    .close-fullscreen { position: fixed; top: 20px; right: 20px; background: rgba(50,50,60,0.8); backdrop-filter: blur(8px); border-radius: 40px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2001; color: white; font-size: 20px; transition: 0.2s; border: 1px solid rgba(255,255,255,0.2); }
    .close-fullscreen:hover { background: rgba(80,80,100,0.9); transform: scale(1.05); }
    .shared-post-quote { background: #252525; border-radius: 16px; padding: 10px; margin-top: 6px; border-left: 3px solid #3b82f6; cursor: pointer; transition: 0.2s; }
    .shared-post-quote:hover { background: #2a2a2a; transform: translateX(2px); }
    .avatar-crop-container { display: flex; flex-direction: column; align-items: center; }
    .crop-canvas { border-radius: 50%; overflow: hidden; width: 220px; height: 220px; margin: 20px auto; border: 3px solid #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.3); background: #1a1a1a; cursor: grab; }
    .crop-canvas:active { cursor: grabbing; }
    .crop-slider { width: 100%; margin: 15px 0; accent-color: #3b82f6; }
    .confirm-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 3000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
    .confirm-modal-content { background: #1a1a1a; border-radius: 32px; width: 90%; max-width: 400px; padding: 28px; border: 1px solid #3a3a3a; text-align: center; }
    .track-card { background: #1a1a1a; border-radius: 16px; padding: 12px; margin-bottom: 12px; transition: 0.2s; cursor: pointer; }
    .track-card:hover { background: #252525; transform: translateX(5px); }
    .track-cover { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; background: #2a2a2a; display: flex; align-items: center; justify-content: center; }
    .audio-player { width: 100%; height: 40px; border-radius: 20px; }
    .audio-player::-webkit-media-controls-panel { background: #2a2a2a; }
    .swipe-delete { position: absolute; top: 0; bottom: 0; width: 80px; display: flex; align-items: center; justify-content: center; background: #ef4444; color: white; transition: 0.3s; z-index: -1; }
    .swipe-delete.left { left: 0; border-radius: 20px 0 0 20px; }
    .swipe-delete.right { right: 0; border-radius: 0 20px 20px 0; }
    @media (max-width: 640px) {
      .message-bubble { max-width: 90%; }
      .chat-user-item { padding: 10px; }
      .card { border-radius: 16px; }
      .icon-btn { padding: 6px 10px; font-size: 11px; }
      .white-glow-btn { padding: 6px 12px; font-size: 11px; }
      .modal-media-content { max-width: 95vw; max-height: 80vh; }
      .close-fullscreen { top: 10px; right: 10px; width: 36px; height: 36px; font-size: 16px; }
      .post-actions { flex-wrap: wrap !important; gap: 6px !important; }
    }
  </style>
</head>
<body>
<div id="root"><div class="flex items-center justify-center min-h-screen text-white"><i class="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const STORAGE_BUCKET = "wave-media";
  const DEFAULT_AVATAR = "https://ui-avatars.com/api/?background=3b82f6&color=fff&rounded=true&size=96&bold=true&length=2&name=?";
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Функции для работы с аудио через бесплатный хостинг
  async function uploadAudioToHosting(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('reqtype', 'fileupload');
    
    try {
      const response = await fetch('https://catbox.moe/user/api.php', {
        method: 'POST',
        body: formData
      });
      const url = await response.text();
      if (url && url.startsWith('https://files.catbox.moe/')) {
        return url.trim();
      }
    } catch(e) { console.error('Audio upload error:', e); }
    
    // Fallback: audio to base64 (for small files)
    if (file.size < 1000000) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }
    return null;
  }

  async function uploadImageToHosting(file) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('reqtype', 'fileupload');
    
    try {
      const response = await fetch('https://catbox.moe/user/api.php', {
        method: 'POST',
        body: formData
      });
      const url = await response.text();
      if (url && url.startsWith('https://files.catbox.moe/')) {
        return url.trim();
      }
    } catch(e) { console.error('Image upload error:', e); }
    return null;
  }

  function showToast(msg) { 
    const t = document.createElement('div'); 
    t.className = 'toast'; 
    t.innerHTML = msg; 
    document.body.appendChild(t); 
    setTimeout(() => t.remove(), 2800); 
  }
  
  function formatDate(iso) { 
    if(!iso) return 'только что';
    const d = new Date(iso);
    const now = new Date();
    const mskOffset = 3 * 60;
    const localOffset = now.getTimezoneOffset();
    const mskTime = new Date(d.getTime() + (localOffset + mskOffset) * 60000);
    const nowMsk = new Date(now.getTime() + (localOffset + mskOffset) * 60000);
    const diff = Math.floor((nowMsk - mskTime) / 1000);
    if (diff < 60) return 'только что';
    if (diff < 3600) return `${Math.floor(diff/60)} мин назад`;
    if (diff < 86400) {
      const h = mskTime.getHours().toString().padStart(2,'0');
      const m = mskTime.getMinutes().toString().padStart(2,'0');
      const dNum = mskTime.getDate();
      const nowDate = nowMsk.getDate();
      if (dNum === nowDate) return `сегодня в ${h}:${m}`;
      if (dNum === nowDate - 1) return `вчера в ${h}:${m}`;
      return `${mskTime.toLocaleDateString('ru-RU', {day:'numeric', month:'short'})} в ${h}:${m}`;
    }
    if (diff < 172800) return 'вчера';
    if (diff < 604800) return `${Math.floor(diff/86400)} дн назад`;
    if (diff < 2592000) return `${Math.floor(diff/604800)} нед назад`;
    if (diff < 31536000) return `${Math.floor(diff/2592000)} мес назад`;
    return `${Math.floor(diff/31536000)} г назад`;
  }
  
  function formatNumber(n) { 
    if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M'; 
    if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K'; 
    return n; 
  }

  // Swipeable Message Component
  function SwipeableMessage({ message, isMine, onDelete, children }) {
    const [swipeOffset, setSwipeOffset] = React.useState(0);
    const [startX, setStartX] = React.useState(0);
    const [isDragging, setIsDragging] = React.useState(false);
    const messageRef = React.useRef(null);

    const handleTouchStart = (e) => {
      setStartX(e.touches[0].clientX);
      setIsDragging(true);
    };

    const handleTouchMove = (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - startX;
      const maxSwipe = 80;
      let newOffset = 0;
      if (isMine && deltaX < 0) newOffset = Math.max(-maxSwipe, deltaX);
      if (!isMine && deltaX > 0) newOffset = Math.min(maxSwipe, deltaX);
      setSwipeOffset(newOffset);
    };

    const handleTouchEnd = () => {
      setIsDragging(false);
      if (Math.abs(swipeOffset) > 50) {
        onDelete(message.id);
      }
      setSwipeOffset(0);
    };

    return (
      <div 
        ref={messageRef}
        style={{ transform: `translateX(${swipeOffset}px)`, transition: isDragging ? 'none' : 'transform 0.3s ease' }}
        onTouchStart={handleTouchStart}
        onTouchMove={handleTouchMove}
        onTouchEnd={handleTouchEnd}
      >
        {children}
      </div>
    );
  }

  // Poll Component with vote changing
  function PollComponent({ poll, postId, userId, onVote }) {
    const userVoteIndex = poll?.user_vote_index !== undefined && poll?.voted_by?.includes(userId) ? poll.user_vote_index : -1;
    const totalVotes = poll?.options?.reduce((sum, opt) => sum + (opt.votes || 0), 0) || 0;
    
    const handleVote = async (optionIndex) => {
      let newPoll = JSON.parse(JSON.stringify(poll));
      
      if (userVoteIndex !== -1) {
        // Remove old vote
        newPoll.options[userVoteIndex].votes = Math.max(0, (newPoll.options[userVoteIndex].votes || 0) - 1);
        newPoll.voted_by = newPoll.voted_by.filter(id => id !== userId);
      }
      
      if (optionIndex !== userVoteIndex) {
        // Add new vote
        newPoll.options[optionIndex].votes = (newPoll.options[optionIndex].votes || 0) + 1;
        newPoll.voted_by = [...newPoll.voted_by, userId];
        newPoll.user_vote_index = optionIndex;
        showToast('✅ Голос изменён!');
      } else {
        newPoll.user_vote_index = -1;
        showToast('🗳 Голос убран');
      }
      
      onVote(postId, newPoll);
    };
    
    return (
      <div className="mt-3 p-3 bg-[#252525] rounded-xl">
        <p className="text-white text-sm font-medium mb-2">{poll?.question || 'Опрос'}</p>
        {poll?.options?.map((opt, idx) => {
          const percent = totalVotes > 0 ? ((opt.votes || 0) / totalVotes) * 100 : 0;
          const isUserVote = userVoteIndex === idx;
          return (
            <div 
              key={idx} 
              className="poll-option"
              onClick={() => handleVote(idx)}
            >
              <div className="relative p-2">
                <div className="poll-bar absolute left-0 top-0 h-full rounded-xl" style={{ width: `${percent}%`, opacity: 0.3 }}></div>
                <div className="relative flex justify-between items-center z-10">
                  <span className="text-white text-sm">
                    {opt.text} 
                    {isUserVote && <span className="text-green-400 text-xs ml-1">✓ ваш голос</span>}
                  </span>
                  <span className="text-gray-300 text-xs">{percent.toFixed(1)}% ({opt.votes || 0})</span>
                </div>
              </div>
            </div>
          );
        })}
        <p className="text-gray-500 text-xs mt-2 text-center">📊 Всего голосов: {totalVotes}</p>
      </div>
    );
  }

  // Track Component for Music Section
  function TrackComponent({ track, currentUser, onLike, onComment, onShare, onPlay }) {
    const [showComments, setShowComments] = React.useState(false);
    const [commentText, setCommentText] = React.useState('');
    const hasLiked = track.liked_by?.includes(currentUser.id);
    
    const addComment = () => {
      if (!commentText.trim()) return;
      const newComment = {
        id: Date.now(),
        user_id: currentUser.id,
        username: currentUser.username,
        user_avatar: currentUser.avatar,
        text: commentText,
        created_at: new Date().toISOString()
      };
      onComment(track.id, [...(track.comments || []), newComment]);
      setCommentText('');
    };
    
    return (
      <div className="track-card">
        <div className="flex gap-3">
          <div className="track-cover flex-shrink-0" onClick={() => onPlay(track)}>
            {track.cover_url ? (
              <img src={track.cover_url} className="w-full h-full rounded-xl object-cover" />
            ) : (
              <div className="w-full h-full flex items-center justify-center bg-gradient-to-br from-purple-600 to-blue-600 rounded-xl">
                <i className="fas fa-music text-white text-2xl"></i>
              </div>
            )}
          </div>
          <div className="flex-1">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-white font-bold text-base">{track.title}</h3>
                <p className="text-gray-400 text-xs">@{track.author_username}</p>
              </div>
              <button onClick={() => onShare(track)} className="text-gray-400 hover:text-white p-2">
                <i className="fas fa-share-alt"></i>
              </button>
            </div>
            <div className="mt-2">
              <audio controls className="audio-player w-full" src={track.audio_url}>
                <source src={track.audio_url} type="audio/mpeg" />
              </audio>
            </div>
            <div className="flex gap-4 mt-2 text-gray-400 text-sm">
              <button onClick={() => onLike(track.id)} className={`flex gap-1 hover:text-red-400 ${hasLiked ? 'text-red-500' : ''}`}>
                <i className="fas fa-heart"></i> {formatNumber(track.likes || 0)}
              </button>
              <button onClick={() => setShowComments(!showComments)} className="flex gap-1 hover:text-blue-400">
                <i className="far fa-comment"></i> {(track.comments || []).length}
              </button>
            </div>
          </div>
        </div>
        {showComments && (
          <div className="mt-3 pl-2 border-l-2 border-gray-700">
            <div className="space-y-2 max-h-48 overflow-y-auto">
              {(track.comments || []).map(c => (
                <div key={c.id} className="flex gap-2 text-sm">
                  <img src={c.user_avatar || DEFAULT_AVATAR} className="w-5 h-5 rounded-full" />
                  <div>
                    <span className="text-gray-400 text-xs">@{c.username}</span>
                    <p className="text-white text-xs">{c.text}</p>
                  </div>
                </div>
              ))}
            </div>
            <div className="flex gap-2 mt-2">
              <input 
                type="text" 
                placeholder="Комментарий..." 
                value={commentText} 
                onChange={e => setCommentText(e.target.value)}
                className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white text-xs"
              />
              <button onClick={addComment} className="bg-blue-600 text-white px-3 rounded-xl text-xs">→</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  // Music Upload Modal
  function MusicUploadModal({ onClose, onUpload }) {
    const [title, setTitle] = React.useState('');
    const [audioFile, setAudioFile] = React.useState(null);
    const [coverFile, setCoverFile] = React.useState(null);
    const [uploading, setUploading] = React.useState(false);
    const [coverPreview, setCoverPreview] = React.useState(null);
    
    const handleSubmit = async () => {
      if (!title.trim() || !audioFile) {
        showToast('Заполните название и выберите аудиофайл');
        return;
      }
      setUploading(true);
      const audioUrl = await uploadAudioToHosting(audioFile);
      let coverUrl = null;
      if (coverFile) {
        coverUrl = await uploadImageToHosting(coverFile);
      }
      if (audioUrl) {
        await onUpload({ title: title.trim(), audio_url: audioUrl, cover_url: coverUrl });
        onClose();
      } else {
        showToast('Ошибка загрузки аудио');
      }
      setUploading(false);
    };
    
    return (
      <div className="fullscreen-modal" onClick={onClose}>
        <div className="fullscreen-modal-content" onClick={e => e.stopPropagation()}>
          <h2 className="text-white text-xl font-bold mb-4">Загрузить трек</h2>
          <input 
            type="text" 
            placeholder="Название трека" 
            value={title} 
            onChange={e => setTitle(e.target.value)}
            className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white mb-3"
          />
          <label className="block mb-2 text-gray-400 text-sm">Аудиофайл (MP3):</label>
          <input 
            type="file" 
            accept="audio/*" 
            onChange={e => setAudioFile(e.target.files[0])}
            className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm mb-3"
          />
          <label className="block mb-2 text-gray-400 text-sm">Обложка (опционально):</label>
          <input 
            type="file" 
            accept="image/*" 
            onChange={e => {
              const file = e.target.files[0];
              setCoverFile(file);
              if (file) {
                const reader = new FileReader();
                reader.onloadend = () => setCoverPreview(reader.result);
                reader.readAsDataURL(file);
              }
            }}
            className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm mb-3"
          />
          {coverPreview && (
            <img src={coverPreview} className="w-20 h-20 rounded-xl object-cover mb-3" />
          )}
          <div className="flex gap-3">
            <button onClick={handleSubmit} disabled={uploading} className="flex-1 bg-blue-600 py-3 rounded-xl text-white font-semibold">
              {uploading ? <i className="fas fa-spinner fa-spin"></i> : 'Загрузить'}
            </button>
            <button onClick={onClose} className="flex-1 bg-gray-700 py-3 rounded-xl text-white">Отмена</button>
          </div>
        </div>
      </div>
    );
  }

  function SharedTrackQuote({ track, onGoToTrack }) {
    return (
      <div className="shared-post-quote" onClick={() => onGoToTrack(track.id)}>
        <div className="flex gap-2 items-center">
          {track.cover_url ? (
            <img src={track.cover_url} className="w-10 h-10 rounded-lg object-cover" />
          ) : (
            <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-purple-600 to-blue-600 flex items-center justify-center">
              <i className="fas fa-music text-white text-sm"></i>
            </div>
          )}
          <div>
            <p className="text-white text-sm font-medium">{track.title}</p>
            <p className="text-gray-400 text-xs">@{track.author_username}</p>
          </div>
        </div>
      </div>
    );
  }

  // Main App Component
  function MainApp({ user, onLogout }) {
    const [tab, setTab] = React.useState('feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [tracks, setTracks] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(null);
    const [messages, setMessages] = React.useState([]);
    const [chatList, setChatList] = React.useState([]);
    const [unread, setUnread] = React.useState({});
    const [notifs, setNotifs] = React.useState([]);
    const [viewProfile, setViewProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [newPost, setNewPost] = React.useState('');
    const [media, setMedia] = React.useState([]);
    const [uploading, setUploading] = React.useState(false);
    const [msgText, setMsgText] = React.useState('');
    const [msgMedia, setMsgMedia] = React.useState([]);
    const [uploadingMsg, setUploadingMsg] = React.useState(false);
    const [search, setSearch] = React.useState('');
    const [searchUsers, setSearchUsers] = React.useState([]);
    const [searchPosts, setSearchPosts] = React.useState([]);
    const [sType, setSType] = React.useState('users');
    const [showMusicUpload, setShowMusicUpload] = React.useState(false);
    const [musicTab, setMusicTab] = React.useState('my');
    const [editingTrack, setEditingTrack] = React.useState(null);
    const [shareTrack, setShareTrack] = React.useState(null);
    const [sharePost, setSharePost] = React.useState(null);
    const [delPostId, setDelPostId] = React.useState(null);
    const [fullscreenMedia, setFullscreenMedia] = React.useState(null);
    const [tempPoll, setTempPoll] = React.useState(null);
    const [showPollModal, setShowPollModal] = React.useState(false);
    const [showHideModal, setShowHideModal] = React.useState(false);
    const [hideSel, setHideSel] = React.useState([]);
    const [commentsPagePost, setCommentsPagePost] = React.useState(null);
    const [commentsReturnToPost, setCommentsReturnToPost] = React.useState(null);
    const [switchDialog, setSwitchDialog] = React.useState(false);
    const [switchUser, setSwitchUser] = React.useState('');
    const [switchPass, setSwitchPass] = React.useState('');
    const [switchErr, setSwitchErr] = React.useState('');
    const [showMentions, setShowMentions] = React.useState(false);
    const [mentionQuery, setMentionQuery] = React.useState('');
    const [mentionPos, setMentionPos] = React.useState(0);
    const [scrollingToPost, setScrollingToPost] = React.useState(null);
    const [showSubs, setShowSubs] = React.useState(false);
    const [showFollows, setShowFollows] = React.useState(false);
    const [showConfirmDeletePost, setShowConfirmDeletePost] = React.useState(false);
    const [showConfirmDeleteAccount, setShowConfirmDeleteAccount] = React.useState(false);
    const [currentPlayingTrack, setCurrentPlayingTrack] = React.useState(null);
    const textareaRef = React.useRef(null);
    const messageIdsSet = React.useRef(new Set());
    const chatContainerRef = React.useRef(null);
    const postRefs = React.useRef({});

    React.useEffect(() => {
      if (chatContainerRef.current) {
        chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
      }
    }, [messages]);

    React.useEffect(() => {
      if (scrollingToPost && postRefs.current[scrollingToPost]) {
        postRefs.current[scrollingToPost].scrollIntoView({ behavior: 'smooth', block: 'center' });
        setScrollingToPost(null);
      }
    }, [scrollingToPost, posts]);

    const loadAll = async () => {
      try {
        const [pRes, uRes, mRes, nRes, tRes] = await Promise.all([
          supabase.from('posts').select('*').order('created_at', { ascending: false }),
          supabase.from('users').select('*'),
          supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`).order('created_at', { ascending: true }),
          supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false }),
          supabase.from('tracks').select('*').order('likes', { ascending: false })
        ]);
        const all = pRes.data || [];
        const visible = all.filter(p => !p.hidden_from?.includes(user.id));
        setPosts(visible);
        setUsers(uRes.data || []);
        setNotifs(nRes.data || []);
        setTracks(tRes.data || []);
        
        const { data: updatedUser } = await supabase.from('users').select('*').eq('id', user.id).single();
        if (updatedUser) {
          user.following = updatedUser.following || [];
          user.followers = updatedUser.followers || [];
          user.avatar = updatedUser.avatar;
          user.full_name = updatedUser.full_name;
          user.bio = updatedUser.bio;
        }
        
        const msgs = mRes.data || [];
        const chatSet = new Set();
        msgs.forEach(m=>{ if(m.from_user!==user.id) chatSet.add(m.from_user); if(m.to_user!==user.id) chatSet.add(m.from_user); if(m.from_user===user.id) chatSet.add(m.to_user); });
        setChatList(uRes.data?.filter(u=>chatSet.has(u.id) && u.id !== user.id)||[]);
        const cnt = {};
        msgs.forEach(m=>{ if(m.to_user===user.id && !m.read) cnt[m.from_user]=(cnt[m.from_user]||0)+1; });
        setUnread(cnt);
        if(chatUser){
          const chatMsgs = msgs.filter(m=>(m.from_user===user.id&&m.to_user===chatUser.id)||(m.from_user===chatUser.id&&m.to_user===user.id));
          setMessages(chatMsgs);
          await supabase.from('messages').update({read:true}).eq('to_user',user.id).eq('from_user',chatUser.id);
        }
      } catch(e) { console.error(e); showToast('Ошибка загрузки'); }
      setLoading(false);
    };

    React.useEffect(() => { loadAll(); }, []);
    React.useEffect(() => { if(chatUser) loadAll(); }, [chatUser]);

    React.useEffect(() => {
      const pSub = supabase.channel('posts').on('postgres_changes', {event:'*',schema:'public',table:'posts'}, () => loadAll()).subscribe();
      const tSub = supabase.channel('tracks').on('postgres_changes', {event:'*',schema:'public',table:'tracks'}, () => loadAll()).subscribe();
      const mSub = supabase.channel('messages').on('postgres_changes', {event:'INSERT',schema:'public',table:'messages'}, (payload) => {
        const newMsg = payload.new;
        if (messageIdsSet.current.has(newMsg.id)) return;
        messageIdsSet.current.add(newMsg.id);
        if ((newMsg.to_user === user.id || newMsg.from_user === user.id)) {
          if (chatUser && (newMsg.from_user === chatUser.id || newMsg.to_user === chatUser.id)) {
            setMessages(prev => [...prev, newMsg]);
            if (newMsg.to_user === user.id) {
              supabase.from('messages').update({read:true}).eq('id', newMsg.id);
              setUnread(prev => ({...prev, [newMsg.from_user]: 0}));
            }
          } else {
            loadAll();
          }
        }
      }).subscribe();
      return () => { pSub.unsubscribe(); tSub.unsubscribe(); mSub.unsubscribe(); };
    }, [chatUser, user.id]);

    // Music functions
    const uploadTrack = async (trackData) => {
      const newTrack = {
        id: Date.now(),
        title: trackData.title,
        audio_url: trackData.audio_url,
        cover_url: trackData.cover_url,
        author_id: user.id,
        author_username: user.username,
        likes: 0,
        liked_by: [],
        comments: [],
        created_at: new Date().toISOString()
      };
      const { data, error } = await supabase.from('tracks').insert(newTrack).select().single();
      if (!error) {
        setTracks([data, ...tracks]);
        showToast('Трек загружен!');
      } else {
        showToast('Ошибка: ' + error.message);
      }
    };

    const likeTrack = async (trackId) => {
      const track = tracks.find(t => t.id === trackId);
      if (!track) return;
      
      let newLikes = track.likes || 0;
      let newLikedBy = [...(track.liked_by || [])];
      
      if (newLikedBy.includes(user.id)) {
        newLikes--;
        newLikedBy = newLikedBy.filter(id => id !== user.id);
      } else {
        newLikes++;
        newLikedBy.push(user.id);
      }
      
      const updatedTrack = { ...track, likes: newLikes, liked_by: newLikedBy };
      setTracks(prev => prev.map(t => t.id === trackId ? updatedTrack : t));
      await supabase.from('tracks').update({ likes: newLikes, liked_by: newLikedBy }).eq('id', trackId);
    };

    const commentTrack = async (trackId, newComments) => {
      setTracks(prev => prev.map(t => t.id === trackId ? { ...t, comments: newComments } : t));
      await supabase.from('tracks').update({ comments: newComments }).eq('id', trackId);
    };

    const shareTrackToChat = async (track, chatUserId) => {
      const msgObj = { 
        from_user: user.id, 
        to_user: chatUserId, 
        content: '',
        shared_track: track,
        read: false, 
        created_at: new Date() 
      };
      const { error } = await supabase.from('messages').insert(msgObj).select().single();
      if (!error) {
        setChatUser(users.find(u => u.id === chatUserId));
        setTab('chat');
        setShareTrack(null);
        showToast('Трек отправлен в чат');
      }
    };

    const sharePostToChat = async (post, chatUserId) => {
      const msgObj = { 
        from_user: user.id, 
        to_user: chatUserId, 
        content: '',
        shared_post: post,
        read: false, 
        created_at: new Date() 
      };
      const { error } = await supabase.from('messages').insert(msgObj).select().single();
      if (!error) {
        setChatUser(users.find(u => u.id === chatUserId));
        setTab('chat');
        setSharePost(null);
        showToast('Пост отправлен в чат');
      }
    };

    const deleteMessage = async (messageId) => {
      setMessages(prev => prev.filter(m => m.id !== messageId));
      await supabase.from('messages').delete().eq('id', messageId);
      showToast('Сообщение удалено');
    };

    const createPost = async () => {
      if(!newPost.trim() && media.length===0 && !tempPoll){ showToast('Напишите текст или добавьте медиа/опрос'); return; }
      
      const mentions = [...newPost.matchAll(/@(\w+)/g)].map(m=>m[1]);
      for(let m of mentions){
        const {data} = await supabase.from('users').select('username').eq('username',m).single();
        if(!data){ showToast(`Пользователь @${m} не существует`); return; }
      }
      
      const hashtags = [...newPost.matchAll(/#([\wа-яё]+)/gi)].map(m=>m[0]);
      const hidden = hideSel.length ? hideSel : null;
      
      const newPostObj = { 
        user_id: user.id, 
        username: user.username, 
        user_avatar: user.avatar, 
        content: newPost, 
        media: media, 
        poll: tempPoll, 
        likes: 0, 
        comments: [], 
        mentions: mentions, 
        hashtags: hashtags,
        hidden_from: hidden,
        created_at: new Date().toISOString() 
      };
      
      const {data: ins, error} = await supabase.from('posts').insert(newPostObj).select().single();
      
      if(error) { 
        showToast('Ошибка: ' + error.message); 
        return; 
      }
      
      if(ins) setPosts([ins, ...posts]);
      setNewPost(''); setMedia([]); setTempPoll(null); setHideSel([]);
      
      for(let m of mentions){
        const u = users.find(x=>x.username === m);
        if(u && u.id !== user.id){
          await supabase.from('notifications').insert({ 
            user_id: u.id, type: 'mention', from_user_id: user.id, 
            from_username: user.username, text: `${user.username} упомянул вас в посте`, 
            read: false, created_at: new Date() 
          });
        }
      }
      showToast('Пост опубликован!');
    };

    const likePost = async (pid, curr) => { 
      const newL = curr + 1; 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,likes:newL}:p)); 
      await supabase.from('posts').update({likes:newL}).eq('id',pid); 
    };
    
    const addComment = async (pid, text, replyTo=null) => {
      const post = posts.find(p=>p.id===pid);
      const newC = {id:Date.now(), user_id:user.id, username:user.username, user_avatar:user.avatar, text, reply_to_id:replyTo?.id||null, reply_to_username:replyTo?.username||null, created_at:new Date().toISOString()};
      const newCmnts = [...(post.comments||[]), newC];
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newCmnts}:p));
      await supabase.from('posts').update({comments:newCmnts}).eq('id',pid);
      if(post.user_id!==user.id) await supabase.from('notifications').insert({user_id:post.user_id,type:'comment',from_user_id:user.id,from_username:user.username,post_id:pid,text:`${user.username} прокомментировал ваш пост`, read:false,created_at:new Date()});
    };
    
    const deleteComment = async (pid, cid) => { 
      const post=posts.find(p=>p.id===pid); 
      const newC=(post.comments||[]).filter(c=>c.id!==cid); 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newC}:p)); 
      await supabase.from('posts').update({comments:newC}).eq('id',pid); 
      showToast('Комментарий удалён'); 
    };
    
    const delPost = async () => { 
      if (!delPostId) return;
      setPosts(prev=>prev.filter(p=>p.id!==delPostId)); 
      await supabase.from('posts').delete().eq('id',delPostId).eq('user_id',user.id); 
      setDelPostId(null);
      setShowConfirmDeletePost(false);
      showToast('Пост удалён'); 
    };
    
    const follow = async (id) => { 
      if(id===user.id){showToast('Нельзя подписаться на себя');return;} 
      
      let currentFollowing = user.following || [];
      if(currentFollowing.includes(id)) { 
        showToast('Вы уже подписаны'); 
        return; 
      }
      
      const newFollowing = [...currentFollowing, id];
      const { error: err1 } = await supabase.from('users').update({ following: newFollowing }).eq('id', user.id);
      if(err1) { showToast('Ошибка'); return; }
      user.following = newFollowing;
      
      const targetUser = users.find(u => u.id === id);
      if(targetUser) {
        const newFollowers = [...(targetUser.followers || []), user.id];
        const { error: err2 } = await supabase.from('users').update({ followers: newFollowers }).eq('id', id);
        if(!err2) {
          setUsers(prev => prev.map(u => u.id === id ? {...u, followers: newFollowers} : u));
        }
      }
      
      showToast('Подписались');
      await loadAll();
    };
    
    const sendMsg = async (content, msgMediaList = []) => {
      if((!content || !content.trim()) && msgMediaList.length === 0) return;
      const msgObj = { 
        from_user: user.id, 
        to_user: chatUser.id, 
        content: content || '', 
        media: msgMediaList,
        read: false, 
        created_at: new Date() 
      };
      const {data:ins} = await supabase.from('messages').insert(msgObj).select().single();
      if(ins) {
        setMessages(prev => [...prev, ins]);
        setMsgText('');
        setMsgMedia([]);
      }
    };
    
    const saveProfile = async () => { 
      await supabase.from('users').update({full_name:editName, bio:editBio}).eq('id',user.id); 
      user.full_name=editName; 
      user.bio=editBio; 
      setEditProfile(false); 
      await loadAll(); 
      showToast('Профиль обновлён'); 
    };
    
    const deleteAccount = async () => {
      await supabase.from('users').delete().eq('id', user.id);
      showToast('Аккаунт удалён');
      localStorage.removeItem('wave_user');
      localStorage.removeItem('wave_access');
      window.location.reload();
    };
    
    const handlePollVote = async (pid, newPoll) => { 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,poll:newPoll}:p)); 
      await supabase.from('posts').update({poll:newPoll}).eq('id',pid); 
    };

    const renderText = (text) => {
      if(!text) return null;
      const parts = text.split(/(@\w+|#[\wа-яё]+)/gi);
      return parts.map((p,i) => {
        if(p && p.startsWith('@')){ const un=p.slice(1); return <span key={i} className="mention" onClick={()=>{const u=users.find(x=>x.username===un); if(u) setViewProfile(u);}}>{p}</span>; }
        if(p && p.startsWith('#')) return <span key={i} className="hashtag" onClick={()=>{setSearch(p.slice(1)); setSType('posts'); setTab('search');}}>{p}</span>;
        return <span key={i}>{p}</span>;
      });
    };
    
    const goToMyProfile = () => {
      setViewProfile(user);
      setShowSubs(false);
      setShowFollows(false);
    };

    const uploadMediaFiles = async (files) => {
      setUploading(true);
      const uploaded = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        if (media.length + uploaded.length >= 5) { showToast('Максимум 5 файлов'); break; }
        const formData = new FormData();
        formData.append('file', f);
        formData.append('reqtype', 'fileupload');
        try {
          const response = await fetch('https://catbox.moe/user/api.php', {
            method: 'POST',
            body: formData
          });
          const url = await response.text();
          if (url && url.startsWith('https://files.catbox.moe/')) {
            uploaded.push({ url: url.trim(), type: f.type.startsWith('image/') ? 'image' : 'video' });
          }
        } catch(e) { console.error('Upload error:', e); }
      }
      setMedia([...media, ...uploaded]);
      setUploading(false);
      return uploaded;
    };

    // Placeholder for missing state variables
    const [editProfile, setEditProfile] = React.useState(false);
    const [editName, setEditName] = React.useState(user.full_name||'');
    const [editBio, setEditBio] = React.useState(user.bio||'');
    const [editPost, setEditPost] = React.useState(null);
    const [editPostContent, setEditPostContent] = React.useState('');

    const PostMenu = ({onEdit,onDel,onShare}) => {
      const [open,setOpen]=React.useState(false);
      const ref=React.useRef(null);
      React.useEffect(()=>{const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener('click',fn); return()=>document.removeEventListener('click',fn);},[]);
      return (<div className="relative" ref={ref}><button onClick={()=>setOpen(!open)} className="text-gray-400 hover:text-white p-2"><i className="fas fa-ellipsis-h"></i></button>{open&&(<div className="dropdown-menu">{onEdit&&<div onClick={()=>{onEdit();setOpen(false);}} className="dropdown-item"><i className="fas fa-pen"></i> Редактировать</div>}{onShare&&<div onClick={()=>{onShare();setOpen(false);}} className="dropdown-item"><i className="fas fa-share-alt"></i> Поделиться</div>}{onDel&&<div onClick={()=>{onDel();setOpen(false);}} className="dropdown-item"><i className="fas fa-trash-alt"></i> Удалить</div>}</div>)}</div>);
    };

    const getRecommendationOrder = (postsList) => {
      const popular = postsList.filter(p => (p.likes || 0) + (p.comments?.length || 0) > 5);
      const normal = postsList.filter(p => (p.likes || 0) + (p.comments?.length || 0) <= 5);
      const mixed = [];
      const maxLen = Math.max(popular.length, normal.length);
      for (let i = 0; i < maxLen; i++) {
        if (i < popular.length) mixed.push(popular[i]);
        if (i < normal.length) mixed.push(normal[i]);
      }
      return mixed;
    };
    
    const orderedPosts = getRecommendationOrder(posts);
    const myTracks = tracks.filter(t => t.author_id === user.id);
    const popularTracks = [...tracks].sort((a,b) => (b.likes || 0) - (a.likes || 0));

    if(loading) return <div className="min-h-screen flex items-center justify-center text-white"><i className="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div>;

    // Render music section
    if(tab === 'music') {
      return (
        <div className="min-h-screen pb-20" style={{background:'#0a0a0a'}}>
          <header className="sticky top-0 z-20 border-b border-gray-800 bg-[#0f0f0f]/90 backdrop-blur-md p-3">
            <div className="max-w-2xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-2">
                <i className="fas fa-music text-white text-xl"></i>
                <span className="text-white font-bold text-lg">Музыка</span>
              </div>
              <div className="flex gap-3 text-gray-400">
                <button onClick={() => setTab('feed')} className="text-lg"><i className="fas fa-home"></i></button>
                <button onClick={() => setShowMusicUpload(true)} className="text-lg bg-blue-600 px-3 py-1 rounded-full text-white text-sm">
                  <i className="fas fa-upload"></i>
                </button>
                <button onClick={onLogout} className="text-sm bg-gray-800 px-2 py-0.5 rounded-full">Выйти</button>
              </div>
            </div>
          </header>
          <main className="max-w-2xl mx-auto p-3">
            <div className="flex gap-2 mb-4">
              <button onClick={() => setMusicTab('my')} className={`flex-1 py-2 rounded-xl font-semibold ${musicTab === 'my' ? 'bg-blue-600 text-white' : 'bg-[#1a1a1a] text-gray-400'}`}>
                Мои треки
              </button>
              <button onClick={() => setMusicTab('popular')} className={`flex-1 py-2 rounded-xl font-semibold ${musicTab === 'popular' ? 'bg-blue-600 text-white' : 'bg-[#1a1a1a] text-gray-400'}`}>
                Популярное
              </button>
            </div>
            {musicTab === 'my' && myTracks.length === 0 && (
              <div className="text-center text-gray-500 py-12">
                <i className="fas fa-music text-4xl mb-3"></i>
                <p>У вас пока нет треков</p>
                <button onClick={() => setShowMusicUpload(true)} className="mt-3 bg-blue-600 px-4 py-2 rounded-full text-white text-sm">
                  Загрузить первый трек
                </button>
              </div>
            )}
            {(musicTab === 'my' ? myTracks : popularTracks).map(track => (
              <TrackComponent 
                key={track.id}
                track={track}
                currentUser={user}
                onLike={likeTrack}
                onComment={commentTrack}
                onShare={(t) => setShareTrack(t)}
                onPlay={(t) => setCurrentPlayingTrack(t)}
              />
            ))}
          </main>
          {showMusicUpload && <MusicUploadModal onClose={() => setShowMusicUpload(false)} onUpload={uploadTrack} />}
          {shareTrack && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={() => setShareTrack(null)}>
              <div className="card p-5 max-w-sm w-full" onClick={e => e.stopPropagation()}>
                <p className="text-white mb-2">Поделиться треком в чате</p>
                <div className="max-h-48 overflow-auto">
                  {chatList.filter(cu => cu.id !== user.id).map(cu => (
                    <div key={cu.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded" onClick={() => shareTrackToChat(shareTrack, cu.id)}>
                      <img src={cu.avatar || DEFAULT_AVATAR} className="w-6 h-6 rounded-full" />
                      <span className="text-white text-sm">@{cu.username}</span>
                    </div>
                  ))}
                </div>
                <button onClick={() => setShareTrack(null)} className="w-full mt-2 bg-gray-700 py-2 rounded-xl">Отмена</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Rest of the app (feed, chat, etc.) - simplified for brevity, same as before but with swipeable messages
    return (
      <div className="min-h-screen pb-20" style={{background:'#0a0a0a'}}>
        {/* Share modals and other components */}
        {sharePost && (
          <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={() => setSharePost(null)}>
            <div className="card p-5 max-w-sm w-full" onClick={e => e.stopPropagation()}>
              <p className="text-white mb-2">Поделиться постом в чате</p>
              <div className="max-h-48 overflow-auto">
                {chatList.filter(cu => cu.id !== user.id).map(cu => (
                  <div key={cu.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded" onClick={() => sharePostToChat(sharePost, cu.id)}>
                    <img src={cu.avatar || DEFAULT_AVATAR} className="w-6 h-6 rounded-full" />
                    <span className="text-white text-sm">@{cu.username}</span>
                  </div>
                ))}
              </div>
              <button onClick={() => setSharePost(null)} className="w-full mt-2 bg-gray-700 py-2 rounded-xl">Отмена</button>
            </div>
          </div>
        )}

        <header className="sticky top-0 z-20 border-b border-gray-800 bg-[#0f0f0f]/90 backdrop-blur-md p-3">
          <div className="max-w-2xl mx-auto flex justify-between items-center">
            <div className="flex items-center gap-2">
              <i className="fas fa-water text-white text-xl"></i>
              <span className="text-white font-bold text-lg">Wave</span>
            </div>
            <div className="flex gap-3 text-gray-400">
              <button onClick={() => setTab('feed')} className={`text-lg ${tab==='feed'?'text-white':''}`}><i className="fas fa-home"></i></button>
              <button onClick={() => setTab('music')} className={`text-lg ${tab==='music'?'text-white':''}`}><i className="fas fa-music"></i></button>
              <button onClick={() => setTab('chat')} className={`text-lg relative ${tab==='chat'?'text-white':''}`}>
                <i className="fas fa-comments"></i>
                {Object.values(unread).reduce((a,b)=>a+b,0)>0 && <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{Object.values(unread).reduce((a,b)=>a+b,0)}</span>}
              </button>
              <button onClick={goToMyProfile} className={`text-lg ${tab==='profile'?'text-white':''}`}><i className="fas fa-user"></i></button>
              <button onClick={onLogout} className="text-sm bg-gray-800 px-2 py-0.5 rounded-full">Выйти</button>
            </div>
          </div>
        </header>

        <main className="max-w-2xl mx-auto p-3">
          {tab === 'feed' && (
            <>
              <div className="card p-3 mb-4">
                <div className="flex gap-2">
                  <img src={user.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full flex-shrink-0" />
                  <div className="flex-1">
                    <textarea ref={textareaRef} rows="2" placeholder="Что нового? @ или #" className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm resize-none" value={newPost} onChange={(e) => setNewPost(e.target.value)} />
                    <div className="flex flex-wrap gap-1 mt-2">
                      {media.map((m,i) => (
                        <div key={i} className="media-preview" onClick={() => setFullscreenMedia({url:m.url,type:m.type})}>
                          {m.type==='video' ? <video src={m.url} /> : <img src={m.url} />}
                          <button className="remove-media" onClick={(e)=>{e.stopPropagation(); setMedia(media.filter((_,idx)=>idx!==i));}}>×</button>
                        </div>
                      ))}
                    </div>
                    {tempPoll && (
                      <div className="mt-2 p-2 bg-[#252525] rounded-xl flex justify-between">
                        <span className="text-white text-xs">Опрос: {tempPoll.question}</span>
                        <button onClick={()=>setTempPoll(null)} className="text-red-400 text-xs">✖</button>
                      </div>
                    )}
                    <div className="flex flex-wrap gap-2 mt-2">
                      <label className={`icon-btn text-sm ${uploading ? 'opacity-50 cursor-wait' : ''}`}>
                        {uploading ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-paperclip"></i>} Медиа
                        <input type="file" accept="image/*,video/*" multiple onChange={async(e)=>{const files=Array.from(e.target.files); if(media.length+files.length>5){showToast('Максимум 5');e.target.value='';return;} await uploadMediaFiles(files); e.target.value='';}} className="hidden" disabled={uploading} />
                      </label>
                      <button onClick={() => setShowPollModal(true)} className="icon-btn text-sm"><i className="fas fa-chart-bar"></i></button>
                      <button onClick={createPost} className="white-glow-btn text-sm ml-auto">Опубликовать</button>
                    </div>
                  </div>
                </div>
              </div>
              {orderedPosts.map(p => (
                <div key={p.id} className="card p-3 mb-3">
                  <div className="flex justify-between">
                    <div className="flex gap-2 cursor-pointer" onClick={() => p.user_id !== user.id && setViewProfile(users.find(u => u.id === p.user_id))}>
                      <img src={p.user_avatar || DEFAULT_AVATAR} className="w-7 h-7 rounded-full" />
                      <div>
                        <div className="font-bold text-white text-sm">@{p.username}</div>
                        <div className="text-xs text-gray-500">{formatDate(p.created_at)}</div>
                      </div>
                    </div>
                    <PostMenu 
                      onEdit={p.user_id === user.id ? () => { setEditPost(p); setEditPostContent(p.content); } : null}
                      onDel={p.user_id === user.id ? () => { setDelPostId(p.id); setShowConfirmDeletePost(true); } : null}
                      onShare={() => setSharePost(p)}
                    />
                  </div>
                  <div className="text-white text-sm whitespace-pre-wrap">{renderText(p.content)}</div>
                  {p.media && p.media.length > 0 && (
                    <div className="mt-3">
                      {p.media[0].type === 'video' ? 
                        <video src={p.media[0].url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => setFullscreenMedia(p.media[0])} /> :
                        <img src={p.media[0].url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => setFullscreenMedia(p.media[0])} />
                      }
                    </div>
                  )}
                  {p.poll && <PollComponent poll={p.poll} postId={p.id} userId={user.id} onVote={handlePollVote} />}
                  <div className="flex gap-3 mt-2 text-gray-400 text-sm">
                    <button onClick={() => likePost(p.id, p.likes || 0)} className="flex gap-1 hover:text-red-400">
                      <i className="fas fa-heart"></i> {formatNumber(p.likes || 0)}
                    </button>
                    <button onClick={() => { setCommentsPagePost(p); setCommentsReturnToPost(p.id); }} className="flex gap-1 hover:text-blue-400">
                      <i className="far fa-comment"></i> {(p.comments || []).length}
                    </button>
                  </div>
                </div>
              ))}
            </>
          )}

          {tab === 'chat' && (
            <div className="flex flex-col h-[80vh]">
              <div className="chat-user-list">
                <h3 className="text-white font-bold mb-3"><i className="fas fa-users mr-2"></i> Контакты</h3>
                {chatList.filter(cu => cu.id !== user.id).map(cu => (
                  <div key={cu.id} className="chat-user-item" onClick={() => setChatUser(cu)}>
                    <img src={cu.avatar || DEFAULT_AVATAR} className="w-10 h-10 rounded-full" />
                    <div className="flex-1">
                      <div className="font-bold text-white">@{cu.username}</div>
                      <div className="text-gray-400 text-xs">{cu.full_name || cu.username}</div>
                    </div>
                    {unread[cu.id] > 0 && <div className="bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">{unread[cu.id]}</div>}
                  </div>
                ))}
                {chatList.filter(cu => cu.id !== user.id).length === 0 && <div className="text-center text-gray-500 py-8">Нет чатов. Начните общение!</div>}
              </div>
              {chatUser && chatUser.id !== user.id && (
                <div className="fixed inset-x-0 bottom-0 top-0 z-50 bg-[#0a0a0a] flex flex-col" style={{marginTop:'55px'}}>
                  <div className="sticky top-0 bg-[#1a1a1a] p-3 flex items-center gap-3 border-b border-gray-800">
                    <button onClick={() => setChatUser(null)} className="text-white text-xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-800">←</button>
                    <img src={chatUser.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                    <div>
                      <div className="font-bold text-white">@{chatUser.username}</div>
                      <div className="text-gray-400 text-xs">{chatUser.full_name || chatUser.username}</div>
                    </div>
                  </div>
                  <div className="flex-1 overflow-y-auto p-3 space-y-2 chat-messages" ref={chatContainerRef}>
                    {messages.map(msg => {
                      const isMine = msg.from_user === user.id;
                      return (
                        <SwipeableMessage key={msg.id} message={msg} isMine={isMine} onDelete={deleteMessage}>
                          <div className={`flex ${isMine ? 'justify-end' : 'justify-start'}`}>
                            <div className={`message-bubble ${isMine ? 'message-mine' : 'message-theirs'}`}>
                              {msg.shared_post && (
                                <SharedPostQuote 
                                  post={msg.shared_post} 
                                  onGoToPost={(pid) => { setTab('feed'); setScrollingToPost(pid); setChatUser(null); }}
                                />
                              )}
                              {msg.shared_track && (
                                <SharedTrackQuote 
                                  track={msg.shared_track} 
                                  onGoToTrack={(tid) => { setTab('music'); setChatUser(null); }}
                                />
                              )}
                              {msg.media && msg.media.length > 0 && (
                                <div className="flex flex-wrap gap-1 mt-1">
                                  {msg.media.map((m, idx) => (
                                    <div key={idx} className="cursor-pointer" onClick={() => setFullscreenMedia(m)}>
                                      {m.type === 'video' ? 
                                        <video src={m.url} className="w-20 h-20 rounded-lg object-cover" /> :
                                        <img src={m.url} className="w-20 h-20 rounded-lg object-cover" />
                                      }
                                    </div>
                                  ))}
                                </div>
                              )}
                              {msg.content && <p className="break-words">{msg.content}</p>}
                              <div className="flex justify-end items-center gap-1 mt-1">
                                <span className="text-[10px] opacity-70">{new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>
                              </div>
                            </div>
                          </div>
                        </SwipeableMessage>
                      );
                    })}
                  </div>
                  <div className="p-3 border-t border-gray-800 flex gap-2 bg-[#1a1a1a]">
                    <input type="text" placeholder="Сообщение..." value={msgText} onChange={e => setMsgText(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendMsg(msgText, msgMedia)} className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" />
                    <label className={`bg-gray-700 text-white px-3 rounded-xl flex items-center cursor-pointer ${uploadingMsg ? 'opacity-50' : ''}`}>
                      {uploadingMsg ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-paperclip"></i>}
                      <input type="file" accept="image/*,video/*" multiple className="hidden" onChange={async(e)=>{const files=Array.from(e.target.files); await uploadMediaFiles(files); e.target.value='';}} disabled={uploadingMsg} />
                    </label>
                    <button onClick={() => sendMsg(msgText, msgMedia)} className="bg-blue-600 text-white px-4 rounded-xl">→</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </main>

        {/* Modals */}
        {showPollModal && (
          <div className="fullscreen-modal" onClick={() => setShowPollModal(false)}>
            <div className="fullscreen-modal-content" onClick={e => e.stopPropagation()}>
              <h2 className="text-white text-xl font-bold mb-4">Создать опрос</h2>
              <input type="text" placeholder="Вопрос" className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white mb-3" id="pollQuestion" />
              <div id="pollOptions"></div>
              <button onClick={() => {
                const question = document.getElementById('pollQuestion').value;
                const optionInputs = document.querySelectorAll('#pollOptions input');
                const options = Array.from(optionInputs).map(i => i.value).filter(v => v.trim());
                if (!question.trim()) { showToast('Введите вопрос'); return; }
                if (options.length < 2) { showToast('Минимум 2 варианта'); return; }
                setTempPoll({ question: question.trim(), options: options.map(t => ({ text: t, votes: 0 })), voted_by: [], user_vote_index: -1 });
                setShowPollModal(false);
                showToast('Опрос добавлен');
              }} className="w-full bg-blue-600 py-3 rounded-xl text-white font-semibold">Добавить</button>
            </div>
          </div>
        )}

        {fullscreenMedia && (
          <div className="modal-media" onClick={() => setFullscreenMedia(null)}>
            <div className="close-fullscreen" onClick={() => setFullscreenMedia(null)}><i className="fas fa-times"></i></div>
            {fullscreenMedia.type === 'video' ? 
              <video src={fullscreenMedia.url} controls autoPlay className="modal-media-content" onClick={(e) => e.stopPropagation()} /> :
              <img src={fullscreenMedia.url} className="modal-media-content" onClick={(e) => e.stopPropagation()} />
            }
          </div>
        )}

        {showConfirmDeletePost && delPostId && (
          <div className="confirm-modal" onClick={() => setShowConfirmDeletePost(false)}>
            <div className="confirm-modal-content" onClick={e => e.stopPropagation()}>
              <h3 className="text-white text-xl font-bold mb-3">Удалить пост?</h3>
              <div className="flex gap-3">
                <button onClick={delPost} className="flex-1 bg-red-600 py-2 rounded-xl text-white">Да</button>
                <button onClick={() => { setShowConfirmDeletePost(false); setDelPostId(null); }} className="flex-1 bg-gray-700 py-2 rounded-xl text-white">Отмена</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  function PasswordGate({ onSuccess }) { 
    const [p, setP] = React.useState(''); 
    const [e, setE] = React.useState(''); 
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full text-center">
          <i className="fas fa-lock text-4xl text-white mb-3"></i>
          <h1 className="text-xl font-bold text-white">Wave Social</h1>
          <p className="text-gray-400 mt-1 text-sm">Введите пароль для доступа</p>
          <form onSubmit={(e) => { e.preventDefault(); if (p === '8554social') { localStorage.setItem('wave_access','ok'); onSuccess(); } else setE('Неверный пароль'); }} className="mt-4">
            <input type="password" value={p} onChange={e=>setP(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-center" autoFocus placeholder="Пароль" />
            {e && <div className="text-red-400 text-sm mt-1">{e}</div>}
            <button type="submit" className="w-full mt-3 bg-blue-600 text-white py-2 rounded-xl font-semibold">Войти</button>
          </form>
        </div>
      </div>
    );
  }

  function Auth({ onLogin }) { 
    const [login, setLogin] = React.useState(true); 
    const [user, setUser] = React.useState(''); 
    const [pass, setPass] = React.useState(''); 
    const [name, setName] = React.useState(''); 
    const [err, setErr] = React.useState(''); 
    const [load, setLoad] = React.useState(false); 
    
    const submit = async (e) => { 
      e.preventDefault(); setErr(''); setLoad(true); 
      if (login) { 
        const { data: u } = await supabase.from('users').select('*').eq('username', user).single(); 
        if (!u) { setErr('Неверный логин или пароль'); setLoad(false); return; } 
        if (pass === u.password_hash) onLogin(u); else setErr('Неверный логин или пароль'); 
      } else { 
        if (pass.length < 4) { setErr('Пароль минимум 4 символа'); setLoad(false); return; } 
        const { data: exist } = await supabase.from('users').select('username').eq('username', user).single(); 
        if (exist) { setErr('Имя пользователя занято'); setLoad(false); return; } 
        const { data: nu } = await supabase.from('users').insert({ username: user, full_name: name || user, password_hash: pass, avatar: DEFAULT_AVATAR, following: [], followers: [] }).select().single(); 
        if (nu) onLogin(nu); else setErr('Ошибка регистрации'); 
      } 
      setLoad(false); 
    }; 
    
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full">
          <div className="text-center"><i className="fas fa-water text-3xl text-white"></i><h1 className="text-2xl font-bold mt-1 text-white">Wave Social</h1><p className="text-gray-500 text-sm mt-2">Общайся. Делись. Вдохновляй.</p></div>
          <form onSubmit={submit} className="space-y-3 mt-4">
            <input type="text" placeholder="Логин" value={user} onChange={e=>setUser(e.target.value.toLowerCase())} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            <input type="password" placeholder="Пароль" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            {!login && <input type="text" placeholder="Имя" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" />}
            {err && <div className="text-red-400 text-sm text-center">{err}</div>}
            <button type="submit" disabled={load} className="w-full bg-blue-600 text-white py-2 rounded-xl font-semibold">{load ? 'Загрузка...' : (login ? 'Войти' : 'Регистрация')}</button>
          </form>
          <button onClick={()=>{setLogin(!login); setErr('');}} className="w-full mt-3 text-gray-400 text-sm hover:text-white">{login ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}</button>
        </div>
      </div>
    );
  }

  function App() { 
    const [a,setA]=React.useState(false); 
    const [u,setU]=React.useState(null); 
    const [l,setL]=React.useState(true); 
    React.useEffect(()=>{ 
      if(localStorage.getItem('wave_access')==='ok') setA(true); 
      const s=localStorage.getItem('wave_user'); 
      if(s) setU(JSON.parse(s)); 
      setL(false); 
    },[]); 
    const log=(u)=>{ localStorage.setItem('wave_user',JSON.stringify(u)); setU(u); }; 
    const out=()=>{ localStorage.removeItem('wave_user'); setU(null); localStorage.removeItem('wave_access'); window.location.reload(); }; 
    if(l) return <div className="p-4 text-white">Загрузка...</div>; 
    if(!a) return <PasswordGate onSuccess={()=>setA(true)} />; 
    if(u) return <MainApp user={u} onLogout={out} />; 
    return <Auth onLogin={log} />; 
  }
  
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
