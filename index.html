  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0f0f0f; }

    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e1e1e; border: 1px solid #333; color: white; padding: 8px 18px; border-radius: 40px; z-index: 1000; font-size: 14px; }
    .media-preview { position: relative; display: inline-block; margin: 4px; border-radius: 14px; overflow: hidden; border: 1px solid #3a3a3a; width: 80px; height: 80px; cursor: pointer; }
    .media-preview img, .media-preview video { width: 100%; height: 100%; object-fit: cover; }
    .remove-media { position: absolute; top: -8px; right: -8px; background: #ef4444; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; color: white; z-index: 10; }
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 16px; min-width: 160px; z-index: 50; overflow: hidden; }
    .dropdown-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: #e0e0e0; transition: 0.15s; cursor: pointer; }
    .dropdown-item:hover { background: #2a2a2a; }
    .edit-input, .edit-textarea { background: #2a2a2a; border: none; border-radius: 16px; padding: 10px 14px; color: white; width: 100%; margin-top: 8px; }
    .reply-quote { background: #111; padding: 8px 12px; border-radius: 14px; border-left: 3px solid #3b82f6; font-size: 12px; color: #aaa; margin-bottom: 8px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal-card { background: #1e1e1e; border-radius: 28px; padding: 24px; max-width: 360px; width: 90%; text-align: center; border: 1px solid #3a3a3a; }
    .share-list, .hide-list { max-height: 300px; overflow-y: auto; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .share-user, .hide-user { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 16px; cursor: pointer; transition: 0.15s; }
    .share-user:hover, .hide-user:hover { background: #2a2a2a; }
    .mention { color: #3b82f6; font-weight: 500; cursor: pointer; }
    .hashtag { color: #eab308; font-weight: 500; cursor: pointer; }
    .chat-bubble { overflow-wrap: break-word; white-space: pre-wrap; word-break: break-word; }
    .avatar-default { background: #2a2a2a; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #888; }
    .white-glow-btn { background: white; color: #111; box-shadow: 0 0 8px rgba(255,255,255,0.3); transition: 0.2s; }
    .white-glow-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255,255,255,0.5); background: #f0f0f0; }
    .fullscreen-media { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .fullscreen-media img, .fullscreen-media video { max-width: 95vw; max-height: 95vh; border-radius: 28px; box-shadow: 0 0 50px rgba(255,255,255,0.2); }
  </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const STORAGE_BUCKET = "wave-media";
  const DEFAULT_AVATAR = "https://ui-avatars.com/api/?background=2a2a2a&color=fff&rounded=true&size=96&bold=true&length=1&name=?";

  function showToast(msg) { const t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
  function formatDate(iso) { const d=new Date(iso), n=new Date(), diff=Math.floor((n-d)/1000); if(diff<60) return 'только что'; if(diff<3600) return `${Math.floor(diff/60)} мин назад`; if(diff<86400) return `сегодня в ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`; if(diff<172800) return 'вчера'; if(diff<604800) return `${Math.floor(diff/86400)} дн назад`; if(diff<2592000) return `${Math.floor(diff/604800)} нед назад`; if(diff<31536000) return `${Math.floor(diff/2592000)} мес назад`; return `${Math.floor(diff/31536000)} г назад`; }
  function formatLikes(n){ if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'м'; if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'к'; return n; }

  function PasswordGate({onSuccess}){ const [pass,setPass]=React.useState(''); const [err,setErr]=React.useState(''); return (<div className="min-h-screen flex items-center justify-center p-4"><div className="card p-6 max-w-md w-full text-center"><i className="fas fa-lock text-4xl text-white mb-3"></i><h1 className="text-xl font-bold text-white">Wave Social</h1><p className="text-gray-400 mt-1 text-sm">Введите пароль</p><form onSubmit={(e)=>{e.preventDefault(); if(pass==='8554social'){localStorage.setItem('wave_access','ok'); onSuccess();}else setErr('Неверный пароль');}} className="mt-4"><input type="password" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-center" autoFocus />{err&&<div className="text-red-400 text-sm mt-1">{err}</div>}<button type="submit" className="w-full mt-3 bg-gray-700 text-white py-1.5 rounded-xl btn">Войти</button></form></div></div>);}
  function Auth({onLogin}){ const [isLogin,setIsLogin]=React.useState(true); const [username,setUsername]=React.useState(''); const [password,setPassword]=React.useState(''); const [name,setName]=React.useState(''); const [error,setError]=React.useState(''); const [loading,setLoading]=React.useState(false); const submit=async(e)=>{ e.preventDefault(); setError(''); setLoading(true); if(isLogin){ const {data:u}=await supabase.from('users').select('*').eq('username',username).single(); if(!u){setError('Неверный логин или пароль'); setLoading(false); return;} if(password===u.password_hash) onLogin(u); else setError('Неверный логин или пароль'); }else{ if(password.length<4){setError('Пароль минимум 4 символа'); setLoading(false); return;} const {data:exist}=await supabase.from('users').select('username').eq('username',username).single(); if(exist){setError('Имя занято'); setLoading(false); return;} const {data:nu}=await supabase.from('users').insert({username,full_name:name||username,password_hash:password,avatar:DEFAULT_AVATAR}).select().single(); if(nu) onLogin(nu); else setError('Ошибка'); } setLoading(false); }; return (<div className="min-h-screen flex items-center justify-center p-4"><div className="card p-6 max-w-md w-full"><div className="text-center"><i className="fas fa-water text-3xl text-white"></i><h1 className="text-2xl font-bold mt-1 text-white">Wave Social</h1></div><form onSubmit={submit} className="space-y-3 mt-4"><input type="text" placeholder="Логин" value={username} onChange={e=>setUsername(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required /><input type="password" placeholder="Пароль" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />{!isLogin&&<input type="text" placeholder="Имя" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" />}{error&&<div className="text-red-400 text-sm">{error}</div>}<button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-2 rounded-xl font-semibold btn">{loading?'Загрузка...':(isLogin?'Войти':'Регистрация')}</button></form><button onClick={()=>{setIsLogin(!isLogin); setError('');}} className="w-full mt-3 text-gray-400 text-sm">{isLogin?'Нет аккаунта?':'Уже есть аккаунт?'}</button></div></div>);}

  function MainApp({ user, onLogout }) {
    const [activeTab, setActiveTab] = React.useState('feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(null);
    const [messages, setMessages] = React.useState([]);
    const [chatList, setChatList] = React.useState([]);
    const [unreadCounts, setUnreadCounts] = React.useState({});
    const [notifications, setNotifications] = React.useState([]);
    const [viewedProfile, setViewedProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [newPostContent, setNewPostContent] = React.useState('');
    const [mediaList, setMediaList] = React.useState([]);
    const [uploadingMedia, setUploadingMedia] = React.useState(false);
    const [commentTexts, setCommentTexts] = React.useState({});
    const [newMessageText, setNewMessageText] = React.useState('');
    const [replyToMessage, setReplyToMessage] = React.useState(null);
    const [replyingToComment, setReplyingToComment] = React.useState(null);
    const [searchQuery, setSearchQuery] = React.useState('');
    const [searchUserResults, setSearchUserResults] = React.useState([]);
    const [searchPostResults, setSearchPostResults] = React.useState([]);
    const [searchType, setSearchType] = React.useState('users');
    const [showSubscribers, setShowSubscribers] = React.useState(false);
    const [showFollowing, setShowFollowing] = React.useState(false);
    const [avatarUploading, setAvatarUploading] = React.useState(false);
    const [editingProfile, setEditingProfile] = React.useState(false);
    const [editName, setEditName] = React.useState(user.full_name || '');
    const [editBio, setEditBio] = React.useState(user.bio || '');
    const [showDeleteAccountConfirm, setShowDeleteAccountConfirm] = React.useState(false);
    const [showMentions, setShowMentions] = React.useState(false);
    const [mentionQuery, setMentionQuery] = React.useState('');
    const [mentionPosition, setMentionPosition] = React.useState(0);
    const textareaRef = React.useRef(null);
    const messagesEndRef = React.useRef(null);
    const [editingPost, setEditingPost] = React.useState(null);
    const [editPostContent, setEditPostContent] = React.useState('');
    const [sharingPost, setSharingPost] = React.useState(null);
    const [shareSelected, setShareSelected] = React.useState([]);
    const [hidingPost, setHidingPost] = React.useState(null);
    const [hideSelected, setHideSelected] = React.useState([]);
    const [postToDelete, setPostToDelete] = React.useState(null);
    const [selectedComment, setSelectedComment] = React.useState(null);
    const [selectedMessage, setSelectedMessage] = React.useState(null);
    const [fullscreenMedia, setFullscreenMedia] = React.useState(null);
    const [switchAccountDialog, setSwitchAccountDialog] = React.useState(false);
    const [switchUsername, setSwitchUsername] = React.useState('');
    const [switchPassword, setSwitchPassword] = React.useState('');
    const [switchError, setSwitchError] = React.useState('');

    const loadData = async () => {
      const [postsRes, usersRes, messagesRes, notifsRes] = await Promise.all([
        supabase.from('posts').select('*').order('created_at', { ascending: false }),
        supabase.from('users').select('*'),
        supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`),
        supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false })
      ]);
      const allPosts = postsRes.data || [];
      const visiblePosts = allPosts.filter(p => !p.hidden_from?.includes(user.id));
      setPosts(visiblePosts);
      setUsers(usersRes.data || []);
      setNotifications(notifsRes.data || []);
      const msgs = messagesRes.data || [];
      const chatUsersSet = new Set();
      msgs.forEach(m => { if (m.from_user !== user.id) chatUsersSet.add(m.from_user); if (m.to_user !== user.id) chatUsersSet.add(m.to_user); });
      setChatList(usersRes.data?.filter(u => chatUsersSet.has(u.id)) || []);
      const counts = {};
      msgs.forEach(m => { if (m.to_user === user.id && !m.read) counts[m.from_user] = (counts[m.from_user] || 0) + 1; });
      setUnreadCounts(counts);
      if (chatUser) {
        const chatMsgs = msgs.filter(m => (m.from_user === user.id && m.to_user === chatUser.id) || (m.from_user === chatUser.id && m.to_user === user.id)).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
        setMessages(chatMsgs);
        await supabase.from('messages').update({ read: true }).eq('to_user', user.id).eq('from_user', chatUser.id);
      }
      setLoading(false);
    };
    React.useEffect(() => { loadData(); }, []);

    React.useEffect(() => {
      const postsSub = supabase.channel('posts').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadData()).subscribe();
      const messagesSub = supabase.channel('messages').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadData()).subscribe();
      const notifsSub = supabase.channel('notifs').on('postgres_changes', { event: '*', schema: 'public', table: 'notifications' }, () => loadData()).subscribe();
      return () => { postsSub.unsubscribe(); messagesSub.unsubscribe(); notifsSub.unsubscribe(); };
    }, []);

    React.useEffect(() => {
      if (!chatUser) return;
      const sub = supabase.channel('chat-realtime').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `to_user=eq.${user.id},from_user=eq.${chatUser.id}` }, (payload) => {
        setMessages(prev => [...prev, payload.new]);
        supabase.from('messages').update({ read: true }).eq('id', payload.new.id);
        setUnreadCounts(prev => ({ ...prev, [chatUser.id]: 0 }));
      }).subscribe();
      return () => sub.unsubscribe();
    }, [chatUser, user.id]);

    React.useEffect(() => {
      if (!searchQuery.trim()) { setSearchUserResults([]); setSearchPostResults([]); return; }
      if (searchType === 'users') setSearchUserResults(users.filter(u => u.id !== user.id && u.username.toLowerCase().includes(searchQuery.toLowerCase())));
      else setSearchPostResults(posts.filter(p => p.content.toLowerCase().includes(searchQuery.toLowerCase()) || (searchQuery.startsWith('#') && p.content.toLowerCase().includes(searchQuery.toLowerCase()))));
    }, [searchQuery, searchType, users, posts]);

    const uploadMediaFiles = async (files) => {
      const uploaded = [];
      for (const file of files) {
        const ext = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
        const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(fileName, file);
        if (error) { showToast(`Ошибка: ${file.name}`); continue; }
        const { data: urlData } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
        uploaded.push({ url: urlData.publicUrl, type: file.type.startsWith('image/') ? 'image' : 'video' });
      }
      return uploaded;
    };

    const sendMessage = async () => {
      if ((!newMessageText.trim() && !replyToMessage) || !chatUser) return;
      let content = newMessageText;
      if (replyToMessage) {
        const replyToUser = replyToMessage.from_user === user.id ? chatUser.username : users.find(u => u.id === replyToMessage.from_user)?.username;
        content = `[Ответ @${replyToUser}: "${replyToMessage.content.substring(0, 60)}"]\n${newMessageText}`;
      }
      const tempId = Date.now();
      setMessages(prev => [...prev, { id: tempId, from_user: user.id, to_user: chatUser.id, content, created_at: new Date().toISOString() }]);
      setNewMessageText('');
      setReplyToMessage(null);
      const { data: inserted } = await supabase.from('messages').insert({ from_user: user.id, to_user: chatUser.id, content, read: false, created_at: new Date() }).select().single();
      if (inserted) setMessages(prev => prev.map(m => m.id === tempId ? inserted : m));
      await supabase.from('notifications').insert({ user_id: chatUser.id, type: 'message', from_user_id: user.id, from_username: user.username, text: `${user.username} отправил сообщение`, read: false, created_at: new Date() });
    };

    const deleteMessage = async (msgId) => {
      setMessages(prev => prev.filter(m => m.id !== msgId));
      await supabase.from('messages').delete().eq('id', msgId);
      setSelectedMessage(null);
    };

    const followUser = async (targetUserId) => {
      if (targetUserId === user.id) { showToast('Нельзя подписаться на самого себя'); return; }
      let following = user.following || [];
      const isFollow = following.includes(targetUserId);
      const newFollowing = isFollow ? following.filter(id => id !== targetUserId) : [...following, targetUserId];
      await supabase.from('users').update({ following: newFollowing }).eq('id', user.id);
      user.following = newFollowing;
      const targetUser = users.find(u => u.id === targetUserId);
      if (targetUser) {
        let followers = targetUser.followers || [];
        const newFollowers = isFollow ? followers.filter(id => id !== user.id) : [...followers, user.id];
        await supabase.from('users').update({ followers: newFollowers }).eq('id', targetUserId);
      }
      await loadData();
      showToast(isFollow ? 'Отписались' : 'Подписались');
    };

    const uploadAvatar = async (file) => {
      if (!file) return;
      setAvatarUploading(true);
      const fileName = `avatar_${user.id}_${Date.now()}.jpg`;
      const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(fileName, file);
      if (error) { showToast('Ошибка'); setAvatarUploading(false); return; }
      const { data: urlData } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(fileName);
      await supabase.from('users').update({ avatar: urlData.publicUrl }).eq('id', user.id);
      user.avatar = urlData.publicUrl;
      await loadData();
      setAvatarUploading(false);
      showToast('Аватар обновлён');
    };

    const deleteAccount = async () => {
      await supabase.from('users').delete().eq('id', user.id);
      showToast('Аккаунт удалён');
      onLogout();
    };

    const saveProfile = async () => {
      await supabase.from('users').update({ full_name: editName, bio: editBio }).eq('id', user.id);
      user.full_name = editName; user.bio = editBio;
      setEditingProfile(false);
      await loadData();
      showToast('Профиль обновлён');
    };

    const handleMediaUpload = async (e) => {
      const files = Array.from(e.target.files);
      if (mediaList.length + files.length > 5) { showToast('Максимум 5 файлов'); return; }
      setUploadingMedia(true);
      const newMedia = await uploadMediaFiles(files);
      setMediaList([...mediaList, ...newMedia]);
      setUploadingMedia(false);
      e.target.value = '';
    };
    const removeMedia = (index) => setMediaList(mediaList.filter((_, i) => i !== index));

    const createPost = async () => {
      if (!newPostContent.trim() && mediaList.length === 0) { showToast('Напишите текст или добавьте медиа'); return; }
      const mentions = [...newPostContent.matchAll(/@(\w+)/g)].map(m => m[1]);
      for (const m of mentions) {
        const { data } = await supabase.from('users').select('username').eq('username', m).single();
        if (!data) { showToast(`Пользователь @${m} не существует`); return; }
      }
      const hashtags = [...newPostContent.matchAll(/#[\wа-яё]+/gi)].map(m => m[0]);
      const hiddenFrom = hideSelected.length ? hideSelected : null;
      const tempId = Date.now();
      const newPostObj = { id: tempId, user_id: user.id, username: user.username, user_avatar: user.avatar, content: newPostContent, media: mediaList, likes: 0, comments: [], mentions, hashtags, hidden_from: hiddenFrom, created_at: new Date().toISOString(), edited: false };
      setPosts([newPostObj, ...posts]);
      setNewPostContent('');
      setMediaList([]);
      setHidingPost(null);
      setHideSelected([]);
      const { data: inserted } = await supabase.from('posts').insert({
        user_id: user.id, username: user.username, user_avatar: user.avatar, content: newPostContent, media: mediaList, likes: 0, comments: [], mentions, hashtags, hidden_from: hiddenFrom, created_at: new Date(), edited: false
      }).select().single();
      if (inserted) setPosts(prev => prev.map(p => p.id === tempId ? inserted : p));
      for (const m of mentions) {
        const mentioned = users.find(u => u.username === m);
        if (mentioned && mentioned.id !== user.id) {
          await supabase.from('notifications').insert({ user_id: mentioned.id, type: 'mention', from_user_id: user.id, from_username: user.username, text: `${user.username} отметил вас в посте`, read: false, created_at: new Date() });
        }
      }
      showToast('Пост опубликован!');
    };

    const likePost = async (postId, currentLikes) => {
      const newLikes = currentLikes + 1;
      setPosts(prev => prev.map(p => p.id === postId ? { ...p, likes: newLikes } : p));
      await supabase.from('posts').update({ likes: newLikes }).eq('id', postId);
    };

    const addComment = async (postId) => {
      let text = commentTexts[postId] || '';
      if (!text.trim()) return;
      if (replyingToComment) text = `[Ответ @${replyingToComment.username}: "${replyingToComment.text.substring(0, 60)}"]\n${text}`;
      const post = posts.find(p => p.id === postId);
      const newComment = { id: Date.now(), user_id: user.id, username: user.username, user_avatar: user.avatar, text, created_at: new Date().toISOString() };
      const newComments = [...(post.comments || []), newComment];
      setPosts(prev => prev.map(p => p.id === postId ? { ...p, comments: newComments } : p));
      setCommentTexts({ ...commentTexts, [postId]: '' });
      setSelectedComment(null);
      setReplyingToComment(null);
      await supabase.from('posts').update({ comments: newComments }).eq('id', postId);
      if (post.user_id !== user.id) {
        await supabase.from('notifications').insert({ user_id: post.user_id, type: 'comment', from_user_id: user.id, from_username: user.username, post_id: postId, text: `${user.username} прокомментировал ваш пост`, read: false, created_at: new Date() });
      }
    };

    const deleteComment = async (postId, commentId) => {
      const post = posts.find(p => p.id === postId);
      const newComments = (post.comments || []).filter(c => c.id !== commentId);

a2a2a] rounded-xl flex flex-col gap-2">{users.filter(u => (profileUser.following || []).includes(u.id)).map(u => (<div key={u.id} className="flex items-center gap-2 p-1 cursor-pointer hover:bg-[#3a3a3a] rounded" onClick={() => setViewedProfile(u)}><img src={u.avatar || DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white text-sm">@{u.username}</span></div>))}</div>)}</div>{userPosts.map(post => (<div key={post.id} className="card p-4 mb-4"><p className="text-white whitespace-pre-wrap">{renderContent(post.content)}</p><div className="flex gap-4 mt-2 text-gray-400 text-sm"><span><i className="fas fa-heart text-red-500"></i> {formatLikes(post.likes || 0)}</span><span><i className="far fa-comment"></i> {(post.comments || []).length}</span></div></div>))}</div>);

      {editingPost && (<div className="modal-overlay" onClick={() => setEditingPost(null)}><div className="modal-card" onClick={e => e.stopPropagation()}><p className="text-white mb-3">Редактировать пост</p><textarea value={editPostContent} onChange={e => setEditPostContent(e.target.value)} rows="4" className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white"></textarea><div className="flex gap-2 mt-4"><button onClick={updatePost} className="flex-1 bg-blue-600 text-white py-2 rounded-xl btn">Сохранить</button><button onClick={() => setEditingPost(null)} className="flex-1 bg-gray-700 text-white py-2 rounded-xl btn">Отмена</button></div></div></div>)}
      {sharingPost && (<div className="modal-overlay" onClick={() => { setSharingPost(null); setShareSelected([]); }}><div className="modal-card" onClick={e => e.stopPropagation()}><p className="text-white mb-3">Поделиться с пользователями</p><div className="share-list">{users.filter(u => u.id !== user.id).map(u => (<div key={u.id} className="share-user" onClick={() => setShareSelected(prev => prev.includes(u.id) ? prev.filter(id => id !== u.id) : [...prev, u.id])}><input type="checkbox" checked={shareSelected.includes(u.id)} onChange={() => {}} className="w-4 h-4" /><img src={u.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><span className="text-white">@{u.username}</span></div>))}</div><div className="flex gap-2 mt-4"><button onClick={sharePostFunc} className="flex-1 bg-green-600 text-white py-2 rounded-xl btn">Отправить ({shareSelected.length})</button><button onClick={() => { setSharingPost(null); setShareSelected([]); }} className="flex-1 bg-gray-700 text-white py-2 rounded-xl btn">Отмена</button></div></div></div>)}
      {hidingPost && (<div className="modal-overlay" onClick={() => { setHidingPost(null); setHideSelected([]); }}><div className="modal-card" onClick={e => e.stopPropagation()}><p className="text-white mb-3">Не показывать пост пользователям</p><div className="hide-list">{users.filter(u => u.id !== user.id).map(u => (<div key={u.id} className="hide-user" onClick={() => setHideSelected(prev => prev.includes(u.id) ? prev.filter(id => id !== u.id) : [...prev, u.id])}><input type="checkbox" checked={hideSelected.includes(u.id)} onChange={() => {}} className="w-4 h-4" /><img src={u.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><span className="text-white">@{u.username}</span></div>))}</div><div className="flex gap-2 mt-4"><button onClick={() => setHidingPost(false)} className="flex-1 bg-blue-600 text-white py-2 rounded-xl btn">Применить</button><button onClick={() => { setHidingPost(null); setHideSelected([]); }} className="flex-1 bg-gray-700 text-white py-2 rounded-xl btn">Отмена</button></div></div></div>)}
      {switchAccountDialog && (<div className="modal-overlay" onClick={() => { setSwitchAccountDialog(false); setSwitchError(''); setSwitchUsername(''); setSwitchPassword(''); }}><div className="modal-card" onClick={e => e.stopPropagation()}><p className="text-white mb-3">Войти в другой аккаунт</p><input type="text" placeholder="Логин" value={switchUsername} onChange={e => setSwitchUsername(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white mb-2" /><input type="password" placeholder="Пароль" value={switchPassword} onChange={e => setSwitchPassword(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white mb-2" />{switchError && <div className="text-red-400 text-sm mb-2">{switchError}</div>}<div className="flex gap-2"><button onClick={switchToAccount} className="flex-1 bg-blue-600 text-white py-2 rounded-xl btn">Войти</button><button onClick={() => { setSwitchAccountDialog(false); setSwitchError(''); setSwitchUsername(''); setSwitchPassword(''); }} className="flex-1 bg-gray-700 text-white py-2 rounded-xl btn">Отмена</button></div></div></div>)}

      <header className="sticky top-0 z-20 border-b border-gray-800 bg-[#0f0f0f]/90 backdrop-blur-md p-4"><div className="max-w-2xl mx-auto flex justify-between items-center"><div className="flex items-center gap-2"><i className="fas fa-water text-white text-2xl"></i><span className="text-white font-bold text-xl">Wave</span></div><div className="flex gap-4 text-gray-400"><button onClick={() => { setActiveTab('feed'); setViewedProfile(null); }} className={`text-xl ${activeTab === 'feed' ? 'text-white' : ''}`}><i className="fas fa-home"></i></button><button onClick={() => { setActiveTab('search'); setViewedProfile(null); }} className={`text-xl ${activeTab === 'search' ? 'text-white' : ''}`}><i className="fas fa-search"></i></button><button onClick={() => { setActiveTab('chat'); setViewedProfile(null); }} className={`text-xl relative ${activeTab === 'chat' ? 'text-white' : ''}`}><i className="fas fa-comments"></i>{Object.values(unreadCounts).reduce((a,b)=>a+b,0)>0 && <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{Object.values(unreadCounts).reduce((a,b)=>a+b,0)}</span>}</button><button onClick={() => { setActiveTab('notify'); setViewedProfile(null); }} className={`text-xl relative ${activeTab === 'notify' ? 'text-white' : ''}`}><i className="fas fa-bell"></i>{notifications.filter(n => !n.read).length > 0 && <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{notifications.filter(n => !n.read).length}</span>}</button><button onClick={() => { setActiveTab('profile'); setViewedProfile(null); }} className={`text-xl ${activeTab === 'profile' ? 'text-white' : ''}`}><i className="fas fa-user"></i></button><button onClick={onLogout} className="text-sm bg-gray-800 px-3 py-1 rounded-full">Выйти</button></div></div></header>

      <main className="max-w-2xl mx-auto p-4">
        {activeTab === 'feed' && (<><div className="card p-4 mb-6"><div className="flex gap-3"><img src={user.avatar || DEFAULT_AVATAR} className="w-10 h-10 rounded-full object-cover" /><div className="flex-1 relative"><textarea ref={textareaRef} rows="2" placeholder="Что нового? @username или #хештег" className="w-full p-3 bg-[#2a2a2a] rounded-2xl text-white resize-none" value={newPostContent} onChange={handlePostInput} />{showMentions && filteredMentions.length > 0 && (<div className="absolute bottom-full left-0 bg-[#2a2a2a] border border-gray-700 rounded-xl max-h-48 overflow-auto z-10 mb-1 w-48">{filteredMentions.map(u => (<div key={u.id} className="p-2 hover:bg-[#3a3a3a] cursor-pointer flex items-center gap-2" onClick={() => insertMention(u.username)}><img src={u.avatar || DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white">@{u.username}</span></div>))}</div>)}<div className="flex flex-wrap gap-2 mt-2">{mediaList.map((m, i) => (<div key={i} className="media-preview" onClick={() => setFullscreenMedia({ url: m.url, type: m.type })}>{m.type === 'video' ? <video src={m.url} /> : <img src={m.url} />}<button className="remove-media" onClick={(e) => { e.stopPropagation(); removeMedia(i); }}>×</button></div>))}</div><div className="flex gap-2 mt-2"><label className={`cursor-pointer bg-gray-800 p-2 rounded-xl ${uploadingMedia ? 'opacity-50' : ''}`}><i className="fas fa-paperclip"></i><input type="file" accept="image/*,video/*" multiple onChange={handleMediaUpload} className="hidden" disabled={uploadingMedia} /></label><button onClick={() => setHidingPost(true)} className="bg-gray-800 text-white px-3 py-2 rounded-xl"><i className="fas fa-cog"></i></button><button onClick={createPost} className="white-glow-btn text-black px-6 py-2 rounded-full text-sm btn">Опубликовать</button></div></div></div></div>{posts.map(post => (<div key={post.id} className="card p-4 mb-4"><div className="flex items-center justify-between mb-2"><div className="flex items-center gap-2 cursor-pointer" onClick={() => post.user_id !== user.id && setViewedProfile(users.find(u => u.id === post.user_id))}><img src={post.user_avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><span className="font-bold text-white hover:underline">@{post.username}</span></div><div className="flex items-center gap-2"><span className="text-gray-500 text-xs">{formatDate(post.created_at)}{post.edited && <span className="ml-1 text-gray-600">(изменено)</span>}</span><PostDropdownMenu onEdit={post.user_id === user.id ? () => { setEditingPost(post); setEditPostContent(post.content); } : null} onDelete={post.user_id === user.id ? () => setPostToDelete(post.id) : null} onShare={() => { setSharingPost(post); setShareSelected([]); }} onHide={post.user_id === user.id ? () => { setHidingPost(true); setHideSelected(post.hidden_from || []); } : null} /></div></div><p className="text-white whitespace-pre-wrap">{renderContent(post.content)}</p>{post.media && post.media.length > 0 && (<div className="grid grid-cols-2 md:grid-cols-3 gap-2 mt-3">{post.media.map((m, i) => (m.type === 'video' ? (<video key={i} src={m.url} className="w-full h-40 object-cover rounded-2xl cursor-pointer" onClick={() => setFullscreenMedia({ url: m.url, type: 'video' })} />) : (<img key={i} src={m.url} className="w-full h-40 object-cover rounded-2xl cursor-pointer" onClick={() => setFullscreenMedia({ url: m.url, type: 'image' })} />)))}</div>)}<div className="flex gap-4 mt-3 text-gray-400 text-sm"><button onClick={() => likePost(post.id, post.likes || 0)} className="flex gap-1 hover:text-red-400"><i className="fas fa-heart"></i> {formatLikes(post.likes || 0)}</button><button onClick={() => { const div = document.getElementById(`comments-${post.id}`); if (div) div.classList.toggle('hidden'); }} className="flex gap-1 hover:text-blue-400"><i className="far fa-comment"></i> {(post.comments || []).length}</button></div><div id={`comments-${post.id}`} className="hidden mt-3 pt-3 border-t border-gray-800">{replyingToComment && <div className="reply-quote">Ответ @{replyingToComment.username}: "{replyingToComment.text.substring(0,60)}"</div>}{(post.comments || []).map(c => (<div key={c.id} className="flex gap-2 mb-2 text-sm p-2 hover:bg-[#2a2a2a] rounded-xl cursor-pointer" onClick={() => setSelectedComment({ postId: post.id, comment: c })}><span className="font-bold text-gray-300" onClick={(e) => { e.stopPropagation(); if (c.user_id !== user.id) setViewedProfile(users.find(u => u.id === c.user_id)); }}>@{c.username}</span><span className="text-gray-400 whitespace-pre-wrap">{c.text}</span></div>))}<div className="flex gap-2 mt-2"><input id={`comment-input-${post.id}`} type="text" placeholder="Комментарий..." className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-sm text-white" value={commentTexts[post.id] || ''} onChange={e => setCommentTexts({ ...commentTexts, [post.id]: e.target.value })} /><button onClick={() => addComment(post.id)} className="bg-gray-700 text-white px-3 rounded-xl text-sm btn">→</button></div></div></div>))}</>)}

        {activeTab === 'search' && (<div><div className="card p-4 mb-6"><div className="flex gap-2 mb-3"><button onClick={() => setSearchType('users')} className={`px-3 py-1 rounded-full text-sm ${searchType === 'users' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300'}`}>👥 Пользователи</button><button onClick={() => setSearchType('posts')} className={`px-3 py-1 rounded-full text-sm ${searchType === 'posts' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300'}`}>📄 Посты</button></div><input type="text" placeholder="Поиск пользователей, постов или хештегов #..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white" /></div>{searchType === 'users' && searchUserResults.map(u => (<div key={u.id} className="card p-4 mb-3 flex items-center justify-between"><div className="flex items-center gap-3 cursor-pointer" onClick={() => setViewedProfile(u)}><img src={u.avatar || DEFAULT_AVATAR} className="w-10 h-10 rounded-full" /><div><div className="font-bold text-white">{u.full_name || u.username}</div><div className="text-gray-400 text-sm">@{u.username}</div></div></div><button onClick={() => { setChatUser(u); setActiveTab('chat'); }} className="bg-green-600 text-white px-3 py-1 rounded-full text-sm btn">Чат</button></div>))}{searchType === 'posts' && searchPostResults.map(post => (<div key={post.id} className="card p-4 mb-3 cursor-pointer" onClick={() => { setActiveTab('feed'); setTimeout(() => document.getElementById(`post-${post.id}`)?.scrollIntoView({ behavior: 'smooth' }), 100); }}><div className="flex items-center gap-2 mb-2"><img src={post.user_avatar || DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="font-bold text-white text-sm">@{post.username}</span></div><p className="text-white text-sm whitespace-pre-wrap">{post.content.substring(0, 100)}...</p><div className="flex gap-3 mt-2 text-gray-500 text-xs"><span><i className="fas fa-heart text-red-500"></i> {formatLikes(post.likes || 0)}</span><span><i className="far fa-comment"></i> {(post.comments || []).length}</span></div></div>))}</div>)}

        {activeTab === 'chat' && (<div className="flex flex-col h-[70vh]"><div className="flex gap-2 mb-4 overflow-x-auto">{chatList.map(cu => (<button key={cu.id} onClick={() => setChatUser(cu)} className={`px-3 py-1 rounded-full text-sm ${chatUser?.id === cu.id ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-300'}`}>@{cu.username}</button>))}</div>{chatUser ? (<div className="card flex flex-col h-full"><div className="p-3 border-b border-gray-800 font-bold text-white">Чат с @{chatUser.username}</div><div className="flex-1 overflow-y-auto p-3 space-y-2">{replyToMessage && (<div className="reply-quote"><i className="fas fa-reply mr-1"></i> Ответ @{replyToMessage.from_user === user.id ? chatUser.username : users.find(u => u.id === replyToMessage.from_user)?.username}: "{replyToMessage.content.substring(0, 60)}"</div>)}{messages.map((msg, idx) => (<div key={idx} className={`flex ${msg.from_user === user.id ? 'justify-end' : 'justify-start'}`}><div className={`max-w-[70%] p-2 rounded-xl ${msg.from_user === user.id ? 'bg-blue-600 text-white' : 'bg-[#2a2a2a] text-white'} chat-bubble cursor-pointer`} onClick={() => setSelectedMessage({ msg })}><p className="text-sm whitespace-pre-wrap">{msg.content}</p><div className="text-xs opacity-70 mt-1">{new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div></div></div>))}<div ref={messagesEndRef} /></div><div className="p-3 border-t border-gray-800 flex gap-2"><input id="message-input" type="text" placeholder="Сообщение..." value={newMessageText} onChange={e => setNewMessageText(e.target.value)} onKeyPress={e => e.key === 'Enter' && sendMessage()} className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" /><button onClick={sendMessage} className="bg-blue-600 text-white px-4 rounded-xl btn">→</button></div></div>) : (<div className="card p-8 text-center text-gray-500">Выберите чат</div>)}</div>)}

        {activeTab === 'notify' && (<div><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-bold text-white">Уведомления</h2><button onClick={markAllNotificationsRead} className="text-sm bg-gray-700 text-white px-3 py-1 rounded-xl btn">Прочитать все</button></div>{notifications.length === 0 && <div className="card p-8 text-center text-gray-500">Нет уведомлений</div>}{notifications.map(n => (<div key={n.id} className={`card p-4 mb-3 cursor-pointer ${!n.read ? 'border-l-4 border-green-500' : ''}`} onClick={async () => { await supabase.from('notifications').update({ read: true }).eq('id', n.id); setNotifications(prev => prev.map(not => not.id === n.id ? { ...not, read: true } : not)); if (n.type === 'message') { const from = users.find(u => u.id === n.from_user_id); if (from) { setChatUser(from); setActiveTab('chat'); } } else { setActiveTab('feed'); } }}><p className="text-white">{n.text}</p><p className="text-xs text-gray-500 mt-1">{formatDate(n.created_at)}</p></div>))}</div>)}

        {activeTab === 'profile' && (<div className="card p-6 text-center"><div className="flex justify-end"><ProfileDropdownMenu /></div><div className="avatar-upload w-24 h-24 mx-auto relative cursor-pointer"><img src={user.avatar || DEFAULT_AVATAR} className="w-24 h-24 rounded-full object-cover" /><input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer rounded-full" onChange={(e) => uploadAvatar(e.target.files[0])} disabled={avatarUploading} /></div>{editingProfile ? (<div className="mt-4"><input type="text" value={editName} onChange={e => setEditName(e.target.value)} className="edit-input" placeholder="Имя" /><textarea value={editBio} onChange={e => setEditBio(e.target.value)} className="edit-textarea" rows="2" placeholder="О себе" /><div className="flex gap-2 mt-3"><button onClick={saveProfile} className="bg-green-600 text-white px-4 py-2 rounded-xl btn">Сохранить</button><button onClick={() => setEditingProfile(false)} className="bg-gray-700 text-white px-4 py-2 rounded-xl btn">Отмена</button></div></div>) : (<><h2 className="text-xl font-bold text-white mt-2">{user.full_name || user.username}</h2><p className="text-gray-400">@{user.username}</p><p className="text-gray-500 text-sm mt-1">{user.bio || 'Нет описания'}</p><div className="flex gap-6 justify-center mt-4"><div><span className="font-bold text-white">{posts.filter(p => p.user_id === user.id).length}</span><span className="text-gray-500 ml-1">постов</span></div><div><span className="font-bold text-white">{user.followers?.length || 0}</span><span className="text-gray-500 ml-1">подписчиков</span></div><div><span className="font-bold text-white">{user.following?.length || 0}</span><span className="text-gray-500 ml-1">подписок</span></div></div></>)}</div>)}
      </main>
    </div>);
  }

  function App() { const [access, setAccess] = React.useState(false); const [user, setUser] = React.useState(null); const [loading, setLoading] = React.useState(true); React.useEffect(() => { if (localStorage.getItem('wave_access') === 'ok') setAccess(true); const saved = localStorage.getItem('wave_user'); if (saved) setUser(JSON.parse(saved)); setLoading(false); }, []); const handleLogin = (u) => { localStorage.setItem('wave_user', JSON.stringify(u)); setUser(u); }; const handleLogout = () => { localStorage.removeItem('wave_user'); setUser(null); }; if (loading) return <div className="p-4 text-white">Загрузка...</div>; if (!access) return <PasswordGate onSuccess={() => setAccess(true)} />; if (user) return <MainApp user={user} onLogout={handleLogout} />; return <Auth onLogin={handleLogin} />; }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
