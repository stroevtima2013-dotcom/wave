<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Wave Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0a0a0a; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #2a2a2a; color: white; padding: 8px 16px; border-radius: 40px; z-index: 1000; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  // ========== ВСТАВЬ СВОИ КЛЮЧИ ==========
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  // ======================================
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  // ========== ВХОД ПО ПАРОЛЮ ==========
  function PasswordGate({ onSuccess }) {
    const [password, setPassword] = React.useState('');
    const [error, setError] = React.useState('');
    return (
      <div className="min-h-screen flex items-center justify-center bg-[#0a0a0a] p-4">
        <div className="card p-8 max-w-md w-full text-center">
          <i className="fas fa-lock text-4xl text-white mb-4"></i>
          <h1 className="text-2xl font-bold text-white">Wave Social</h1>
          <p className="text-gray-500 mt-2">Введите пароль: 8554social</p>
          <form onSubmit={(e) => { e.preventDefault(); if (password === '8554social') { localStorage.setItem('wave_access', 'ok'); onSuccess(); } else setError('Неверный пароль'); }} className="mt-6">
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white text-center" autoFocus />
            {error && <div className="text-red-400 text-sm mt-2">{error}</div>}
            <button type="submit" className="w-full mt-4 bg-gray-800 text-white py-2 rounded-xl">Войти</button>
          </form>
        </div>
      </div>
    );
  }

  // ========== РЕГИСТРАЦИЯ / ВХОД ==========
  function LoginRegister({ onLogin }) {
    const [isLogin, setIsLogin] = React.useState(true);
    const [username, setUsername] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [fullName, setFullName] = React.useState('');
    const [error, setError] = React.useState('');
    const [loading, setLoading] = React.useState(false);
  
    const handleSubmit = async (e) => {
      e.preventDefault();
      setError('');
      setLoading(true);
      
      if (isLogin) {
        const { data: userData } = await supabase.from('users').select('*').eq('username', username).single();
        if (!userData) { setError('Пользователь не найден'); setLoading(false); return; }
        if (password === userData.password_hash) onLogin(userData);
        else setError('Неверный пароль');
      } else {
        if (password.length < 4) { setError('Пароль минимум 4 символа'); setLoading(false); return; }
        const { data: existing } = await supabase.from('users').select('username').eq('username', username).single();
        if (existing) { setError('Имя уже занято'); setLoading(false); return; }
        const { data: newUser } = await supabase.from('users').insert({ 
          username, full_name: fullName || username, password_hash: password, bio: 'Новый пользователь!' 
        }).select().single();
        if (newUser) onLogin(newUser);
        else setError('Ошибка регистрации');
      }
      setLoading(false);
    };
  
    return (
      <div className="min-h-screen flex items-center justify-center bg-[#0a0a0a] p-4">
        <div className="card p-8 max-w-md w-full">
          <div className="text-center"><i className="fas fa-water text-4xl text-white"></i><h1 className="text-2xl font-bold mt-2 text-white">Wave Social</h1></div>
          <form onSubmit={handleSubmit} className="space-y-4 mt-6">
            <input type="text" placeholder="Логин" value={username} onChange={e => setUsername(e.target.value)} className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white" required />
            <input type="password" placeholder="Пароль" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white" required />
            {!isLogin && <input type="text" placeholder="Имя" value={fullName} onChange={e => setFullName(e.target.value)} className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white" />}
            {error && <div className="text-red-400 text-sm">{error}</div>}
            <button type="submit" disabled={loading} className="w-full bg-gray-800 text-white py-3 rounded-xl font-semibold">{loading ? 'Загрузка...' : (isLogin ? 'Войти' : 'Зарегистрироваться')}</button>
          </form>
          <button onClick={() => { setIsLogin(!isLogin); setError(''); }} className="w-full mt-4 text-gray-500 text-sm">{isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}</button>
        </div>
      </div>
    );
  }

  // ========== ГЛАВНОЕ ПРИЛОЖЕНИЕ ==========
  function MainApp({ user, onLogout }) {
    const [posts, setPosts] = React.useState([]);
    const [newPost, setNewPost] = React.useState('');
    const [loading, setLoading] = React.useState(true);
    const [showComments, setShowComments] = React.useState(null);
    const [commentTexts, setCommentTexts] = React.useState({});
    
    const loadPosts = async () => {
      const { data } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
      setPosts(data || []);
      setLoading(false);
    };
    
    React.useEffect(() => { loadPosts(); }, []);
    
    const createPost = async () => {
      if (!newPost.trim()) return;
      await supabase.from('posts').insert({
        user_id: user.id, username: user.username, user_avatar: user.avatar,
        content: newPost, likes: 0, comments: [], created_at: new Date()
      });
      setNewPost('');
      loadPosts();
      showToast('Пост опубликован!');
    };
    
    const likePost = async (postId, currentLikes) => {
      await supabase.from('posts').update({ likes: currentLikes + 1 }).eq('id', postId);
      loadPosts();
    };
    
    const addComment = async (postId) => {
      const text = commentTexts[postId] || '';
      if (!text.trim()) return;
      const post = posts.find(p => p.id === postId);
      const newComments = [...(post.comments || []), {
        id: Date.now(),
        user_id: user.id,
        username: user.username,
        text: text,
        created_at: new Date().toISOString()
      }];
      await supabase.from('posts').update({ comments: newComments }).eq('id', postId);
      setCommentTexts({ ...commentTexts, [postId]: '' });
      loadPosts();
      showToast('Комментарий добавлен');
    };
    
    if (loading) return <div className="p-4 text-white text-center">Загрузка...</div>;
    
    return (
      <div className="min-h-screen bg-[#0a0a0a]">
        <header className="sticky top-0 border-b border-gray-800 bg-[#0a0a0a]/90 p-4 flex justify-between items-center">
          <div className="flex items-center gap-2"><i className="fas fa-water text-white text-2xl"></i><span className="text-white font-bold">Wave</span></div>
          <div className="flex items-center gap-3">
            <span className="text-gray-400 text-sm">@{user.username}</span>
            <button onClick={onLogout} className="bg-gray-800 text-white px-3 py-1 rounded-full text-sm">Выйти</button>
          </div>
        </header>
        
        <main className="max-w-2xl mx-auto p-4">
          {/* Форма поста */}
          <div className="card p-4 mb-6">
            <textarea rows="3" placeholder="Что нового?" className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white" value={newPost} onChange={e => setNewPost(e.target.value)} />
            <button onClick={createPost} className="mt-2 bg-blue-600 text-white px-6 py-2 rounded-full text-sm">Опубликовать</button>
          </div>
          
          {/* Лента */}
          {posts.map(post => (
            <div key={post.id} className="card p-4 mb-4">
              <div className="flex items-center gap-3 mb-2">
                <img src={post.user_avatar || 'https://via.placeholder.com/40'} className="w-10 h-10 rounded-full" />
                <div><div className="font-bold text-white">@{post.username}</div><div className="text-xs text-gray-500">{new Date(post.created_at).toLocaleString()}</div></div>
              </div>
              <p className="text-white">{post.content}</p>
              <div className="flex gap-4 mt-3 text-gray-500">
                <button onClick={() => likePost(post.id, post.likes || 0)} className="flex gap-1 hover:text-red-400">❤️ {post.likes || 0}</button>
                <button onClick={() => setShowComments(showComments === post.id ? null : post.id)} className="flex gap-1 hover:text-blue-400">💬 {(post.comments || []).length}</button>
              </div>
              
              {showComments === post.id && (
                <div className="mt-3 pt-3 border-t border-gray-800">
                  {(post.comments || []).map(c => (
                    <div key={c.id} className="flex gap-2 mb-2 text-sm">
                      <span className="font-bold text-gray-300">@{c.username}</span>
                      <span className="text-gray-400">{c.text}</span>
                    </div>
                  ))}
                  <div className="flex gap-2 mt-2">
                    <input type="text" placeholder="Написать комментарий..." className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-sm text-white" value={commentTexts[post.id] || ''} onChange={e => setCommentTexts({ ...commentTexts, [post.id]: e.target.value })} />
                    <button onClick={() => addComment(post.id)} className="bg-gray-800 text-white px-3 rounded-xl text-sm">→</button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </main>
      </div>
    );
  }

  // ========== ГЛАВНЫЙ КОМПОНЕНТ ==========
  function App() {
    const [access, setAccess] = React.useState(false);
    const [user, setUser] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    
    React.useEffect(() => {
      if (localStorage.getItem('wave_access') === 'ok') setAccess(true);
      const saved = localStorage.getItem('wave_user');
      if (saved) setUser(JSON.parse(saved));
      setLoading(false);
    }, []);
    
    const handleLogin = (u) => { localStorage.setItem('wave_user', JSON.stringify(u)); setUser(u); };
    const handleLogout = () => { localStorage.removeItem('wave_user'); setUser(null); };
    
    if (loading) return <div className="p-4 text-white">Загрузка...</div>;
    if (!access) return <PasswordGate onSuccess={() => setAccess(true)} />;
    if (user) return <MainApp user={user} onLogout={handleLogout} />;
    return <LoginRegister onLogin={handleLogin} />;
  }
  
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
