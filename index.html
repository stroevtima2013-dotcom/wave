<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Wave Social</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f0f0f; margin: 0; padding: 0; }
    #root { min-height: 100vh; background: #0f0f0f; }
    .card { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 24px; transition: 0.2s; box-shadow: 0 0 5px rgba(255,255,255,0.05); }
    .card:hover { transform: translateY(-3px); border-color: #4a4a4a; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e1e1e; border: 1px solid #333; color: white; padding: 8px 18px; border-radius: 40px; z-index: 1000; font-size: 14px; animation: fadeInUp 0.3s ease; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .media-preview { position: relative; display: inline-block; margin: 4px; border-radius: 14px; overflow: hidden; border: 1px solid #3a3a3a; width: 80px; height: 80px; cursor: pointer; }
    .media-preview img, .media-preview video { width: 100%; height: 100%; object-fit: cover; }
    .remove-media { position: absolute; top: -8px; right: -8px; background: #ef4444; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; color: white; z-index: 10; }
    .dropdown-menu { position: absolute; right: 0; top: 100%; margin-top: 8px; background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 16px; min-width: 160px; z-index: 50; overflow: hidden; }
    .dropdown-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; color: #e0e0e0; transition: 0.15s; cursor: pointer; }
    .dropdown-item:hover { background: #2a2a2a; }
    .reply-quote { background: #1a1a1a; padding: 6px 10px; border-radius: 12px; border-left: 3px solid #3b82f6; font-size: 11px; color: #aaa; margin-bottom: 6px; display: flex; flex-direction: column; gap: 2px; }
    .mention { color: #3b82f6; font-weight: 600; cursor: pointer; background: rgba(59,130,246,0.15); padding: 2px 6px; border-radius: 12px; display: inline-block; }
    .hashtag { color: #eab308; font-weight: 600; cursor: pointer; background: rgba(234,179,8,0.15); padding: 2px 6px; border-radius: 12px; display: inline-block; }
    .white-glow-btn { background: white; color: #111; box-shadow: 0 0 8px rgba(255,255,255,0.3); transition: 0.2s; font-weight: 500; cursor: pointer; border: none; border-radius: 40px; padding: 8px 20px; }
    .white-glow-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255,255,255,0.5); background: #f0f0f0; }
    .icon-btn { background: white; color: #111; border-radius: 40px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; border: none; transition: 0.2s; }
    .icon-btn:hover { transform: scale(1.02); background: #f5f5f5; }
    .fullscreen-media { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .fullscreen-media img, .fullscreen-media video { max-width: 95vw; max-height: 95vh; border-radius: 28px; }
    .fullscreen-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 1000; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fullscreen-modal-content { background: #1a1a1a; border-radius: 32px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 24px; border: 1px solid #3a3a3a; animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .poll-option { background: #2a2a2a; border-radius: 12px; margin: 8px 0; overflow: hidden; cursor: pointer; transition: 0.2s; }
    .poll-option:hover { background: #333; }
    .poll-bar { background: #3b82f6; height: 100%; transition: width 0.3s ease; }
    .chat-user-list { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
    .chat-user-item { background: #1a1a1a; border-radius: 16px; padding: 12px; cursor: pointer; transition: 0.2s; border: 1px solid #2c2c2c; display: flex; align-items: center; gap: 12px; }
    .chat-user-item:hover { background: #252525; border-color: #3b82f6; }
    .chat-messages { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow-y: auto; padding: 12px; }
    .message-bubble { max-width: 80%; padding: 10px 14px; border-radius: 20px; word-break: break-word; }
    .message-mine { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message-theirs { background: #2a2a2a; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
    .voice-message { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 30px; cursor: pointer; }
    .voice-message audio { height: 36px; min-width: 200px; }
    .carousel-container { position: relative; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; display: flex; gap: 8px; scrollbar-width: thin; }
    .carousel-slide { flex: 0 0 100%; scroll-snap-align: start; }
    .carousel-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 16px; cursor: pointer; }
    @media (max-width: 640px) {
      .message-bubble { max-width: 90%; }
      .chat-user-item { padding: 10px; }
      .card { border-radius: 16px; }
      .icon-btn { padding: 6px 12px; font-size: 12px; }
      .white-glow-btn { padding: 6px 14px; font-size: 12px; }
      .voice-message audio { min-width: 160px; height: 32px; }
    }
  </style>
</head>
<body>
<div id="root"><div class="flex items-center justify-center min-h-screen text-white"><i class="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
  const SUPABASE_URL = "https://udjyttttghwtylzjavmw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_U_lF6X0ZakHsq6I_f8byHA_91hFjf3y";
  const STORAGE_BUCKET = "wave-media";
  const DEFAULT_AVATAR = "https://ui-avatars.com/api/?background=3b82f6&color=fff&rounded=true&size=96&bold=true&length=2&name=?";
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showToast(msg) { 
    const t = document.createElement('div'); 
    t.className = 'toast'; 
    t.innerHTML = msg; 
    document.body.appendChild(t); 
    setTimeout(() => t.remove(), 2500); 
  }
  
  // Время МСК (+3 часа от UTC)
  function formatDate(iso) { 
    if(!iso) return 'только что';
    const d = new Date(iso);
    const now = new Date();
    const mskOffset = 3 * 60 * 60 * 1000; // +3 часа
    const mskTime = new Date(d.getTime() + mskOffset);
    const nowMsk = new Date(now.getTime() + mskOffset);
    const diff = Math.floor((nowMsk - mskTime) / 1000);
    if (diff < 60) return 'только что';
    if (diff < 3600) return `${Math.floor(diff/60)} мин назад`;
    if (diff < 86400) {
      const h = mskTime.getHours().toString().padStart(2,'0');
      const m = mskTime.getMinutes().toString().padStart(2,'0');
      const dNum = mskTime.getDate();
      const nowDate = nowMsk.getDate();
      if (dNum === nowDate) return `сегодня в ${h}:${m}`;
      if (dNum === nowDate - 1) return `вчера в ${h}:${m}`;
      return `${mskTime.toLocaleDateString('ru-RU', {day:'numeric', month:'short'})} в ${h}:${m}`;
    }
    if (diff < 172800) return 'вчера';
    if (diff < 604800) return `${Math.floor(diff/86400)} дн назад`;
    if (diff < 2592000) return `${Math.floor(diff/604800)} нед назад`;
    if (diff < 31536000) return `${Math.floor(diff/2592000)} мес назад`;
    return `${Math.floor(diff/31536000)} г назад`;
  }
  
  function formatLikes(n) { 
    if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'м'; 
    if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'к'; 
    return n; 
  }

  // Умная лента: популярный - новый - популярный - новый
  function getSmartOrder(posts) {
    const popular = posts.filter(p => (p.likes || 0) + (p.comments?.length || 0) > 5);
    const normal = posts.filter(p => (p.likes || 0) + (p.comments?.length || 0) <= 5);
    const result = [];
    const maxLen = Math.max(popular.length, normal.length);
    for (let i = 0; i < maxLen; i++) {
      if (i < popular.length) result.push(popular[i]);
      if (i < normal.length) result.push(normal[i]);
    }
    return result;
  }

  // Карусель для 3+ фото
  function MediaCarousel({ media, onFullscreen }) {
    const [currentIndex, setCurrentIndex] = React.useState(0);
    if (!media || media.length === 0) return null;
    if (media.length <= 3) {
      return <MediaCollage media={media} onFullscreen={onFullscreen} />;
    }
    const current = media[currentIndex];
    return (
      <div className="mt-3 relative">
        <div className="relative">
          {current.type === 'video' ? 
            <video src={current.url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => onFullscreen(current)} /> :
            <img src={current.url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => onFullscreen(current)} />
          }
          <div className="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded-full">{currentIndex+1} / {media.length}</div>
          {currentIndex > 0 && (
            <button onClick={(e) => { e.stopPropagation(); setCurrentIndex(currentIndex-1); }} className="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white rounded-full w-8 h-8 flex items-center justify-center"><i className="fas fa-chevron-left"></i></button>
          )}
          {currentIndex < media.length-1 && (
            <button onClick={(e) => { e.stopPropagation(); setCurrentIndex(currentIndex+1); }} className="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white rounded-full w-8 h-8 flex items-center justify-center"><i className="fas fa-chevron-right"></i></button>
          )}
        </div>
      </div>
    );
  }

  function MediaCollage({ media, onFullscreen }) {
    if (!media || media.length === 0) return null;
    if (media.length === 1) {
      const m = media[0];
      return (
        <div className="mt-3">
          {m.type === 'video' ? 
            <video src={m.url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => onFullscreen(m)} /> :
            <img src={m.url} className="w-full rounded-xl max-h-[450px] object-cover cursor-pointer" onClick={() => onFullscreen(m)} />
          }
        </div>
      );
    }
    if (media.length === 2) {
      return (
        <div className="grid grid-cols-2 gap-2 mt-3">
          {media.map((m, i) => (
            <div key={i}>
              {m.type === 'video' ? 
                <video src={m.url} className="w-full rounded-xl h-48 object-cover cursor-pointer" onClick={() => onFullscreen(m)} /> :
                <img src={m.url} className="w-full rounded-xl h-48 object-cover cursor-pointer" onClick={() => onFullscreen(m)} />
              }
            </div>
          ))}
        </div>
      );
    }
    if (media.length === 3) {
      return (
        <div className="grid grid-cols-3 gap-1 mt-3">
          {media.map((m, i) => (
            <div key={i}>
              {m.type === 'video' ? 
                <video src={m.url} className="w-full rounded-xl aspect-square object-cover cursor-pointer" onClick={() => onFullscreen(m)} /> :
                <img src={m.url} className="w-full rounded-xl aspect-square object-cover cursor-pointer" onClick={() => onFullscreen(m)} />
              }
            </div>
          ))}
        </div>
      );
    }
    return <MediaCarousel media={media} onFullscreen={onFullscreen} />;
  }

  function SharedPostCard({ post, onGoToPost }) {
    return (
      <div className="bg-[#252525] rounded-2xl p-3 mt-2 cursor-pointer hover:bg-[#2a2a2a] transition border border-gray-800" onClick={(e) => { e.stopPropagation(); onGoToPost(post.id); }}>
        <div className="flex items-center gap-2 mb-2"><img src={post.user_avatar || DEFAULT_AVATAR} className="w-5 h-5 rounded-full" /><span className="text-white text-xs font-medium">@{post.username}</span></div>
        <p className="text-gray-300 text-sm line-clamp-2">{post.content?.substring(0, 100)}{post.content?.length > 100 ? '...' : ''}</p>
        <div className="flex gap-3 mt-2 text-gray-500 text-xs"><span><i className="fas fa-heart text-red-500"></i> {formatLikes(post.likes || 0)}</span><span><i className="far fa-comment"></i> {(post.comments || []).length}</span></div>
      </div>
    );
  }

  function ReadMore({ text, maxLength = 200 }) {
    const [expanded, setExpanded] = React.useState(false);
    if(!text) return null;
    const needTruncate = text.length > maxLength;
    const displayText = expanded ? text : (needTruncate ? text.slice(0, maxLength) + '...' : text);
    if (!needTruncate) return <p className="text-white text-sm whitespace-pre-wrap">{text}</p>;
    return (
      <div className="read-more-container">
        <div className={`read-more-content ${expanded ? 'expanded' : 'collapsed'}`}>
          <p className="text-white text-sm whitespace-pre-wrap">{displayText}</p>
        </div>
        {!expanded && <div className="read-more-overlay"></div>}
        <button onClick={() => setExpanded(!expanded)} className="read-more-btn">{expanded ? 'Свернуть ↑' : 'Читать далее ↓'}</button>
      </div>
    );
  }

  function PollComponent({ poll, postId, userId, onVote }) {
    const [voted, setVoted] = React.useState(poll?.voted_by?.includes(userId) || false);
    const totalVotes = poll?.options?.reduce((sum, opt) => sum + (opt.votes || 0), 0) || 0;
    const handleVote = async (optionIndex) => {
      if (voted) return;
      const newPoll = { ...poll };
      newPoll.options[optionIndex].votes = (newPoll.options[optionIndex].votes || 0) + 1;
      newPoll.voted_by = [...(poll.voted_by || []), userId];
      onVote(postId, newPoll);
      setVoted(true);
    };
    return (
      <div className="mt-3 p-3 bg-[#252525] rounded-xl">
        <p className="text-white text-sm font-medium mb-2">{poll?.question || 'Опрос'}</p>
        {poll?.options?.map((opt, idx) => {
          const percent = totalVotes > 0 ? ((opt.votes || 0) / totalVotes) * 100 : 0;
          return (
            <div key={idx} className="poll-option" onClick={() => handleVote(idx)}>
              <div className="relative p-2">
                <div className="poll-bar absolute left-0 top-0 h-full rounded-xl" style={{ width: `${percent}%`, opacity: 0.3 }}></div>
                <div className="relative flex justify-between items-center z-10">
                  <span className="text-white text-sm">{opt.text}</span>
                  {voted && <span className="text-gray-300 text-xs">{percent.toFixed(1)}% ({opt.votes || 0})</span>}
                </div>
              </div>
            </div>
          );
        })}
        <p className="text-gray-500 text-xs mt-2 text-center">{voted ? `✅ Всего голосов: ${totalVotes}` : '📊 Нажмите на вариант, чтобы проголосовать'}</p>
      </div>
    );
  }

  function PollCreatorModal({ onClose, onSave }) {
    const [question, setQuestion] = React.useState('');
    const [options, setOptions] = React.useState(['', '']);
    const addOption = () => { if (options.length < 10) setOptions([...options, '']); };
    const removeOption = (idx) => { if (options.length > 2) setOptions(options.filter((_, i) => i !== idx)); };
    const savePoll = () => {
      if (!question.trim()) { showToast('Введите вопрос опроса'); return; }
      const valid = options.filter(o => o.trim());
      if (valid.length < 2) { showToast('Минимум 2 варианта'); return; }
      onSave({ question: question.trim(), options: valid.map(t => ({ text: t, votes: 0 })), voted_by: [] });
      onClose();
    };
    return (
      <div className="fullscreen-modal" onClick={onClose}>
        <div className="fullscreen-modal-content" onClick={e=>e.stopPropagation()}>
          <div className="flex justify-between items-center mb-4"><h2 className="text-white text-xl font-bold">Создать опрос</h2><button onClick={onClose} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
          <input type="text" placeholder="Вопрос опроса" value={question} onChange={e=>setQuestion(e.target.value)} className="w-full p-3 bg-[#2a2a2a] rounded-xl text-white text-sm mb-4" autoFocus />
          <div className="mb-4"><p className="text-gray-400 text-sm mb-2">Варианты ответа (2-10):</p>
            {options.map((opt, i) => (<div key={i} className="flex gap-2 mb-2"><input type="text" placeholder={`Вариант ${i+1}`} value={opt} onChange={e=>setOptions(options.map((o, j)=>j===i?e.target.value:o))} className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" />{options.length>2 && <button onClick={()=>removeOption(i)} className="bg-red-600 text-white px-3 rounded-xl text-sm">✖</button>}</div>))}
          </div>
          <button onClick={addOption} className="text-blue-400 text-sm mb-4">+ Добавить вариант ({options.length}/10)</button>
          <div className="flex gap-3"><button onClick={savePoll} className="flex-1 bg-blue-600 py-3 rounded-xl text-white font-semibold">Добавить</button><button onClick={onClose} className="flex-1 bg-gray-700 py-3 rounded-xl text-white">Отмена</button></div>
        </div>
      </div>
    );
  }

  function HideSettingsModal({ users, currentUserId, selectedUsers, onToggleUser, onApply, onClose }) {
    return (
      <div className="fullscreen-modal" onClick={onClose}>
        <div className="fullscreen-modal-content" onClick={e=>e.stopPropagation()}>
          <div className="flex justify-between items-center mb-4"><h2 className="text-white text-xl font-bold">Скрыть пост</h2><button onClick={onClose} className="text-gray-400 hover:text-white text-2xl">&times;</button></div>
          <p className="text-gray-400 text-sm mb-4">Выберите пользователей:</p>
          <div className="max-h-96 overflow-y-auto mb-4 space-y-2">
            {users.filter(u=>u.id!==currentUserId).map(u=>(
              <div key={u.id} className={`flex items-center gap-3 p-3 rounded-xl cursor-pointer transition ${selectedUsers.includes(u.id)?'bg-[#2a2a2a] border border-blue-500':'bg-[#1a1a1a] hover:bg-[#252525]'}`} onClick={()=>onToggleUser(u.id)}>
                <input type="checkbox" checked={selectedUsers.includes(u.id)} onChange={()=>{}} className="w-4 h-4" />
                <img src={u.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                <div className="flex-1"><div className="text-white text-sm">{u.full_name||u.username}</div><div className="text-gray-500 text-xs">@{u.username}</div></div>
              </div>
            ))}
          </div>
          <div className="flex gap-3"><button onClick={onApply} className="flex-1 bg-blue-600 py-3 rounded-xl text-white font-semibold">Применить ({selectedUsers.length})</button><button onClick={onClose} className="flex-1 bg-gray-700 py-3 rounded-xl text-white">Отмена</button></div>
        </div>
      </div>
    );
  }

  function CommentsPage({ post, currentUser, onClose, onAddComment, onDeleteComment }) {
    const [text, setText] = React.useState('');
    const [replyTo, setReplyTo] = React.useState(null);
    const comments = post.comments || [];
    const renderComment = (c, depth=0) => {
      const replies = comments.filter(rc => rc.reply_to_id === c.id);
      return (
        <div key={c.id} className="mb-3" style={{marginLeft: depth*20}}>
          <div className="flex items-start gap-2 p-2 hover:bg-[#2a2a2a] rounded-xl">
            <img src={c.user_avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full mt-0.5" />
            <div className="flex-1">
              <div className="flex items-center gap-2"><span className="font-bold text-sm text-white">@{c.username}</span><span className="text-xs text-gray-500">{formatDate(c.created_at)}</span></div>
              {c.reply_to_username && <div className="reply-quote mt-1 text-xs">Ответ для @{c.reply_to_username}</div>}
              <p className="text-gray-300 text-sm mt-1">{c.text}</p>
              <button onClick={() => { setReplyTo(c); setText(`@${c.username} `); }} className="text-xs text-blue-400 mt-1">Ответить</button>
              {c.user_id === currentUser.id && <button onClick={() => onDeleteComment(post.id, c.id)} className="text-xs text-red-400 ml-2">Удалить</button>}
            </div>
          </div>
          {replies.map(r => renderComment(r, depth+1))}
        </div>
      );
    };
    return (
      <div className="fixed inset-0 bg-black/95 z-50 flex flex-col">
        <div className="sticky top-0 bg-[#1a1a1a] p-3 flex items-center gap-3 border-b border-gray-800"><button onClick={onClose} className="text-white text-xl">←</button><span className="text-white font-bold">Комментарии ({comments.length})</span></div>
        <div className="flex-1 overflow-y-auto p-3">{comments.filter(c=>!c.reply_to_id).map(c=>renderComment(c))}{comments.length===0 && <div className="text-center text-gray-500 py-8">Нет комментариев</div>}</div>
        <div className="p-3 border-t border-gray-800 bg-[#1a1a1a]">
          {replyTo && <div className="reply-quote mb-2 text-xs">Ответ @{replyTo.username} <button onClick={()=>setReplyTo(null)} className="text-red-400">✖</button></div>}
          <div className="flex gap-2"><input type="text" placeholder="Написать комментарий..." value={text} onChange={e=>setText(e.target.value)} className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" /><button onClick={()=>{if(text.trim()){onAddComment(post.id, text, replyTo); setText(''); setReplyTo(null);}}} className="bg-blue-600 text-white px-4 rounded-xl">→</button></div>
        </div>
      </div>
    );
  }

  function PasswordGate({ onSuccess }) { 
    const [p, setP] = React.useState(''); 
    const [e, setE] = React.useState(''); 
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>

  function Auth({ onLogin }) { 
    const [login, setLogin] = React.useState(true); 
    const [user, setUser] = React.useState(''); 
    const [pass, setPass] = React.useState(''); 
    const [name, setName] = React.useState(''); 
    const [err, setErr] = React.useState(''); 
    const [load, setLoad] = React.useState(false); 
    
    const submit = async (e) => { 
      e.preventDefault(); setErr(''); setLoad(true); 
      if (login) { 
        const { data: u } = await supabase.from('users').select('*').eq('username', user).single(); 
        if (!u) { setErr('Неверный логин или пароль'); setLoad(false); return; } 
        if (pass === u.password_hash) onLogin(u); else setErr('Неверный логин или пароль'); 
      } else { 
        if (pass.length < 4) { setErr('Пароль минимум 4 символа'); setLoad(false); return; } 
        const { data: exist } = await supabase.from('users').select('username').eq('username', user).single(); 
        if (exist) { setErr('Имя пользователя занято'); setLoad(false); return; } 
        const { data: nu } = await supabase.from('users').insert({ username: user, full_name: name || user, password_hash: pass, avatar: DEFAULT_AVATAR, following: [], followers: [] }).select().single(); 
        if (nu) onLogin(nu); else setErr('Ошибка регистрации'); 
      } 
      setLoad(false); 
    }; 
    
    return (
      <div className="min-h-screen flex items-center justify-center p-4" style={{background: '#0f0f0f'}}>
        <div className="card p-6 max-w-md w-full">
          <div className="text-center"><i className="fas fa-water text-3xl text-white"></i><h1 className="text-2xl font-bold mt-1 text-white">Wave Social</h1><p className="text-gray-500 text-sm mt-2">Общайся. Делись. Вдохновляй.</p></div>
          <form onSubmit={submit} className="space-y-3 mt-4">
            <input type="text" placeholder="Логин" value={user} onChange={e=>setUser(e.target.value.toLowerCase())} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            <input type="password" placeholder="Пароль" value={pass} onChange={e=>setPass(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" required />
            {!login && <input type="text" placeholder="Имя" value={name} onChange={e=>setName(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white" />}
            {err && <div className="text-red-400 text-sm text-center">{err}</div>}
            <button type="submit" disabled={load} className="w-full bg-blue-600 text-white py-2 rounded-xl font-semibold">{load ? 'Загрузка...' : (login ? 'Войти' : 'Регистрация')}</button>
          </form>
          <button onClick={()=>{setLogin(!login); setErr('');}} className="w-full mt-3 text-gray-400 text-sm hover:text-white">{login ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}</button>
        </div>
      </div>
    );
  }

  function MainApp({ user, onLogout }) {
    const [tab, setTab] = React.useState('feed');
    const [posts, setPosts] = React.useState([]);
    const [users, setUsers] = React.useState([]);
    const [chatUser, setChatUser] = React.useState(null);
    const [messages, setMessages] = React.useState([]);
    const [chatList, setChatList] = React.useState([]);
    const [unread, setUnread] = React.useState({});
    const [notifs, setNotifs] = React.useState([]);
    const [viewProfile, setViewProfile] = React.useState(null);
    const [loading, setLoading] = React.useState(true);
    const [newPost, setNewPost] = React.useState('');
    const [media, setMedia] = React.useState([]);
    const [uploading, setUploading] = React.useState(false);
    const [commentTexts, setCommentTexts] = React.useState({});
    const [msgText, setMsgText] = React.useState('');
    const [search, setSearch] = React.useState('');
    const [searchUsers, setSearchUsers] = React.useState([]);
    const [searchPosts, setSearchPosts] = React.useState([]);
    const [sType, setSType] = React.useState('users');
    const [avatarUp, setAvatarUp] = React.useState(false);
    const [editProfile, setEditProfile] = React.useState(false);
    const [editName, setEditName] = React.useState(user.full_name||'');
    const [editBio, setEditBio] = React.useState(user.bio||'');
    const [editPost, setEditPost] = React.useState(null);
    const [editPostContent, setEditPostContent] = React.useState('');
    const [sharePost, setSharePost] = React.useState(null);
    const [delPostId, setDelPostId] = React.useState(null);
    const [fullscreen, setFullscreen] = React.useState(null);
    const [tempPoll, setTempPoll] = React.useState(null);
    const [showPollModal, setShowPollModal] = React.useState(false);
    const [showHideModal, setShowHideModal] = React.useState(false);
    const [hideSel, setHideSel] = React.useState([]);
    const [commentsPagePost, setCommentsPagePost] = React.useState(null);
    const [switchDialog, setSwitchDialog] = React.useState(false);
    const [switchUser, setSwitchUser] = React.useState('');
    const [switchPass, setSwitchPass] = React.useState('');
    const [switchErr, setSwitchErr] = React.useState('');
    const [showMentions, setShowMentions] = React.useState(false);
    const [mentionQuery, setMentionQuery] = React.useState('');
    const [mentionPos, setMentionPos] = React.useState(0);
    const [scrollingToPost, setScrollingToPost] = React.useState(null);
    const [showSubs, setShowSubs] = React.useState(false);
    const [showFollows, setShowFollows] = React.useState(false);
    const [showDeleteAccount, setShowDeleteAccount] = React.useState(false);
    const [recording, setRecording] = React.useState(false);
    const [mediaRecorder, setMediaRecorder] = React.useState(null);
    const [uploadingVoice, setUploadingVoice] = React.useState(false);
    const msgEndRef = React.useRef(null);
    const textareaRef = React.useRef(null);
    const messageIdsSet = React.useRef(new Set());
    const chatContainerRef = React.useRef(null);
    const postRefs = React.useRef({});

    React.useEffect(() => {
      if (chatContainerRef.current) {
        chatContainerRef.current.scrollTop = chatContainerRef.current.scrollHeight;
      }
    }, [messages]);

    React.useEffect(() => {
      if (scrollingToPost && postRefs.current[scrollingToPost]) {
        postRefs.current[scrollingToPost].scrollIntoView({ behavior: 'smooth', block: 'center' });
        setScrollingToPost(null);
      }
    }, [scrollingToPost, posts]);

    const loadAll = async () => {
      try {
        const [pRes, uRes, mRes, nRes] = await Promise.all([
          supabase.from('posts').select('*').order('created_at', { ascending: false }),
          supabase.from('users').select('*'),
          supabase.from('messages').select('*').or(`from_user.eq.${user.id},to_user.eq.${user.id}`).order('created_at', { ascending: true }),
          supabase.from('notifications').select('*').eq('user_id', user.id).order('created_at', { ascending: false })
        ]);
        const all = pRes.data || [];
        const visible = all.filter(p => !p.hidden_from?.includes(user.id));
        setPosts(visible);
        setUsers(uRes.data || []);
        setNotifs(nRes.data || []);
        const msgs = mRes.data || [];
        const chatSet = new Set();
        msgs.forEach(m=>{ if(m.from_user!==user.id) chatSet.add(m.from_user); if(m.to_user!==user.id) chatSet.add(m.to_user); });
        setChatList(uRes.data?.filter(u=>chatSet.has(u.id))||[]);
        const cnt = {};
        msgs.forEach(m=>{ if(m.to_user===user.id && !m.read) cnt[m.from_user]=(cnt[m.from_user]||0)+1; });
        setUnread(cnt);
        if(chatUser){
          const chatMsgs = msgs.filter(m=>(m.from_user===user.id&&m.to_user===chatUser.id)||(m.from_user===chatUser.id&&m.to_user===user.id));
          setMessages(chatMsgs);
          await supabase.from('messages').update({read:true}).eq('to_user',user.id).eq('from_user',chatUser.id);
        }
      } catch(e) { console.error(e); showToast('Ошибка загрузки'); }
      setLoading(false);
    };

    React.useEffect(() => { loadAll(); }, []);
    React.useEffect(() => { if(chatUser) loadAll(); }, [chatUser]);

    React.useEffect(() => {
      const pSub = supabase.channel('posts').on('postgres_changes', {event:'*',schema:'public',table:'posts'}, () => loadAll()).subscribe();
      const mSub = supabase.channel('messages').on('postgres_changes', {event:'INSERT',schema:'public',table:'messages'}, (payload) => {
        const newMsg = payload.new;
        if (messageIdsSet.current.has(newMsg.id)) return;
        messageIdsSet.current.add(newMsg.id);
        if ((newMsg.to_user === user.id || newMsg.from_user === user.id)) {
          if (chatUser && (newMsg.from_user === chatUser.id || newMsg.to_user === chatUser.id)) {
            setMessages(prev => {
              if (prev.some(m => m.id === newMsg.id)) return prev;
              return [...prev, newMsg];
            });
            if (newMsg.to_user === user.id) {
              supabase.from('messages').update({read:true}).eq('id', newMsg.id);
              setUnread(prev => ({...prev, [newMsg.from_user]: 0}));
            }
          } else {
            loadAll();
          }
        }
      }).subscribe();
      return () => { pSub.unsubscribe(); mSub.unsubscribe(); };
    }, [chatUser, user.id]);

    React.useEffect(() => {
      if(!search.trim()){ setSearchUsers([]); setSearchPosts([]); return; }
      if(sType === 'users') setSearchUsers(users.filter(u=>u.id!==user.id && u.username.toLowerCase().includes(search.toLowerCase())));
      else {
        const hashtagPattern = new RegExp(`#${search}`, 'i');
        const filtered = posts.filter(p => p.content && hashtagPattern.test(p.content));
        setSearchPosts(filtered);
      }
    }, [search, sType, users, posts]);

    const handlePostChange = (e) => {
      const val = e.target.value;
      setNewPost(val);
      const cursorPos = e.target.selectionStart;
      const textBeforeCursor = val.slice(0, cursorPos);
      const lastAtIndex = textBeforeCursor.lastIndexOf('@');
      if (lastAtIndex !== -1 && (lastAtIndex === textBeforeCursor.length - 1 || textBeforeCursor[lastAtIndex + 1]?.match(/\s/))) {
        const afterAt = textBeforeCursor.slice(lastAtIndex + 1);
        if (!afterAt.includes(' ') && afterAt.length < 30) {
          setShowMentions(true);
          setMentionQuery(afterAt);
          setMentionPos(lastAtIndex);
          return;
        }
      }
      setShowMentions(false);
    };

    const insertMention = (username) => {
      const before = newPost.slice(0, mentionPos);
      const after = newPost.slice(mentionPos + 1 + mentionQuery.length);
      setNewPost(`${before}@${username} ${after}`);
      setShowMentions(false);
      textareaRef.current?.focus();
    };

    // Ускоренная загрузка файлов (сжатие для тяжёлых)
    const uploadMedia = async (files) => {
      const uploaded = [];
      for(let f of files){
        let fileToUpload = f;
        if (f.size > 5 * 1024 * 1024 && f.type.startsWith('image/')) {
          // небольшое сжатие для тяжёлых изображений через canvas
          const img = await createImageBitmap(f);
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          let width = img.width;
          let height = img.height;
          const maxDim = 1200;
          if (width > maxDim || height > maxDim) {
            if (width > height) { height = (height * maxDim) / width; width = maxDim; }
            else { width = (width * maxDim) / height; height = maxDim; }
          }
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
          fileToUpload = new File([blob], f.name.replace(/\.[^/.]+$/, '.jpg'), { type: 'image/jpeg' });
        }
        const name = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileToUpload.name.split('.').pop()}`;
        const {error} = await supabase.storage.from(STORAGE_BUCKET).upload(name, fileToUpload);
        if(error) continue;
        const {data:url} = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name);
        uploaded.push({url:url.publicUrl, type:fileToUpload.type.startsWith('image/')?'image':'video'});
      }
      return uploaded;
    };

    const upAvatar = async (file) => { 
      if(!file) return; 
      setAvatarUp(true); 
      const reader = new FileReader();
      reader.onloadend = () => {
        user.avatar = reader.result;
        setUsers(prev => prev.map(u => u.id === user.id ? {...u, avatar: reader.result} : u));
        setAvatarUp(false);
      };
      reader.readAsDataURL(file);
      try {
        const name = `avatar_${user.id}_${Date.now()}.jpg`;
        const {error} = await supabase.storage.from(STORAGE_BUCKET).upload(name, file);
        if(error) throw error;
        const {data:url} = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name);
        await supabase.from('users').update({avatar:url.publicUrl}).eq('id',user.id);
        user.avatar = url.publicUrl;
        setUsers(prev => prev.map(u => u.id === user.id ? {...u, avatar: url.publicUrl} : u));
        showToast('Аватар обновлён');
      } catch(e) { console.error(e); }
    };

    const createPost = async () => {
      if(!newPost.trim() && media.length===0 && !tempPoll){ showToast('Напишите текст или добавьте медиа/опрос'); return; }
      
      const mentions = [...newPost.matchAll(/@(\w+)/g)].map(m=>m[1]);
      for(let m of mentions){
        const {data} = await supabase.from('users').select('username').eq('username',m).single();
        if(!data){ showToast(`Пользователь @${m} не существует`); return; }
      }
      
      const hashtags = [...newPost.matchAll(/#([\wа-яё]+)/gi)].map(m=>m[0]);
      const hidden = hideSel.length ? hideSel : null;
      
      const newPostObj = { 
        user_id: user.id, 
        username: user.username, 
        user_avatar: user.avatar, 
        content: newPost, 
        media: media, 
        poll: tempPoll, 
        likes: 0, 
        comments: [], 
        mentions: mentions, 
        hashtags: hashtags,
        hidden_from: hidden,
        created_at: new Date().toISOString() 
      };
      
      const {data: ins, error} = await supabase.from('posts').insert(newPostObj).select().single();
      
      if(error) { 
        showToast('Ошибка: ' + error.message); 
        return; 
      }
      
      if(ins) setPosts([ins, ...posts]);
      setNewPost(''); setMedia([]); setTempPoll(null); setHideSel([]);
      
      for(let m of mentions){
        const u = users.find(x=>x.username === m);
        if(u && u.id !== user.id){
          await supabase.from('notifications').insert({ 
            user_id: u.id, type: 'mention', from_user_id: user.id, 
            from_username: user.username, text: `${user.username} упомянул вас в посте`, 
            read: false, created_at: new Date() 
          });
        }
      }
      showToast('Пост опубликован!');
    };

    const likePost = async (pid, curr) => { 
      const newL = curr + 1; 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,likes:newL}:p)); 
      await supabase.from('posts').update({likes:newL}).eq('id',pid); 
    };
    
    const addComment = async (pid, text, replyTo=null) => {
      const post = posts.find(p=>p.id===pid);
      const newC = {id:Date.now(), user_id:user.id, username:user.username, user_avatar:user.avatar, text, reply_to_id:replyTo?.id||null, reply_to_username:replyTo?.username||null, created_at:new Date().toISOString()};
      const newCmnts = [...(post.comments||[]), newC];
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newCmnts}:p));
      await supabase.from('posts').update({comments:newCmnts}).eq('id',pid);
      if(post.user_id!==user.id) await supabase.from('notifications').insert({user_id:post.user_id,type:'comment',from_user_id:user.id,from_username:user.username,post_id:pid,text:`${user.username} прокомментировал ваш пост`, read:false,created_at:new Date()});
    };
    
    const deleteComment = async (pid, cid) => { 
      const post=posts.find(p=>p.id===pid); 
      const newC=(post.comments||[]).filter(c=>c.id!==cid); 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,comments:newC}:p)); 
      await supabase.from('posts').update({comments:newC}).eq('id',pid); 
      showToast('Комментарий удалён'); 
    };
    
    const delPost = async (pid) => { 
      setPosts(prev=>prev.filter(p=>p.id!==pid)); 
      await supabase.from('posts').delete().eq('id',pid).eq('user_id',user.id); 
      setDelPostId(null); 
      showToast('Пост удалён'); 
    };
    
    const follow = async (id) => { 
      if(id===user.id){showToast('Нельзя подписаться на себя');return;} 
      let f=user.following||[]; 
      let is=f.includes(id); 
      if(is) { showToast('Вы уже подписаны'); return; }
      let nf=[...f,id]; 
      await supabase.from('users').update({following:nf}).eq('id',user.id); 
      user.following=nf; 
      let t=users.find(u=>u.id===id); 
      if(t){
        let fl=t.followers||[]; 
        let nfl=[...fl,user.id]; 
        await supabase.from('users').update({followers:nfl}).eq('id',id);
        setUsers(prev => prev.map(u => u.id === id ? {...u, followers: nfl} : u));
      }
      showToast('Подписались'); 
      await loadAll(); 
    };
    
    const sendMsg = async (textOrVoice) => {
      const content = typeof textOrVoice === 'string' ? textOrVoice : msgText;
      if((!content || !content.trim()) && !textOrVoice?.url) return;
      const msgObj = { from_user:user.id, to_user:chatUser.id, read:false, created_at:new Date() };
      if (typeof textOrVoice === 'string' || content.trim()) {
        msgObj.content = content;
      }
      if (textOrVoice?.url) {
        msgObj.voice_url = textOrVoice.url;
      }
      const {data:ins} = await supabase.from('messages').insert(msgObj).select().single();
      if(ins) setMessages(prev => [...prev, ins]);
      setMsgText('');
      // Убрано уведомление о сообщении
    };

    const startRecording = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream);
        const chunks = [];
        recorder.ondataavailable = (e) => chunks.push(e.data);
        recorder.onstop = async () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const file = new File([blob], `voice_${Date.now()}.webm`, { type: 'audio/webm' });
          setUploadingVoice(true);
          const name = `voice_${user.id}_${Date.now()}.webm`;
          const {error} = await supabase.storage.from(STORAGE_BUCKET).upload(name, file);
          if(error) { showToast('Ошибка загрузки голосового'); setUploadingVoice(false); return; }
          const {data:url} = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(name);
          await sendMsg({ url: url.publicUrl });
          setUploadingVoice(false);
          stream.getTracks().forEach(track => track.stop());
        };
        recorder.start();
        setMediaRecorder(recorder);
        setRecording(true);
        setTimeout(() => { if(recorder.state === 'recording') stopRecording(); }, 60000);
      } catch(e) { showToast('Нет доступа к микрофону'); }
    };

    const stopRecording = () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        setRecording(false);
      }
    };

    const sharePostToChat = async (post, chatUserId) => {
      // Отправляем ссылку на пост вместо цитаты
      const postLink = `🔗 Пост: https://wavesocial.app/post/${post.id}\n\n❤️ ${formatLikes(post.likes || 0)} лайков | 💬 ${(post.comments || []).length} комментариев`;
      await supabase.from('messages').insert({ from_user:user.id, to_user:chatUserId, content:postLink, shared_post_id:post.id, read:false, created_at:new Date() });
      showToast('Пост отправлен в чат');
    };
    
    const saveProfile = async () => { 
      await supabase.from('users').update({full_name:editName, bio:editBio}).eq('id',user.id); 
      user.full_name=editName; 
      user.bio=editBio; 
      setEditProfile(false); 
      await loadAll(); 
      showToast('Профиль обновлён'); 
    };
    
    const deleteAccount = async () => {
      await supabase.from('users').delete().eq('id', user.id);
      showToast('Аккаунт удалён');
      localStorage.removeItem('wave_user');
      localStorage.removeItem('wave_access');
      window.location.reload();
    };
    
    const handlePollVote = async (pid, newPoll) => { 
      setPosts(prev=>prev.map(p=>p.id===pid?{...p,poll:newPoll}:p)); 
      await supabase.from('posts').update({poll:newPoll}).eq('id',pid); 
    };

    const changeMyVote = async (post) => {
      if (!post.poll) return;
      const newPoll = { ...post.poll, voted_by: post.poll.voted_by.filter(id => id !== user.id) };
      setPosts(prev=>prev.map(p=>p.id===post.id?{...p,poll:newPoll}:p));
      await supabase.from('posts').update({poll:newPoll}).eq('id',post.id);
      showToast('Ваш голос сброшен, можете проголосовать снова');
    };

    const renderText = (text) => {
      if(!text) return null;
      const parts = text.split(/(@\w+|#[\wа-яё]+)/gi);
      return parts.map((p,i) => {
        if(p.startsWith('@')){ const un=p.slice(1); return <span key={i} className="mention" onClick={()=>{const u=users.find(x=>x.username===un); if(u) setViewProfile(u);}}>{p}</span>; }
        if(p.startsWith('#')) return <span key={i} className="hashtag" onClick={()=>{setSearch(p.slice(1)); setSType('posts'); setTab('search');}}>{p}</span>;
        return <span key={i}>{p}</span>;
      });
    };
    
    const openProfileFollowList = (profileUser, type) => {
      setViewProfile(profileUser);
      if(type === 'subs') { setShowSubs(true); setShowFollows(false); }
      else { setShowFollows(true); setShowSubs(false); }
    };

    const PostMenu = ({onEdit,onDel,onShare,onChangeVote,hasPoll}) => {
      const [open,setOpen]=React.useState(false);
      const ref=React.useRef(null);
      React.useEffect(()=>{const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener('click',fn); return()=>document.removeEventListener('click',fn);},[]);
      return (<div className="relative" ref={ref}><button onClick={()=>setOpen(!open)} className="text-gray-400 hover:text-white p-2"><i className="fas fa-ellipsis-h"></i></button>{open&&(<div className="dropdown-menu">{onEdit&&<div onClick={()=>{onEdit();setOpen(false);}} className="dropdown-item"><i className="fas fa-pen"></i> Редактировать</div>}{onShare&&<div onClick={()=>{onShare();setOpen(false);}} className="dropdown-item"><i className="fas fa-share-alt"></i> Поделиться</div>}{hasPoll && onChangeVote && <div onClick={()=>{onChangeVote();setOpen(false);}} className="dropdown-item"><i className="fas fa-sync-alt"></i> Изменить голос</div>}{onDel&&<div onClick={()=>{onDel();setOpen(false);}} className="dropdown-item"><i className="fas fa-trash-alt"></i> Удалить</div>}</div>)}</div>);
    };

    const ProfileMenu = () => {
      const [open,setOpen]=React.useState(false);
      const ref=React.useRef(null);
      React.useEffect(()=>{const fn=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);}; document.addEventListener('click',fn); return()=>document.removeEventListener('click',fn);},[]);
      return (
        <div className="absolute top-4 right-4 z-10" ref={ref}>
          <button onClick={()=>setOpen(!open)} className="text-gray-400 hover:text-white p-2 rounded-full bg-black/30"><i className="fas fa-ellipsis-v"></i></button>
          {open&&(
            <div className="dropdown-menu">
              <div onClick={()=>{setEditProfile(true); setOpen(false);}} className="dropdown-item"><i className="fas fa-user-edit"></i> Редактировать профиль</div>
              <div onClick={()=>{setSwitchDialog(true); setOpen(false);}} className="dropdown-item"><i className="fas fa-exchange-alt"></i> Сменить аккаунт</div>
              <div onClick={()=>{setShowDeleteAccount(true); setOpen(false);}} className="dropdown-item"><i className="fas fa-trash-alt"></i> Удалить аккаунт</div>
            </div>
          )}
        </div>
      );
    };

    const mentionUsers = users.filter(u => u.id !== user.id && u.username.toLowerCase().includes(mentionQuery.toLowerCase())).slice(0,5);
    const smartPosts = getSmartOrder(posts);

    if(loading) return <div className="min-h-screen flex items-center justify-center text-white"><i className="fas fa-spinner fa-spin mr-2"></i> Загрузка...</div>;
    if(commentsPagePost) return <CommentsPage post={commentsPagePost} currentUser={user} onClose={()=>setCommentsPagePost(null)} onAddComment={addComment} onDeleteComment={deleteComment} />;
    
    if(viewProfile) {
      const profileUser = viewProfile;
      const profilePosts = posts.filter(p => p.user_id === profileUser.id);
      const isFollowing = (user.following || []).includes(profileUser.id);
      
      return (
        <div className="min-h-screen p-4" style={{background: '#0a0a0a'}}>
          <button onClick={() => { setViewProfile(null); setShowSubs(false); setShowFollows(false); }} className="text-gray-400 mb-4 hover:text-white transition"><i className="fas fa-arrow-left"></i> Назад</button>
          <div className="card p-6 text-center mb-6 relative">
            {profileUser.id === user.id && <ProfileMenu />}
            <img src={profileUser.avatar || DEFAULT_AVATAR} className="w-24 h-24 rounded-full mx-auto border-2 border-blue-500" />
            <h2 className="text-xl font-bold text-white mt-3">{profileUser.full_name || profileUser.username}</h2>
            <p className="text-gray-400 text-sm">@{profileUser.username}</p>
            <p className="text-gray-400 text-sm mt-2">{profileUser.bio || ''}</p>
            <div className="flex gap-2 justify-center mt-4">
              <button onClick={() => { setChatUser(profileUser); setViewProfile(null); setTab('chat'); }} className="bg-green-600 text-white px-4 py-1.5 rounded-full text-sm hover:bg-green-700">Чат</button>
              {profileUser.id !== user.id && !isFollowing && (
                <button onClick={() => follow(profileUser.id)} className="px-4 py-1.5 rounded-full text-sm transition bg-blue-600">Подписаться</button>
              )}
              {profileUser.id !== user.id && isFollowing && <button className="px-4 py-1.5 rounded-full text-sm bg-gray-600" disabled>Подписан</button>}
            </div>
            <div className="flex gap-5 justify-center mt-4 text-sm">
              <button onClick={() => { setShowSubs(!showSubs); setShowFollows(false); }} className="hover:text-blue-400 transition">
                <span className="font-bold text-white text-lg">{profileUser.followers?.length || 0}</span> <span className="text-gray-400">подписчиков</span>
              </button>
              <button onClick={() => { setShowFollows(!showFollows); setShowSubs(false); }} className="hover:text-blue-400 transition">
                <span className="font-bold text-white text-lg">{profileUser.following?.length || 0}</span> <span className="text-gray-400">подписок</span>
              </button>
            </div>
            {showSubs && (
              <div className="mt-4 p-2 bg-[#2a2a2a] rounded-xl max-h-48 overflow-y-auto">
                {users.filter(u => profileUser.followers?.includes(u.id)).map(u => (
                  <div key={u.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#3a3a3a] rounded" onClick={() => setViewProfile(u)}>
                    <img src={u.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                    <div className="text-left"><div className="text-white font-medium">@{u.username}</div><div className="text-gray-500 text-xs">{u.full_name || u.username}</div></div>
                  </div>
                ))}
                {(!profileUser.followers || profileUser.followers.length === 0) && <div className="text-gray-500 text-sm text-center py-4">Нет подписчиков</div>}
              </div>
            )}
            {showFollows && (
              <div className="mt-4 p-2 bg-[#2a2a2a] rounded-xl max-h-48 overflow-y-auto">
                {users.filter(u => profileUser.following?.includes(u.id)).map(u => (
                  <div key={u.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#3a3a3a] rounded" onClick={() => setViewProfile(u)}>
                    <img src={u.avatar || DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                    <div className="text-left"><div className="text-white font-medium">@{u.username}</div><div className="text-gray-500 text-xs">{u.full_name || u.username}</div></div>
                  </div>
                ))}
                {(!profileUser.following || profileUser.following.length === 0) && <div className="text-gray-500 text-sm text-center py-4">Нет подписок</div>}
              </div>
            )}
          </div>
          <div className="space-y-3">
            <h3 className="text-white font-bold text-lg px-1">Посты</h3>
            {profilePosts.map(p => (
              <div key={p.id} className="card p-4">
                <div className="text-white text-sm whitespace-pre-wrap">{renderText(p.content)}</div>
                <MediaCollage media={p.media} onFullscreen={(m)=>setFullscreen(m)} />
                {p.poll && <PollComponent poll={p.poll} postId={p.id} userId={user.id} onVote={handlePollVote} />}
                <div className="flex gap-4 mt-3 text-gray-400 text-sm">
                  <span><i className="fas fa-heart text-red-500"></i> {formatLikes(p.likes || 0)}</span>
                  <span><i className="far fa-comment"></i> {(p.comments || []).length}</span>
                </div>
              </div>
            ))}
            {profilePosts.length === 0 && <div className="text-center text-gray-500 py-8">Нет постов</div>}
          </div>
        </div>
      );
    }

    return (
      <div className="min-h-screen pb-16" style={{background:'#0a0a0a'}}>
        {fullscreen && <div className="fullscreen-media" onClick={()=>setFullscreen(null)}>{fullscreen.type==='video'?<video src={fullscreen.url} controls autoPlay />:<img src={fullscreen.url} />}</div>}
        {delPostId && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>setDelPostId(null)}><div className="card p-5 max-w-sm w-full text-center"><p className="text-white mb-4">Удалить этот пост?</p><div className="flex gap-2"><button onClick={()=>delPost(delPostId)} className="flex-1 bg-red-600 py-2 rounded-xl">Да</button><button onClick={()=>setDelPostId(null)} className="flex-1 bg-gray-700 py-2 rounded-xl">Нет</button></div></div></div>}
        {editPost && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>setEditPost(null)}><div className="card p-5 max-w-sm w-full"><textarea value={editPostContent} onChange={e=>setEditPostContent(e.target.value)} rows="3" className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white mb-3" /><div className="flex gap-2"><button onClick={async()=>{setPosts(prev=>prev.map(p=>p.id===editPost.id?{...p,content:editPostContent,edited:true}:p)); await supabase.from('posts').update({content:editPostContent,edited:true}).eq('id',editPost.id); setEditPost(null); showToast('Пост обновлён');}} className="flex-1 bg-blue-600 py-2 rounded-xl text-white">Сохранить</button><button onClick={()=>setEditPost(null)} className="flex-1 bg-gray-700 py-2 rounded-xl">Отмена</button></div></div></div>}
        {sharePost && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>{setSharePost(null);}}><div className="card p-5 max-w-sm w-full"><p className="text-white mb-2">Поделиться в чате</p><div className="max-h-48 overflow-auto">{chatList.map(cu=><div key={cu.id} className="flex items-center gap-2 p-2 cursor-pointer hover:bg-[#2a2a2a] rounded" onClick={()=>{sharePostToChat(sharePost, cu.id); setSharePost(null);}}><img src={cu.avatar||DEFAULT_AVATAR} className="w-6 h-6 rounded-full" /><span className="text-white text-sm">@{cu.username}</span></div>)}</div><button onClick={()=>setSharePost(null)} className="w-full mt-2 bg-gray-700 py-2 rounded-xl">Отмена</button></div></div>}
        {switchDialog && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>{setSwitchDialog(false); setSwitchErr(''); setSwitchUser(''); setSwitchPass('');}}><div className="card p-5 max-w-sm w-full"><p className="text-white mb-3 text-center">Сменить аккаунт</p><input type="text" placeholder="Логин" value={switchUser} onChange={e=>setSwitchUser(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white mb-2" /><input type="password" placeholder="Пароль" value={switchPass} onChange={e=>setSwitchPass(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white mb-2" />{switchErr&&<div className="text-red-400 text-sm mb-2">{switchErr}</div>}<div className="flex gap-2"><button onClick={async()=>{const{data:acc}=await supabase.from('users').select('*').eq('username',switchUser).single(); if(!acc||acc.password_hash!==switchPass){setSwitchErr('Неверный логин или пароль');return;} localStorage.setItem('wave_user',JSON.stringify(acc)); window.location.reload();}} className="flex-1 bg-blue-600 py-2 rounded-xl text-white">Войти</button><button onClick={()=>{setSwitchDialog(false); setSwitchErr(''); setSwitchUser(''); setSwitchPass('');}} className="flex-1 bg-gray-700 py-2 rounded-xl">Отмена</button></div></div></div>}
        {showDeleteAccount && <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50" onClick={()=>setShowDeleteAccount(false)}><div className="card p-5 max-w-sm w-full text-center"><p className="text-white mb-4 text-lg">Удалить аккаунт?</p><p className="text-gray-400 text-sm mb-4">Это действие нельзя отменить. Все ваши посты и данные будут удалены.</p><div className="flex gap-2"><button onClick={deleteAccount} className="flex-1 bg-red-600 py-2 rounded-xl hover:bg-red-700">Да, удалить</button><button onClick={()=>setShowDeleteAccount(false)} className="flex-1 bg-gray-700 py-2 rounded-xl hover:bg-gray-600">Отмена</button></div></div></div>}
        {showPollModal && <PollCreatorModal onClose={()=>setShowPollModal(false)} onSave={(poll)=>{setTempPoll(poll); showToast('Опрос добавлен');}} />}
        {showHideModal && <HideSettingsModal users={users} currentUserId={user.id} selectedUsers={hideSel} onToggleUser={(id)=>setHideSel(prev=>prev.includes(id)?prev.filter(i=>i!==id):[...prev,id])} onApply={()=>{setShowHideModal(false); showToast(`Скрыто от ${hideSel.length} пользователей`);}} onClose={()=>setShowHideModal(false)} />}

        <header className="sticky top-0 z-20 border-b border-gray-800 bg-[#0f0f0f]/90 backdrop-blur-md p-3"><div className="max-w-2xl mx-auto flex justify-between items-center"><div className="flex items-center gap-2"><i className="fas fa-water text-white text-xl"></i><span className="text-white font-bold text-lg">Wave</span></div><div className="flex gap-3 text-gray-400"><button onClick={()=>{setTab('feed'); setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className={`text-lg ${tab==='feed'?'text-white':''}`}><i className="fas fa-home"></i></button><button onClick={()=>{setTab('search'); setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className={`text-lg ${tab==='search'?'text-white':''}`}><i className="fas fa-search"></i></button><button onClick={()=>{setTab('chat'); setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className={`text-lg relative ${tab==='chat'?'text-white':''}`}><i className="fas fa-comments"></i>{Object.values(unread).reduce((a,b)=>a+b,0)>0&&<span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{Object.values(unread).reduce((a,b)=>a+b,0)}</span>}</button><button onClick={()=>{setTab('notify'); setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className={`text-lg relative ${tab==='notify'?'text-white':''}`}><i className="fas fa-bell"></i>{notifs.filter(n=>!n.read && n.type !== 'message').length>0&&<span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center">{notifs.filter(n=>!n.read && n.type !== 'message').length}</span>}</button><button onClick={()=>{setTab('profile'); setViewProfile(null); setShowSubs(false); setShowFollows(false);}} className={`text-lg ${tab==='profile'?'text-white':''}`}><i className="fas fa-user"></i></button><button onClick={onLogout} className="text-sm bg-gray-800 px-2 py-0.5 rounded-full">Выйти</button></div></div></header>

        <main className="max-w-2xl mx-auto p-3">
          {tab==='feed' && (<>
            <div className="card p-3 mb-4"><div className="flex gap-2"><img src={user.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" /><div className="flex-1 relative"><textarea ref={textareaRef} rows="2" placeholder="Что нового? @ или #" className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm resize-none" value={newPost} onChange={handlePostChange} />{showMentions && mentionUsers.length>0 && (<div className="absolute bottom-full left-0 bg-[#1a1a1a] border border-gray-700 rounded-xl max-h-36 overflow-auto z-10 mb-1 w-44">{mentionUsers.map(u=><div key={u.id} className="p-1.5 hover:bg-[#2a2a2a] cursor-pointer flex gap-2" onClick={()=>insertMention(u.username)}><img src={u.avatar||DEFAULT_AVATAR} className="w-5 h-5 rounded-full" /><span className="text-white text-xs">@{u.username}</span></div>)}</div>)}<div className="flex flex-wrap gap-1 mt-2">{media.map((m,i)=><div key={i} className="media-preview" onClick={()=>setFullscreen({url:m.url,type:m.type})}>{m.type==='video'?<video src={m.url} />:<img src={m.url} />}<button className="remove-media" onClick={(e)=>{e.stopPropagation(); setMedia(media.filter((_,idx)=>idx!==i));}}>×</button></div>)}</div>{tempPoll && <div className="mt-2 p-2 bg-[#252525] rounded-xl flex justify-between"><span className="text-white text-xs">Опрос: {tempPoll.question}</span><button onClick={()=>setTempPoll(null)} className="text-red-400 text-xs">✖</button></div>}<div className="flex gap-2 mt-2"><label className={`icon-btn text-sm ${uploading?'opacity-50':''}`}><i className="fas fa-paperclip"></i><input type="file" accept="image/*,video/*" multiple onChange={async(e)=>{const files=Array.from(e.target.files); if(media.length+files.length>5){showToast('Максимум 5');return;} setUploading(true); const up=await uploadMedia(files); setMedia([...media,...up]); setUploading(false); e.target.value='';}} className="hidden" disabled={uploading} /></label><button onClick={()=>setShowPollModal(true)} className="icon-btn text-sm"><i className="fas fa-chart-bar"></i></button><button onClick={()=>setShowHideModal(true)} className="icon-btn text-sm"><i className="fas fa-eye-slash"></i></button><button onClick={createPost} className="white-glow-btn text-sm">Опубликовать</button></div></div></div></div>
            {smartPosts.map(p=>{
              const hasPoll = !!p.poll;
              const alreadyVoted = p.poll?.voted_by?.includes(user.id);
              return (
                <div key={p.id} ref={el => postRefs.current[p.id] = el} className="card p-3 mb-3">
                  <div className="flex justify-between"><div className="flex gap-2 cursor-pointer" onClick={()=>p.user_id!==user.id&&setViewProfile(users.find(u=>u.id===p.user_id))}><img src={p.user_avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full" /><div><div className="font-bold text-white text-sm">@{p.username}</div><div className="text-xs text-gray-500">{formatDate(p.created_at)}{p.edited&&<span className="ml-1 text-gray-600">(ред)</span>}</div></div></div><PostMenu onEdit={p.user_id===user.id?()=>{setEditPost(p); setEditPostContent(p.content);}:null} onDel={p.user_id===user.id?()=>setDelPostId(p.id):null} onShare={()=>{setSharePost(p);}} onChangeVote={hasPoll && alreadyVoted ? () => changeMyVote(p) : null} hasPoll={hasPoll && alreadyVoted} /></div>
                  <div className="text-white text-sm whitespace-pre-wrap">{renderText(p.content)}</div>
                  <MediaCollage media={p.media} onFullscreen={(m)=>setFullscreen(m)} />
                  {p.poll && <PollComponent poll={p.poll} postId={p.id} userId={user.id} onVote={handlePollVote} />}
                  <div className="flex gap-3 mt-2 text-gray-400 text-sm"><button onClick={()=>likePost(p.id,p.likes||0)} className="flex gap-1 hover:text-red-400"><i className="fas fa-heart"></i> {formatLikes(p.likes||0)}</button><button onClick={()=>setCommentsPagePost(p)} className="flex gap-1 hover:text-blue-400"><i className="far fa-comment"></i> {(p.comments||[]).length}</button></div>
                </div>
              );
            })}
          </>)}

          {tab==='search' && (<div><div className="card p-3 mb-4"><div className="flex gap-2 mb-2"><button onClick={()=>setSType('users')} className={`text-xs px-2 py-1 rounded-full ${sType==='users'?'bg-blue-600':'bg-gray-800'}`}><i className="fas fa-users mr-1"></i> Пользователи</button><button onClick={()=>setSType('posts')} className={`text-xs px-2 py-1 rounded-full ${sType==='posts'?'bg-blue-600':'bg-gray-800'}`}><i className="fas fa-hashtag mr-1"></i> Хештеги</button></div><input type="text" placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" /></div>{sType==='users'&&searchUsers.map(u=><div key={u.id} className="card p-3 mb-2 flex justify-between items-center"><div className="flex gap-2 cursor-pointer" onClick={()=>setViewProfile(u)}><img src={u.avatar||DEFAULT_AVATAR} className="w-7 h-7 rounded-full" /><div><div className="font-bold text-white text-sm">{u.full_name||u.username}</div><div className="text-gray-400 text-xs">@{u.username}</div></div></div><button onClick={()=>{setChatUser(u); setTab('chat');}} className="bg-green-600 text-white px-2 py-0.5 rounded-full text-xs">Чат</button></div>)}
            {sType==='posts'&&searchPosts.map(p=><div key={p.id} className="card p-3 mb-2 cursor-pointer" onClick={()=>{setTab('feed'); setScrollingToPost(p.id);}}><div className="text-white text-sm">{p.content?.substring(0,100)}</div><div className="text-gray-500 text-xs mt-1">@{p.username} • {formatDate(p.created_at)}</div></div>)}
            {sType==='posts' && searchPosts.length===0 && search && <div className="text-gray-500 text-center py-8">Ничего не найдено по хештегу</div>}
          </div>)}

          {tab==='chat' && (<div className="flex flex-col h-[80vh]">
            <div className="chat-user-list">
              <h3 className="text-white font-bold mb-3"><i className="fas fa-users mr-2"></i> Контакты</h3>
              {chatList.map(cu=>(
                <div key={cu.id} className="chat-user-item" onClick={()=>setChatUser(cu)}>
                  <img src={cu.avatar||DEFAULT_AVATAR} className="w-10 h-10 rounded-full" />
                  <div className="flex-1"><div className="font-bold text-white">@{cu.username}</div><div className="text-gray-400 text-xs">{cu.full_name||cu.username}</div></div>
                  {unread[cu.id]>0 && <div className="bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">{unread[cu.id]}</div>}
                </div>
              ))}
              {chatList.length===0 && <div className="text-center text-gray-500 py-8">Нет чатов. Начните общение!</div>}
            </div>
            {chatUser && (
              <div className="fixed inset-x-0 bottom-0 top-0 z-50 bg-[#0a0a0a] flex flex-col" style={{marginTop:'55px'}}>
                <div className="sticky top-0 bg-[#1a1a1a] p-3 flex items-center gap-3 border-b border-gray-800">
                  <button onClick={()=>setChatUser(null)} className="text-white text-xl w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-800">←</button>
                  <img src={chatUser.avatar||DEFAULT_AVATAR} className="w-8 h-8 rounded-full" />
                  <div><div className="font-bold text-white">@{chatUser.username}</div><div className="text-gray-400 text-xs">{chatUser.full_name||chatUser.username}</div></div>
                </div>
                <div className="flex-1 overflow-y-auto p-3 space-y-2 chat-messages" ref={chatContainerRef}>
                  {messages.map(msg=>(
                    <div key={msg.id} className={`flex ${msg.from_user===user.id?'justify-end':'justify-start'}`}>
                      <div className={`message-bubble ${msg.from_user===user.id?'message-mine':'message-theirs'}`}>
                        {msg.shared_post_id && (()=>{
                          const sharedPost = posts.find(p => p.id === msg.shared_post_id);
                          return sharedPost && <SharedPostCard post={sharedPost} onGoToPost={(pid)=>{setTab('feed'); setScrollingToPost(pid); setChatUser(null);}} />;
                        })()}
                        {msg.voice_url && (
                          <div className="voice-message">
                            <audio controls src={msg.voice_url} className="h-9" />
                          </div>
                        )}
                        {msg.content && <p className="break-words">{msg.content}</p>}
                        <div className="text-[10px] opacity-70 mt-1 text-right">{new Date(msg.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="p-3 border-t border-gray-800 flex gap-2 bg-[#1a1a1a]">
                  <input type="text" placeholder="Сообщение..." value={msgText} onChange={e=>setMsgText(e.target.value)} onKeyPress={e=>e.key==='Enter'&&sendMsg(msgText)} className="flex-1 p-2 bg-[#2a2a2a] rounded-xl text-white text-sm" />
                  <button onClick={() => sendMsg(msgText)} className="bg-blue-600 text-white px-4 rounded-xl">→</button>
                  <button onMouseDown={startRecording} onMouseUp={stopRecording} onTouchStart={startRecording} onTouchEnd={stopRecording} className={`${recording ? 'bg-red-600 animate-pulse' : 'bg-gray-700'} text-white px-3 rounded-xl`}><i className="fas fa-microphone"></i></button>
                  {uploadingVoice && <div className="text-white text-xs">⏳</div>}
                </div>
              </div>
            )}
          </div>)}

          {tab==='notify' && (<div><div className="flex justify-between items-center mb-2"><h2 className="text-lg font-bold text-white">Уведомления</h2><button onClick={async()=>{const unreadIds=notifs.filter(n=>!n.read && n.type !== 'message').map(n=>n.id); if(unreadIds.length===0)return; await supabase.from('notifications').update({read:true}).in('id',unreadIds); setNotifs(prev=>prev.map(n=>({...n,read:true}))); showToast('Все прочитаны');}} className="text-xs bg-gray-700 px-2 py-0.5 rounded-full">Прочитать все</button></div>{notifs.filter(n=>n.type !== 'message').length===0&&<div className="card p-6 text-center text-gray-500">Нет уведомлений</div>}{notifs.filter(n=>n.type !== 'message').map(n=><div key={n.id} className={`card p-2 mb-2 cursor-pointer ${!n.read?'border-l-4 border-green-500':''}`} onClick={async()=>{await supabase.from('notifications').update({read:true}).eq('id',n.id); setNotifs(prev=>prev.map(not=>not.id===n.id?{...not,read:true}:not)); setTab('feed');}}><p className="text-white text-sm">{n.text}</p><p className="text-gray-500 text-xs">{formatDate(n.created_at)}</p></div>)}</div>)}

          {tab==='profile' && (<div className="card p-4 text-center relative"><ProfileMenu /><div className="avatar-upload w-20 h-20 mx-auto relative cursor-pointer"><img src={user.avatar||DEFAULT_AVATAR} className="w-20 h-20 rounded-full object-cover" /><input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer rounded-full" onChange={(e)=>upAvatar(e.target.files[0])} disabled={avatarUp} /></div>{editProfile?(<div className="mt-3"><input type="text" value={editName} onChange={e=>setEditName(e.target.value)} className="w-full p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm" placeholder="Имя" /><textarea value={editBio} onChange={e=>setEditBio(e.target.value)} className="w-full p-1.5 bg-[#2a2a2a] rounded-xl text-white text-sm mt-1" rows="2" placeholder="О себе"></textarea><div className="flex gap-2 mt-2"><button onClick={saveProfile} className="flex-1 bg-green-600 text-white py-1 rounded-xl text-sm">Сохранить</button><button onClick={()=>setEditProfile(false)} className="flex-1 bg-gray-700 text-white py-1 rounded-xl text-sm">Отмена</button></div></div>):(<><h2 className="text-lg font-bold text-white mt-1">{user.full_name||user.username}</h2><p className="text-gray-400 text-sm">@{user.username}</p><p className="text-gray-500 text-xs mt-1">{user.bio||''}</p><div className="flex gap-4 justify-center mt-3 text-sm"><div><span className="font-bold text-white">{posts.filter(p=>p.user_id===user.id).length}</span><span className="text-gray-500 ml-1">постов</span></div><button onClick={()=>openProfileFollowList(user, 'subs')} className="cursor-pointer hover:text-blue-400 transition"><span className="font-bold text-white">{user.followers?.length||0}</span><span className="text-gray-500 ml-1">подписчиков</span></button><button onClick={()=>openProfileFollowList(user, 'follows')} className="cursor-pointer hover:text-blue-400 transition"><span className="font-bold text-white">{user.following?.length||0}</span><span className="text-gray-500 ml-1">подписок</span></button></div></>)}</div>)}
        </main>
      </div>
    );
  }

  function App() { 
    const [a,setA]=React.useState(false); 
    const [u,setU]=React.useState(null); 
    const [l,setL]=React.useState(true); 
    React.useEffect(()=>{ 
      if(localStorage.getItem('wave_access')==='ok') setA(true); 
      const s=localStorage.getItem('wave_user'); 
      if(s) setU(JSON.parse(s)); 
      setL(false); 
    },[]); 
    const log=(u)=>{ localStorage.setItem('wave_user',JSON.stringify(u)); setU(u); }; 
    const out=()=>{ localStorage.removeItem('wave_user'); setU(null); localStorage.removeItem('wave_access'); window.location.reload(); }; 
    if(l) return <div className="p-4 text-white">Загрузка...</div>; 
    if(!a) return <PasswordGate onSuccess={()=>setA(true)} />; 
    if(u) return <MainApp user={u} onLogout={out} />; 
    return <Auth onLogin={log} />; 
  }
  
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
